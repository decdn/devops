---
# The deCDN collections from Ansible Galaxy. Install into ./collections (ansible.cfg
# reads it from there):
#   ansible-galaxy collection install -r requirements.yml -p collections
# Each floor is the collection's newest release when this file was copied from
# decdn/devops (its scripts/release.sh moves them on every release). Pin exact
# versions (==X.Y.Z) once the fleet runs, and bump them deliberately, reading each
# CHANGELOG: https://github.com/decdn/devops/tree/main/ansible/galaxy
collections:
  # Node operators: cache nodes only. Delete decdn.publisher below.
  - name: decdn.node
    version: ">=0.5.0"
  # Publishers: origin nodes, sponsord and its onramp, iroh relays and DNS servers
  # (and cache nodes). Depends on decdn.node.
  - name: decdn.publisher
    version: ">=0.3.1"
