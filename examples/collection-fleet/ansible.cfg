# Settings for running the decdn.node / decdn.publisher playbooks from this
# directory: decdn/devops's ansible/ansible.cfg, except roles_path (every role comes
# from the collections). Fetched backups land in backups/ beside this file.
[defaults]
inventory = inventory/hosts.yml
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
nocows = True
interpreter_python = auto_silent
# Keep it on: modules run over the SSH session instead of being staged in the
# target's ~/.ansible/tmp, where the roles' `copy: content=` of a secret (the node's
# decdn.env, Alloy's token file) would otherwise sit in plaintext. Needs `requiretty`
# off in sudoers, the default on the Debian/Ubuntu targets.
pipelining = True

[inventory]
# Fail on an inventory that does not parse, as decdn/devops's Makefile does
# (ANSIBLE_INVENTORY_UNPARSED_FAILED), rather than warn and run against no host.
unparsed_is_failed = True

[privilege_escalation]
become = True
become_method = sudo
