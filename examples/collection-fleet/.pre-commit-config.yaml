---
# Pre-commit hooks for the fleet inventory.
#
#   pip install pre-commit && pre-commit install   # one-time install
#   pre-commit run --all-files                     # run on all files
#
# CI runs the same hooks; beside them, it loads the inventory and syntax-checks the
# collections' playbooks against it (.github/workflows/ci.yml).
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

# The installed collections, and ansible's .ansible/ working directory.
exclude: >-
  (?x)^(
    collections/|
    \.ansible/
  )

repos:
  # ── Generic hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep markdown hard line breaks
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]   # tolerate custom/!vault tags; syntax check only
      - id: check-json
        # An ansible-vault vault.json is ciphertext (vault-encrypted below), not JSON.
        exclude: ^inventory/(group|host)_vars/[^/]+/(.+/)?vault\.json$

  # ── Bash ───────────────────────────────────────────────────────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  # ── Markdown (relaxed ruleset; see .markdownlint-cli2.yaml) ────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # ── Local: yamllint for the Ansible inputs (.yamllint), vars shadowing ─────
  # *.yml.example templates don't match yamllint's files (they end in .example).
  - repo: local
    hooks:
      - id: yamllint-ansible
        name: yamllint (inventory/, requirements.yml)
        entry: yamllint -c .yamllint
        language: python
        additional_dependencies: ["yamllint==1.35.1"]
        files: ^(inventory/.*|requirements)\.ya?ml$
        # An ansible-vault file is ciphertext, not YAML to lint (vault-encrypted below).
        exclude: ^inventory/(group|host)_vars/[^/]+/(.+/)?vault\.ya?ml$

      # On your working tree, so it sees the git-ignored secret.yml files (and their
      # directories) that CI never does.
      - id: vars-shadowing
        name: no vars source shadowed by another of the same name
        entry: scripts/check-vars-shadowing.sh
        language: script
        pass_filenames: false
        always_run: true

      # The optional committed secrets file (README.md § Encrypted secrets) holds
      # ciphertext: refuse a vault.yml that is not ansible-vault encrypted, at any depth
      # under a group or host directory (Ansible loads those recursively).
      - id: vault-encrypted
        name: inventory vault files are ansible-vault encrypted
        entry: scripts/check-vault-encrypted.sh
        language: script
        files: ^inventory/(group|host)_vars/[^/]+/(.+/)?vault\.(ya?ml|json)$
