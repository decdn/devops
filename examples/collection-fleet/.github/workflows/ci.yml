name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail, not the implicit `bash -e`: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

# Third-party actions are pinned to a full commit SHA (a re-pointed tag can ship
# malicious code). The trailing comment records the human-readable version;
# .github/dependabot.yml bumps them.
jobs:
  # Every pre-commit hook on every file: hygiene, markdownlint, yamllint and the vault
  # files' encryption. The same gate `pre-commit run --all-files` runs locally.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10         # hook environments are cached; ~1m cold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install --upgrade pre-commit
      # Hook environments (node for markdownlint, yamllint's virtualenv) keyed on the
      # config that pins them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure

  # The inventory and every committed vars file load, and the collections' playbooks
  # load against them. The collections are installed fresh from Galaxy on every run
  # (no cache): with `>=` floors in requirements.yml that is the newest release, so a
  # release whose playbooks no longer load fails here. What a role makes of your
  # variables is only checked by a run (--check --diff). Fails until
  # inventory/hosts.yml is committed. Nothing here connects to a host or reads the
  # git-ignored secret.yml files. Committed vault.yml files must decrypt with the
  # ANSIBLE_VAULT_PASSWORD repository secret when it is set, and are replaced by an
  # empty mapping when it is not (README.md § Encrypted secrets).
  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install ansible-core
        run: python -m pip install --upgrade ansible-core
      - name: Install the collections
        # Galaxy resets connections now and then: retry those, and fail at once on
        # anything else (a version the floors ask for that Galaxy does not have, say).
        run: |
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml -p collections 2>&1 | tee install.log && exit 0
            grep -qiE 'connection (reset|refused|aborted)|timed? ?out|HTTP Error 5[0-9][0-9]' install.log \
              || { echo "::error::ansible-galaxy collection install failed"; exit 1; }
            ((attempt < 3)) || break
            echo "::warning::ansible-galaxy hit a transient error (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          echo "::error::ansible-galaxy collection install failed 3 times"
          exit 1
      # The same check the pre-commit hook runs on your working tree.
      - name: No vars source shadowed by another of the same name
        run: scripts/check-vars-shadowing.sh
      # Optional (README.md § Encrypted secrets). With the ANSIBLE_VAULT_PASSWORD secret
      # set, every committed vault file (at any depth under a group or host directory,
      # as the vault-encrypted hook checks them) must decrypt with it, here, even one of
      # a host or group the inventory does not name; the steps after it decrypt the
      # rest as they load them. Without it (also on pull requests from forks and from
      # Dependabot, which get no Actions secrets), each vault file is replaced by an
      # empty mapping in this checkout only: the rest of the inventory is still loaded
      # and checked, and the pre-commit job still checks each one is encrypted.
      - name: Decrypt or stub the vault files
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          list="$(git ls-files -- ':(glob)inventory/*_vars/*/**/vault.yml' \
            ':(glob)inventory/*_vars/*/**/vault.yaml' ':(glob)inventory/*_vars/*/**/vault.json')"
          [[ -n $list ]] || { echo "No vault files committed"; exit 0; }
          mapfile -t vaults <<<"$list"
          if [[ -n $VAULT_PASSWORD ]]; then
            pass_file="$RUNNER_TEMP/vault-pass"
            (umask 077 && printf '%s\n' "$VAULT_PASSWORD" >"$pass_file")
            echo "ANSIBLE_VAULT_PASSWORD_FILE=$pass_file" >>"$GITHUB_ENV"
            for f in "${vaults[@]}"; do
              ansible-vault view --vault-password-file "$pass_file" "$f" >/dev/null \
                || { echo "::error file=$f::$f does not decrypt with the ANSIBLE_VAULT_PASSWORD secret"; exit 1; }
            done
            echo "${#vaults[@]} vault file(s) decrypt with the ANSIBLE_VAULT_PASSWORD secret"
          else
            for f in "${vaults[@]}"; do echo '{}' >"$f"; done
            echo "::warning::No ANSIBLE_VAULT_PASSWORD secret: loading the inventory with ${#vaults[@]} vault file(s) replaced by {}, unchecked"
          fi
      # --list, not --graph: it loads every group_vars/ and host_vars/ file too. Its
      # output (your committed variables) is not printed.
      - name: Load the inventory
        run: ansible-inventory --list >/dev/null
      # decdn.node alone (cache nodes only)? Check decdn.node.node, decdn.node.backup
      # and decdn.node.decommission instead.
      - name: Syntax-check the playbooks
        run: |
          for pb in decdn.publisher.site decdn.publisher.backup decdn.publisher.decommission; do
            ansible-playbook "$pb" --syntax-check
          done

  # Lint the workflow files themselves.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10         # ~15s in practice
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1.80.6
        with:
          reporter: github-check
          fail_on_error: true
