[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pin a solc version when contracts land so every dev gets byte-identical initcode
# (and therefore identical CREATE2 addresses). TODO: set to the deCDN contracts' version.
# solc = "0.8.28"
optimizer = true
optimizer_runs = 200

# deCDN devnet — see ../bin/deploy.sh
[rpc_endpoints]
devnet = "http://127.0.0.1:8545"
