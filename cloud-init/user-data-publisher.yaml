#cloud-config
# deCDN publisher host bootstrap: an origin node (the deCDN node with an origin backend,
# the canonical source of your namespace's content), sponsord (the onboarding sponsor's
# treasury signer and PaymentPool keeper) and sponsord-onramp (its public gate, behind
# Caddy), for a fresh Debian 12/13 or Ubuntu 24.04/26.04 VM (x86_64 or aarch64). Paste
# this into your provider's "user data" / "cloud-init" field when creating the server.
# The full walkthrough is in cloud-init/README.md of github.com/decdn/devops
# ("Publisher host"). To run fewer of them, delete the groups you do not want: an origin
# alone keeps decdn_nodes and decdn_origin_nodes, a sponsor alone sponsord_hosts and
# sponsord_onramp_hosts (move baseline_sudo_users, baseline_sudo_autodetect_runner and
# any ssh_allow_cidrs into sponsord_hosts' vars then).
#
# Edit every value marked MUST-EDIT first. The bootstrap refuses to run while any
# CHANGE_ME is left.
#
# NEVER PUT A SECRET IN THIS FILE. Any local process can read user-data from the instance
# metadata service, and your provider keeps a copy in its console and API. That rules out
# the node's and sponsord's RPC URLs (they may embed an API key), S3 keys for the origin
# backend, the treasury keystore and its password, and the Turnstile secret. Everything
# below is public: an SSH *public* key, versions, a region, the origin's store, a domain,
# a public RPC URL, a Turnstile sitekey. The secrets are written over SSH after the first
# boot; the node's wallet and sponsord's API token are generated on the host.
#
# On first boot the host clones github.com/decdn/devops at DEVOPS_REF, installs a pinned
# Ansible, and hardens itself (SSH, firewall with udp/4433 open for the node and tcp/80
# and tcp/443 for Caddy, automatic patching). It then stops and waits for its secrets
# under /etc/decdn and /etc/sponsord. `cloud-init status --wait` returns when it is done.
---
package_update: true
packages:
  - git
  - python3-venv
  - ca-certificates
  - sudo

write_files:
  # Which revision of github.com/decdn/devops the host runs. Pin a full 40-character
  # commit SHA (verified after checkout) or a release tag. Branch names are refused.
  - path: /etc/decdn-bootstrap/bootstrap.env
    owner: root:root
    permissions: "0600"
    content: |
      DEVOPS_REPO=https://github.com/decdn/devops.git
      DEVOPS_REF=CHANGE_ME

  # The Ansible inventory for this host. Everything the playbook needs that is not a
  # secret lives here. More knobs: ansible/roles/*/defaults/main.yml. The admin account
  # is set once, in decdn_nodes' vars below.
  - path: /etc/decdn-bootstrap/inventory.yml
    owner: root:root
    permissions: "0600"
    content: |
      ---
      decdn_nodes:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: /usr/bin/python3
        vars:
          # Your admin account. Hardening disables root and password SSH logins, so this
          # account and its key are how you log back in. Many providers inject their key
          # for root only, so list the key here too.
          baseline_sudo_users:
            - name: CHANGE_ME                  # MUST-EDIT: login name, e.g. "alice"
              keys:
                - "CHANGE_ME"                  # MUST-EDIT: your SSH public key, "ssh-ed25519 AAAA… you@laptop"
          # Under cloud-init the "runner" is root on this host, not you, so there is
          # nobody to auto-detect.
          baseline_sudo_autodetect_runner: false
          # Optional: accept SSH only from these CIDRs.
          # ssh_allow_cidrs: ["203.0.113.0/24"]

          # The node, installed from the GPG-verified release tarballs. The release is
          # the decdn_node role's default at DEVOPS_REF (decdn_node_version); set
          # decdn_node_version here to pin another one.
          decdn_node_install_method: release
          # Optional: a mirror that serves v<version>/{decdn-node,decdn}-<version>-<target>.tar.gz,
          # SHA256SUMS and SHA256SUMS.asc. The signature is still checked against
          # deCDN's release keys.
          # decdn_node_release_base: "https://mirror.example/decdn/releases/download"
          decdn_node_generate_keystore: true   # the wallet is generated on the host
          decdn_network: arbitrum-sepolia
          decdn_region: "CHANGE_ME"            # MUST-EDIT: ISO 3166-1 alpha-2 of the VM's location, e.g. "DE"

      # The node is your origin: localhost is in decdn_origin_nodes too (a deCDN node with
      # an origin backend). The chain recognises it as the origin once you seat its
      # operator with OriginAssignment.addOrigin; until then it serves as a cache does.
      decdn_origin_nodes:
        hosts:
          localhost:
        vars:
          # MUST-EDIT: where the origin reads your content. http shown; for S3 (R2, B2,
          # MinIO) set decdn_cache_origin_kind: s3 with decdn_cache_origin_s3_bucket,
          # decdn_cache_origin_s3_region (and decdn_cache_origin_s3_endpoint_url) and
          # decdn_cache_origin_s3_use_default_chain: true, and put the keys in
          # /etc/decdn/decdn.env on the host, never here. For a local path, kind fs and
          # decdn_cache_origin_path.
          decdn_cache_origin_kind: http
          decdn_cache_origin_url: "CHANGE_ME"   # MUST-EDIT: e.g. "https://content.example.org/"

      sponsord_hosts:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: /usr/bin/python3
        vars:
          # sponsord, installed from the GPG-verified release tarball. The release is
          # the sponsord role's default at DEVOPS_REF (sponsord_version); set
          # sponsord_version here, and sponsord_onramp_version to the same, to pin
          # another one.
          sponsord_install_method: release
          # Optional: a mirror that serves v<version>/sponsord-<version>-<target>.tar.gz,
          # SHA256SUMS and SHA256SUMS.asc. The signature is still checked against the
          # vendored KEYS.
          # sponsord_release_base: "https://mirror.example/decdn/sponsord/releases/download"
          sponsord_network: arbitrum-sepolia
          # MUST-EDIT: the pool the treasury owns, 0x + 64 hex, printed by `decdn pool open`.
          sponsord_pool_id: "CHANGE_ME"

      # The onramp runs beside the daemon, so localhost is in sponsord_hosts too.
      sponsord_onramp_hosts:
        hosts:
          localhost:
        vars:
          # sponsord-onramp, installed from the GPG-verified release tarball of the
          # same decdn/sponsord release as sponsord (sponsord_onramp_version).
          sponsord_onramp_install_method: release
          # Optional: a mirror, as above, for v<version>/sponsord-onramp-<version>-<target>.tar.gz.
          # sponsord_onramp_release_base: "https://mirror.example/decdn/sponsord/releases/download"
          # Caddy terminates TLS with a certificate from ACME. The domain's A/AAAA records
          # must point at this VM, and tcp/80 and tcp/443 must reach it.
          sponsord_onramp_proxy: caddy
          sponsord_onramp_domain: "CHANGE_ME"        # MUST-EDIT: e.g. "downloads.example.org"
          # sponsord_onramp_acme_email: "ops@example.org"
          # MUST-EDIT: the PUBLIC JSON-RPC endpoint users' decdn reads the chain through.
          # It is served to every user, so never the keyed URL sponsord uses.
          sponsord_onramp_rpc_url: "CHANGE_ME"
          sponsord_onramp_turnstile_sitekey: "CHANGE_ME"   # MUST-EDIT: the widget's public sitekey
          # The releases the installers install default to the role's pins at DEVOPS_REF
          # (sponsord_onramp_decdn_release / _cli_release, each with the SHA-256 of that
          # release's SHA256SUMS). decdn/sponsord's release notes print the CLI pin
          # (its vX.Y.Z tag and digest, under "Onramp pin"); decdn/decdn's do not, so
          # take `sha256sum SHA256SUMS` once its SHA256SUMS.asc verifies. Override all
          # four together, e.g.:
          # sponsord_onramp_decdn_release: "v0.0.1"
          # sponsord_onramp_decdn_sums_sha256: "<64 lowercase hex>"
          # sponsord_onramp_cli_release: "v0.0.2"
          # sponsord_onramp_cli_sums_sha256: "<64 lowercase hex>"

  # What an interactive login prints while the bootstrap is unfinished. It is written
  # here, not by the bootstrap, so that it is in place even if stage 1 fails.
  - path: /etc/profile.d/decdn-bootstrap.sh
    owner: root:root
    permissions: "0644"
    content: |
      # deCDN bootstrap status at login (cloud-init/README.md in decdn/devops).
      log=/var/log/cloud-init-output.log
      rerun="sudo decdn-bootstrap"
      case "$(cat /var/lib/decdn-bootstrap/state 2>/dev/null)" in
        complete) ;;
        awaiting-secret)
          echo "deCDN: hardened, waiting for these secrets on the host (root, 0600). Write them, then run: $rerun"
          sed 's/^/  /' /var/lib/decdn-bootstrap/awaiting 2>/dev/null \
            || echo "  (no list found; see $log)" ;;
        running)
          if pgrep -f 'sbin/decdn-bootstrap|cloud-init/bootstrap[.]sh' >/dev/null 2>&1; then
            echo "deCDN: the bootstrap is running (log: $log)"
          else
            echo "deCDN: the bootstrap was interrupted. Re-run it: $rerun"
          fi ;;
        failed)
          echo "deCDN: the last bootstrap run FAILED (log: $log). Re-run it: $rerun" ;;
        *)
          echo "deCDN: the bootstrap has not run yet (cloud-init status --wait; log: $log)" ;;
      esac

  # Stage 1: fetch and verify the pinned checkout, then hand over to its
  # cloud-init/bootstrap.sh. Re-run it by hand after writing the secrets on the host, or
  # after changing DEVOPS_REF: `sudo decdn-bootstrap`.
  - path: /usr/local/sbin/decdn-bootstrap
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Stage 1 of the deCDN cloud-init bootstrap (cloud-init/README.md in decdn/devops).
      set -euo pipefail
      conf=/etc/decdn-bootstrap/bootstrap.env
      checkout=/opt/decdn-devops
      state_dir=/var/lib/decdn-bootstrap
      die() { echo "decdn-bootstrap: $*" >&2; exit 1; }
      # World-readable: the login hint reads it as the admin account.
      set_state() {
        install -d -m 0755 "$state_dir"
        printf '%s\n' "$1" >"$state_dir/state.tmp"
        chmod 0644 "$state_dir/state.tmp"
        mv -f "$state_dir/state.tmp" "$state_dir/state"
      }

      [[ $EUID -eq 0 ]] || die "run as root (sudo decdn-bootstrap)"
      # One run at a time. The lock is held until stage 2 exits (exec keeps fd 9).
      exec 9>/run/decdn-bootstrap.lock
      flock -n 9 || die "another decdn-bootstrap run is in progress"
      # Any non-zero exit before the hand-over, a signal included, records "failed".
      # exec replaces this process, so stage 2's own traps take over from there.
      trap 'rc=$?; ((rc == 0)) || set_state failed' EXIT
      trap 'exit 129' HUP
      trap 'exit 130' INT
      trap 'exit 143' TERM
      set_state running

      [[ $(stat -c '%u %a' "$conf") == "0 600" ]] || die "$conf must be owned by root, mode 0600"
      # KEY=value lines, read literally: never sourced, so a value is data, not shell.
      DEVOPS_REPO='' DEVOPS_REF=''
      while IFS= read -r line || [[ -n $line ]]; do
        [[ $line =~ ^[[:space:]]*(#|$) ]] && continue
        [[ $line =~ ^([A-Z_]+)=(.*)$ ]] || die "$conf: not a KEY=value line: $line"
        case ${BASH_REMATCH[1]} in
          DEVOPS_REPO) DEVOPS_REPO=${BASH_REMATCH[2]} ;;
          DEVOPS_REF) DEVOPS_REF=${BASH_REMATCH[2]} ;;
          *) die "$conf: unknown key ${BASH_REMATCH[1]}" ;;
        esac
      done <"$conf"
      [[ -n $DEVOPS_REPO ]] || die "DEVOPS_REPO is empty in $conf"
      [[ -n $DEVOPS_REF && $DEVOPS_REF != CHANGE_ME ]] \
        || die "set DEVOPS_REF in $conf to a commit SHA or release tag of $DEVOPS_REPO"
      export HOME="${HOME:-/root}"

      if [[ ! -d $checkout/.git ]]; then
        git clone --quiet --no-checkout "$DEVOPS_REPO" "$checkout"
      fi
      git -C "$checkout" remote set-url origin "$DEVOPS_REPO"
      git -C "$checkout" fetch --quiet --force --tags origin

      if [[ $DEVOPS_REF =~ ^[0-9a-f]{40}$ ]]; then
        want=$DEVOPS_REF
        git -C "$checkout" cat-file -e "$want^{commit}" 2>/dev/null \
          || git -C "$checkout" fetch --quiet origin "$want"
      elif want=$(git -C "$checkout" rev-parse -q --verify "refs/tags/$DEVOPS_REF^{commit}"); then
        echo "decdn-bootstrap: tag $DEVOPS_REF is commit $want"
      else
        die "DEVOPS_REF=$DEVOPS_REF is neither a full 40-character commit SHA nor a tag of $DEVOPS_REPO"
      fi
      git -C "$checkout" -c advice.detachedHead=false checkout --quiet --force --detach "$want"
      [[ $(git -C "$checkout" rev-parse HEAD) == "$want" ]] || die "checkout is not at $want"
      echo "decdn-bootstrap: running $DEVOPS_REPO at $want"
      exec "$checkout/cloud-init/bootstrap.sh"

runcmd:
  - [/usr/local/sbin/decdn-bootstrap]

final_message: >-
  deCDN bootstrap finished after $UPTIME s. `cat /var/lib/decdn-bootstrap/state` shows
  where it stopped; "awaiting-secret" means SSH in, write the secrets listed in
  /var/lib/decdn-bootstrap/awaiting and run `sudo decdn-bootstrap` (cloud-init/README.md).
