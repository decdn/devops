---
name: Upstream drift

# The repo pins one decdn/decdn and one decdn/sponsord release line (decdn_node_version,
# sponsord_version: "X.Y", whose newest finished vX.Y.N the roles install) and carries
# copies of what that release publishes. This job resolves each line as the roles do
# (tasks/resolve-release.yml) and checks, weekly:
#   - the generated mirrors of decdn/decdn at that release's tag:
#     roles/decdn_node/vars/main/networks.yml (contract addresses) and its subsets in
#     roles/sponsord{,_onramp}/vars/main/, and ansible/molecule/schema/files/
#     schema-keys.txt (the node.toml key inventory). They describe the binary a
#     default deploy installs, so they are generated from the tag, not from main;
#   - the hand-copied release facts: the onramp's decdn tag and SHA256SUMS digest
#     (compose/sponsord-onramp.env.example) and the Compose image digests
#     (compose/.env.example), against that release's assets;
#   - that each repo's newest vX.Y.Z tag is still in the pinned line.
# It is a scheduled early warning, not a PR gate: an upstream release must not turn
# unrelated PRs red. Fix drift by re-running the generator it names; act on a new
# release with the bump checklist (roles/decdn_node/README.md, roles/sponsord/README.md);
# scripts/open-decdn-bump.sh opens the decdn bump's PR.
on:
  schedule:
    - cron: '17 6 * * 1'        # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # An explicit shell adds pipefail, which the checks' `|| return 2` rely on.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pins, read from the role defaults (plain scalars, so no YAML parser), and
      # each line resolved as the roles resolve it: the highest vX.Y.N that is not a
      # draft or a prerelease and has a SHA256SUMS.asc asset. An exact pin is itself.
      - name: Read and resolve the pinned releases
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin() { sed -nE "s/^$2: *\"?([^\" #]*)\"?.*/\\1/p" "ansible/roles/$1/defaults/main.yml"; }
          resolve() { # <repo> <pin>: the vX.Y.Z tag a default deploy installs
            if [[ "$2" =~ ^[0-9]+\.[0-9]+$ ]]; then
              gh api "repos/$1/releases?per_page=100" --jq "
                [.[] | select(.draft | not) | select(.prerelease | not)
                     | select([.assets[].name] | index(\"SHA256SUMS.asc\"))
                     | .tag_name | capture(\"^v${2//./\\\\.}\\\\.(?<n>0|[1-9][0-9]*)$\")
                     | .n | tonumber] | max // empty | \"v$2.\\(.)\""
            else
              echo "v$2"
            fi
          }
          decdn="$(pin decdn_node decdn_node_version)"
          sponsord="$(pin sponsord sponsord_version)"
          if [ -z "$decdn" ] || [ -z "$sponsord" ]; then
            echo "::error::a role has no pinned version"
            exit 1
          fi
          decdn_tag="$(resolve decdn/decdn "$decdn")"
          sponsord_tag="$(resolve decdn/sponsord "$sponsord")"
          if [ -z "$decdn_tag" ] || [ -z "$sponsord_tag" ]; then
            echo "::error::no finished release in decdn/decdn $decdn or decdn/sponsord $sponsord"
            exit 1
          fi
          { echo "decdn=$decdn"; echo "sponsord=$sponsord"
            echo "decdn_tag=$decdn_tag"; echo "sponsord_tag=$sponsord_tag"; } >> "$GITHUB_OUTPUT"
      # Public repo, the resolved tag. The sync script reads HEAD through git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: decdn/decdn
          ref: ${{ steps.pins.outputs.decdn_tag }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Each check exits 0 (current), 1 (stale) or anything else (could not run), and
      # the two failure kinds are reported differently: a broken generator is not an
      # upstream change. Full output goes to the job summary; annotations stay one line.
      - name: Compare the mirrors and the pins with upstream
        env:
          DECDN_PIN: ${{ steps.pins.outputs.decdn }}
          SPONSORD_PIN: ${{ steps.pins.outputs.sponsord }}
          DECDN_TAG: ${{ steps.pins.outputs.decdn_tag }}
          SPONSORD_TAG: ${{ steps.pins.outputs.sponsord_tag }}
        run: |
          rc=0
          check() {
            local name="$1" out status; shift
            out="$("$@" 2>&1)" && status=0 || status=$?
            case "$status" in
              0) echo "- ✅ **$name**: current" >> "$GITHUB_STEP_SUMMARY" ;;
              1) rc=1
                 echo "::error title=$name is stale::re-run its generator (see the job summary)"
                 { echo "- ❌ **$name**: stale"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
              *) rc=1
                 echo "::error title=$name check could not run::exit $status (see the job summary)"
                 { echo "- ⚠️ **$name**: check failed to run (exit $status)"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          }
          # The schema inventory has no --check of its own: generate, then diff, so a
          # crashing generator (exit 2) is not mistaken for "every key removed" (exit 1).
          # shellcheck disable=SC2329  # invoked indirectly, through check()
          schema_check() {
            local fresh
            fresh="$(mktemp)"
            python3 ansible/molecule/schema/files/gen-schema-keys.py upstream > "$fresh" || return 2
            diff -u ansible/molecule/schema/files/schema-keys.txt "$fresh"
          }
          # Exit 1 when the repo's newest vX.Y.Z tag (pre-releases skipped) is not in the
          # pinned line (or, for an exact pin, is not the pin): a new line is a bump.
          # shellcheck disable=SC2329  # invoked indirectly, through check()
          release_check() {
            local repo="$1" pin="$2" tags latest
            tags="$(git ls-remote --tags --refs "https://github.com/$repo" 'v*')" || return 2
            latest="$(sed -n 's#.*refs/tags/##p' <<<"$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)" || true
            [ -n "$latest" ] || { echo "$repo: no vX.Y.Z tag found"; return 2; }
            [ "$latest" = "v$pin" ] || [ "${latest%.*}" = "v$pin" ] && return 0
            echo "$repo: pinned $pin, newest vX.Y.Z tag $latest"
            return 1
          }
          # shellcheck disable=SC2329  # invoked by sums_check and digest_check
          asset() { # <repo> <tag> <file>: a release asset on stdout
            curl -fsSL --retry 3 "https://github.com/$1/releases/download/$2/$3"
          }
          # Exit 1 when Compose's onramp installer pin (compose/sponsord-onramp.env.example)
          # is not the release a default deploy serves, or its SHA256SUMS digest is not
          # that release's. The installers check the downloaded SHA256SUMS against it,
          # so a stale one would only fail on users' machines.
          # shellcheck disable=SC2329  # invoked indirectly, through check()
          sums_check() {
            local repo="$1" tag="$2" env=compose/sponsord-onramp.env.example release want got
            release="$(sed -nE 's/^ONRAMP_DECDN_RELEASE=//p' "$env")"
            want="$(sed -nE 's/^ONRAMP_DECDN_SUMS_SHA256=//p' "$env")"
            [ "$release" = "$tag" ] || { echo "$env: ONRAMP_DECDN_RELEASE is $release, not $tag"; return 1; }
            got="$(asset "$repo" "$tag" SHA256SUMS | sha256sum)" || return 2
            got="${got%% *}"
            [ "$got" = "$want" ] && return 0
            echo "$repo $tag: SHA256SUMS is $got, $env pins $want"
            return 1
          }
          # Exit 1 when a compose/.env.example digest is not the one the pinned release's
          # digest file names (the first of <files> the release has). The .asc is not
          # checked here; this compares, the bump checklist verifies.
          # shellcheck disable=SC2329  # invoked indirectly, through check()
          digest_check() {
            local repo="$1" tag="$2" var="$3" want got="" f; shift 3
            want="$(sed -nE "s/^$var=//p" compose/.env.example)"
            for f in "$@"; do got="$(asset "$repo" "$tag" "$f" 2>/dev/null)" && break; got=""; done
            [ -n "$got" ] || { echo "$repo $tag: none of $* found"; return 2; }
            got="${got##*@}"
            got="${got%%[[:space:]]*}"
            [ "$got" = "$want" ] && return 0
            echo "$repo $tag: $var should be $got, compose/.env.example has $want"
            return 1
          }
          echo "### Upstream drift (decdn/decdn $DECDN_PIN: $DECDN_TAG, $(git -C upstream rev-parse --short HEAD); decdn/sponsord $SPONSORD_PIN: $SPONSORD_TAG)" >> "$GITHUB_STEP_SUMMARY"
          check "network profiles" python3 scripts/sync-network-profiles.py upstream --ref HEAD --check
          check "config schema keys" schema_check
          check "decdn/decdn release line" release_check decdn/decdn "$DECDN_PIN"
          check "decdn/sponsord release line" release_check decdn/sponsord "$SPONSORD_PIN"
          check "Compose onramp decdn pin" sums_check decdn/decdn "$DECDN_TAG"
          check "Compose decdn-node digest" digest_check decdn/decdn "$DECDN_TAG" DECDN_IMAGE_DIGEST \
            decdn-node-image-digest.txt
          check "Compose sponsord digest" digest_check decdn/sponsord "$SPONSORD_TAG" SPONSORD_IMAGE_DIGEST \
            sponsord-image-digest.txt
          check "Compose sponsord-onramp digest" digest_check decdn/sponsord "$SPONSORD_TAG" \
            SPONSORD_ONRAMP_IMAGE_DIGEST sponsord-onramp-image-digest.txt
          exit "$rc"
