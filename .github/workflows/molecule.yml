---
name: Molecule

# Containerised converge + idempotence + verify of the roles, one runner per scenario.
# Heavy (privileged systemd Docker containers) — scoped to ansible/ changes and
# blocking. Mark the `molecule` check (the aggregate job below) required in branch
# protection once proven; the per-scenario check names follow the scenario list.
# This file is in `paths` alongside ansible/ so a change to the jobs themselves (their
# cache wiring, the matrix, the timeouts) is exercised by the PR that makes it.
# cloud-init/ is in `paths` because the `cloud-init` scenarios boot
# cloud-init/user-data*.yaml and run cloud-init/bootstrap.sh, and scripts/molecule.sh
# because every scenario runs through it (`make molecule`).
on:
  pull_request:
    paths: ['ansible/**', 'cloud-init/**', 'scripts/molecule.sh', '.github/workflows/molecule.yml']
  push:
    branches: [main]
    paths: ['ansible/**', 'cloud-init/**', 'scripts/molecule.sh', '.github/workflows/molecule.yml']

permissions:
  contents: read

concurrency:
  group: molecule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix comes from the same discovery `make molecule` uses, so a new scenario
  # directory is picked up with no edit here, and a directory without a molecule.yml
  # fails the run instead of silently dropping out of it (scripts/molecule.sh).
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5          # seconds in practice
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the scenarios
        id: list
        working-directory: ansible
        run: |
          scenarios="$(make -s molecule-list)"
          echo "$scenarios"
          echo "scenarios=$scenarios" >>"$GITHUB_OUTPUT"

  # One runner per scenario. They were one job at JOBS=3 on one 4-vCPU runner: ~31m
  # for 14 scenarios, CPU-bound (per-task overhead roughly doubled under contention),
  # with the slowest scenarios queued last. Now the wall clock is the slowest single
  # scenario plus setup: ~10m for 18 scenarios (first run, PR #96), set by
  # cloud-init-sponsord (~9m45s; now cloud-init-publisher, which also boots an
  # origin node), then cloud-init (~8m) and sponsord-onramp (~7m30s);
  # most others take 2-5m. By October 2026 iroh-relay and source-build had reached
  # ~11m on their side effects, which are now split over sibling scenarios (#106),
  # so no scenario should go much past ~6.5m. Re-measure against the timeout when a
  # scenario grows, and split one that approaches it along its side effects (see
  # CONTRIBUTING.md).
  scenario:
    name: molecule (${{ matrix.scenario }})
    needs: discover
    runs-on: ubuntu-latest      # Docker is preinstalled
    # A bound, not a target: without one a wedged privileged systemd container burns
    # the 360-minute default, and with cancel-in-progress above, some branch-protection
    # setups read the resulting cancelled check as "not failed" rather than as a failure.
    timeout-minutes: 25
    strategy:
      # Every scenario always reports: one failure must not hide another's.
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.discover.outputs.scenarios) }}
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image pull was most of `create` (~35s of a fresh runner's leg). Start it
      # first, in the background, so it overlaps the Python install below; the step
      # before `molecule test` waits for it. The runner keeps a step's background
      # processes until the job ends. Each pull leaves its exit status in a file,
      # since that later step is another shell and cannot `wait` on these.
      # `create` then finds the digest-pinned images present (pre_build_image: true).
      - name: Start pulling the scenario's images
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          pulls="$RUNNER_TEMP/pulls"
          mkdir -p "$pulls"
          yq '.platforms[].image | select(. != null)' "molecule/$SCENARIO/molecule.yml" \
            | sort -u >"$pulls/images"
          cat "$pulls/images"
          n=0
          while read -r image; do
            n=$((n + 1))
            ( docker pull -q "$image" >"$pulls/$n.log" 2>&1; echo $? >"$pulls/$n.rc" ) &
          done <"$pulls/images"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # uv resolves and installs the same unpinned list as pip did, newest of each,
      # in a fraction of pip's ~30s. No uv cache: in CI setup-uv prunes downloaded
      # wheels before saving, so a cache would hold little and add a save step.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install molecule + Ansible
        run: |
          venv="$RUNNER_TEMP/molecule-venv"
          uv venv --python "$(command -v python)" "$venv"
          uv pip install --python "$venv/bin/python" \
            molecule "molecule-plugins[docker]" ansible ansible-lint docker
          echo "$venv/bin" >>"$GITHUB_PATH"
      # Same key and same rationale as ci.yml's jobs (see ansible-lint there): a warm
      # tree makes the install a no-op that never contacts galaxy.ansible.com, and the
      # save is gated so a part-way Galaxy failure cannot poison the cache. The key is
      # derived wholly from ansible/requirements.yml, so it cannot drift from ci.yml's
      # copy the way a duplicated env var would. It wraps
      # `make molecule` because the deps install is owned by the Make target here, not
      # by a step of its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: galaxy-cache
        with:
          path: ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}
      # Bounded like the job: a pull that never finishes fails here, by name, rather
      # than leaving `create` to time out on an image it is still waiting for.
      - name: Wait for the image pulls
        run: |
          pulls="$RUNNER_TEMP/pulls"
          n="$(wc -l <"$pulls/images")"
          for ((i = 1; i <= n; i++)); do
            for ((t = 0; t < 600; t++)); do [[ -s "$pulls/$i.rc" ]] && break; sleep 1; done
            image="$(sed -n "${i}p" "$pulls/images")"
            [[ -s "$pulls/$i.rc" ]] || { echo "::error::pull of $image did not finish in 10 minutes"; exit 1; }
            [[ "$(<"$pulls/$i.rc")" == 0 ]] || { cat "$pulls/$i.log"; echo "::error::pull of $image failed"; exit 1; }
            echo "pulled $image"
          done
      - name: molecule test
        # There is deliberately no separate `make deps` step: `make molecule` runs deps
        # itself, so a standalone one would resolve and install the Galaxy requirements
        # a second time every run — a second chance to trip over a flaky
        # galaxy.ansible.com, for no added coverage. The cache above wraps that
        # Make-owned invocation instead. The name goes through env, not into the
        # script text: it comes from a directory name in the PR.
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: make molecule SCENARIOS="$SCENARIO"
      # A step `if:` without a status-check function implies success(), so this is
      # skipped when anything above failed — including a genuinely failing scenario,
      # which leaves the cache cold for that leg. Conservative on purpose: it is the
      # same guard that keeps a part-way Galaxy install out of the cache. On a cold
      # key every passing leg races to save; the losers log a harmless "Cache already
      # exists", as ci.yml's jobs that share this key do.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        with:
          path: ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

  # The one stable check name for branch protection: a matrix leg's name changes with
  # the scenario list. `always()` so it reports even when discovery or a leg failed
  # (skipped dependants otherwise leave the check skipped, which reads as passing),
  # and it passes only when every leg succeeded.
  molecule:
    needs: [discover, scenario]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5          # seconds in practice
    steps:
      - name: Require every scenario to pass
        env:
          DISCOVER: ${{ needs.discover.result }}
          SCENARIOS: ${{ needs.scenario.result }}
        run: |
          echo "discover: $DISCOVER, scenarios: $SCENARIOS"
          test "$DISCOVER" = success && test "$SCENARIOS" = success
