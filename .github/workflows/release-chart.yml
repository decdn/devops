---
name: Release chart

# A decdn-node-X.Y.Z tag releases the `decdn-node` Helm chart on its own version; the
# `decdn.node` and `decdn.publisher` collections have their own workflow
# (release-collection.yml). See RELEASING.md.
#
# `build` always runs: it gates the tag (Chart.yaml and the chart changelog must agree
# on X.Y.Z), re-runs the chart checks, packages the chart, and uploads it with
# SHA256SUMS as a workflow artifact. `publish` makes it public
# (oci://ghcr.io/decdn/charts, cosign-signed keyless, plus the Artifact Hub repository
# metadata; and a GitHub Release) ONLY when the repository variable PUBLISH_ENABLED is
# 'true'. Until then a tag push is a dry run. A manual dispatch is always a dry run.
#
# The tag prefix is part of the chart's cosign certificate identity
# (release-chart.yml@refs/tags/decdn-node-, RELEASING.md § Verifying a release): never
# rename this file or the tag shape once a chart is published.
on:
  push:
    tags: ['decdn-node-[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to dry-run, e.g. decdn-node-0.1.0 (nothing is published)
        required: true

permissions:
  contents: read

concurrency:
  # Per workflow: a manual dry run of each, both from main, must not queue behind
  # (or cancel) the other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false     # never cut a half-published release short

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  CHART_REGISTRY: oci://ghcr.io/decdn/charts

# `bash -eo pipefail`, not the default `bash -e`, so a failure anywhere in a pipe
# fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate the tag against the chart and its changelog
        # The gate accepts either artifact's tag; a manual dispatch could pass the other
        # one, so refuse it here, before anything is built.
        run: |
          [[ "$TAG" == decdn-node-* ]] || { echo "::error::$TAG is not a chart tag (decdn-node-X.Y.Z)"; exit 1; }
          scripts/check-release-version.sh "$TAG" --notes release-notes.md
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Helm is pinned five times: ci.yml's helm, kics and scripts jobs, and both jobs
      # here. Bump all five together.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Chart lint and render tests
        run: make lint-helm
      # Artifact Hub reads a release's changes from Chart.yaml, not CHANGELOG.md, so
      # generate the annotation from the changelog section the gate just checked. The
      # package carries it, the commit never does; lint ran on the chart as committed.
      # tests/scripts-test.sh runs this step and the check below by name.
      - name: Add the artifacthub.io/changes annotation
        run: |
          CHANGES="$(scripts/chart-artifacthub-changes.py charts/decdn-node/CHANGELOG.md "${TAG#decdn-node-}")"
          export CHANGES
          yq -i '.annotations["artifacthub.io/changes"] = strenv(CHANGES)' charts/decdn-node/Chart.yaml
      - name: Package the chart and write checksums
        run: |
          mkdir -p dist
          helm package charts/decdn-node --destination dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          # Not release assets, so outside SHA256SUMS: the notes become the Release
          # body, the Artifact Hub metadata is pushed next to the chart.
          cp release-notes.md charts/decdn-node/artifacthub-repo.yml dist/
          cat dist/SHA256SUMS
      - name: Check the packaged artifacthub.io/changes
        run: |
          helm show chart dist/decdn-node-"${TAG#decdn-node-}".tgz \
            | yq -o=json '.annotations["artifacthub.io/changes"] | from_yaml' \
            | jq -e 'type == "array" and length > 0 and all(.[];
                (.kind | IN("added", "changed", "deprecated", "removed", "fixed", "security"))
                and (.description | type == "string" and length > 0))' >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment with required reviewers in the repository settings.
    environment: release
    permissions:
      contents: write           # the GitHub Release
      packages: write           # the chart on ghcr.io
      id-token: write           # keyless cosign signature (Sigstore)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist
      - name: Verify the artifacts are the ones build checksummed
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Push and sign the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Helm and cosign keep separate credential stores (Helm's registry config
          # vs Docker's config.json), so log both in: cosign pushes the signature.
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Capture and print on both paths: under `bash -e` a bare out="$(…)" would
          # exit on failure before the error text was shown.
          if ! out="$(helm push dist/decdn-node-"${TAG#decdn-node-}".tgz "$CHART_REGISTRY" 2>&1)"; then
            echo "$out"
            echo "::error::helm push failed"
            exit 1
          fi
          echo "$out"
          digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' <<<"$out")"
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "ghcr.io/decdn/charts/decdn-node@$digest"
          echo "chart: ${CHART_REGISTRY}/decdn-node:${TAG#decdn-node-} ($digest)" >> "$GITHUB_STEP_SUMMARY"
      # Repeatable: oras push just moves the artifacthub.io tag.
      - name: Push the Artifact Hub repository metadata
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push ghcr.io/decdn/charts/decdn-node:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      # Last, so the Release page only appears once the chart is live. Not marked
      # Latest: the repo's Latest release follows the decdn.node collection, the
      # primary path.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "decdn-node chart ${TAG#decdn-node-}" --latest=false \
            --notes-file dist/release-notes.md \
            dist/decdn-node-*.tgz dist/SHA256SUMS
