---
# The core assertion of this scenario is IMPLICIT: molecule only reaches `verify`
# if `converge` (and the idempotence re-run) succeeded — i.e. the advisory
# readiness probe timed out WITHOUT failing the deploy (converge's post_tasks
# prove it retried the booting 200). This play nails down the rest of that end
# state: the unit is running (the hard service-state gate still passed) and its
# /metrics still says decdn_node_boot_ready 0 (proving the timeout path was
# actually taken, not short-circuited by a boot that finished anyway).
- name: Verify
  hosts: all
  become: true
  tasks:
    # side_effect.yml's last restart returns before the stub binds (Type=simple).
    - name: Read the node's metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/metrics
        return_content: true
      register: node_metrics
      retries: 10
      delay: 1
      until: node_metrics.status | default(-1) == 200

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Read node.toml for the disabled-observability branch
      ansible.builtin.slurp:
        src: /etc/decdn/node.toml
      register: node_toml_b64

    - name: Assert disabled Grafana with no explicit endpoint omits OTLP entirely
      ansible.builtin.assert:
        that:
          - "'otlp_endpoint' not in (node_toml_b64.content | b64decode)"
        fail_msg: >-
          node.toml rendered observability.otlp_endpoint even though both
          decdn_grafana_cloud_enabled is false and decdn_otlp_endpoint is empty.

    - name: Assert the deploy survived a readiness timeout with the unit running
      ansible.builtin.assert:
        that:
          # Still booting: the timeout path is what we exercised.
          - node_metrics.content is search('(?m)^decdn_node_boot_ready 0$')
          # The load-bearing liveness gate still holds: the unit is running.
          - >-
            'decdn-node.service' in ansible_facts.services
            and ansible_facts.services['decdn-node.service'].state == 'running'
        fail_msg: >-
          Expected a running decdn-node whose /metrics says decdn_node_boot_ready 0
          (advisory-timeout path). /metrics: {{ node_metrics.content }}
