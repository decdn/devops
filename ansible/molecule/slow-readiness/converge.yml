---
# Converge the decdn_node role against the stub in its `stuck` boot with a tiny
# readiness window (the role's variables are molecule.yml's inventory group_vars,
# shared with side_effect.yml). The advisory probe MUST keep polling the 200 that
# says decdn_node_boot_ready 0, then time out and WARN without failing — so this
# play reaching the end (and the idempotence re-run) is itself the core
# assertion; post_tasks prove the probe did not stop at the first 200.
# verify.yml then confirms the running-but-booting end state.
- name: Converge
  hosts: all
  become: true
  roles:
    - role: decdn_node
  post_tasks:
    # A probe that took any 200 as ready would stop at its first attempt; one that
    # reads the gauge retries until the window runs out on decdn_node_boot_ready 0
    # (attempts then equals the retries), and its warning names the booting state.
    - name: Assert the readiness probe kept polling a node that is still booting
      ansible.builtin.assert:
        that:
          - decdn_metrics_probe.status == 200
          - decdn_metrics_probe.content is search('(?m)^decdn_node_boot_ready 0$')
          - decdn_metrics_probe.attempts | int == decdn_readiness_retries | int
          - decdn_readiness_warning is not skipped
          - "'`decdn_node_boot_ready 0`:' in decdn_readiness_warning.msg"
        fail_msg: >-
          Expected the probe to retry a 200 carrying decdn_node_boot_ready 0 until
          its window ran out, then warn that the node is booting; got status
          {{ decdn_metrics_probe.status | default('none') }} after
          {{ decdn_metrics_probe.attempts | default('?') }} attempt(s).
