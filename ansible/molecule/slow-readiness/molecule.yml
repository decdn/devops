---
# Regression scenario for the ADVISORY /metrics readiness probe. Runs the stub
# daemon in its "late bind" mode (it stays alive but never binds metrics — see
# molecule/default/files/decdn-node-stub, gated on /etc/decdn/stub-no-metrics),
# with a deliberately tiny readiness window. It proves the fix: the role's probe
# WARNS (does not fail) on timeout, the deploy still succeeds, and the hard
# service-state gate confirms the unit is `running`. Reuses the default
# scenario's stub binary rather than duplicating it.
#
# `baseline` is NOT exercised here (same rationale as the default scenario:
# host-level hardening is real-host-only — see molecule/default/molecule.yml).
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: decdn-node-slow-readiness
    # Same digest-pinned image as the default scenario (repo convention). Re-resolve
    # both together to bump.
    image: geerlingguy/docker-debian12-ansible@sha256:4553092be2c00b1ffe580927b9ff03f3c3a0df32b7dd693a3eb02efb6c2b77b7
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
