---
# One host-provisioned secret.env case for converge.yml (looped over _sp_case: tag,
# content, task). Stages the treasury files and secret.env, runs sponsord with no
# inventory RPC URL, and records the tag only if the role failed at _sp_case.task.
- name: "Host-provisioned secret.env case {{ _sp_case.tag }}"
  block:
    - name: Create /etc/sponsord
      ansible.builtin.file:
        path: /etc/sponsord
        state: directory
        mode: "0755"

    - name: Stage the treasury files and the host secret.env
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0600"
      loop:
        - {dest: /etc/sponsord/treasury-keystore.json, content: "{}\n"}
        - {dest: /etc/sponsord/treasury-password, content: "placeholder\n"}
        - {dest: /etc/sponsord/secret.env, content: "{{ _sp_case.content }}"}
      loop_control:
        label: "{{ item.dest }}"

    - name: Run sponsord against the host secret.env
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_rpc_url: ""
  rescue:
    - name: Record the rejection (only if its assert failed) of {{ _sp_case.tag }}
      ansible.builtin.set_fact:
        decdn_rejected: "{{ decdn_rejected + [_sp_case.tag] }}"
      when: ansible_failed_task.name == _sp_case.task
  always:
    - name: Remove /etc/sponsord
      ansible.builtin.file:
        path: /etc/sponsord
        state: absent
