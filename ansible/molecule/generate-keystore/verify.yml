---
# Verify the opt-in generation path actually minted the wallet. Nothing was staged
# in a prepare step, so the presence of keystore.json + keystore.password at 0600
# (and node.secret) can only be the role's own `decdn_node_generate_keystore` block.
# The `idempotence` step in molecule.yml separately proves a second converge is a
# no-op (the stat/`creates:` gating never re-mints existing material).
- name: Verify
  hosts: all
  become: true
  vars:
    decdn_home: /var/lib/decdn
    decdn_etc: /etc/decdn
  tasks:
    - name: Look up the decdn user
      ansible.builtin.getent:
        database: passwd
        key: decdn

    - name: Assert the decdn system user exists with a nologin shell
      ansible.builtin.assert:
        that:
          - getent_passwd['decdn'] is defined and 'nologin' in getent_passwd['decdn'][5]
        fail_msg: "decdn system user missing or has a login shell"

    - name: Stat the generated wallet material
      ansible.builtin.stat:
        path: "{{ item }}"
      register: decdn_wallet
      loop:
        - "{{ decdn_home }}/keystore.json"
        - "{{ decdn_etc }}/keystore.password"
        - "{{ decdn_home }}/node.secret"

    - name: Assert the role generated the keystore + password + node identity at 0600
      ansible.builtin.assert:
        that:
          # exists-and-mode in one expression so a missing file short-circuits to
          # the fail_msg rather than raising on the absent stat.mode.
          - decdn_wallet.results[0].stat.exists and decdn_wallet.results[0].stat.mode == '0600'
          - decdn_wallet.results[1].stat.exists and decdn_wallet.results[1].stat.mode == '0600'
          - decdn_wallet.results[2].stat.exists and decdn_wallet.results[2].stat.mode == '0600'
        fail_msg: >-
          Expected the role to generate keystore.json + keystore.password + node.secret
          (all 0600) from nothing, but one is missing or not 0600 — the
          decdn_node_generate_keystore block did not run as expected.

    - name: Assert the keystore + password + node identity are owned by the decdn user
      ansible.builtin.assert:
        that:
          - decdn_wallet.results[0].stat.pw_name == 'decdn'
          - decdn_wallet.results[1].stat.pw_name == 'decdn'
          - decdn_wallet.results[2].stat.pw_name == 'decdn'
        fail_msg: "generated wallet material is not owned by the decdn user"

    - name: Stat the systemd unit
      ansible.builtin.stat:
        path: /etc/systemd/system/decdn-node.service
      register: decdn_unit

    - name: Assert the systemd unit was installed
      ansible.builtin.assert:
        that:
          - decdn_unit.stat.exists
        fail_msg: "decdn-node.service unit missing"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert decdn-node is running
      ansible.builtin.assert:
        that:
          # Membership-and-state in one expression so an absent service
          # short-circuits to the fail_msg instead of raising on .state.
          - >-
            'decdn-node.service' in ansible_facts.services
            and ansible_facts.services['decdn-node.service'].state == 'running'
        fail_msg: "decdn-node is not running — check: journalctl -u decdn-node -e"
