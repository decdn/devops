---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Resolve the fixture's main commit  # noqa: command-instead-of-module
      ansible.builtin.command: git -C /srv/decdn-fixture.git rev-parse main
      register: _fixture_head
      changed_when: false

    - name: Read the installed-source stamp
      ansible.builtin.slurp:
        src: /usr/local/lib/decdn/installed-source
      register: _stamp

    - name: Require the stamp to name the repo and the built commit
      ansible.builtin.assert:
        that:
          - >-
            (_stamp.content | b64decode | trim)
            == 'file:///srv/decdn-fixture.git@' ~ _fixture_head.stdout
        fail_msg: >-
          installed-source is {{ _stamp.content | b64decode | trim }}, expected
          main @ {{ _fixture_head.stdout }}

    - name: Stat the release stamp, the binaries and the build layout
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/lib/decdn/installed-version
        - /usr/local/bin/decdn-node
        - /usr/local/bin/decdn
        - /var/lib/decdn-build
        - /var/lib/decdn-build/toolchain
        - /var/lib/decdn-build/toolchain/cargo/bin/rustup
        - /var/lib/decdn-build/toolchain/rustup-init
        - /var/lib/decdn-build/git
        - /var/lib/decdn-build/git/decdn
        - /var/lib/decdn-build/work
        - /var/lib/decdn-build/work/decdn
        - /var/lib/decdn-build/work/decdn.tar
      register: _st

    # Nothing the build user can write outlives a build: the home, toolchain and
    # clone are root's, and the work directory is gone after a successful install.
    - name: Require root-owned binaries, a root-owned build layout and no leftovers
      vars:
        _s: "{{ dict(_st.results | map(attribute='item') | zip(_st.results | map(attribute='stat'))) }}"
        _b: /var/lib/decdn-build
      ansible.builtin.assert:
        that:
          - not _s['/usr/local/lib/decdn/installed-version'].exists
          - _s['/usr/local/bin/decdn-node'].pw_name == 'root'
          - _s['/usr/local/bin/decdn-node'].mode == '0755'
          - _s['/usr/local/bin/decdn'].pw_name == 'root'
          - _s['/usr/local/bin/decdn'].mode == '0755'
          - _s[_b].pw_name == 'root' and _s[_b].gr_name == 'decdn-build' and _s[_b].mode == '0750'
          - _s[_b ~ '/toolchain'].pw_name == 'root' and _s[_b ~ '/toolchain'].mode == '0755'
          - _s[_b ~ '/toolchain/cargo/bin/rustup'].pw_name == 'root'
          - not _s[_b ~ '/toolchain/rustup-init'].exists
          - _s[_b ~ '/git'].pw_name == 'root' and _s[_b ~ '/git'].mode == '0700'
          - _s[_b ~ '/git/decdn'].pw_name == 'root'
          - _s[_b ~ '/work'].pw_name == 'root' and _s[_b ~ '/work'].mode == '0755'
          - not _s[_b ~ '/work/decdn'].exists
          - not _s[_b ~ '/work/decdn.tar'].exists
        fail_msg: "{{ _s | to_nice_json }}"

    - name: Find anything under the build home the build user owns
      ansible.builtin.command:
        argv: [find, /var/lib/decdn-build, -user, decdn-build]
      register: _owned
      changed_when: false

    - name: Require that the build user owns nothing there between builds
      ansible.builtin.assert:
        that:
          - _owned.stdout | length == 0
        fail_msg: "Owned by decdn-build after the build: {{ _owned.stdout_lines }}"

    # files/fixture/crates/node/build.rs tries to leave these behind, and a
    # process: the sandboxed unit's private /tmp, /var/tmp and /dev/shm, its
    # read-only filesystem and its cgroup must have stopped all of it.
    - name: Stat what the hostile build script tried to leave on the host
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /tmp/decdn-build-escape
        - /var/tmp/decdn-build-escape
        - /dev/shm/decdn-build-escape
        - /var/lib/decdn-build/escape
      register: _escape

    - name: Look for a process of the build user
      ansible.builtin.command:
        argv: [pgrep, -u, decdn-build]
      register: _left_running
      changed_when: false
      failed_when: _left_running.rc not in [0, 1]

    - name: Require that nothing escaped the build sandbox
      ansible.builtin.assert:
        that:
          - _escape.results | selectattr('stat.exists') | list | length == 0
          - _left_running.rc == 1
        fail_msg: >-
          escaped files {{ _escape.results | selectattr('stat.exists') | map(attribute='item') | list }},
          build-user processes {{ _left_running.stdout_lines }}

    - name: Read cron.deny and at.deny
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/cron.deny, /etc/at.deny]
      register: _deny

    - name: Require cron and at denied to the build user
      ansible.builtin.assert:
        that:
          - >-
            _deny.results | map(attribute='content') | map('b64decode') | map('split')
            | select('contains', 'decdn-build') | list | length == 2

    - name: Read the installed binaries' fixture revision
      ansible.builtin.command: "{{ item }} --fixture-rev"
      loop:
        - /usr/local/bin/decdn-node
        - /usr/local/bin/decdn
      register: _rev
      changed_when: false

    - name: Require the binaries built from the fixture's first commit
      ansible.builtin.assert:
        that:
          - _rev.results | map(attribute='stdout') | list == ['1', '1']

    - name: Read the build user's account entry
      ansible.builtin.getent:
        database: passwd
        key: decdn-build

    - name: Require a no-login system build user
      ansible.builtin.assert:
        that:
          # getent fields after the name: password, uid, gid, gecos, home, shell.
          - ansible_facts.getent_passwd['decdn-build'][1] | int < 1000
          - ansible_facts.getent_passwd['decdn-build'][4] == '/var/lib/decdn-build'
          - ansible_facts.getent_passwd['decdn-build'][5] == '/usr/sbin/nologin'

    - name: Read the decdn-node unit state
      ansible.builtin.systemd:
        name: decdn-node
      register: _unit

    - name: Require decdn-node running on the source-built binary
      ansible.builtin.assert:
        that:
          - _unit.status.ActiveState == 'active'
