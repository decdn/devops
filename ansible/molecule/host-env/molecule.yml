---
# Containerised converge + idempotence + verify for the HOST-PROVISIONED secret
# path (#39): /etc/decdn/decdn.env is written by the operator on the target and
# decdn_rpc_url is left empty in inventory, so no secret transits the control
# machine. The role must then NOT rewrite the file, must lock it to 0600
# decdn:decdn, and must still start the daemon. `idempotence` is load-bearing
# here — it proves the role neither rewrites the file nor restart-loops on it.
#
# `baseline` is NOT exercised here for the same reasons as the `default` scenario
# (host-level hardening is meaningless in a throwaway systemd container) — see
# ../default/molecule.yml. This scenario reuses the shared stub daemon under
# ../default/files/decdn-node-stub.
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: decdn-node-hostenv-molecule
    # Same image as the default scenario, pinned by digest for reproducible CI.
    # Re-resolve the digest to bump (keep in sync with ../default/molecule.yml).
    image: geerlingguy/docker-debian12-ansible@sha256:4553092be2c00b1ffe580927b9ff03f3c3a0df32b7dd693a3eb02efb6c2b77b7
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
verifier:
  name: ansible
scenario:
  # converge -> idempotence proves a STABLE host file neither gets rewritten nor
  # restarts the unit; side_effect then edits that file out of band and the second
  # converge must restart the daemon (verify.yml compares MainPID across it). The
  # order matters: idempotence has to run while the file is still untouched.
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - converge
    - verify
    - destroy
