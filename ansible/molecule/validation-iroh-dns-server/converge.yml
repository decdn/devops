---
# NEGATIVE-path scenario for iroh_dns_server: proves the role's fail-loud input
# validation REJECTS bad values (AGENTS.md hard-rule 4), so a regression that
# weakens an assert fails CI. Same shape as ../validation-iroh-relay: each case runs
# the role with a VALID baseline (the play vars) plus ONE broken input, wrapped in
# block/rescue, and the rescue records a tag ONLY when the failing task is the exact
# assert that case targets (matched on ansible_failed_task.name). A bad value that
# slipped past validation fails later at a differently-named task, is NOT counted,
# and the final assert catches the miss.
#
# Every input case aborts at an assert before any host mutation. The host-side
# cases start a squatter on tcp/443, then on port 53 at the DNS bind address, and
# stop it again in `always:`; they stop before the binary is installed, so no server
# ever starts here.
- name: Converge iroh_dns_server (expect validation failures)
  hosts: all
  become: true
  vars:
    # Valid baseline; each case overrides exactly one input. manual, because the
    # release download is not wanted here.
    iroh_dns_server_install_method: manual
    iroh_dns_server_manual_bin_src: "{{ _ids_project }}/molecule/iroh-dns-server/files/iroh-dns-server-stub"
    _ids_project: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    _ids_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
    iroh_dns_server_hostname: dns.molecule.test
    iroh_dns_server_acme_contact: ops@molecule.test
    # The container's address is private, so the apex A record is set.
    iroh_dns_server_rr_a: 192.0.2.10
    # The target triple of the other supported architecture, for release-target.
    _ids_other_target: >-
      {{ (_ids_targets | dict2items | rejectattr('key', 'equalto', ansible_facts['architecture'])
          | map(attribute='value') | first) }}
    _ids_targets:
      x86_64: x86_64-unknown-linux-gnu
      aarch64: aarch64-unknown-linux-gnu
  tasks:
    - name: Initialize the rejected-by-validation tracker
      ansible.builtin.set_fact:
        decdn_rejected: []

    - name: "Case install-method — an unknown install method"
      block:
        - name: Run iroh_dns_server with an unknown install method
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: "source"
      rescue:
        - name: Record install-method rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['install-method'] }}"
          when: ansible_failed_task.name == "Require a valid install method"

    - name: "Case release-version — release mode with a malformed version"
      block:
        - name: Run iroh_dns_server with release mode with a malformed version
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: "release"
            iroh_dns_server_version: "1.3"
      rescue:
        - name: Record release-version rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-version'] }}"
          when: ansible_failed_task.name == "Require a pinned release version"

    - name: "Case release-sha256 — release mode with no digest for the host's target"
      block:
        - name: Run iroh_dns_server with release mode with no digest for the host's target
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: "release"
            iroh_dns_server_sha256: {}
      rescue:
        - name: Record release-sha256 rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-sha256'] }}"
          when: ansible_failed_task.name == "Require a pinned sha256 for the target"

    - name: "Case release-target — release mode with a target for another architecture"
      block:
        - name: Run iroh_dns_server with release mode with a target for another architecture
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: "release"
            iroh_dns_server_target: "{{ _ids_other_target }}"
      rescue:
        - name: Record release-target rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-target'] }}"
          when: ansible_failed_task.name == "Require the target triple to match the host architecture"

    - name: "Case release-target-unsupported — release mode for a target the role does not install"
      block:
        - name: Run iroh_dns_server with release mode for a target the role does not install
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: "release"
            iroh_dns_server_target: "riscv64gc-unknown-linux-gnu"
      rescue:
        - name: Record release-target-unsupported rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-target-unsupported'] }}"
          when: ansible_failed_task.name == "Require a supported target triple"

    - name: "Case manual-src — manual mode with no binary source"
      block:
        - name: Run iroh_dns_server with manual mode with no binary source
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_manual_bin_src: ""
      rescue:
        - name: Record manual-src rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['manual-src'] }}"
          when: ansible_failed_task.name == "Require a manual binary source"

    - name: "Case hostname-url — a URL as the hostname"
      block:
        - name: Run iroh_dns_server with a URL as the hostname
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_hostname: "https://dns.molecule.test"
      rescue:
        - name: Record hostname-url rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['hostname-url'] }}"
          when: ansible_failed_task.name == "Validate the DNS server hostname"

    - name: "Case hostname-ip — an IP address as the hostname"
      block:
        - name: Run iroh_dns_server with an IP address as the hostname
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_hostname: "192.0.2.1"
      rescue:
        - name: Record hostname-ip rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['hostname-ip'] }}"
          when: ansible_failed_task.name == "Validate the DNS server hostname"

    - name: "Case hostname-empty — no hostname"
      block:
        - name: Run iroh_dns_server with no hostname
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_hostname: ""
      rescue:
        - name: Record hostname-empty rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['hostname-empty'] }}"
          when: ansible_failed_task.name == "Validate the DNS server hostname"

    - name: "Case contact-mailto — a mailto URI as the contact"
      block:
        - name: Run iroh_dns_server with a mailto URI as the contact
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_acme_contact: "mailto:ops@molecule.test"
      rescue:
        - name: Record contact-mailto rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['contact-mailto'] }}"
          when: ansible_failed_task.name == "Validate the ACME contact"

    - name: "Case contact-empty — no ACME contact"
      block:
        - name: Run iroh_dns_server with no ACME contact
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_acme_contact: ""
      rescue:
        - name: Record contact-empty rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['contact-empty'] }}"
          when: ansible_failed_task.name == "Validate the ACME contact"

    - name: "Case bool-staging — a string for acme_staging"
      block:
        - name: Run iroh_dns_server with a string for acme_staging
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_acme_staging: "true"
      rescue:
        - name: Record bool-staging rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['bool-staging'] }}"
          when: ansible_failed_task.name == "Validate the boolean knobs"

    - name: "Case bool-mainline — a string for mainline_enabled"
      block:
        - name: Run iroh_dns_server with a string for mainline_enabled
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_mainline_enabled: "yes"
      rescue:
        - name: Record bool-mainline rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['bool-mainline'] }}"
          when: ansible_failed_task.name == "Validate the boolean knobs"

    - name: "Case origins-string — the origins as one string"
      block:
        - name: Run iroh_dns_server with the origins as one string
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_origins: "dns.molecule.test"
      rescue:
        - name: Record origins-string rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['origins-string'] }}"
          when: ansible_failed_task.name == "Validate the origins"

    - name: "Case origins-empty — no origin"
      block:
        - name: Run iroh_dns_server with no origin
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_origins: []
      rescue:
        - name: Record origins-empty rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['origins-empty'] }}"
          when: ansible_failed_task.name == "Validate the origins"

    - name: "Case origins-dup — one origin twice, once qualified"
      block:
        - name: Run iroh_dns_server with one origin twice, once qualified
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_origins: ["dns.molecule.test", "DNS.molecule.test."]
      rescue:
        - name: Record origins-dup rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['origins-dup'] }}"
          when: ansible_failed_task.name == "Validate the origins"

    - name: "Case origins-url — a URL as an origin"
      block:
        - name: Run iroh_dns_server with a URL as an origin
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_origins: ["https://dns.molecule.test"]
      rescue:
        - name: Record origins-url rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['origins-url'] }}"
          when: ansible_failed_task.name == "Validate the origins"

    - name: "Case origins-root-only — the root as the only origin"
      block:
        - name: Run iroh_dns_server with the root as the only origin
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_origins: ["."]
      rescue:
        - name: Record origins-root-only rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['origins-root-only'] }}"
          when: ansible_failed_task.name == "Validate the origins"

    - name: "Case soa-fields — an SOA with five fields"
      block:
        - name: Run iroh_dns_server with an SOA with five fields
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_default_soa: "dns.molecule.test. hostmaster.dns.molecule.test. 0 10800 3600"
      rescue:
        - name: Record soa-fields rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['soa-fields'] }}"
          when: ansible_failed_task.name == "Validate the SOA and the TTL"

    - name: "Case soa-serial — an SOA serial past 32 bits"
      block:
        - name: Run iroh_dns_server with an SOA serial past 32 bits
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_default_soa: >-
              dns.molecule.test. hostmaster.dns.molecule.test. 4294967296 10800 3600 604800 3600
      rescue:
        - name: Record soa-serial rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['soa-serial'] }}"
          when: ansible_failed_task.name == "Validate the SOA and the TTL"

    - name: "Case ttl-zero — a zero record TTL"
      block:
        - name: Run iroh_dns_server with a zero record TTL
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_default_ttl: 0
      rescue:
        - name: Record ttl-zero rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['ttl-zero'] }}"
          when: ansible_failed_task.name == "Validate the SOA and the TTL"

    - name: "Case ns-relative — an NS name without its trailing dot"
      block:
        - name: Run iroh_dns_server with an NS name without its trailing dot
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_ns: "dns.molecule.test"
      rescue:
        - name: Record ns-relative rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['ns-relative'] }}"
          when: ansible_failed_task.name == "Validate the NS record"

    - name: "Case ns-below-origin — an NS name below an origin"
      block:
        - name: Run iroh_dns_server with an NS name below an origin
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_ns: "ns1.dns.molecule.test."
      rescue:
        - name: Record ns-below-origin rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['ns-below-origin'] }}"
          when: ansible_failed_task.name == "Validate the NS record"

    - name: "Case https-bind-loopback — a loopback https bind"
      block:
        - name: Run iroh_dns_server with a loopback https bind
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_https_bind_address: "127.0.0.1"
      rescue:
        - name: Record https-bind-loopback rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['https-bind-loopback'] }}"
          when: ansible_failed_task.name == "Validate the https bind address"

    - name: "Case https-bind-brackets — a bracketed https bind"
      block:
        - name: Run iroh_dns_server with a bracketed https bind
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_https_bind_address: "[::]"
      rescue:
        - name: Record https-bind-brackets rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['https-bind-brackets'] }}"
          when: ansible_failed_task.name == "Validate the https bind address"

    - name: "Case dns-bind-port — a DNS bind with a port"
      block:
        - name: Run iroh_dns_server with a DNS bind with a port
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_dns_bind_address: "192.0.2.5:53"
      rescue:
        - name: Record dns-bind-port rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['dns-bind-port'] }}"
          when: ansible_failed_task.name == "Validate the DNS bind address"

    - name: "Case dns-bind-empty — no DNS bind address (no default IPv4 fact)"
      block:
        - name: Run iroh_dns_server with no DNS bind address (no default IPv4 fact)
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_dns_bind_address: ""
      rescue:
        - name: Record dns-bind-empty rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['dns-bind-empty'] }}"
          when: ansible_failed_task.name == "Validate the DNS bind address"

    - name: "Case dns-bind-mapped — an IPv4-mapped DNS bind"
      block:
        - name: Run iroh_dns_server with an IPv4-mapped DNS bind
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_dns_bind_address: "::ffff:192.0.2.5"
      rescue:
        - name: Record dns-bind-mapped rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['dns-bind-mapped'] }}"
          when: ansible_failed_task.name == "Validate the DNS bind address"

    - name: "Case rr-a-v6 — an IPv6 address as the A record"
      block:
        - name: Run iroh_dns_server with an IPv6 address as the A record
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_a: "2001:db8::1"
      rescue:
        - name: Record rr-a-v6 rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['rr-a-v6'] }}"
          when: ansible_failed_task.name == "Validate the apex address records"

    - name: "Case rr-aaaa-v4 — an IPv4 address as the AAAA record"
      block:
        - name: Run iroh_dns_server with an IPv4 address as the AAAA record
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_aaaa: "192.0.2.1"
      rescue:
        - name: Record rr-aaaa-v4 rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['rr-aaaa-v4'] }}"
          when: ansible_failed_task.name == "Validate the apex address records"

    - name: "Case rr-a-private — a private (RFC 1918) address as the A record"
      block:
        - name: Run iroh_dns_server with a private (RFC 1918) address as the A record
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_a: "10.0.0.1"
      rescue:
        - name: Record rr-a-private rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['rr-a-private'] }}"
          when: ansible_failed_task.name == "Validate the apex address records"

    - name: "Case rr-aaaa-ula — a ULA address as the AAAA record"
      block:
        - name: Run iroh_dns_server with a ULA address as the AAAA record
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_aaaa: "fd00::1"
      rescue:
        - name: Record rr-aaaa-ula rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['rr-aaaa-ula'] }}"
          when: ansible_failed_task.name == "Validate the apex address records"

    - name: "Case ns-no-address — an apex NS name and no address for it (wildcard DNS bind)"
      block:
        - name: Run iroh_dns_server with an apex NS name and no address for it (wildcard DNS bind)
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_dns_bind_address: "::"
            iroh_dns_server_rr_a: ""
      rescue:
        - name: Record ns-no-address rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['ns-no-address'] }}"
          when: ansible_failed_task.name == "Require an address for the NS name and the hostname"

    - name: "Case ns-no-address-private — an apex NS name and a private DNS bind as its only address"
      block:
        - name: Run iroh_dns_server with an apex NS name and a private DNS bind as its only address
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_a: ""
      rescue:
        - name: Record ns-no-address-private rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['ns-no-address-private'] }}"
          when: ansible_failed_task.name == "Require an address for the NS name and the hostname"

    - name: "Case hostname-no-address — no NS record, and no address for the apex hostname"
      block:
        - name: Run iroh_dns_server with no NS record, and no address for the apex hostname
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_rr_ns: ""
            iroh_dns_server_rr_a: ""
      rescue:
        - name: Record hostname-no-address rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['hostname-no-address'] }}"
          when: ansible_failed_task.name == "Require an address for the NS name and the hostname"

    - name: "Case dns-bind-noncanonical — an IPv6 DNS bind in upper case"
      block:
        - name: Run iroh_dns_server with an IPv6 DNS bind in upper case
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_dns_bind_address: "2001:DB8::1"
      rescue:
        - name: Record dns-bind-noncanonical rejection (only if its assert failed)
