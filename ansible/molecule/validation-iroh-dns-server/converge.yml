    - name: "Case metrics-public — metrics on a public address"
      block:
        - name: Run iroh_dns_server with metrics on a public address
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_metrics_bind: "0.0.0.0"
