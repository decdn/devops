    - name: "Case health-port-metrics — the health listener on the metrics port"
      block:
        - name: Run iroh_dns_server with the health listener on the metrics port
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_health_port: 9117
      rescue:
        - name: Record health-port-metrics rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['health-port-metrics'] }}"
          when: ansible_failed_task.name == "Require the metrics and health listeners on loopback"

    - name: "Case rate-smart — the X-Forwarded-For rate limit"
      block:
        - name: Run iroh_dns_server with the X-Forwarded-For rate limit
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_pkarr_put_rate_limit: "smart"
      rescue:
        - name: Record rate-smart rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['rate-smart'] }}"
          when: ansible_failed_task.name == "Validate the pkarr PUT rate limit"

    - name: "Case mainline-bootstrap-off — bootstrap nodes with the DHT off"
      block:
        - name: Run iroh_dns_server with bootstrap nodes with the DHT off
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_mainline_bootstrap: ["router.molecule.test:6881"]
      rescue:
        - name: Record mainline-bootstrap-off rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['mainline-bootstrap-off'] }}"
          when: ansible_failed_task.name == "Validate the mainline DHT bootstrap nodes"

    - name: "Case mainline-bootstrap-shape — a bootstrap node without a port"
      block:
        - name: Run iroh_dns_server with a bootstrap node without a port
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_mainline_enabled: true
            iroh_dns_server_mainline_bootstrap: ["router.molecule.test"]
      rescue:
        - name: Record mainline-bootstrap-shape rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['mainline-bootstrap-shape'] }}"
          when: ansible_failed_task.name == "Validate the mainline DHT bootstrap nodes"

    - name: "Case mainline-bootstrap-port — a bootstrap node port past 65535"
      block:
        - name: Run iroh_dns_server with a bootstrap node port past 65535
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_mainline_enabled: true
            iroh_dns_server_mainline_bootstrap: ["router.molecule.test:70000"]
      rescue:
        - name: Record mainline-bootstrap-port rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['mainline-bootstrap-port'] }}"
          when: ansible_failed_task.name == "Validate the mainline DHT bootstrap nodes"

    - name: "Case limit-nofile — an open-files limit under 1024"
      block:
        - name: Run iroh_dns_server with an open-files limit under 1024
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_limit_nofile: 100
      rescue:
        - name: Record limit-nofile rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['limit-nofile'] }}"
          when: ansible_failed_task.name == "Validate the open-files limit"

    - name: "Case log-space — a log filter with a space"
      block:
        - name: Run iroh_dns_server with a log filter with a space
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_log_level: "info debug"
      rescue:
        - name: Record log-space rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['log-space'] }}"
          when: ansible_failed_task.name == "Validate iroh_dns_server_log_level"

    - name: "Case cert-check — an unknown certificate-check mode"
      block:
        - name: Run iroh_dns_server with an unknown certificate-check mode
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_certificate_check: "maybe"
      rescue:
        - name: Record cert-check rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['cert-check'] }}"
          when: ansible_failed_task.name == "Validate the readiness and certificate-check knobs"

    # Host-side: "::" (the https default) on a kernel that binds IPv6 only, where it
    # would serve no IPv4 client. The setting is per network namespace.
    - name: "Case bindv6only — the wildcard https bind with net.ipv6.bindv6only=1"
      block:
        - name: Make this namespace bind IPv6 only
          ansible.builtin.command:
            argv: [sysctl, -w, net.ipv6.bindv6only=1]
          changed_when: true

        - name: Run iroh_dns_server on a kernel that binds IPv6 only
          ansible.builtin.include_role:
            name: iroh_dns_server
      rescue:
        - name: Record bindv6only rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['bindv6only'] }}"
          when: ansible_failed_task.name == 'Refuse "::" on a host that binds IPv6 only'
      always:
        - name: Bind both families again
          ansible.builtin.command:
            argv: [sysctl, -w, net.ipv6.bindv6only=0]
          changed_when: true

    # Host-side: valid inputs, but another process holds a port the server needs.
    - name: "Case port-squatter-https — another process on tcp/443"
      block:
        - name: Squat on tcp/443 with another process
          ansible.builtin.command:
            argv: [systemd-run, --unit=molecule-squatter-443, --collect,
                   python3, -m, http.server, "443", --bind, "0.0.0.0"]
          changed_when: true

        - name: Wait for the squatter on tcp/443 to listen
          ansible.builtin.wait_for:
            port: 443
            host: "127.0.0.1"
            timeout: 15

        - name: Run iroh_dns_server while another process holds tcp/443
          ansible.builtin.include_role:
            name: iroh_dns_server
      rescue:
        - name: Record port-squatter-https rejection (only if its guard failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['port-squatter-https'] }}"
          when: ansible_failed_task.name == "Refuse ports held by another process"
      always:
        - name: Stop the squatter on tcp/443
          ansible.builtin.systemd_service:
            name: molecule-squatter-443
            state: stopped
          failed_when: false

    - name: "Case port-squatter-dns — another process on port 53 at the DNS bind address"
      block:
        - name: Squat on port 53 at the DNS bind address with another process
          ansible.builtin.command:
            argv: [systemd-run, --unit=molecule-squatter-53, --collect,
                   python3, -m, http.server, "53", --bind, "{{ _ids_ip }}"]
          changed_when: true

        - name: Wait for the squatter on port 53 at the DNS bind address to listen
          ansible.builtin.wait_for:
            port: 53
            host: "{{ _ids_ip }}"
            timeout: 15

        - name: Run iroh_dns_server while another process holds port 53 at the DNS bind address
          ansible.builtin.include_role:
            name: iroh_dns_server
      rescue:
        - name: Record port-squatter-dns rejection (only if its guard failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['port-squatter-dns'] }}"
          when: ansible_failed_task.name == "Refuse ports held by another process"
      always:
        - name: Stop the squatter on port 53 at the DNS bind address
          ansible.builtin.systemd_service:
            name: molecule-squatter-53
            state: stopped
          failed_when: false

    # Host-side: a holder of port 53 on every address (dnsmasq or bind's usual way)
    # while the server binds one: the wildcard covers the bind address too.
    - name: "Case port-squatter-dns-wildcard — another process on port 53 on every address"
      block:
        - name: Squat on port 53 on every address with another process
          ansible.builtin.command:
            argv: [systemd-run, --unit=molecule-squatter-53-any, --collect,
                   python3, -m, http.server, "53", --bind, 0.0.0.0]
          changed_when: true

        - name: Wait for the wildcard squatter on port 53 to listen
          ansible.builtin.wait_for:
            port: 53
            host: 127.0.0.1
            timeout: 15

        - name: Run iroh_dns_server while another process holds port 53 on every address
          ansible.builtin.include_role:
            name: iroh_dns_server
      rescue:
        - name: Record port-squatter-dns-wildcard rejection (only if its guard failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['port-squatter-dns-wildcard'] }}"
          when: ansible_failed_task.name == "Refuse ports held by another process"
      always:
        - name: Stop the wildcard squatter on port 53
          ansible.builtin.systemd_service:
            name: molecule-squatter-53-any
            state: stopped
          failed_when: false

    # Host-side: a udp-only holder of port 53 at the DNS bind address (the tcp
    # squatters above do not exercise the guard's udp read).
    - name: "Case port-squatter-dns-udp — another process on udp/53 at the DNS bind address"
      block:
        - name: Hold udp/53 at the DNS bind address with another process
          ansible.builtin.command:
            argv: [systemd-run, --unit=molecule-squatter-udp53, --collect, python3, -c,
                   "import socket, sys, time; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM);
                   s.bind((sys.argv[1], 53)); time.sleep(600)", "{{ _ids_ip }}"]
          changed_when: true

        - name: Wait for the udp squatter to bind
          ansible.builtin.command:
            argv: [ss, -Hlun, "( sport = :53 )"]
          register: _ids_udp_squat
          changed_when: false
          retries: 30
          delay: 1
          until: _ids_udp_squat.stdout | length > 0

        - name: Run iroh_dns_server while another process holds udp/53
          ansible.builtin.include_role:
            name: iroh_dns_server
      rescue:
        - name: Record port-squatter-dns-udp rejection (only if its guard failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['port-squatter-dns-udp'] }}"
          when: ansible_failed_task.name == "Refuse ports held by another process"
      always:
        - name: Stop the udp squatter
          ansible.builtin.systemd_service:
            name: molecule-squatter-udp53
            state: stopped
          failed_when: false

    - name: Require every bad input to have been rejected by its own assert
      ansible.builtin.assert:
        that:
          - decdn_rejected | sort == _decdn_expected | sort
        fail_msg: >-
          Expected {{ _decdn_expected | sort }}, got {{ decdn_rejected | sort }} — a
          missing tag means that bad value slipped past validation (it would reach
          the server and crash-loop it, or open what must stay closed).
      vars:
        _decdn_expected:
          - install-method
          - release-version
          - release-sha256
          - release-target
          - release-target-unsupported
          - manual-src
          - hostname-url
          - hostname-ip
          - hostname-empty
          - contact-mailto
          - contact-empty
          - bool-staging
          - bool-mainline
          - origins-string
          - origins-empty
          - origins-dup
          - origins-url
          - soa-fields
          - soa-serial
          - ttl-zero
          - ns-relative
          - ns-below-origin
          - https-bind-loopback
          - https-bind-brackets
          - dns-bind-port
          - dns-bind-empty
          - dns-bind-mapped
          - rr-a-v6
          - rr-aaaa-v4
          - ns-no-address
          - ns-no-address-private
          - hostname-no-address
          - dns-bind-noncanonical
          - metrics-public
          - metrics-port-relay
          - health-port-metrics
          - rate-smart
          - mainline-bootstrap-off
          - mainline-bootstrap-shape
          - limit-nofile
          - log-space
          - cert-check
          - port-squatter-https
          - port-squatter-dns
          - port-squatter-dns-wildcard
          - port-squatter-dns-udp
          - origins-root-only
          - bindv6only
          - rr-a-private
          - rr-aaaa-ula
          - mainline-bootstrap-port
