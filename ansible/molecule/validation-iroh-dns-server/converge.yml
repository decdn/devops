        - name: Record metrics-public rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['metrics-public'] }}"
          when: ansible_failed_task.name == "Require the metrics and health listeners on loopback"

    - name: "Case metrics-port-relay — metrics on the relay's metrics port"
      block:
        - name: Run iroh_dns_server with metrics on the relay's metrics port
          ansible.builtin.include_role:
