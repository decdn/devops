---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Query chain id over loopback
      ansible.builtin.uri:
        url: "http://127.0.0.1:8545"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: eth_chainId
          params: []
      register: chainid

    - name: Chain id is 31337 (0x7a69)
      ansible.builtin.assert:
        that:
          - chainid.json.result == "0x7a69"
        fail_msg: "expected 0x7a69, got {{ chainid.json.result | default('<none>') }}"

    - name: Collect listening sockets
      ansible.builtin.command:
        cmd: ss -ltn
      register: listeners
      changed_when: false

    - name: Assert anvil and caddy bind loopback only (never 0.0.0.0)
      ansible.builtin.assert:
        that:
          - "'0.0.0.0:8545' not in listeners.stdout"
          - "'0.0.0.0:8080' not in listeners.stdout"
          - "'127.0.0.1:8545' in listeners.stdout"
          - "'127.0.0.1:8080' in listeners.stdout"

    - name: Reject unauthenticated requests through Caddy (401)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: eth_chainId
          params: []
        status_code: 401
      register: noauth
      failed_when: noauth.status != 401
