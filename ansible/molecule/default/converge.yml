---
# Exercise the decdn_node role only (baseline is real-host-only — see molecule.yml).
# `manual` install copies the stub daemon from the scenario's files/ dir, so no
# published release is needed. The required chain/contract knobs use placeholder
# (but well-formed) values — the role's fail-loud asserts still run against them.
- name: Converge
  hosts: all
  become: true
  vars:
    stub_bin: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/decdn-node-stub"
    decdn_node_install_method: manual
    decdn_node_manual_bin_src: "{{ stub_bin }}"
    decdn_cli_manual_bin_src: "{{ stub_bin }}"
    # Manual mode doesn't require a version, but setting one that MATCHES the stub's
    # `--version` output exercises the install-time version-match backstop
    # (install.yml) instead of letting it degrade to a bare liveness check. Must
    # stay in sync with the version string printed by files/decdn-node-stub.
    decdn_node_version: "0.0.0-molecule-stub"
    decdn_rpc_url: "https://rpc.example.invalid/"
    decdn_chain_id: 421614
    decdn_region: "US"
    decdn_payment_channel_address: "0x1111111111111111111111111111111111111111"
    decdn_capacity_bond_address: "0x2222222222222222222222222222222222222222"
    decdn_slash_judge_address: "0x3333333333333333333333333333333333333333"
    # fs origin: exercises the role's "create the fs cache-origin base dir" task
    # (#28) — /var/lib/decdn/origin does not pre-exist, so the run genuinely creates
    # it (verify.yml asserts owner/group/mode). Keep in sync with verify.yml.
    decdn_cache_origin_kind: "fs"
    decdn_cache_origin_path: "/var/lib/decdn/origin"
    # Operator-facing tuning knobs (#29 + siblings): exercise the new emission +
    # validation. Chosen to cover the forms a naive template would get wrong — an
    # explicit 0 (must EMIT, not be dropped), bare-integer Bytes/Percent (never
    # "2MiB"/"4.0"), a bool (rendered lowercase via `| lower`), and a string list.
    # verify.yml asserts each renders with the exact value AND type. Keep in sync.
    decdn_node_to_node_pull_through_enabled: true
    decdn_gc_interval_sec: 0
    decdn_pull_ahead_bytes: 2097152
    decdn_pull_share_ratio_percent: 400
    decdn_enable_0rtt: false
    decdn_delivery_floor: 0
    decdn_settlement_auto_threshold_micro_usdc: 50000000
    # Two entries each so the {% for %} comma-join branch (loop.last) is exercised —
    # a single-element list never renders the separator. verify.yml asserts order.
    decdn_relay_urls:
      - "https://relay1.example.invalid:443"
      - "https://relay2.example.invalid:443"
    decdn_pinned_hashes:
      - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    # Exercise baseline's named-sudo-users feature (see pre_tasks below). Throwaway
    # keys, generated for this test only — public keys, not credentials. Two users
    # on purpose: `alice.smith` has a '.' (so the sudoers.d filename-sanitize maps it
    # to /etc/sudoers.d/alice_smith — the one branch whose failure is silent) and two
    # keys (exercises the multi-key authorized_key loop), while molecule-operator stays single.
    baseline_sudo_users:
      - name: molecule-operator
        keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA/WM19rWc9jhe0qncc4EuoLzkpR28E+oq77lV2HNvaV molecule@test"
      - name: alice.smith
        keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAiMn5YPa5+zTGH+dtmHTWBxw5H2/Z587gzTM44n0T9A alice-key1@test"
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID0mUUEyMOboViIle8vOOa3aGVXiH5NC2HnxLp+A5Gj+ alice-key2@test"
  # baseline as a whole is real-host-only (firewall + DevSec hardening — see
  # molecule.yml), but its named-sudo-users block is container-safe, so run just
  # that task file here to give the feature real converge/idempotence/verify coverage.
  pre_tasks:
    # Pre-create alice.smith with a DISABLED-password sentinel ('*', not a real
    # credential) so the role's `password_lock` has an unlocked field to convert
    # (usermod -L prepends '!' -> '!*'). Without this the account would already be
    # '!' from useradd and the lock assertion in verify.yml would pass vacuously.
    # update_password: on_create keeps the field stable across the idempotence re-run.
    - name: Seed alice.smith with a disabled password so the lock is verifiable
      ansible.builtin.user:
        name: alice.smith
        password: "*"
        update_password: on_create
        shell: /bin/bash
        create_home: true
    - name: Exercise baseline's named-sudo-users block (container-safe subset)
      ansible.builtin.include_role:
        name: baseline
        tasks_from: sudo_users
  roles:
    - role: decdn_node
