---
# Containerised converge + verify + idempotence for the service roles.
# Only `anvil` and `caddy` are exercised here — `baseline` applies DevSec
# ssh_hardening (disables root/password login) which would sever Molecule's
# connection to a throwaway container, so it is validated on real hosts instead.
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: anvil-molecule
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
  inventory:
    group_vars:
      all:
        # converge.yml runs only anvil + caddy — baseline (and its admin-user /
        # ssh_hardening logic) is never exercised here, so no ssh_admin_* is needed.
        foundry_version: latest
        # Loopback plain-HTTP caddy: a container can't satisfy public ACME, and
        # verify.yml asserts the loopback bind. Production defaults to caddy_public: true.
        caddy_public: false
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - converge
    - idempotence
    - verify
    - destroy
