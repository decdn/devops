---
# Containerised converge + idempotence + verify for the public deCDN node.
# Exercises the `decdn_node` role end-to-end against a stub daemon: install
# (manual mode, so no published release is needed), the operator-keystore gate,
# node.toml + a hardened systemd unit, service start, and the role's own
# /metrics readiness probe.
#
# `baseline` is NOT exercised here — it applies DevSec ssh_hardening (disables
# root/password login) which would sever Molecule's connection to a throwaway
# container, so it is validated on real hosts via `make check` instead.
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml
driver:
  name: docker
platforms:
  - name: decdn-node-molecule
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
