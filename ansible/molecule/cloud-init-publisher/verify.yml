---
# After the secrets: the host moved to the pinned tag, the origin node and both sponsor
# services came from their (mirrored, signed) releases and are running, with the
# origin backend in node.toml, sponsord generated its own API token, and Caddy serves
# the onramp over https. The toolchain pins are ../cloud-init's check.
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Read the bootstrap state
      ansible.builtin.slurp:
        src: /var/lib/decdn-bootstrap/state
      register: bootstrap_state

    - name: Stat the list of missing secrets (removed on "complete")
      ansible.builtin.stat:
        path: /var/lib/decdn-bootstrap/awaiting
      register: awaiting

    # side_effect moved DEVOPS_REF from converge's SHA to a tag on a newer commit.
    - name: Read the tagged commit (recorded by prepare.yml)
      ansible.builtin.slurp:
        src: /srv/devops-src.tag-sha
      register: tag_sha

    - name: Read the checkout's commit
      ansible.builtin.slurp:
        src: /opt/decdn-devops/.git/HEAD
      register: checkout_head

    - name: Read the installed-version stamps (release mode only writes them)
      ansible.builtin.slurp:
        src: "/usr/local/lib/{{ item }}/installed-version"
      register: stamps
      loop: [decdn, sponsord, sponsord-onramp]

    - name: Stat the host-generated API token
      ansible.builtin.stat:
        path: /etc/sponsord/api-token
      register: api_token

    - name: Read the origin backend from the node's config
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, tomllib
            with open("/etc/decdn/node.toml", "rb") as f:
                print(json.dumps(tomllib.load(f).get("cache", {}).get("origin")))
      register: node_origin
      changed_when: false

    - name: Gather service facts
      ansible.builtin.service_facts:

    # The role probes the same; this proves the chain still answers after the run.
    - name: Fetch the onramp's /healthz through Caddy
      ansible.builtin.command:
        argv: [curl, -fsSk, --max-time, '10', --resolve, 'onramp.molecule.test:443:127.0.0.1',
               'https://onramp.molecule.test/healthz']
      register: https_health
      changed_when: false
      failed_when: false

    - name: Run the login hint
      ansible.builtin.command:
        cmd: sh /etc/profile.d/decdn-bootstrap.sh
      register: login_hint
      changed_when: false

    - name: Assert every service is installed from its release and running
      vars:
        services: ['caddy.service', 'decdn-node.service', 'sponsord-onramp.service', 'sponsord.service']
        origin: "{{ node_origin.stdout | from_json }}"
        # A unit that is absent drops out here, rather than failing the template.
        units: "{{ ansible_facts.services | dict2items | selectattr('key', 'in', services) }}"
        running: "{{ units | selectattr('value.state', 'equalto', 'running') | map(attribute='key') | sort }}"
      ansible.builtin.assert:
        that:
          - bootstrap_state.content | b64decode | trim == 'complete'
          - not awaiting.stat.exists
          - checkout_head.content | b64decode | trim == tag_sha.content | b64decode | trim
          - stamps.results | map(attribute='content') | map('b64decode') | map('trim') | unique
            == ['0.0.0-molecule-stub']
          - "origin == {'kind': 'http', 'url': 'https://content.example.invalid/'}"
          - api_token.stat.exists
          - api_token.stat.mode == '0600'
          - running == services
          - https_health.rc == 0
          - login_hint.stdout == ''
        fail_msg: >-
          state={{ bootstrap_state.content | b64decode | trim }} awaiting={{ awaiting.stat.exists }}
          head={{ checkout_head.content | b64decode | trim }} (tag {{ tag_sha.content | b64decode | trim }})
          stamps={{ stamps.results | map(attribute='content') | map('b64decode') | list }}
          origin={{ origin | to_json }}
          api-token={{ api_token.stat.mode | default('absent') }}
          running={{ running }} of {{ services }}
          https rc={{ https_health.rc }} {{ https_health.stderr }}
          hint={{ login_hint.stdout | to_json }}
