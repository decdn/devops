---
# Everything the publisher user-data needs from the outside world, stood up inside the
# container (see molecule.yml). The secrets are NOT staged here: side_effect writes
# them after the first boot, as the operator would.
- name: Pack the working tree
  ansible.builtin.import_playbook: ../cloud-init/pack.yml

- name: Prepare
  hosts: all
  become: true
  vars:
    stub_version: "0.0.0-molecule-stub"
    stubs: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule"
    # Two repositories' releases of the same version, so each gets its own base
    # (converge.yml): decdn/decdn's node and CLI (../cloud-init's stub), and
    # decdn/sponsord's one release holding both archives under one SHA256SUMS, as it
    # releases its workspace.
    mirror_releases:
      - dir: "decdn/v{{ stub_version }}"
        bins:
          - {name: decdn-node, src: "{{ stubs }}/default/files/decdn-node-stub"}
          - {name: decdn, src: "{{ stubs }}/default/files/decdn-node-stub"}
      - dir: "sponsord/v{{ stub_version }}"
        bins:
          - {name: sponsord, src: "{{ stubs }}/sponsord/files/sponsord-stub"}
          - {name: sponsord-onramp, src: "{{ stubs }}/sponsord-onramp/files/sponsord-onramp-stub"}
  tasks:
    # CONTAINER-ONLY: without shared propagation on / every LoadCredential= directory
    # comes up empty under docker (../sponsord/prepare.yml explains).
    - name: Give / shared mount propagation, as systemd does on a real host  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: mount --make-rshared /
      changed_when: true

    - name: The repo, as a git remote
      ansible.builtin.include_tasks: ../cloud-init/includes/repo.yml

    - name: The release mirror
      ansible.builtin.include_tasks: ../cloud-init/includes/mirror.yml
