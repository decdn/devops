---
# First, the inventory mistakes stage 2 must refuse, each recording "failed" and saying
# so at login (../cloud-init/includes/refuse.yml). Each case costs about a minute: pip
# and Galaxy run before the check.
# Then the operator's part, as the "Publisher host" walkthrough in cloud-init/README.md
# tells it:
#   1. Write the node's secret and sponsord's three only, and re-run. The onramp's
#      Turnstile secret is still missing, so the run must stop at the gate again,
#      listing just that file: the gate covers every group the host is in, not only
#      the first.
#   2. Write the Turnstile secret, move DEVOPS_REF to a tag on a newer commit (the
#      upgrade path), and re-run for the whole playbook. The values are placeholders:
#      the stubs never dial the RPC URL or Cloudflare.
- name: Side effect — inventory refusals, then the secrets in two steps
  hosts: all
  become: true
  vars:
    env_file: /etc/decdn-bootstrap/bootstrap.env
    bootstrap_inventory: /etc/decdn-bootstrap/inventory.yml
    # Evaluated after good_inventory is read below.
    refusals:
      - name: localhost in neither base group
        dest: "{{ bootstrap_inventory }}"
        content: >-
          {{ good_inventory.content | b64decode
             | regex_replace('(?m)^sponsord_hosts:$', 'molecule_hosts:')
             | regex_replace('(?m)^decdn_nodes:$', 'molecule_nodes:') }}
        mode: "0600"
        expect: neither decdn_nodes nor sponsord_hosts
      - name: the origin outside decdn_nodes
        dest: "{{ bootstrap_inventory }}"
        content: >-
          {{ good_inventory.content | b64decode
             | regex_replace('(?m)^decdn_nodes:$', 'molecule_nodes:') }}
        mode: "0600"
        expect: in decdn_origin_nodes but not in decdn_nodes
      - name: the onramp outside sponsord_hosts
        dest: "{{ bootstrap_inventory }}"
        content: >-
          {{ good_inventory.content | b64decode
             | regex_replace('(?m)^sponsord_hosts:$', 'molecule_hosts:') }}
        mode: "0600"
        expect: in sponsord_onramp_hosts but not in sponsord_hosts
  tasks:
    - name: Read the working inventory
      ansible.builtin.slurp:
        src: "{{ bootstrap_inventory }}"
      register: good_inventory

    - name: Read the SHA converge pinned (recorded by prepare.yml)
      ansible.builtin.slurp:
        src: /srv/devops-src.sha
      register: pinned_sha_file

    - name: Decode it
      ansible.builtin.set_fact:
        pinned_sha: "{{ pinned_sha_file.content | b64decode | trim }}"

    - name: Refuse each broken inventory
      ansible.builtin.include_tasks: ../cloud-init/includes/refuse.yml
      loop: "{{ refusals }}"
      loop_control:
        loop_var: refusal
        label: "{{ refusal.name }}"

    # Stage 2 clears the list before its group checks, so a run they refuse leaves no
    # stale list for final_message to point at.
    - name: Stat the list of missing secrets after the refusals
      ansible.builtin.stat:
        path: /var/lib/decdn-bootstrap/awaiting
      register: refused_awaiting

    - name: Assert the refusals left no list of missing secrets
      ansible.builtin.assert:
        that:
          - not refused_awaiting.stat.exists
        fail_msg: /var/lib/decdn-bootstrap/awaiting survived a failed run

    # A host whose DEVOPS_REF predates the list records awaiting-secret without it.
    - name: Record awaiting-secret with no list (an older bootstrap's state)
      ansible.builtin.copy:
        dest: /var/lib/decdn-bootstrap/state
        content: "awaiting-secret\n"
        owner: root
        group: root
        mode: "0644"

    - name: Run the login hint with no list
      ansible.builtin.command:
        cmd: sh /etc/profile.d/decdn-bootstrap.sh
      register: listless_hint
      changed_when: false

    - name: Assert the hint says the list is missing instead of printing nothing
      ansible.builtin.assert:
        that:
          - listless_hint.stdout is search('waiting for these secrets')
          - listless_hint.stdout is search('[(]no list found; see /var/log/cloud-init-output[.]log[)]')
        fail_msg: "hint: {{ listless_hint.stdout | to_json }}"

    - name: Restore the working inventory
      ansible.builtin.copy:
        dest: "{{ bootstrap_inventory }}"
        content: "{{ good_inventory.content | b64decode }}"
        owner: root
        group: root
        mode: "0600"

    - name: Create /etc/decdn and /etc/sponsord
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: [/etc/decdn, /etc/sponsord]

    - name: Write the node's RPC endpoint on the host
      ansible.builtin.copy:
        dest: /etc/decdn/decdn.env
        content: "DECDN_RPC_URL=https://rpc.example.invalid/\n"
        owner: root
        group: root
        mode: "0600"

    - name: Write sponsord's secrets on the host
      ansible.builtin.copy:
        dest: "/etc/sponsord/{{ item.name }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - {name: treasury-keystore.json, content: "{{ '{}' }}\n"}
        - {name: treasury-password, content: "molecule-placeholder\n"}
        - {name: secret.env, content: "SPONSORD_RPC_URL=https://rpc.example.invalid/v2/molecule\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: Re-run the bootstrap without the Turnstile secret
      ansible.builtin.command:
        cmd: /usr/local/sbin/decdn-bootstrap
      register: partial
      changed_when: true
      failed_when: false

    - name: Read the state and the list of missing secrets after the partial re-run
      ansible.builtin.include_tasks: ../cloud-init/includes/read-state.yml

    - name: Stat the daemons (not installed while any secret is missing)
      ansible.builtin.stat:
        path: "{{ item }}"
      register: partial_bin
      loop: [/usr/local/bin/sponsord, /usr/local/bin/decdn-node]

    - name: Assert the gate still holds, for the Turnstile secret alone
      ansible.builtin.assert:
        that:
          - partial.rc == 0
          - bootstrap_state.content | b64decode | trim == 'awaiting-secret'
          - awaiting.content | b64decode | split | list == ['/etc/sponsord/turnstile-secret']
          - partial.stdout is search('Cloudflare Turnstile secret')
          - partial.stdout is not search('treasury wallet')
          - partial.stdout is not search('RPC endpoint')
          - partial_bin.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          rc={{ partial.rc }} state={{ bootstrap_state.content | b64decode | trim }}
          awaiting={{ awaiting.content | b64decode | to_json }}
          installed={{ partial_bin.results | selectattr('stat.exists') | map(attribute='item') | list }}
          output={{ (partial.stdout_lines[-30:] + partial.stderr_lines) | to_json }}

    - name: Write the Turnstile secret on the host
      ansible.builtin.copy:
        dest: /etc/sponsord/turnstile-secret
        content: "1x0000000000000000000000000000000AA\n"
        owner: root
        group: root
        mode: "0600"

    - name: Read the working bootstrap.env
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: good_env

    - name: Pin the tag on the newer commit (the upgrade path)
      ansible.builtin.copy:
        dest: "{{ env_file }}"
        content: >-
          {{ good_env.content | b64decode
             | regex_replace('(?m)^DEVOPS_REF=.*$', 'DEVOPS_REF=v0.0.0-molecule') }}
        owner: root
        group: root
        mode: "0600"

    - name: Re-run the bootstrap
      ansible.builtin.command:
        cmd: /usr/local/sbin/decdn-bootstrap
      register: rerun
      changed_when: true
      failed_when: false

    - name: Fail with the bootstrap's output
      ansible.builtin.fail:
        msg: "{{ rerun.stdout_lines[-60:] + rerun.stderr_lines }}"
      when: rerun.rc != 0
