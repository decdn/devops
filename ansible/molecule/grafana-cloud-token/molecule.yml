---
# Inventory-path exercise of the #39 relaxation: grafana_alloy_api_token set in
# (git-ignored) inventory instead of a host-provisioned /etc/grafana-alloy.env.
# Positive path only — the broken-input matrix lives in ../validation; the
# host-provisioned positive path lives in ../grafana-cloud. No prepare-stage env
# file AT ALL here by design: the absence is what proves preflight's existence
# gate honours the token variable, and that the role authors the file itself.
#
# Same two boundaries as ../grafana-cloud: the stub binds no sockets and exits 0
# for every subcommand, so nothing here proves runtime loadability (`make
# lint-alloy` does that against the real pinned binary).
driver:
  name: docker
platforms:
  - name: decdn-node-grafana-cloud-token
    # Same digest-pinned image as the other scenarios (repo convention). Re-resolve
    # all of them together to bump.
    image: geerlingguy/docker-debian12-ansible@sha256:4553092be2c00b1ffe580927b9ff03f3c3a0df32b7dd693a3eb02efb6c2b77b7
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    ANSIBLE_PIPELINING: "true"
verifier:
  name: ansible
scenario:
  test_sequence:
    # Leading `destroy` so an orphaned container is never reused — see
    # ../default/molecule.yml. No prepare playbook: unlike ../grafana-cloud there
    # are NO host-provisioned fixtures to stage — their absence is the point.
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
