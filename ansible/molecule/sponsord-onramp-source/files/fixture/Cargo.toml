# Test fixture for molecule/sponsord-onramp-source: a workspace shaped like
# decdn/sponsord (packages and binaries sponsord and sponsord-onramp), with no
# dependencies so it compiles in seconds. Each binary execs the matching Python stub
# (molecule/sponsord, molecule/sponsord-onramp), so both roles run end to end on
# source-built binaries.
[workspace]
resolver = "3"
members = ["crates/sponsord", "crates/sponsord-onramp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
