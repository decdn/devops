---
# NEGATIVE-path scenario for grafana_alloy: proves the role's fail-loud preflight
# gates actually REJECT bad inputs (AGENTS.md hard-rule 4). converge.yml runs the
# role with one broken input per case and asserts each is rejected at the gate it
# targets — so a regression that weakens a gate fails this scenario. Every case
# aborts in preflight (before any user/package/config change), so no service starts
# here; there is no verify/idempotence step — the converge IS the assertion.
# Split by role from ../validation (decdn_node) so the matrices run in parallel,
# each in its own container; ../validation-sponsord covers sponsord and
# sponsord_onramp. The positive paths live in ../grafana-cloud and
# ../grafana-cloud-token.
# No `dependency` step: see ../validation/molecule.yml. The collections come from
# `make deps` -> ansible/collections, surfaced by ANSIBLE_COLLECTIONS_PATH below.
driver:
  name: docker
platforms:
  - name: decdn-node-validation-alloy
    # Same digest-pinned image as the other scenarios (repo convention). Re-resolve
    # all of them together to bump.
    image: geerlingguy/docker-debian12-ansible@sha256:a131e3b7a9a38dda40e98b49b39d6200ffab0ad853c714a513f5eea41bab9a25
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    # Drops a `docker exec` round trip per remote task — see ../validation/molecule.yml.
    ANSIBLE_PIPELINING: "true"
scenario:
  test_sequence:
    # Leading `destroy` so an orphaned container is never reused — see
    # ../default/molecule.yml. No prepare playbook: no case reads the node wallet
    # material ../validation/prepare.yml stages; each case stages its own fixtures.
    - destroy
    - create
    - converge
    - destroy
