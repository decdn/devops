---
# Stage what an operator provisions before the first deploy:
#   1. the daemon's treasury keystore + password (as ../sponsord/prepare.yml);
#   2. the Turnstile secret, at 0644 so verify.yml can attribute the 0600
#      lock-down to the role;
#   3. the Grafana Cloud credential env file (as ../grafana-cloud/prepare.yml).
# The API token is NOT staged: the sponsord role generates it, and the onramp
# reads that same file.
#
# CONTAINER-ONLY step first, as ../sponsord/prepare.yml explains: without shared
# propagation on / every LoadCredential= directory comes up empty under docker.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Give / shared mount propagation, as systemd does on a real host  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: mount --make-rshared /
      changed_when: true

    - name: Create the sponsord config directory
      ansible.builtin.file:
        path: /etc/sponsord
        state: directory
        mode: "0755"

    - name: Stage the placeholder treasury files and the Turnstile secret
      ansible.builtin.copy:
        dest: "/etc/sponsord/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - {name: treasury-keystore.json, content: "{{ '{}' }}\n"}
        - {name: treasury-password, content: "molecule-placeholder\n"}
        - {name: turnstile-secret, content: "1x0000000000000000000000000000000AA\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: Stage the Grafana Cloud credential fixture on the host
      ansible.builtin.copy:
        dest: /etc/grafana-alloy.env
        owner: root
        group: root
        mode: "0600"
        content: |
          GC_PROM_REMOTE_WRITE_URL=https://prometheus-prod-xx.molecule.invalid/api/prom/push
          GC_OTLP_ENDPOINT=https://otlp-gateway-prod-xx.molecule.invalid/otlp
          GC_PROM_USERNAME=999888777
          GC_OTLP_USERNAME=999888779
          GC_LOKI_USERNAME=999888778
          GC_API_TOKEN=molecule-test-token
