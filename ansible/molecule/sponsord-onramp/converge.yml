---
# The real entry point: both plays of playbooks/sponsord.yml (the daemon, then the
# onramp), so playbooks/group_vars/all.yml derives the Alloy toggles exactly as a
# deploy would. Variables come from molecule.yml's inventory group_vars; baseline
# is skipped there.
- name: Converge
  ansible.builtin.import_playbook: ../../playbooks/sponsord.yml
