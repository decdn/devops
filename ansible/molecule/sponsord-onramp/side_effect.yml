---
# What a green converge + idempotence cannot prove:
#   1. Rotating the Turnstile secret OUT OF BAND restarts the onramp onto it, and
#      only the onramp (a no-op re-run first proves nothing else restarts it).
#   2. The /healthz readiness gate is FATAL, and a failed run records nothing: the
#      restart-input record keeps the last healthy inputs until a run succeeds.
#   3. With no record, a running onramp is restarted (it was never confirmed
#      healthy on its inputs), and a daemon restart brings the onramp back by
#      itself (PartOf=, Restart=on-failure, no start limit).
#   4. A custom gate page is installed, read by the onramp, and removed again.
#   5. The Turnstile secret from inventory: it replaces a host-written file only when
#      confirmed, lands verbatim at 0600 with an `inventory` record and restarts the
#      onramp; an unchanged re-run is a no-op; an emptied value never adopts the
#      role's own file; with the record discarded the host's file is accepted.
# The proxy side effects (proxy "none", ACME, a foreign Caddyfile) run in
# ../sponsord-onramp-caddy, and the source install in ../sponsord-onramp-source,
# beside this scenario.
# The host is left healthy on the role's own Caddyfile, `tls internal`, for verify.
- name: Side effect — rotation, the fatal gate and the restart-input record
  hosts: all
  become: true
  vars:
    _or_record: /etc/sponsord/.onramp-inputs.sha256
  tasks:
    - name: Read the unit states before anything changes
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: _or_before
      loop: [sponsord-onramp, sponsord]

    - name: Assert the onramp was running cleanly
      ansible.builtin.assert:
        that:
          - _or_before.results[0].status.ActiveState == 'active'
          - _or_before.results[0].status.MainPID | int > 0
        fail_msg: >-
          Expected sponsord-onramp active (got
          ActiveState={{ _or_before.results[0].status.ActiveState }}):
          journalctl -u sponsord-onramp -e

    # include_role here, import_playbook in the converge: if the two contexts
    # resolved any input differently, the onramp would restart for that alone, and
    # the rotation check below would pass for the wrong reason.
    - name: Re-run the onramp with nothing changed
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the onramp after the no-op run
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_noop

    - name: Require the no-op run to have left the onramp alone
      ansible.builtin.assert:
        that:
          - _or_noop.status.MainPID == _or_before.results[0].status.MainPID
        fail_msg: A re-run with no input changed restarted sponsord-onramp.

    - name: Rotate the Turnstile secret out of band
      ansible.builtin.copy:
        dest: /etc/sponsord/turnstile-secret
        content: "1x0000000000000000000000000000000BB\n"
        mode: "0600"

    - name: Converge the onramp again after the rotation
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the unit states after the rotation converge
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: _or_after
      loop: [sponsord-onramp, sponsord]

    - name: Require the rotation to have restarted the onramp, and only the onramp
      ansible.builtin.assert:
        that:
          - _or_after.results[0].status.ActiveState == 'active'
          - _or_after.results[0].status.MainPID != _or_before.results[0].status.MainPID
          - _or_after.results[1].status.MainPID == _or_before.results[1].status.MainPID
        fail_msg: >-
          After the Turnstile secret was rotated, the onramp's PID went
          {{ _or_before.results[0].status.MainPID }} -> {{ _or_after.results[0].status.MainPID }}
          (must change) and the daemon's {{ _or_before.results[1].status.MainPID }} ->
          {{ _or_after.results[1].status.MainPID }} (must not).

    - name: Hash the Turnstile secret the onramp is now healthy on
      ansible.builtin.stat:
        path: /etc/sponsord/turnstile-secret
        checksum_algorithm: sha256
      register: _or_secret_b

    - name: Stop the onramp, then make it refuse to start
      ansible.builtin.systemd_service:
        name: sponsord-onramp
        state: stopped

    - name: Stage the stub's refuse-to-start marker
      ansible.builtin.copy:
        dest: /etc/sponsord/onramp-stub-unhealthy
        content: ""
        mode: "0644"

    # A changed input on the failing run: the record must not take it.
    - name: Rotate the Turnstile secret once more
      ansible.builtin.copy:
        dest: /etc/sponsord/turnstile-secret
        content: "1x0000000000000000000000000000000CC\n"
        mode: "0600"

    - name: Converge against an onramp that never becomes healthy
      block:
        - name: Run the role with a short readiness window
          ansible.builtin.include_role:
            name: sponsord_onramp
          vars:
            sponsord_onramp_readiness_retries: 3
            sponsord_onramp_readiness_delay: 1

        - name: Fail — the readiness gate let an unhealthy onramp through
          ansible.builtin.fail:
            msg: The role finished although sponsord-onramp never answered /healthz.
      rescue:
        - name: Require the failure to come from the readiness gate itself
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Report a sponsord-onramp that did not become healthy'
            fail_msg: >-
              Expected the role to fail at its readiness report, but it failed at
              "{{ ansible_failed_task.name }}".

        - name: Read the restart-input record after the failed run
          ansible.builtin.slurp:
            src: "{{ _or_record }}"
          register: _or_rec_failed

        # Field order: token, Turnstile secret, env file, gate page, unit, binary.
        - name: Require the failed run to have left the record on the healthy inputs
          ansible.builtin.assert:
            that:
              - (_or_rec_failed.content | b64decode).split()[1] == _or_secret_b.stat.checksum
            fail_msg: >-
              The record moved to the inputs of a run whose onramp never became
              healthy; the next converge would not restart it onto them.
      always:
        - name: Remove the refuse-to-start marker
          ansible.builtin.file:
            path: /etc/sponsord/onramp-stub-unhealthy
            state: absent

    - name: Converge once more to bring the onramp back
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Hash the Turnstile secret now in place
      ansible.builtin.stat:
        path: /etc/sponsord/turnstile-secret
        checksum_algorithm: sha256
      register: _or_secret_c

    - name: Read the restart-input record after the recovery
      ansible.builtin.slurp:
        src: "{{ _or_record }}"
      register: _or_rec_ok

    - name: Require the record to follow the inputs once the onramp is healthy
      ansible.builtin.assert:
        that:
          - (_or_rec_ok.content | b64decode).split()[1] == _or_secret_c.stat.checksum
        fail_msg: The healthy run did not record the Turnstile secret it started on.

- name: Side effect — a missing record, and a daemon restart
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the onramp before the record is removed
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_norec_before

    - name: Remove the restart-input record
      ansible.builtin.file:
        path: /etc/sponsord/.onramp-inputs.sha256
        state: absent

    - name: Converge with no record
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the onramp and the record after that converge
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_norec_after

    - name: Stat the rewritten record
      ansible.builtin.stat:
        path: /etc/sponsord/.onramp-inputs.sha256
      register: _or_norec_rec

    - name: Require a restart and a fresh record
      ansible.builtin.assert:
        that:
          - _or_norec_after.status.MainPID != _or_norec_before.status.MainPID
          - _or_norec_rec.stat.exists
        fail_msg: >-
          With no record, a running onramp must be restarted (it was never confirmed
          healthy on its inputs) and the record written again.

    - name: Restart the daemon
      ansible.builtin.systemd_service:
        name: sponsord
        state: restarted

    # The onramp restarts with the daemon (PartOf=), usually before the daemon
    # listens; it must exit, retry and come back on its own, with no converge.
    - name: Wait for the onramp to come back by itself
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        status_code: 200
        timeout: 5
      register: _or_partof
      retries: 30
      delay: 1
      until: _or_partof.status == 200

    - name: Read the onramp after the daemon restart
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_partof_unit

    - name: Require the onramp to have restarted with the daemon
      ansible.builtin.assert:
        that:
          - _or_partof_unit.status.ActiveState == 'active'
          - _or_partof_unit.status.MainPID != _or_norec_after.status.MainPID
        fail_msg: The onramp did not restart with the daemon (PartOf=sponsord.service).

- name: Side effect — a custom gate page
  hosts: all
  become: true
  gather_facts: false
  vars:
    _or_page: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/gate.html"
  tasks:
    - name: Converge with a custom gate page
      ansible.builtin.include_role:
        name: sponsord_onramp
      vars:
        sponsord_onramp_gate_template_src: "{{ _or_page }}"

    - name: Stat the installed page and read the env file
      ansible.builtin.stat:
        path: /etc/sponsord/onramp-gate.html
      register: _or_page_stat

    - name: Read the env file with the page set
      ansible.builtin.slurp:
        src: /etc/sponsord/sponsord-onramp.env
      register: _or_page_env

    # The stub reads the page at start, as the onramp's dynamic user: the role's
    # /healthz gate passing already proves it was readable.
    - name: Require the page installed root-owned, world-readable and configured
      ansible.builtin.assert:
        that:
          - _or_page_stat.stat.isreg
          - _or_page_stat.stat.mode == '0644'
          - _or_page_stat.stat.pw_name == 'root'
          - "'ONRAMP_GATE_TEMPLATE=/etc/sponsord/onramp-gate.html' in (_or_page_env.content | b64decode)"
        fail_msg: The custom gate page is not installed, or not configured.

    - name: Converge without the page again
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Stat the page after it was dropped
      ansible.builtin.stat:
        path: /etc/sponsord/onramp-gate.html
      register: _or_page_gone

    - name: Read the env file without the page
      ansible.builtin.slurp:
        src: /etc/sponsord/sponsord-onramp.env
      register: _or_page_env_gone

    - name: Require the page and its setting gone
      ansible.builtin.assert:
        that:
          - not _or_page_gone.stat.exists
          - "'ONRAMP_GATE_TEMPLATE' not in (_or_page_env_gone.content | b64decode)"
        fail_msg: The dropped gate page is still installed or configured.

- name: Side effect — the Turnstile secret from inventory
  hosts: all
  become: true
  gather_facts: false
  vars:
    _or_ts: /etc/sponsord/turnstile-secret
    _or_ts_record: /etc/sponsord/.turnstile-secret.sha256
    _or_ts_value: 1x0000000000000000000000000000000DD
  tasks:
    - name: Converge with an inventory secret over the host's file, unconfirmed
      block:
        - name: Run the role with sponsord_onramp_turnstile_secret set
          ansible.builtin.include_role:
            name: sponsord_onramp
          vars:
            sponsord_onramp_turnstile_secret: "{{ _or_ts_value }}"

        - name: Fail — the role overwrote a host-provisioned Turnstile secret
          ansible.builtin.fail:
            msg: The role replaced a Turnstile secret it did not write, unconfirmed.
      rescue:
        - name: Require the failure to come from the overwrite guard
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name
                == 'Require confirmation to overwrite a Turnstile secret this role did not write'
            fail_msg: "Expected the overwrite guard, got \"{{ ansible_failed_task.name }}\"."

    - name: Read the onramp before the takeover
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_ts_before

    - name: Converge with the takeover confirmed
      ansible.builtin.include_role:
        name: sponsord_onramp
      vars:
        sponsord_onramp_turnstile_secret: "{{ _or_ts_value }}"
        sponsord_onramp_turnstile_secret_overwrite_host_file: true

    - name: Read the secret, its record and the onramp after the takeover
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _or_ts_files
      loop: ["{{ _or_ts }}", "{{ _or_ts_record }}"]

    - name: Stat the secret after the takeover
      ansible.builtin.stat:
        path: "{{ _or_ts }}"
      register: _or_ts_stat

    - name: Read the onramp after the takeover
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_ts_after

    - name: Require the inventory secret written, recorded and picked up
      ansible.builtin.assert:
        that:
          - (_or_ts_files.results[0].content | b64decode) == _or_ts_value
          - (_or_ts_files.results[1].content | b64decode) is match('^inventory [0-9a-f]{64}\s*$')
          - _or_ts_stat.stat.mode == '0600'
          - _or_ts_after.status.ActiveState == 'active'
          - _or_ts_after.status.MainPID != _or_ts_before.status.MainPID
        fail_msg: >-
          The inventory secret was not written verbatim at 0600 with an `inventory`
          record, or the onramp did not restart onto it.

    - name: Re-run with the same inventory secret, unconfirmed
      ansible.builtin.include_role:
        name: sponsord_onramp
      vars:
        sponsord_onramp_turnstile_secret: "{{ _or_ts_value }}"

    - name: Read the onramp after the re-run
      ansible.builtin.systemd_service:
        name: sponsord-onramp
      register: _or_ts_rerun

    - name: Require the re-run to leave the role's own file and the onramp alone
      ansible.builtin.assert:
        that:
          - _or_ts_rerun.status.MainPID == _or_ts_after.status.MainPID
        fail_msg: Re-running with an unchanged inventory secret restarted the onramp.

    - name: Converge with the inventory secret gone
      block:
        - name: Run the role with sponsord_onramp_turnstile_secret empty
          ansible.builtin.include_role:
            name: sponsord_onramp

        - name: Fail — the role adopted its own file as host-provisioned
          ansible.builtin.fail:
            msg: The role adopted a file it wrote from inventory as the host's.
      rescue:
        - name: Require the failure to come from the adoption guard
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Refuse to adopt a role-written Turnstile secret as host-provisioned'
            fail_msg: "Expected the adoption guard, got \"{{ ansible_failed_task.name }}\"."

    - name: Hand the secret to the host (discard the record)
      ansible.builtin.file:
        path: "{{ _or_ts_record }}"
        state: absent

    - name: Converge with the host-provisioned secret
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the record after the handover
      ansible.builtin.slurp:
        src: "{{ _or_ts_record }}"
      register: _or_ts_handover

    - name: Require a `host` record after the handover
      ansible.builtin.assert:
        that:
          - (_or_ts_handover.content | b64decode) is match('^host [0-9a-f]{64}\s*$')
        fail_msg: The handed-over secret was not recorded as the host's.
