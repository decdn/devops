# Test fixture for the source phase of ../../side_effect.yml: a workspace shaped
# like decdn/sponsord (packages and binaries sponsord and sponsord-onramp), with no
# dependencies so it compiles in seconds. Each binary execs this scenario's Python
# stub for it, so both roles run end to end on source-built binaries.
[workspace]
resolver = "3"
members = ["crates/sponsord", "crates/sponsord-onramp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
