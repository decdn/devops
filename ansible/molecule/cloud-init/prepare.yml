---
# Everything the user-data needs from the outside world, stood up inside the container
# by the includes the cloud-init-publisher scenario shares:
#   * cloud-init itself, and the repo committed from the WORKING TREE
#     (pack.yml, includes/repo.yml);
#   * a release mirror: the shared stub daemon packaged as the node's two release
#     binaries, signed by a throwaway key and served on loopback (includes/mirror.yml).
- name: Pack the working tree
  ansible.builtin.import_playbook: pack.yml

- name: Prepare
  hosts: all
  become: true
  vars:
    stub_version: "0.0.0-molecule-stub"
    stub_bin: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/default/files/decdn-node-stub"
    mirror_releases:
      - dir: "v{{ stub_version }}"
        bins:
          - {name: decdn-node, src: "{{ stub_bin }}"}
          - {name: decdn, src: "{{ stub_bin }}"}
      # Signed and verified, but its binaries report stub_version: verify.yml's last
      # play needs the version backstop to refuse it.
      - dir: v0.0.9
        version: 0.0.9
        bins:
          - {name: decdn-node, src: "{{ stub_bin }}"}
          - {name: decdn, src: "{{ stub_bin }}"}
      # The release line 0.7, for verify.yml's line play: 0.7.10 is the newest finished
      # release (newer than 0.7.2 numerically, not as text). The prerelease, the draft
      # and the release the index lists without SHA256SUMS.asc are all newer, and each
      # reports another version, so installing any of them fails the version backstop.
      - dir: v0.7.2
        version: 0.7.2
        reports: 0.7.2
        bins: &line_bins
          - {name: decdn-node, src: "{{ stub_bin }}"}
          - {name: decdn, src: "{{ stub_bin }}"}
      - {dir: v0.7.10, version: 0.7.10, reports: 0.7.10, bins: *line_bins}
      - {dir: v0.7.11, version: 0.7.11, prerelease: true, bins: *line_bins}
      - {dir: v0.7.12, version: 0.7.12, draft: true, bins: *line_bins}
      - {dir: v0.7.13, version: 0.7.13, asc: false, bins: *line_bins}
  tasks:
    - name: The repo, as a git remote
      ansible.builtin.include_tasks: includes/repo.yml

    - name: The release mirror
      ansible.builtin.include_tasks: includes/mirror.yml
