---
# The operator's part, as cloud-init/README.md tells it, plus the mistakes stage 1 must
# refuse:
#   1. Each broken bootstrap.env must make `decdn-bootstrap` exit non-zero with its reason,
#      record "failed", and make the login hint say so. The branch-name case matters
#      most: a branch is unpinned code run as root.
#   2. Then the real thing: move DEVOPS_REF to a tag on a newer commit (the upgrade
#      path), write the RPC endpoint to a 0600 file on the host, and re-run. The value
#      is a placeholder; the stub daemon never dials it. The collections stand as an
#      older lock left them (another recorded lock, a collection it listed), so the
#      re-run must replace the whole tree.
- name: Side effect — refusals, then the secret and a re-run at a tag
  hosts: all
  become: true
  vars:
    env_file: /etc/decdn-bootstrap/bootstrap.env
    collections_dir: /opt/decdn-devops/ansible/collections
    stale_collection: "{{ collections_dir }}/ansible_collections/molecule/stale"
    refusals:
      - name: a branch name
        content: "DEVOPS_REPO=file:///srv/devops-src\nDEVOPS_REF=molecule\n"
        mode: "0600"
        expect: neither a full 40-character commit SHA nor a tag
      - name: the placeholder ref
        content: "DEVOPS_REPO=file:///srv/devops-src\nDEVOPS_REF=CHANGE_ME\n"
        mode: "0600"
        expect: set DEVOPS_REF
      - name: an unknown key
        content: "DEVOPS_REPO=file:///srv/devops-src\nDEVOPS_REF=CHANGE_ME\nFOO=bar\n"
        mode: "0600"
        expect: unknown key FOO
      - name: a group-readable bootstrap.env
        content: "DEVOPS_REPO=file:///srv/devops-src\nDEVOPS_REF=v0.0.0-molecule\n"
        mode: "0640"
        expect: must be owned by root, mode 0600
  tasks:
    - name: Read the working bootstrap.env
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: good_env

    - name: Read the SHA converge pinned (recorded by prepare.yml)
      ansible.builtin.slurp:
        src: /srv/devops-src.sha
      register: pinned_sha_file

    - name: Decode it
      ansible.builtin.set_fact:
        pinned_sha: "{{ pinned_sha_file.content | b64decode | trim }}"

    - name: Refuse each broken bootstrap.env
      ansible.builtin.include_tasks: includes/refuse.yml
      loop: "{{ refusals }}"
      loop_control:
        loop_var: refusal
        label: "{{ refusal.name }}"

    - name: Pin the tag on the newer commit (the upgrade path)
      ansible.builtin.copy:
        dest: "{{ env_file }}"
        content: >-
          {{ good_env.content | b64decode
             | regex_replace('(?m)^DEVOPS_REF=.*$', 'DEVOPS_REF=v0.0.0-molecule') }}
        owner: root
        group: root
        mode: "0600"

    - name: Create /etc/decdn
      ansible.builtin.file:
        path: /etc/decdn
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the RPC endpoint on the host
      ansible.builtin.copy:
        dest: /etc/decdn/decdn.env
        content: "DECDN_RPC_URL=https://rpc.example.invalid/\n"
        owner: root
        group: root
        mode: "0600"

    - name: Record an older lock as the installed one
      ansible.builtin.copy:
        dest: "{{ collections_dir }}/.decdn-bootstrap-lock.yml"
        content: "collections: []\n"
        owner: root
        group: root
        mode: "0644"

    - name: Create a collection only the older lock listed
      ansible.builtin.file:
        path: "{{ stale_collection }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Give it a manifest
      ansible.builtin.copy:
        dest: "{{ stale_collection }}/MANIFEST.json"
        content: '{"collection_info": {"namespace": "molecule", "name": "stale", "version": "1.0.0"}}'
        owner: root
        group: root
        mode: "0644"

    - name: Re-run the bootstrap
      ansible.builtin.command:
        cmd: /usr/local/sbin/decdn-bootstrap
      register: rerun
      changed_when: true
      failed_when: false

    - name: Fail with the bootstrap's output
      ansible.builtin.fail:
        msg: "{{ rerun.stdout_lines[-60:] + rerun.stderr_lines }}"
      when: rerun.rc != 0

    - name: Read the installed lock after the re-run
      ansible.builtin.slurp:
        src: "{{ collections_dir }}/.decdn-bootstrap-lock.yml"
      register: installed_lock

    - name: Read the checkout's lock
      ansible.builtin.slurp:
        src: /opt/decdn-devops/cloud-init/collections.lock.yml
      register: checkout_lock

    - name: Stat the collection only the older lock listed
      ansible.builtin.stat:
        path: "{{ stale_collection }}"
      register: stale

    # verify.yml checks the reinstalled tree is exactly collections.lock.yml.
    - name: Assert the re-run replaced the collections and recorded the new lock
      ansible.builtin.assert:
        that:
          - rerun.stdout is search('Starting galaxy collection install')
          - not stale.stat.exists
          - installed_lock.content == checkout_lock.content
        fail_msg: >-
          stale collection left={{ stale.stat.exists }};
          recorded lock={{ installed_lock.content | b64decode | to_json }};
          output={{ rerun.stdout_lines[-30:] | to_json }}
