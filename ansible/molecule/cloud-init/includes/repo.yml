---
# Shared by the cloud-init scenarios' prepare.yml: cloud-init itself (a cloud image ships
# it; these images do not) and the repo as a git remote, from the tarball
# pack.yml built. Stage 1 clones it from file:// and checks out a commit exactly
# as it would a pinned SHA on GitHub.
#
# Two commits: converge pins the first by SHA (/srv/devops-src.sha); side_effect then
# moves the host to a tag on the second (/srv/devops-src.tag-sha), the "upgrade the
# deployment code" path. The branch is named so a scenario can check that stage 1
# refuses a branch name.
- name: Install cloud-init, git and gnupg
  ansible.builtin.apt:
    name: [cloud-init, git, gnupg, tar]
    state: present
    update_cache: true

- name: Create the source repo directory
  ansible.builtin.file:
    path: /srv/devops-src
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the working tree into the container
  ansible.builtin.unarchive:
    src: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/devops-src.tgz"
    dest: /srv/devops-src

- name: Commit it, so stage 1 has a SHA to pin and a tag to move to
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      git init -q -b molecule
      git add -A
      git -c user.name=molecule -c user.email=molecule@molecule.invalid commit -qm "molecule snapshot"
      git rev-parse HEAD > /srv/devops-src.sha
      git -c user.name=molecule -c user.email=molecule@molecule.invalid commit -q --allow-empty -m "molecule bump"
      git tag v0.0.0-molecule
      git rev-parse HEAD > /srv/devops-src.tag-sha
    chdir: /srv/devops-src
    executable: /bin/bash
    creates: /srv/devops-src/.git
