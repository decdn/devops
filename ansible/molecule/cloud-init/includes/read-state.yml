---
# Read the bootstrap's state and its list of missing secrets, into `bootstrap_state` and
# `awaiting` (slurp results), after checking both exist and that an unprivileged
# account can read them. The login hint reads them as the admin account, and these
# tests read them as root, which would hide a file (or a directory) the admin cannot
# read. A gate that stopped writing the list then fails here, with this message,
# instead of at the slurp with "file not found".
- name: Stat the bootstrap's state and list of missing secrets
  ansible.builtin.stat:
    path: "/var/lib/decdn-bootstrap/{{ item }}"
  register: state_files
  loop: [state, awaiting]

- name: Assert both exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: /var/lib/decdn-bootstrap/{{ item.item }} is missing
    quiet: true
  loop: "{{ state_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read both as an unprivileged account, as the login hint does
  ansible.builtin.command:
    cmd: runuser -u nobody -- cat /var/lib/decdn-bootstrap/state /var/lib/decdn-bootstrap/awaiting
  register: state_unprivileged
  changed_when: false
  failed_when: state_unprivileged.rc != 0

- name: Read the bootstrap state
  ansible.builtin.slurp:
    src: /var/lib/decdn-bootstrap/state
  register: bootstrap_state

- name: Read the list of missing secrets
  ansible.builtin.slurp:
    src: /var/lib/decdn-bootstrap/awaiting
  register: awaiting
