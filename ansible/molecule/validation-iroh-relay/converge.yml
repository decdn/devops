---
# NEGATIVE-path scenario for iroh_relay: proves the role's fail-loud input
# validation REJECTS bad values (AGENTS.md hard-rule 4), so a regression that
# weakens an assert fails CI. Same shape as ../validation-sponsord: each case runs
# the role with a VALID baseline (the play vars) plus ONE broken input, wrapped in
# block/rescue, and the rescue records a tag ONLY when the failing task is the exact
# assert that case targets (matched on ansible_failed_task.name). A bad value that
# slipped past validation fails later at a differently-named task, is NOT counted,
# and the final assert catches the miss.
#
# Every input case aborts at an assert before any host mutation. The host-side case
# starts a squatter on tcp/443 and stops it again in `always:`; it stops before the
# binary is installed, so no relay ever starts here.
- name: Converge iroh_relay (expect validation failures)
  hosts: all
  become: true
  vars:
    # Valid baseline; each case overrides exactly one input. manual, because the
    # release download is not wanted here.
    iroh_relay_install_method: manual
    iroh_relay_manual_bin_src: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/iroh-relay/files/iroh-relay-stub
    iroh_relay_hostname: relay.molecule.test
    iroh_relay_acme_contact: ops@molecule.test
    # The default allowlist mode needs one ID (no inventory nodes are read here).
    iroh_relay_allowlist: ["{{ _ir_id }}"]
    # The target triple of the other supported architecture, for release-target.
    _ir_other_target: >-
      {{ (_ir_targets | dict2items | rejectattr('key', 'equalto', ansible_facts['architecture'])
          | map(attribute='value') | first) }}
    _ir_id: 81d82536cb4c96ddbeab1f6bf4495d126c1942fb90b9ffb433d91d23314801e7
    _ir_targets:
      x86_64: x86_64-unknown-linux-gnu
      aarch64: aarch64-unknown-linux-gnu
  tasks:
    - name: Initialize the rejected-by-validation tracker
      ansible.builtin.set_fact:
        decdn_rejected: []

    - name: "Case install-method — an unknown install method"
      block:
        - name: Run iroh_relay with an unknown install method
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_install_method: "source"
      rescue:
        - name: Record install-method rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['install-method'] }}"
          when: ansible_failed_task.name == "Require a valid install method"

    - name: "Case release-version — release mode with a malformed version"
      block:
        - name: Run iroh_relay with release mode with a malformed version
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_install_method: "release"
            iroh_relay_version: "1.3"
      rescue:
        - name: Record release-version rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-version'] }}"
          when: ansible_failed_task.name == "Require a pinned release version"

    - name: "Case release-sha256 — release mode with no digest for the host's target"
      block:
        - name: Run iroh_relay with release mode with no digest for the host's target
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_install_method: "release"
            iroh_relay_sha256: {}
      rescue:
        - name: Record release-sha256 rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-sha256'] }}"
          when: ansible_failed_task.name == "Require a pinned sha256 for the target"

    - name: "Case release-target — release mode with a target for another architecture"
      block:
        - name: Run iroh_relay with release mode with a target for another architecture
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_install_method: "release"
            iroh_relay_target: "{{ _ir_other_target }}"
      rescue:
        - name: Record release-target rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-target'] }}"
          when: ansible_failed_task.name == "Require the target triple to match the host architecture"

    - name: "Case release-target-unsupported — release mode for a target the role does not install"
      block:
        - name: Run iroh_relay with release mode for a target the role does not install
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_install_method: "release"
            iroh_relay_target: "riscv64gc-unknown-linux-gnu"
      rescue:
        - name: Record release-target-unsupported rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['release-target-unsupported'] }}"
          when: ansible_failed_task.name == "Require a supported target triple"

    - name: "Case manual-src — manual mode with no binary source"
      block:
        - name: Run iroh_relay with manual mode with no binary source
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_manual_bin_src: ""
      rescue:
        - name: Record manual-src rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['manual-src'] }}"
