    - name: "Case metrics-public — metrics on every address"
      block:
        - name: Run iroh_relay with metrics on every address
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_metrics_bind: "0.0.0.0"
      rescue:
        - name: Record metrics-public rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['metrics-public'] }}"
          when: ansible_failed_task.name == "Require the metrics listener on loopback"

    - name: "Case metrics-port-node — metrics on decdn-node's port"
      block:
        - name: Run iroh_relay with metrics on decdn-node's port
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_metrics_port: 9090
      rescue:
        - name: Record metrics-port-node rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['metrics-port-node'] }}"
          when: ansible_failed_task.name == "Require the metrics listener on loopback"

    - name: "Case metrics-port-low — metrics on a privileged port"
      block:
        - name: Run iroh_relay with metrics on a privileged port
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_metrics_port: 443
      rescue:
        - name: Record metrics-port-low rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['metrics-port-low'] }}"
          when: ansible_failed_task.name == "Require the metrics listener on loopback"

    - name: "Case access-unknown — an unknown access mode"
      block:
        - name: Run iroh_relay with an unknown access mode
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_access: "open"
      rescue:
        - name: Record access-unknown rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['access-unknown'] }}"
          when: ansible_failed_task.name == "Validate the access mode"

    - name: "Case allowlist-in-everyone-mode — allowlist entries in everyone mode"
      block:
        - name: Run iroh_relay with allowlist entries in everyone mode
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_access: "everyone"
      rescue:
        - name: Record allowlist-in-everyone-mode rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['allowlist-in-everyone-mode'] }}"
          when: ansible_failed_task.name == "Validate the access mode"

    - name: "Case denylist-in-allowlist-mode — denylist entries in allowlist mode"
      block:
        - name: Run iroh_relay with denylist entries in allowlist mode
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_denylist: ["{{ _ir_id }}"]
      rescue:
        - name: Record denylist-in-allowlist-mode rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['denylist-in-allowlist-mode'] }}"
          when: ansible_failed_task.name == "Validate the access mode"

    - name: "Case inventory-bool — a string for allowlist_from_inventory"
      block:
        - name: Run iroh_relay with a string for allowlist_from_inventory
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_allowlist_from_inventory: "yes"
      rescue:
