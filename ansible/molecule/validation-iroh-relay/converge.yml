      rescue:
        - name: Record allowlist-string rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['allowlist-string'] }}"
          when: ansible_failed_task.name == "Validate the allowlist"

    - name: "Case allowlist-bad-hex — an uppercase hex endpoint id"
      block:
        - name: Run iroh_relay with an uppercase hex endpoint id
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_allowlist: ["{{ _ir_id | upper }}"]
      rescue:
