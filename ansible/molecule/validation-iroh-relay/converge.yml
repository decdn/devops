          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_access: denylist
            iroh_relay_allowlist: []
            iroh_relay_denylist: "81d82536cb4c96ddbeab1f6bf4495d126c1942fb90b9ffb433d91d23314801e7"
