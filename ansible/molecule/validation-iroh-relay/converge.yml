        - name: Run iroh_relay with a z-base-32 endpoint id
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_access: denylist
            iroh_relay_allowlist: []
            iroh_relay_denylist: ["qybgnirdnemrodzcgtrkzwmr5x3wnbxbzq7orcbjtd6zuvmj4n3o"]
      rescue:
        - name: Record denylist-zbase32 rejection (only if its assert failed)
          ansible.builtin.set_fact:
