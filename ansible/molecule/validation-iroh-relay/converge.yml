            name: iroh_relay
          vars:
            iroh_relay_certificate_check: "maybe"
      rescue:
        - name: Record cert-check rejection (only if its assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['cert-check'] }}"
          when: ansible_failed_task.name == "Validate the readiness and certificate-check knobs"

    # Host-side: valid inputs, but another process holds tcp/443.
    - name: "Case port-squatter — another process on tcp/443"
      block:
        - name: Squat on tcp/443 with another process
          ansible.builtin.command:
            argv: [systemd-run, --unit=molecule-squatter-443, --collect,
                   python3, -m, http.server, "443", --bind, 0.0.0.0]
          changed_when: true

        - name: Wait for the squatter to listen
          ansible.builtin.wait_for:
            port: 443
            host: 127.0.0.1
            timeout: 15

        - name: Run iroh_relay while another process holds tcp/443
          ansible.builtin.include_role:
            name: iroh_relay
      rescue:
        - name: Record port-squatter rejection (only if its guard failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['port-squatter'] }}"
          when: ansible_failed_task.name == "Refuse public ports held by another process"
      always:
        - name: Stop the squatter
          ansible.builtin.systemd_service:
            name: molecule-squatter-443
            state: stopped
          failed_when: false

    - name: Require every bad input to have been rejected by its own assert
      ansible.builtin.assert:
        that:
          - decdn_rejected | sort == _decdn_expected | sort
        fail_msg: >-
          Expected {{ _decdn_expected | sort }}, got {{ decdn_rejected | sort }} — a
          missing tag means that bad value slipped past validation (it would reach
          the relay and crash-loop it, or open what must stay closed).
      vars:
        _decdn_expected:
          - install-method
          - release-version
          - release-sha256
          - release-target
          - release-target-unsupported
          - manual-src
          - hostname-url
          - hostname-ip
          - hostname-empty
          - contact-mailto
          - contact-empty
          - bool-staging
          - bool-qad
          - bind-loopback
          - bind-brackets
          - bind-port
          - bind-loopback-v6long
          - bind-mapped
          - bind-link-local
          - metrics-public
          - metrics-port-node
          - metrics-port-low
          - access-unknown
          - allowlist-in-everyone-mode
          - denylist-in-allowlist-mode
          - inventory-bool
          - allowlist-string
          - allowlist-bad-hex
          - allowlist-dup
          - allowlist-empty
          - denylist-string
          - denylist-zbase32
          - denylist-dup
          - limit-burst-alone
          - limit-zero
          - limit-u32
          - limit-conn
          - limit-nofile
          - log-space
          - log-specifier
          - cert-check
          - port-squatter
