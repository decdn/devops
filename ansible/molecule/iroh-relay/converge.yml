---
# The real entry point: both plays of playbooks/iroh_relay.yml (the placement guard,
# then the relay), so playbooks/group_vars/all.yml derives the Alloy toggle exactly
# as a deploy would. Variables come from molecule.yml's inventory group_vars;
# baseline is skipped there.
- name: Converge
  ansible.builtin.import_playbook: ../../playbooks/iroh_relay.yml
