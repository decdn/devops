---
# Stage what Let's Encrypt and the operator would provide:
#   1. a molecule CA, trusted by the host, and a certificate it signed for
#      relay.molecule.test, which the stub serves on https (the real relay would
#      fetch one from Let's Encrypt into its state directory);
#   2. the Grafana Cloud credential env file (as ../grafana-cloud/prepare.yml);
#   3. a stand-in deCDN node on every platform (the inventory names them in
#      iroh_relay_allowlist_node_hosts): a decdn user, /etc/decdn/node.toml and a
#      `decdn` whose `whoami` prints "node id: <sha256 of the host name>" (one ID
#      per host). Markers under /etc/decdn change it: molecule-no-identity prints
#      the real CLI's "(none — …)" line, molecule-whoami-fails exits 1 with an
#      error, molecule-shared-id prints the same ID on every host.
- name: Prepare
  hosts: all
  become: true
  vars:
    _ir_pki: /etc/iroh-relay-molecule
  tasks:
    - name: Install openssl and the CA tooling
      ansible.builtin.apt:
        name: [openssl, ca-certificates]
        state: present
        update_cache: true

    - name: Create the molecule PKI directory
      ansible.builtin.file:
        path: "{{ _ir_pki }}"
        state: directory
        mode: "0755"

    # The leaf key is world-readable on purpose: the stub runs as the unit's
    # DynamicUser. A throwaway key for a name that resolves nowhere.
    - name: Generate the molecule CA and the relay's certificate
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ _ir_pki }}"
        creates: "{{ _ir_pki }}/relay.crt"
        cmd: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=iroh-relay molecule CA" \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=relay.molecule.test" \
            -keyout relay.key -out relay.csr
          printf 'subjectAltName=DNS:relay.molecule.test\n' > relay.ext
          openssl x509 -req -in relay.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 \
            -extfile relay.ext -out relay.crt
          chmod 0644 relay.key relay.crt ca.crt
          chmod 0600 ca.key

    - name: Trust the molecule CA
      ansible.builtin.copy:
        src: "{{ _ir_pki }}/ca.crt"
        dest: /usr/local/share/ca-certificates/iroh-relay-molecule.crt
        remote_src: true
        mode: "0644"
      register: _ir_ca

    - name: Rebuild the trust store  # noqa: no-handler
      ansible.builtin.command:
        cmd: update-ca-certificates
      changed_when: true
      when: _ir_ca.changed

    - name: Stage the Grafana Cloud credential fixture on the host
      ansible.builtin.copy:
        dest: /etc/grafana-alloy.env
        owner: root
        group: root
        mode: "0600"
        content: |
          GC_PROM_REMOTE_WRITE_URL=https://prometheus-prod-xx.molecule.invalid/api/prom/push
          GC_OTLP_ENDPOINT=https://otlp-gateway-prod-xx.molecule.invalid/otlp
          GC_PROM_USERNAME=999888777
          GC_OTLP_USERNAME=999888779
          GC_LOKI_USERNAME=999888778
          GC_API_TOKEN=molecule-test-token

    - name: Create the stand-in node's decdn user
      ansible.builtin.user:
        name: decdn
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create the stand-in node's config directory
      ansible.builtin.file:
        path: /etc/decdn
        state: directory
        mode: "0755"

    - name: Stage the stand-in node's config
      ansible.builtin.copy:
        dest: /etc/decdn/node.toml
        content: "# molecule stand-in: read by nothing but the fake decdn below\n"
        mode: "0644"

    # The real CLI prints "node id: <hex>" then "key path: …" (crates/cli/src/
    # commands/whoami.rs), or "node id: (none — …)" with no key.
    - name: Stage the stand-in `decdn` CLI
      ansible.builtin.copy:
        dest: /usr/local/bin/decdn
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          [ "${1:-}" = --config ] && [ -r "${2:-}" ] && [ "${3:-}" = whoami ] \
            || { echo "decdn stand-in: unexpected arguments: $*" >&2; exit 2; }
          [ "$(id -un)" = decdn ] || { echo "decdn stand-in: run as $(id -un), not decdn" >&2; exit 1; }
          if [ -e /etc/decdn/molecule-whoami-fails ]; then
            echo "Error: node.secret in /var/lib/decdn is group- or world-readable" >&2
            exit 1
          elif [ -e /etc/decdn/molecule-no-identity ]; then
            echo "node id: (none — no node.secret in /var/lib/decdn; run decdn key-gen)"
          elif [ -e /etc/decdn/molecule-shared-id ]; then
            echo "node id: e8a601ca5aea34a904990dcc03e2c46a7b39d6a23b395dd669ceba0c0aa1077e"
          else
            echo "node id: {{ inventory_hostname | hash('sha256') }}"
            echo "key path: /var/lib/decdn/node.secret"
          fi
