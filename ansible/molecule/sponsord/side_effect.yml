---
# Four behaviours a green converge + idempotence cannot prove:
#   1. Rotating a credential OUT OF BAND (the operator replaces the treasury
#      password file) and re-running the role restarts the daemon onto it. Without
#      this the daemon keeps the old credential behind a green deploy.
#   2. The /healthz readiness gate is FATAL: a daemon that never binds (the stub
#      refuses to start while its marker exists) fails the converge at the role's
#      report task, rather than passing on a Type=simple unit stuck restarting.
#   3. secret.env's two homes and the provenance guards between them: an empty
#      sponsord_rpc_url must not adopt the role's own file; a handed-over file is
#      recorded `host` and locked to 0600; a host edit restarts the daemon; an
#      inventory URL must not overwrite the host's file until confirmed.
#   4. release mode against prepare.yml's signed loopback mirror: a verified
#      install writes the version stamp; a re-run needs no download; a bad
#      checksum, a bad signature and a binary that is not the pinned version all
#      fail at their own task and leave no stamp; manual mode clears the stamp.
#   5. sponsord_generate_treasury_wallet: with no keystore, the role mints one on
#      the host through the decdn CLI (the default scenario's key-gen stub), records
#      the address and stops at its pool-id step; a re-run keeps that wallet; with a
#      pool id the daemon starts on it.
# The host is left healthy, back on the inventory-authored secret.env, the manual
# install and the prepared treasury files, for verify.yml.
- name: Side effect — credential rotation and the fatal readiness gate
  hosts: all
  become: true
  tasks:
    - name: Read the unit state before the rotation
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_before

    - name: Assert sponsord was running cleanly before the rotation
      ansible.builtin.assert:
        that:
          - _sp_before.status.ActiveState == 'active'
          - _sp_before.status.MainPID | int > 0
          - _sp_before.status.NRestarts == '0'
        fail_msg: >-
          Expected sponsord active with no automatic restarts before the rotation (got
          ActiveState={{ _sp_before.status.ActiveState }},
          NRestarts={{ _sp_before.status.NRestarts }}): journalctl -u sponsord -e

    - name: Hash the generated API token before the second converge
      ansible.builtin.stat:
        path: /etc/sponsord/api-token
        checksum_algorithm: sha256
      register: _sp_token_before

    - name: Save the token hash for verify.yml
      ansible.builtin.copy:
        dest: /root/molecule-sponsord-token-before
        content: "{{ _sp_token_before.stat.checksum }}\n"
        mode: "0600"

    - name: Rotate the treasury password out of band
      ansible.builtin.copy:
        dest: /etc/sponsord/treasury-password
        content: "molecule-rotated\n"
        mode: "0600"

    - name: Converge again after the rotation
      ansible.builtin.include_role:
        name: sponsord

    - name: Read the unit state after the rotation converge
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_after

    # Checked here, before the readiness case below stops the daemon (which changes
    # the PID regardless).
    - name: Require the rotation to have restarted sponsord
      ansible.builtin.assert:
        that:
          - _sp_after.status.ActiveState == 'active'
          - _sp_after.status.MainPID != _sp_before.status.MainPID
        fail_msg: >-
          sponsord kept PID {{ _sp_before.status.MainPID }} after its treasury password
          was rotated and the role re-ran: the daemon is still on the old credential.

    - name: Stop the daemon, then make it refuse to start
      ansible.builtin.systemd_service:
        name: sponsord
        state: stopped

    - name: Stage the stub's refuse-to-start marker
      ansible.builtin.copy:
        dest: /etc/sponsord/stub-unhealthy
        content: ""
        mode: "0644"

    - name: Converge against a daemon that never becomes healthy
      block:
        - name: Run the role with a short readiness window
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_readiness_retries: 3
            sponsord_readiness_delay: 1

        - name: Fail — the readiness gate let an unhealthy daemon through
          ansible.builtin.fail:
            msg: The role finished although sponsord never answered /healthz.
      rescue:
        - name: Require the failure to come from the readiness gate itself
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Report a sponsord that did not become healthy'
            fail_msg: >-
              Expected the role to fail at its readiness report, but it failed at
              "{{ ansible_failed_task.name }}".
      always:
        - name: Remove the refuse-to-start marker
          ansible.builtin.file:
            path: /etc/sponsord/stub-unhealthy
            state: absent

    # The failed run wrote no records (they come after the gate), so this run sees
    # the same inputs and only has to bring the daemon back.
    - name: Converge once more to leave the host healthy
      ansible.builtin.include_role:
        name: sponsord

- name: Side effect — secret.env provenance
  hosts: all
  become: true
  vars:
    _sp_env: /etc/sponsord/secret.env
    _sp_rec: /etc/sponsord/.secret.env.sha256
  tasks:
    # 1. secret.yml "went missing": the file is byte-for-byte the role's own.
    - name: Hash secret.env before the adoption attempt
      ansible.builtin.stat:
        path: "{{ _sp_env }}"
        checksum_algorithm: sha256
      register: _sp_env_before

    - name: Run with no inventory RPC URL against the role-authored file
      block:
        - name: Run the role with sponsord_rpc_url empty
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_rpc_url: ""

        - name: Fail — the role adopted its own file as host-provisioned
          ansible.builtin.fail:
            msg: An empty sponsord_rpc_url silently adopted the role-authored secret.env.
      rescue:
        - name: Require the adoption guard to be what stopped it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Refuse to adopt a role-authored secret.env as host-provisioned'
            fail_msg: "Expected the adoption guard, got \"{{ ansible_failed_task.name }}\"."

    - name: Hash secret.env after the refused adoption
      ansible.builtin.stat:
        path: "{{ _sp_env }}"
        checksum_algorithm: sha256
      register: _sp_env_after

    - name: Require the refused run to leave secret.env untouched
      ansible.builtin.assert:
        that:
          - _sp_env_after.stat.checksum == _sp_env_before.stat.checksum

    # 2. A deliberate handover: drop the record, loosen the mode. The role must take
    #    the file as the operator's, lock it down, and owe no restart (same bytes).
    - name: Read the unit state before the handover
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_unit_a

    - name: Hand secret.env to the host (discard the record, loosen the mode)
      ansible.builtin.shell:
        cmd: rm -f {{ _sp_rec }} && chmod 0644 {{ _sp_env }}
      changed_when: true

    - name: Converge with the host-provisioned secret.env
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_rpc_url: ""

    - name: Read secret.env, its record and the unit after the handover
      ansible.builtin.stat:
        path: "{{ _sp_env }}"
        checksum_algorithm: sha256
      register: _sp_env_host

    - name: Read the provenance record after the handover
      ansible.builtin.slurp:
        src: "{{ _sp_rec }}"
      register: _sp_rec_host

    - name: Read the unit state after the handover
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_unit_b

    - name: Require a locked, host-recorded file and no restart
      ansible.builtin.assert:
        that:
          - _sp_env_host.stat.mode == '0600'
          - (_sp_rec_host.content | b64decode).split() == ['host', _sp_env_host.stat.checksum]
          - _sp_unit_b.status.MainPID == _sp_unit_a.status.MainPID
        fail_msg: >-
          Expected secret.env 0600 (got {{ _sp_env_host.stat.mode }}), record
          "host {{ _sp_env_host.stat.checksum }}" (got "{{ _sp_rec_host.content | b64decode | trim }}")
          and no restart (PID {{ _sp_unit_a.status.MainPID }} -> {{ _sp_unit_b.status.MainPID }}).

    # 3. The operator edits the host file: the next converge must restart onto it.
    - name: Edit secret.env on the host
      ansible.builtin.lineinfile:
        path: "{{ _sp_env }}"
        line: "# molecule host edit"
        mode: "0600"

    - name: Converge after the host edit
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_rpc_url: ""

    - name: Read the unit state after the host edit
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_unit_c

    - name: Require the host edit to have restarted sponsord
      ansible.builtin.assert:
        that:
          - _sp_unit_c.status.ActiveState == 'active'
          - _sp_unit_c.status.MainPID != _sp_unit_b.status.MainPID

    # 4. An inventory URL against the host's (edited) file: refused, file kept.
    - name: Run with the inventory URL against the host's file
      block:
        - name: Run the role with the inventory URL (group_vars)
          ansible.builtin.include_role:
            name: sponsord

        - name: Fail — the role overwrote the host's file unconfirmed
          ansible.builtin.fail:
            msg: An inventory sponsord_rpc_url overwrote a host-provisioned secret.env without confirmation.
      rescue:
        - name: Require the overwrite guard to be what stopped it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require confirmation to overwrite a secret.env this role did not write'
            fail_msg: "Expected the overwrite guard, got \"{{ ansible_failed_task.name }}\"."

    - name: Require the host edit to survive the refused overwrite
      ansible.builtin.command:
        cmd: grep -qx '# molecule host edit' {{ _sp_env }}
      changed_when: false

    # 5. Confirmed: the role takes the file back and restarts onto it.
    - name: Converge with the overwrite confirmed
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_secret_env_overwrite_host_file: true

    - name: Read the provenance record after the takeover
      ansible.builtin.slurp:
        src: "{{ _sp_rec }}"
      register: _sp_rec_inv

    - name: Read the unit state after the takeover
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_unit_d

    - name: Require an inventory record, the edit gone and a restart
      ansible.builtin.assert:
        that:
          - (_sp_rec_inv.content | b64decode).split()[0] == 'inventory'
          - _sp_unit_d.status.MainPID != _sp_unit_c.status.MainPID
        fail_msg: >-
          Expected record source "inventory" (got
          "{{ _sp_rec_inv.content | b64decode | trim }}") and a restart.

    - name: Require the host edit to be gone
      ansible.builtin.command:
        cmd: grep -qx '# molecule host edit' {{ _sp_env }}
      register: _sp_edit_gone
      changed_when: false
      failed_when: _sp_edit_gone.rc != 1

- name: Side effect — release mode against the signed loopback mirror
  hosts: all
  become: true
  vars:
    _sp_ver: 0.0.0-molecule-stub
    _sp_base: http://127.0.0.1:8081/releases
    _sp_eph: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    _sp_keys: "{{ _sp_eph }}/sponsord-mirror-KEYS-{{ inventory_hostname }}.asc"
    _sp_stamp: /usr/local/lib/sponsord/installed-version
    _sp_rel: /srv/sponsord-mirror/www/releases/sponsord-v0.0.0-molecule-stub
  tasks:
    - name: Wait for the mirror to serve the signed manifest
      ansible.builtin.uri:
        url: "{{ _sp_base }}/sponsord-v{{ _sp_ver }}/SHA256SUMS.asc"
      register: _sp_mirror_up
      until: _sp_mirror_up.status == 200
      retries: 10
      delay: 1

    # 1. A verified install records the stamp, and clears a source build's stamp
    # (left behind it would make a later source deploy of the same commit skip
    # the build over this release binary).
    - name: Create the stamp directory
      ansible.builtin.file:
        path: /usr/local/lib/sponsord
        state: directory
        mode: "0755"

    - name: Seed a source build stamp
      ansible.builtin.copy:
        dest: /usr/local/lib/sponsord/installed-source
        content: "https://github.com/decdn/sponsord.git@0000000000000000000000000000000000000000\n"
        mode: "0644"

    - name: Install the pinned release
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_install_method: release
        sponsord_version: "{{ _sp_ver }}"
        sponsord_release_base: "{{ _sp_base }}"
        sponsord_release_keyring: "{{ _sp_keys }}"

    - name: Read the version stamp
      ansible.builtin.slurp:
        src: "{{ _sp_stamp }}"
      register: _sp_stamp_1

    - name: Stat the seeded source stamp
      ansible.builtin.stat:
        path: /usr/local/lib/sponsord/installed-source
      register: _sp_source_stamp

    - name: Require the stamp to name the installed release, and no source stamp
      ansible.builtin.assert:
        that:
          - (_sp_stamp_1.content | b64decode | trim) == _sp_ver
          - not _sp_source_stamp.stat.exists

    # 2. The stamp is what makes a re-run need no download.
    - name: Stop the mirror
      ansible.builtin.systemd_service:
        name: molecule-sponsord-mirror
        state: stopped

    - name: Re-run the release install with the mirror down
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_install_method: release
        sponsord_version: "{{ _sp_ver }}"
        sponsord_release_base: "{{ _sp_base }}"
        sponsord_release_keyring: "{{ _sp_keys }}"

    - name: Start the mirror again
      ansible.builtin.systemd_service:
        name: molecule-sponsord-mirror
        state: started

    # 3. A manifest with a valid signature but the wrong hash.
    - name: Keep the good manifest and signature aside, then publish a signed bad hash
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cd {{ _sp_rel | quote }}
          cp SHA256SUMS /root/SHA256SUMS.good
          cp SHA256SUMS.asc /root/SHA256SUMS.asc.good
          f=$(awk '{print $2}' SHA256SUMS)
          printf '%064d  %s\n' 0 "$f" > SHA256SUMS
          rm -f SHA256SUMS.asc
          GNUPGHOME=/srv/sponsord-mirror/gnupg gpg --batch --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cp SHA256SUMS.asc /root/SHA256SUMS.asc.bad
          chmod 0644 SHA256SUMS SHA256SUMS.asc
          rm -f {{ _sp_stamp | quote }}
        executable: /bin/bash
      changed_when: true

    - name: Install against the bad checksum
      block:
        - name: Run the release install
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_install_method: release
            sponsord_version: "{{ _sp_ver }}"
            sponsord_release_base: "{{ _sp_base }}"
            sponsord_release_keyring: "{{ _sp_keys }}"

        - name: Fail — a tarball that does not match the manifest was installed
          ansible.builtin.fail:
            msg: The checksum check let a mismatching tarball through.
      rescue:
        - name: Require the checksum check to be what stopped it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Verify the tarball against SHA256SUMS'
            fail_msg: "Expected the checksum check, got \"{{ ansible_failed_task.name }}\"."

    # 4. The good manifest with a signature over a different one.
    - name: Publish the good manifest with the bad manifest's signature
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cd {{ _sp_rel | quote }}
          cp /root/SHA256SUMS.good SHA256SUMS
          cp /root/SHA256SUMS.asc.bad SHA256SUMS.asc
          chmod 0644 SHA256SUMS SHA256SUMS.asc
        executable: /bin/bash
      changed_when: true

    - name: Install against the mismatched signature
      block:
        - name: Run the release install
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_install_method: release
            sponsord_version: "{{ _sp_ver }}"
            sponsord_release_base: "{{ _sp_base }}"
            sponsord_release_keyring: "{{ _sp_keys }}"

        - name: Fail — a manifest with a bad signature was trusted
          ansible.builtin.fail:
            msg: The signature check let a mismatched signature through.
      rescue:
        - name: Require the signature check to be what stopped it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Verify the SHA256SUMS signature against the release keyring'
            fail_msg: "Expected the signature check, got \"{{ ansible_failed_task.name }}\"."

    - name: Restore the good signature
      ansible.builtin.copy:
        src: /root/SHA256SUMS.asc.good
        dest: "{{ _sp_rel }}/SHA256SUMS.asc"
        remote_src: true
        mode: "0644"

    # Both failures keep their staging directory as evidence; remove it.
    - name: Find the retained staging directories
      ansible.builtin.find:
        paths: /tmp
        patterns: sponsord-install-*
        file_type: directory
      register: _sp_stages

    - name: Require one retained staging directory per failed verification
      ansible.builtin.assert:
        that:
          - _sp_stages.matched == 2
        fail_msg: "Expected 2 retained staging dirs, found {{ _sp_stages.files | map(attribute='path') | list }}"

    - name: Remove the retained staging directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _sp_stages.files }}"
      loop_control:
        label: "{{ item.path }}"

    # 5. A signed, verified release whose binary is not the pinned version.
    - name: Install a release whose binary reports another version
      block:
        - name: Run the release install of 0.0.9
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_install_method: release
            sponsord_version: 0.0.9
            sponsord_release_base: "{{ _sp_base }}"
            sponsord_release_keyring: "{{ _sp_keys }}"

        - name: Fail — a binary that is not the pinned version was accepted
          ansible.builtin.fail:
            msg: The version backstop accepted a binary reporting another version.
      rescue:
        - name: Require the version backstop to be what stopped it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require the installed sponsord to run and match the pinned version'
            fail_msg: "Expected the version backstop, got \"{{ ansible_failed_task.name }}\"."

    - name: Check for a version stamp after the failed installs
      ansible.builtin.stat:
        path: "{{ _sp_stamp }}"
      register: _sp_stamp_failed

    - name: Require no stamp after the failed installs
      ansible.builtin.assert:
        that:
          - not _sp_stamp_failed.stat.exists
        fail_msg: A failed release install left a version stamp, so the next run would skip the download.

    # 6. Back to manual (the scenario's group_vars): the stamp must go.
    - name: Converge back to the manual install
      ansible.builtin.include_role:
        name: sponsord

    - name: Check for a version stamp in manual mode
      ansible.builtin.stat:
        path: "{{ _sp_stamp }}"
      register: _sp_stamp_manual

    - name: Require manual mode to clear the stamp
      ansible.builtin.assert:
        that:
          - not _sp_stamp_manual.stat.exists

- name: Side effect — treasury wallet generation
  hosts: all
  become: true
  vars:
    # The default scenario's node stub implements `key-gen` (dummy keystore.json, a
    # zero eth address on stdout).
    _sp_cli_stub: "{{ playbook_dir }}/../default/files/decdn-node-stub"
  tasks:
    - name: Set the prepared treasury files aside
      ansible.builtin.command:
        argv: [mv, "/etc/sponsord/{{ item }}", "/root/molecule-{{ item }}"]
        creates: "/root/molecule-{{ item }}"
      loop: [treasury-keystore.json, treasury-password]

    - name: Converge with no wallet and no pool id
      block:
        - name: Run the role in wallet-creation mode
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_generate_treasury_wallet: true
            sponsord_decdn_cli_bin_src: "{{ _sp_cli_stub }}"
            sponsord_pool_id: ""

        - name: Fail — the wallet-creation run did not stop
          ansible.builtin.fail:
            msg: The role finished with an empty sponsord_pool_id.
      rescue:
        - name: Require the stop to come from the pool-id step
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Stop until the treasury has opened its pool'
              - "'0x0000000000000000000000000000000000000000' in ansible_failed_result.msg"
            fail_msg: "Expected the pool-id stop, got \"{{ ansible_failed_task.name }}\"."

    - name: Stat the generated wallet, its address and the CLI
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      register: _sp_wallet
      loop:
        - /etc/sponsord/treasury-keystore.json
        - /etc/sponsord/treasury-password
        - /etc/sponsord/treasury-address
        - /usr/local/lib/sponsord/decdn

    - name: Read the generated password and address
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _sp_wallet_content
      loop:
        - /etc/sponsord/treasury-password
        - /etc/sponsord/treasury-address

    - name: Find key-gen scratch directories left behind
      ansible.builtin.find:
        paths: /etc/sponsord
        patterns: ".keygen.*"
        file_type: directory
        hidden: true
      register: _sp_keygen_left

    - name: Require the wallet files, modes and contents
      ansible.builtin.assert:
        that:
          - _sp_wallet.results[0].stat.isreg and _sp_wallet.results[0].stat.mode == '0600'
          - _sp_wallet.results[1].stat.isreg and _sp_wallet.results[1].stat.mode == '0600'
          - _sp_wallet.results[2].stat.isreg and _sp_wallet.results[2].stat.mode == '0644'
          - _sp_wallet.results[3].stat.isreg and _sp_wallet.results[3].stat.mode == '0755'
          - _sp_wallet_content.results[0].content | b64decode is match('^[0-9a-f]{64}\Z')
          - (_sp_wallet_content.results[1].content | b64decode) == '0x0000000000000000000000000000000000000000\n'
          - _sp_keygen_left.matched == 0
        fail_msg: >-
          The generated wallet is not as expected:
          {{ _sp_wallet.results | map(attribute='stat') | map(attribute='mode', default='absent') | list }},
          {{ _sp_keygen_left.matched }} scratch dir(s) left behind.

    - name: Converge in wallet-creation mode again
      block:
        - name: Run the role with the wallet already present
          ansible.builtin.include_role:
            name: sponsord
          vars:
            sponsord_generate_treasury_wallet: true
            sponsord_decdn_cli_bin_src: "{{ _sp_cli_stub }}"
            sponsord_pool_id: ""

        - name: Fail — the second wallet-creation run did not stop
          ansible.builtin.fail:
            msg: The role finished with an empty sponsord_pool_id.
      rescue:
        - name: Require the second stop to come from the pool-id step
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Stop until the treasury has opened its pool'
            fail_msg: "Expected the pool-id stop, got \"{{ ansible_failed_task.name }}\"."

    - name: Re-stat the keystore after the second run
      ansible.builtin.stat:
        path: /etc/sponsord/treasury-keystore.json
        checksum_algorithm: sha256
      register: _sp_wallet_again

    - name: Require the existing wallet to be kept
      ansible.builtin.assert:
        that:
          - _sp_wallet_again.stat.checksum == _sp_wallet.results[0].stat.checksum
        fail_msg: A second wallet-creation run replaced an existing keystore.

    # The scenario's pool id: the stub daemon accepts any JSON keystore.
    - name: Converge with the pool id set
      ansible.builtin.include_role:
        name: sponsord
      vars:
        sponsord_generate_treasury_wallet: true
        sponsord_decdn_cli_bin_src: "{{ _sp_cli_stub }}"

    - name: Read the unit state on the generated wallet
      ansible.builtin.systemd_service:
        name: sponsord
      register: _sp_wallet_unit

    - name: Require sponsord running on the generated wallet
      ansible.builtin.assert:
        that:
          - _sp_wallet_unit.status.ActiveState == 'active'
        fail_msg: "sponsord is {{ _sp_wallet_unit.status.ActiveState }} on the generated wallet."

    - name: Remove the generated wallet, its address and the CLI
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/sponsord/treasury-keystore.json
        - /etc/sponsord/treasury-password
        - /etc/sponsord/treasury-address
        - /usr/local/lib/sponsord/decdn

    - name: Put the prepared treasury files back
      ansible.builtin.command:
        argv: [mv, "/root/molecule-{{ item }}", "/etc/sponsord/{{ item }}"]
        creates: "/etc/sponsord/{{ item }}"
      loop: [treasury-keystore.json, treasury-password]

    - name: Converge back onto the prepared wallet
      ansible.builtin.include_role:
        name: sponsord
