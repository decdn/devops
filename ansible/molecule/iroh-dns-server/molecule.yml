---
# iroh-dns-server on a host of its own (iroh_dns_server_hosts), converged through
# the real playbooks/iroh_dns_server.yml against a stub server
# (files/iroh-dns-server-stub), with a molecule CA standing in for Let's Encrypt
# (no delegated zone in a container).
#
#   converge     the server: config, hardened unit (DynamicUser, CAP_NET_BIND_SERVICE
#                only, StateDirectory), the readiness gate (/healthz and metrics on
#                loopback, every listener owned by the unit, each origin's SOA over
#                udp and tcp) and the certificate check, in "fail" mode, against
#                the molecule CA the host trusts; Alloy scraping the server and
#                labelling its journal stream.
#   idempotence  an unchanged host must not restart anything.
#   side_effect  a no-op re-run leaves the server alone; a changed knob restarts
#                it; a server that will not start FAILS the gate and leaves the
#                restart-input record alone; a squatter on tcp/443, or on port 53
#                at the DNS bind address, is refused before anything changes, and
#                one on 127.0.0.53:53 (systemd-resolved's stub) is not; a missing
#                config fails the start (the unit's assert).
#   verify       files, modes, unit hardening, effective capabilities, the
#                listeners (metrics and health on loopback only), /healthz over
#                https with the trusted certificate, a PUT to /pkarr, SOA, NS and A
#                answers over udp and tcp, the Alloy blocks.
#
# The other side effects run on the same converge, so they run side by side (their
# inventories must stay identical to this one: `make test-scripts` checks): the
# certificate check in ../iroh-dns-server-certificate; the gate's other refusals
# and the wildcard DNS bind in ../iroh-dns-server-gate; the release install
# (download, sha256 pin, stamp, the version on /healthz) in
# ../iroh-dns-server-install against a local mirror; and decommission in
# ../iroh-dns-server-lifecycle. The broken-input matrix lives in
# ../validation-iroh-dns-server. `baseline` is skipped (real-host-only — see
# ../default/molecule.yml), so the tcp/443 and udp+tcp/53 holes are covered by
# tests/firewall-holes instead.
driver:
  name: docker
platforms:
  # Same digest-pinned images as ../sponsord (repo convention).
  - name: dns-molecule
    image: geerlingguy/docker-debian12-ansible@sha256:a131e3b7a9a38dda40e98b49b39d6200ffab0ad853c714a513f5eea41bab9a25
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - iroh_dns_server_hosts
  # systemd 255: StateDirectory= and the ambient capability on a newer systemd.
  - name: dns-molecule-u2404
    image: geerlingguy/docker-ubuntu2404-ansible@sha256:3394e335df58c961c00b78ae601ef30cdd7463b112f21b0c5f78674a70526302
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - iroh_dns_server_hosts
provisioner:
  name: ansible
  options:
    skip-tags: baseline
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    # Same pipelining note as ../default/molecule.yml.
    ANSIBLE_PIPELINING: "true"
  inventory:
    group_vars:
      iroh_dns_server_hosts:
        iroh_dns_server_install_method: manual
        iroh_dns_server_manual_bin_src: >-
          ${MOLECULE_PROJECT_DIRECTORY}/molecule/iroh-dns-server/files/iroh-dns-server-stub
        iroh_dns_server_hostname: dns.molecule.test
        iroh_dns_server_acme_contact: ops@molecule.test
        # The DNS listener binds the container's own address (the default), which
        # is private, so the apex A record is set: a documentation address.
        iroh_dns_server_rr_a: 192.0.2.10
        # Every optional key rendered, so the stub checks each one's shape: a second
        # origin (already qualified), the AAAA record, the DHT and its bootstrap.
        iroh_dns_server_origins: [dns.molecule.test, discovery.molecule.test.]
        iroh_dns_server_rr_aaaa: "2001:db8::10"
        iroh_dns_server_mainline_enabled: true
        iroh_dns_server_mainline_bootstrap: ["router.molecule.test:6881"]
        iroh_dns_server_log_level: info,iroh_dns_server=debug
        iroh_dns_server_certificate_check: fail
        iroh_dns_server_certificate_retries: 5
        iroh_dns_server_certificate_delay: 1
        iroh_dns_server_readiness_retries: 10
        iroh_dns_server_readiness_delay: 1
        # 1s, not the default 5: the side effects run the role dozens of times. The
        # crash-after-bind case (../iroh-dns-server-gate) sets its own.
        iroh_dns_server_readiness_settle: 1
        decdn_grafana_cloud_enabled: true
        grafana_alloy_install_method: manual
        grafana_alloy_manual_bin_src: "${MOLECULE_PROJECT_DIRECTORY}/molecule/grafana-cloud/files/alloy-stub"
        grafana_alloy_region: US
        grafana_alloy_loki_url: https://logs-prod-xx.molecule.invalid/loki/api/v1/push
verifier:
  name: ansible
scenario:
  test_sequence:
    # Leading destroy: see ../default/molecule.yml.
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
