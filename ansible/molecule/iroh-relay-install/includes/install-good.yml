---
# Install the good release from the mirror and check the binary and the stamp.
- name: Run the role in release mode with the right digest
  ansible.builtin.include_role:
    name: iroh_relay
  vars:
    iroh_relay_install_method: release
    iroh_relay_release_base: "{{ _ir_base }}"
    iroh_relay_version: "{{ _ir_good }}"
    iroh_relay_sha256: "{{ {_ir_target: _ir_good_sha} }}"

- name: Hash the installed binary
  ansible.builtin.stat:
    path: /usr/local/bin/iroh-relay
    checksum_algorithm: sha256
  register: _ir_installed

- name: Read the install stamp
  ansible.builtin.slurp:
    src: "{{ _ir_stamp }}"
  register: _ir_stamp_good

- name: Require the release's binary, stamped with its version, target and checksum
  ansible.builtin.assert:
    that:
      - _ir_installed.stat.checksum == _ir_bin_sha
      - (_ir_stamp_good.content | b64decode | trim) == _ir_good ~ ' ' ~ _ir_target ~ ' ' ~ _ir_bin_sha
    fail_msg: >-
      Installed binary {{ _ir_installed.stat.checksum }} (want {{ _ir_bin_sha }}), stamp
      "{{ _ir_stamp_good.content | b64decode | trim }}".
