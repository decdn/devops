---
- name: Verify the relay's decommission
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat the units, the record, and what decommission keeps
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/iroh-relay.service
        - /etc/systemd/system/alloy.service
        - /etc/iroh-relay/.relay-inputs.sha256
        - /etc/iroh-relay/iroh-relay.toml
        - /usr/local/bin/iroh-relay
        - /var/lib/private/iroh-relay/acme/molecule-stub-probe
      register: _after

    - name: Require the units and the record gone, and the config, binary and ACME state kept
      ansible.builtin.assert:
        that:
          - _after.results[0:3] | map(attribute='stat.exists') | unique == [false]
          - _after.results[3:] | map(attribute='stat.exists') | unique == [true]
        fail_msg: >-
          Decommission must remove the relay and Alloy units and the restart-input
          record, and keep the config, the binary and the ACME state:
          {{ _after.results | map(attribute='item') | zip(_after.results | map(attribute='stat.exists')) | list }}

    - name: Read the relay's state
      ansible.builtin.systemd_service:
        name: iroh-relay
      register: _unit

    - name: Require the relay stopped
      ansible.builtin.assert:
        that:
          - _unit.status.ActiveState != 'active'
        fail_msg: iroh-relay is still {{ _unit.status.ActiveState }} after decommission.

    - name: Read the listeners on the relay's ports
      ansible.builtin.command:
        argv: [ss, -Hltun, "( sport = :80 or sport = :443 or sport = :7842 or sport = :9092 )"]
      register: _ss
      changed_when: false

    - name: Require the relay's ports free
      ansible.builtin.assert:
        that:
          - _ss.stdout | trim | length == 0
        fail_msg: "Still listening after decommission: {{ _ss.stdout }}"
