---
# NEGATIVE-path scenario for decdn_node: proves the role's fail-loud tuning-knob
# validation actually REJECTS bad values (AGENTS.md hard-rule 4), so a regression
# that weakens an assert fails CI. Each case runs decdn_node (its main entry point,
# or tasks_from: backup / decommission) with a VALID required config plus ONE bad
# input, wrapped in block/rescue. The role aborts at its validation asserts (which
# for the tuning-knob cases run before any host mutation), so those cases don't
# interfere and no service starts. The env-file cases below are the exception —
# see the ordering note.
#
# The broken-input matrix is split by role into three scenarios that molecule runs
# in parallel: this one (decdn_node), ../validation-alloy (grafana_alloy) and
# ../validation-sponsord (sponsord and sponsord_onramp). Each has its own container,
# tracker and final tally, so a tag counts only in the scenario whose case records it.
#
# The rescue records a case as "rejected" ONLY when the failing task is the SPECIFIC
# assert that case targets (matched on ansible_failed_task.name — mostly the role's
# "Validate optional ..." family, plus the two secret-source gates). That is what
# makes this a real regression guard: if a bad value slipped PAST validation, the
# role would run on and fail later at a differently-named task (e.g. the keystore
# gate) — which is NOT counted, so the final assert catches the miss.
#
# The env-file cases touch host state on purpose: "env-extra" and "env-content"
# stage a host-provisioned /etc/decdn/decdn.env (it has to exist for their gates to
# fire) and remove it again, so they must run AFTER "env-gate", which proves the
# absent-file case still fails.
#
# ONE case is deliberately different: the final "config-gate" case has a valid
# config and has to reach the END of the role, because what it proves is that the
# post-template `decdn config validate` gate still fails the deploy. It therefore
# mutates the host, which is why this scenario has a prepare.yml staging wallet
# material. It runs LAST, after every assert-only case, so it cannot interfere with
# them.
- name: Converge (expect validation failures)
  hosts: all
  become: true
  vars:
    stub_bin: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/default/files/decdn-node-stub"
    # The controller's temp dir, named explicitly so the binary-* cases' tempdirs
    # and the sweep for leaked ones look in the same place.
    _decdn_ctl_tmp: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) }}"
    # Valid baseline so execution reaches the OPTIONAL-knob asserts (required-var
    # asserts all pass); each case below overrides exactly one optional knob.
    decdn_node_install_method: manual
    decdn_node_manual_bin_src: "{{ stub_bin }}"
    decdn_cli_manual_bin_src: "{{ stub_bin }}"
    decdn_rpc_url: "https://rpc.example.invalid/"
    decdn_region: "US"
    decdn_payment_pool_address: "0x1111111111111111111111111111111111111111"
    decdn_capacity_bond_address: "0x2222222222222222222222222222222222222222"
    decdn_slash_judge_address: "0x3333333333333333333333333333333333333333"
    # REQUIRED upstream (ADR 011/031) — the role asserts it with the other three.
    decdn_content_blacklist_address: "0x4444444444444444444444444444444444444444"
  tasks:
    - name: Initialize the rejected-by-validation tracker
      ansible.builtin.set_fact:
        decdn_rejected: []

    # --- Case: cross-field (the regression guard for the effective-value fix) ------
    # A raised eviction target with high-water left UNSET (resolves to 90). The
    # eviction hysteresis gap is STRUCTURAL upstream — target must be <= high-water
    # MINUS 5 — so 88 is rejected even though it is plainly less than 90. That
    # margin is exactly what a naive `<` comparison would let through.
    - name: "Case cross-field — eviction target inside the structural hysteresis gap"
      block:
        - name: Run decdn_node with eviction_target_pct within 5 of the default high-water
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_eviction_target_pct: 88
      rescue:
        - name: Record cross-field rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['cross-field'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: binary-format (dir-mode ships a non-ELF binary) --------------------
    # decdn_release_target_dir mode validates on the CONTROL MACHINE that the resolved
    # binaries are ELF for decdn_node_target before shipping them. Point it at a dir
    # holding the (non-ELF Python) stub named as the two binaries and confirm the
    # format assert rejects it — the "built a macOS Mach-O and shipped it" guard.
    # Staged + validated on the controller (delegate_to: localhost), so it aborts
    # before any host mutation, like the other assert-only cases.
    # The staging root is a fresh tempdir, not a fixed path under the project dir,
    # which every run from this checkout shares: one run's `always:` cleanup could
    # delete another's pair mid-case. (MOLECULE_EPHEMERAL_DIRECTORY would not help:
    # without --parallel molecule keys it on the project dir's basename and the
    # scenario, so it is shared across runs and same-named worktrees too.)
    # Created OUTSIDE the block so a controller-side failure here stops the play
    # with its own error instead of being swallowed by `rescue:` and reported by
    # the final tally as a validation regression.
    # An interrupted run (Ctrl-C, CI timeout) never reaches `always:`, so its
    # tempdir outlives it. Sweep ones older than a day: far longer than any run,
    # so a concurrent run's live pair is never touched.
    - name: Find staging roots leaked by interrupted runs
      ansible.builtin.find:
        paths: "{{ _decdn_ctl_tmp }}"
        patterns: ["decdn-molecule-badbin.*", "decdn-molecule-checkbin.*"]
        file_type: directory
        age: 1d
      register: _decdn_leaked_tmp
      delegate_to: localhost
      become: false

    - name: Remove staging roots leaked by interrupted runs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _decdn_leaked_tmp.files }}"
      loop_control:
        label: "{{ item.path }}"
      delegate_to: localhost
      become: false

    - name: Create a per-run staging root on the control machine (binary-format)
      ansible.builtin.tempfile:
        state: directory
        path: "{{ _decdn_ctl_tmp }}"
        prefix: decdn-molecule-badbin.
      register: _decdn_badbin_tmp
      delegate_to: localhost
      become: false

    - name: "Case binary-format — dir-mode resolves a non-ELF binary"
      vars:
        _decdn_badbin_dir: "{{ _decdn_badbin_tmp.path }}/target/release"
      block:
        - name: Create the staging directory on the control machine
          ansible.builtin.file:
            path: "{{ _decdn_badbin_dir }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false
        - name: Stage a non-ELF binary pair on the control machine
          ansible.builtin.copy:
            src: "{{ stub_bin }}"
            dest: "{{ _decdn_badbin_dir }}/{{ item }}"
            mode: "0755"
          loop: [decdn-node, decdn]
          delegate_to: localhost
          become: false
        - name: Run decdn_node pointed at the non-ELF target dir
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_node_manual_bin_src: ""
            decdn_cli_manual_bin_src: ""
            decdn_release_target_dir: "{{ _decdn_badbin_dir }}"
      rescue:
        - name: Record binary-format rejection (only if the ELF assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['binary-format'] }}"
          when: ansible_failed_task.name is match('^Require both binaries to be ELF')
      always:
        - name: Remove the staged non-ELF binaries
          ansible.builtin.file:
            path: "{{ _decdn_badbin_tmp.path }}"
            state: absent
          delegate_to: localhost
          become: false
        # The role's derive-paths set_fact left decdn_node_manual_bin_src pointing at
        # the (now-removed) badbin dir as a HOST FACT, which outranks the play var.
        # Reset the baseline so later cases — notably config-gate, which reaches the
        # copy step and does NOT re-pass the path — resolve the stub again.
        - name: Restore the baseline binary sources for the remaining cases
          ansible.builtin.set_fact:
            decdn_node_manual_bin_src: "{{ stub_bin }}"
            decdn_cli_manual_bin_src: "{{ stub_bin }}"
            decdn_release_target_dir: ""

    # A read-only `file -b` probe must still execute under --check. Before this
    # regression guard it was skipped and the following ELF assert saw stdout="".
    # Per-run tempdir, created outside the block, for the same reasons as
    # binary-format above.
    - name: Create a per-run check-mode root on the control machine (binary-check-mode)
      ansible.builtin.tempfile:
        state: directory
        path: "{{ _decdn_ctl_tmp }}"
        prefix: decdn-molecule-checkbin.
      register: _decdn_checkbin_tmp
      delegate_to: localhost
      become: false

    - name: "Case binary-check-mode — dir-mode format probe runs during dry-run"
      vars:
        _decdn_check_dir: "{{ _decdn_checkbin_tmp.path }}/target/release"
      block:
        - name: Create the check-mode binary directory on the control machine
          ansible.builtin.file:
            path: "{{ _decdn_check_dir }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        - name: Stage a valid ELF pair for the check-mode probe
          ansible.builtin.copy:
            src: /bin/true
            dest: "{{ _decdn_check_dir }}/{{ item }}"
            mode: "0755"
          loop: [decdn-node, decdn]
          delegate_to: localhost
          become: false

        # Host facts, not include_role vars: include vars outrank the role's own
        # set_fact that derives these paths, leaving them empty at the file probe.
        - name: Activate dir-mode facts for the check-mode probe
          ansible.builtin.set_fact:
            decdn_node_manual_bin_src: ""
            decdn_cli_manual_bin_src: ""
            decdn_release_target_dir: "{{ _decdn_check_dir }}"
            decdn_rpc_url: ""

        - name: Dry-run decdn_node in manual dir-mode
          check_mode: true
          block:
            - name: Include decdn_node under check mode
              ansible.builtin.include_role:
                name: decdn_node
      rescue:
        - name: Record binary check-mode success at the next expected gate
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['binary-check-mode'] }}"
          when: ansible_failed_task.name is match('^Require an RPC endpoint')
      always:
        - name: Remove the check-mode binary fixture
          ansible.builtin.file:
            path: "{{ _decdn_checkbin_tmp.path }}"
            state: absent
          delegate_to: localhost
          become: false
        - name: Restore binary-source facts after the check-mode probe
          ansible.builtin.set_fact:
            decdn_node_manual_bin_src: "{{ stub_bin }}"
            decdn_cli_manual_bin_src: "{{ stub_bin }}"
            decdn_release_target_dir: ""
            decdn_rpc_url: "https://rpc.example.invalid/"

    # --- Case: arch-mismatch (explicit triple for the wrong architecture) --------
    # decdn_node_target is derived from the host's facts; an explicit value naming
    # the OTHER architecture would ship binaries the node cannot exec. Release mode
    # so the triple is consulted; the assert fires before any download.
    - name: "Case arch-mismatch — explicit target triple for the other architecture"
      block:
        - name: Run decdn_node with a target triple that does not match the host
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_node_install_method: release
            decdn_node_version: "0.0.0"
            decdn_node_target: >-
              {{ 'x86_64-unknown-linux-gnu'
                 if ansible_facts.architecture == 'aarch64'
                 else 'aarch64-unknown-linux-gnu' }}
      rescue:
        - name: Record arch-mismatch rejection (only if the arch assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['arch-mismatch'] }}"
          when: ansible_failed_task.name is match('^Require the target triple to match')

    # --- Case: network-unknown / network-chain (decdn_network profile guards) -----
    - name: "Case network-unknown — decdn_network names no known deployment"
      block:
        - name: Run decdn_node with an unknown network profile
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_network: arbitrum-mainnet-typo
      rescue:
        - name: Record network-unknown rejection (only if the network assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['network-unknown'] }}"
          when: ansible_failed_task.name is match('^Require a known decdn_network')

    # An inventory chain_id for another chain would pair that chain with this
    # profile's addresses; the profile guard refuses it.
    - name: "Case network-chain — chain_id disagrees with the network profile"
      block:
        - name: Run decdn_node with a profile and a foreign chain_id
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_network: arbitrum-sepolia
            decdn_chain_id: 1
      rescue:
        - name: Record network-chain rejection (only if the chain_id assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['network-chain'] }}"
          when: ansible_failed_task.name is match('^Require chain_id to match the network profile')

    # --- Lifecycle entry points (tasks_from: backup / decommission) --------------
    # Each fails at its settings or path asserts, before anything on the host is
    # touched. A pasted private key must never reach the host's recipients file.
    - name: "Case backup-secret-key — an age SECRET key pasted as a recipient"
      block:
        - name: Run decdn_node for case backup-secret-key
          ansible.builtin.include_role:
            name: decdn_node
            tasks_from: backup
          vars:
            decdn_backup_age_recipients: ["AGE-SECRET-KEY-1QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ"]
      rescue:
        - name: Record backup-secret-key rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['backup-secret-key'] }}"
          when: ansible_failed_task.name is match('^Validate the backup settings')

    - name: "Case backup-bare-string — recipients given as a bare string, not a list"
      block:
        - name: Run decdn_node for case backup-bare-string
          ansible.builtin.include_role:
            name: decdn_node
            tasks_from: backup
          vars:
            decdn_backup_age_recipients: "age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"
      rescue:
        - name: Record backup-bare-string rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['backup-bare-string'] }}"
          when: ansible_failed_task.name is match('^Validate the backup settings')

    - name: "Case backup-empty — no recipients"
      block:
        - name: Run decdn_node for case backup-empty
          ansible.builtin.include_role:
            name: decdn_node
            tasks_from: backup
          vars:
            decdn_backup_age_recipients: []
      rescue:
        - name: Record backup-empty rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['backup-empty'] }}"
          when: ansible_failed_task.name is match('^Validate the backup settings')

    - name: "Case path-cache-home — cache dir is the data dir (backup)"
      block:
        - name: Run decdn_node for case path-cache-home
          ansible.builtin.include_role:
            name: decdn_node
            tasks_from: backup
          vars:
            decdn_backup_age_recipients: ["age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"]
            decdn_cache_dir: /var/lib/decdn
      rescue:
        - name: Record path-cache-home rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['path-cache-home'] }}"
          when: ansible_failed_task.name is match('^Require the cache dir to hold no identity')

    - name: "Case path-backup-home — backup dir is the data dir"
      block:
        - name: Run decdn_node for case path-backup-home
          ansible.builtin.include_role:
            name: decdn_node
            tasks_from: backup
          vars:
            decdn_backup_age_recipients: ["age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"]
            decdn_backup_dir: /var/lib/decdn
      rescue:
        - name: Record path-backup-home rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['path-backup-home'] }}"
          when: ansible_failed_task.name is match('^Require the backup dir to stay clear')

    - name: "Case path-decommission-cache — cache dir encloses the keystore (decommission purge)"
      block:
        - name: Run decdn_node for case path-decommission-cache
          ansible.builtin.include_role:
            name: decdn_node
            tasks_from: decommission
          vars:
            decdn_decommission_confirm: "{{ ansible_play_hosts_all | sort | join(',') }}"
            decdn_decommission_purge_cache: true
            decdn_cache_dir: /var/lib
      rescue:
        - name: Record path-decommission-cache rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['path-decommission-cache'] }}"
          when: ansible_failed_task.name is match('^Require the cache dir to hold no identity')

    # --- Case: arch-unset (no facts / explicit empty triple) --------------------
    - name: "Case arch-unset — release mode with no resolvable target triple"
      block:
        - name: Run decdn_node for case arch-unset
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_node_install_method: release
            decdn_node_version: "0.0.0"
            decdn_node_target: ""
      rescue:
        - name: Record arch-unset rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['arch-unset'] }}"
          when: ansible_failed_task.name is match('^Require a supported target triple')

    # The network assert must run before the address asserts: with a typo'd
    # network and no explicit addresses, the error has to name the network.
    - name: "Case network-unknown-noaddr — typo'd network with no explicit addresses"
      block:
        - name: Run decdn_node for case network-unknown-noaddr
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_network: arbitrum-sepoila
            decdn_payment_pool_address: ""
            decdn_capacity_bond_address: ""
            decdn_slash_judge_address: ""
            decdn_content_blacklist_address: ""
      rescue:
        - name: Record network-unknown-noaddr rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['network-unknown-noaddr'] }}"
          when: ansible_failed_task.name is match('^Require a known decdn_network')

    # --- Case: range (numeric but below the daemon's minimum) ---------------------
    - name: "Case range — event_poll_interval_ms below 250"
      block:
        - name: Run decdn_node with event_poll below the daemon minimum
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_event_poll_interval_ms: 100
      rescue:
        - name: Record range rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['range'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: range-min1 (0 for a knob the daemon requires strictly positive) ----
    # 0 passes the non-negative shape assert, so only the ranges task can reject it.
    - name: "Case range-min1 — get_logs_max_block_span of 0"
      block:
        - name: Run decdn_node with a zero getLogs span ceiling
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_get_logs_max_block_span: 0
      rescue:
        - name: Record range-min1 rejection (only if the ranges assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['range-min1'] }}"
          when: ansible_failed_task.name is match('^Validate optional knob ranges the daemon rejects')

    # --- Case: shape (non-numeric string for an integer knob) ---------------------
    - name: "Case shape — non-numeric integer knob"
      block:
        - name: Run decdn_node with a non-numeric integer knob
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_gc_interval_sec: "12x"
      rescue:
        - name: Record shape rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['shape'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: bool (quoted non-boolean) ------------------------------------------
    - name: "Case bool — quoted non-boolean"
      block:
        - name: Run decdn_node with a quoted non-boolean
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_relay_foreign_namespaces: "yes"
      rescue:
        - name: Record bool rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['bool'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: list (uppercase pinned hash — upstream rejects uppercase) ----------
    - name: "Case list — uppercase pinned hash"
      block:
        - name: Run decdn_node with an uppercase pinned hash
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_pinned_hashes:
              - "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      rescue:
        - name: Record list rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['list'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: enum (a policy value outside the daemon's closed set) --------------
    - name: "Case enum — unknown eviction policy"
      block:
        - name: Run decdn_node with an unknown eviction policy
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_eviction_policy: "lfu"
      rescue:
        - name: Record enum rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['enum'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: dict (unknown key in a rate-limit table) ---------------------------
    # The template renders these tables from a fixed key list, so an unknown key is
    # SILENTLY DROPPED rather than rendered — the limit would stay at its default
    # with nothing in the diff to show for it. Only the assert catches this.
    - name: "Case dict — unknown key in a rate-limit table"
      block:
        - name: Run decdn_node with an unknown DHT rate-limit key
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_dht_rate_limit:
              per_peer_rate_per_second: 10.0
      rescue:
        - name: Record dict rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['dict'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: bounded-range (below a HARD floor the daemon errors on) ------------
    # tinylfu sketch_bytes has a 16384 floor, and it bites on the stock lru/always
    # policies too because the default serve_economics policy builds the same
    # sketch — so a below-floor value is a startup crash-loop on a config that
    # otherwise looks fine.
    - name: "Case bounded-range — tinylfu sketch below the hard floor"
      block:
        - name: Run decdn_node with an undersized tinylfu sketch
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_tinylfu_sketch_bytes: 8192
      rescue:
        - name: Record bounded-range rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['bounded-range'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: float (a non-numeric would `| float` to 0.0, disabling a limit) -----
    - name: "Case float — non-numeric rate limit"
      block:
        - name: Run decdn_node with a non-numeric float knob
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_security_per_source_rate_per_sec: "fast"
      rescue:
        - name: Record float rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['float'] }}"
          when: ansible_failed_task.name is match('^Validate optional')

    # --- Case: string (double-quote breaks the rendered TOML string) --------------
    - name: "Case string — user_agent containing a double-quote"
      block:
        - name: Run decdn_node with a quote in user_agent
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_cache_user_agent: 'bad"agent'
      rescue:
        - name: Record string rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['string'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    # The quote case above is caught by the character class alone, so it would still
    # pass with the old `$` anchor. This one pins `\Z`: a trailing newline renders a
    # raw newline inside the TOML basic string, and `$` matches just before it.
    - name: "Case string-newline — user_agent with a trailing newline"
      block:
        - name: Run decdn_node with a trailing newline in user_agent
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_cache_user_agent: "agent\n"
      rescue:
        - name: Record string-newline rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['string-newline'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    # --- Cases: otlp_endpoint grammar --------------------------------------------
    # Upstream resolves observability.otlp_endpoint as http://host:port ONLY (the
    # OTLP gRPC exporter has no TLS), so each class below is a daemon start-up
    # refusal the role has to catch first. One case per rejection class: without
    # them a later loosening of the pattern would re-admit an invalid endpoint with
    # the whole suite still green. The `otlp-*` strings are decdn_rejected tracker
    # tags, not knob names.
    #
    # Each rescue matches the EXACT task name rather than the `^Validate optional`
    # family (ten tasks share that prefix): these cases and the user_agent ones all
    # target one assert, so a prefix match would let a regression that fails that
    # assert unconditionally record every tag and "prove" guards that are broken.
    # (`block` takes no `loop`, so each class is its own case — same shape as above.)
    - name: "Case otlp-https — TLS scheme the gRPC exporter cannot speak"
      block:
        - name: Run decdn_node with an https otlp_endpoint
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "https://collector:4317"
      rescue:
        - name: Record otlp-https rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-https'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    - name: "Case otlp-noport — no collector port"
      block:
        - name: Run decdn_node with a portless otlp_endpoint
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "http://collector"
      rescue:
        - name: Record otlp-noport rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-noport'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    - name: "Case otlp-path — an OTLP/HTTP URL (port 4318, /v1/traces) is the wrong protocol"
      block:
        - name: Run decdn_node with a path-bearing otlp_endpoint
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "http://collector:4318/v1/traces"
      rescue:
        - name: Record otlp-path rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-path'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    # `user@host`, NOT `user:pass@host`, for two independent reasons: the latter is
    # rejected by the colon rule that otlp-colon already pins, so it would leave the
    # '@' exclusion untested — drop '@' from the host class and a credential-bearing
    # endpoint would render into the 0640 node.toml unnoticed — AND a `scheme://u:p@`
    # literal trips KICS's HIGH "Passwords And Secrets - Password in URL" query, which
    # fails `make security` in CI. Keep this fixture password-free.
    - name: "Case otlp-userinfo — credentials carried in the URL"
      block:
        - name: Run decdn_node with userinfo in otlp_endpoint
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "http://user@collector:4317"
      rescue:
        - name: Record otlp-userinfo rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-userinfo'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    # Only a bracketed IPv6 literal may carry a colon in the host. Unbracketed,
    # url::Url::parse upstream reads "bad:4317" as the port and refuses.
    - name: "Case otlp-colon — unbracketed extra colon in the host"
      block:
        - name: Run decdn_node with a multi-colon otlp_endpoint host
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "http://collector:bad:4317"
      rescue:
        - name: Record otlp-colon rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-colon'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    # An out-of-range port renders as VALID TOML, so the config-validate gate is the
    # only other thing that would catch it — and that gate is skipped in check mode.
    - name: "Case otlp-port — port above 65535"
      block:
        - name: Run decdn_node with an out-of-range otlp_endpoint port
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "http://collector:70000"
      rescue:
        - name: Record otlp-port rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-port'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    # A trailing newline would break the rendered TOML basic string. Python's `$`
    # matches before a final newline, so this case is what pins the `\Z` anchor.
    - name: "Case otlp-newline — trailing newline"
      block:
        - name: Run decdn_node with a trailing newline in otlp_endpoint
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_otlp_endpoint: "http://collector:4317\n"
      rescue:
        - name: Record otlp-newline rejection (only if a validation assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['otlp-newline'] }}"
          when: ansible_failed_task.name == 'Validate optional string knobs (user_agent, otlp_endpoint)'

    - name: "Case env-control-rpc — inventory RPC URL contains a tab"
      block:
        - name: Run decdn_node with control data in the inventory RPC URL
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            # Decode at runtime so the YAML source contains no literal tab (which
            # ansible-lint's no-tabs rule correctly rejects).
            decdn_rpc_url: "{{ 'aHR0cHM6Ly9ycGMuZXhhbXBsZS5pbnZhbGlkLwlzZWNyZXQ=' | b64decode }}"
      rescue:
        - name: Record inventory RPC control-character rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['env-control-rpc'] }}"
          when: ansible_failed_task.name == 'Validate the inventory RPC URL is one-line EnvironmentFile data'

    - name: "Case env-control-extra — extra environment value contains a tab"
      block:
        - name: Run decdn_node with control data in decdn_extra_env
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_extra_env:
              DECDN_MOLECULE_BAD: "{{ 'bGVmdAlyaWdodA==' | b64decode }}"
      rescue:
        - name: Record extra environment control-character rejection
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['env-control-extra'] }}"
          when: ansible_failed_task.name == 'Validate decdn_extra_env keys and values'

    # --- Case: no RPC endpoint anywhere (#39) -------------------------------------
    # decdn_rpc_url may now be empty — but ONLY when the operator has provisioned
    # /etc/decdn/decdn.env on the host. Nothing has staged that file yet at this
    # point in the play, so "empty and absent" must still fail loud. A regression
    # that relaxed the gate to "always optional" would start a daemon with no chain
    # endpoint. This case must run BEFORE the one below, which stages the file.
    - name: "Case env-gate — no rpc_url and no host-provisioned env file"
      block:
        - name: Run decdn_node with neither an inventory rpc_url nor a host env file
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_rpc_url: ""
      rescue:
        - name: Record env-gate rejection (only if the RPC gate failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['env-gate'] }}"
          when: ansible_failed_task.name is match('^Require an RPC endpoint')

    # --- Case: decdn_extra_env against a host-provisioned env file (#39) ----------
    # The role writes the env file ALL-OR-NOTHING from inventory, so extra_env with
    # an empty rpc_url would be silently dropped — the S3 origin would 403 hours
    # later with nothing in the deploy output to explain it. Must fail loud instead.
    - name: "Case env-extra — decdn_extra_env alongside a host-provisioned env file"
      block:
        - name: Stage a host-provisioned env file so the role takes the host path
          ansible.builtin.copy:
            dest: /etc/decdn/decdn.env
            content: "DECDN_RPC_URL=https://rpc.example.invalid/\n"
            mode: "0600"

        - name: Run decdn_node with extra_env but no rpc_url
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_rpc_url: ""
            decdn_extra_env:
              DECDN_MOLECULE_EXTRA: "would-be-silently-dropped"
      rescue:
        - name: Record env-extra rejection (only if the extra_env assert failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['env-extra'] }}"
          when: ansible_failed_task.name is match('^Reject decdn_extra_env')
      always:
        # Each env-file case owns its fixture end to end rather than relying on the
        # next case to tolerate what it left behind — the ordering dependency was
        # already implicit and a third case made it fragile.
        - name: Remove the staged env file so later cases start clean
          ansible.builtin.file:
            path: /etc/decdn/decdn.env
            state: absent

    # --- Case: a host env file with no usable DECDN_RPC_URL (#39) -----------------
    # The RPC gate accepts the host path on stat.exists ALONE, so this grep is the
    # only thing standing between a file that merely exists and a daemon started
    # with no chain endpoint. Without a case here, weakening the pattern (dropping
    # the value match, un-anchoring it) or neutering the report task's `when:`
    # would be an invisible regression — exactly what the config-gate case below
    # exists to prevent for its own gate. The staged file is commented out, which
    # is the realistic operator error (and `DECDN_RPC_URL= ` with only whitespace
    # must fail too — that is what the [^[:space:]] in the pattern buys).
    - name: "Case env-content — host env file carrying no usable DECDN_RPC_URL"
      block:
        - name: Stage a host env file whose DECDN_RPC_URL is commented out
          ansible.builtin.copy:
            dest: /etc/decdn/decdn.env
            content: |
              #DECDN_RPC_URL=https://rpc.example.invalid/
              DECDN_MOLECULE_OTHER=present
            mode: "0600"

        - name: Run decdn_node against an env file with no usable endpoint
          ansible.builtin.include_role:
            name: decdn_node
          vars:
            decdn_rpc_url: ""
      rescue:
        - name: Record env-content rejection (only if the content gate failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['env-content'] }}"
          when: ansible_failed_task.name is match('^Report a host-provisioned env file')
      always:
        - name: Remove the staged env file so later cases start clean
          ansible.builtin.file:
            path: /etc/decdn/decdn.env
            state: absent

    # --- Case: the config gate itself ---------------------------------------------
    # Every tuning-knob case above trips an Ansible assert before the host is
    # touched (env-extra is the exception — it stages a file first). This one
    # proves the last line of defence still works: `decdn config validate` runs
    # with `failed_when: false` and hands off to a separate `fail` task, so a
    # regression in that task's `when:` would silently turn the authoritative gate
    # into a no-op and start the daemon on an unvalidated config. The stub honours
    # a marker file to force a non-zero validate.
    - name: "Case config-gate — a rejected config must fail the deploy"
      block:
        # The role notifies `Restart decdn-node` when it writes the env file and
        # node.toml — both of which happen BEFORE the config gate. In production
        # the gate's failure aborts the play, so those handlers never flush. Here
        # the rescue below lets the play complete, so they do — and they would
        # fail on a unit that the aborted role never got as far as installing.
        # Pre-install it so the play can flush them, keeping this case about the
        # gate rather than about handler ordering.
        # A placeholder, not the role's own template: that template interpolates
        # role variables which are not in scope in this play. All the handler
        # needs is a unit it can restart.
        - name: Pre-install a placeholder unit so the pending handler can flush
          ansible.builtin.copy:
            dest: /etc/systemd/system/decdn-node.service
            mode: "0644"
            content: |
              [Unit]
              Description=placeholder for the molecule validation scenario
              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/true
              [Install]
              WantedBy=multi-user.target

        - name: Reload systemd so the placeholder unit is visible
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Force the stub's config validate to refuse
          ansible.builtin.copy:
            dest: /etc/decdn/stub-bad-config
            content: "molecule\n"
            mode: "0644"

        - name: Run decdn_node against a config the binary rejects
          ansible.builtin.include_role:
            name: decdn_node
      rescue:
        - name: Record config-gate rejection (only if the gate task failed)
          ansible.builtin.set_fact:
            decdn_rejected: "{{ decdn_rejected + ['config-gate'] }}"
          when: ansible_failed_task.name is match('^Report the config-validation failure')
      always:
        - name: Clear the forced-failure marker
          ansible.builtin.file:
            path: /etc/decdn/stub-bad-config
            state: absent

    # --- Install method + build-from-source inputs ---------------------------------
    # These asserts run before any other input is read, so the cases need no
    # baseline beyond the play's. The fake credentials are refused before use.
    - name: "Cases install-method / source-* — install method and source inputs"
      vars:
        _im_cases:
          - {tag: install-method, method: binary, task: Require a valid install method}
          - {tag: source-ref, method: source, ref: "", task: Require a git ref to build}
          - {tag: source-ref, method: source, ref: "  ", task: Require a git ref to build}
          - tag: source-repo
            method: source
            # kics-scan ignore-line
            repo: "https://user:token@github.com/decdn/decdn.git"
            task: Refuse credentials in the source repo URL
          - tag: source-repo
            method: source
            # kics-scan ignore-line
            repo: "user:token@github.com:decdn/decdn.git"
            task: Refuse credentials in the source repo URL
          # Accepted: an ssh deploy-key URL passes the credential check and fails
          # at the next assert (the bad jobs value) instead.
          - tag: source-repo-ssh-ok
            method: source
            repo: "ssh://git@github.com/decdn/decdn.git"
            jobs: "x"
            task: Validate decdn_node_source_build_jobs
          - {tag: source-jobs, method: source, jobs: "two", task: Validate decdn_node_source_build_jobs}
          - {tag: source-timeout, method: source, timeout: "0", task: Validate decdn_node_source_build_jobs}
      ansible.builtin.include_tasks: includes/install-method-case.yml
      loop: "{{ _im_cases }}"
      loop_control:
        loop_var: _im_case
        label: "{{ _im_case.tag }}"

    - name: Confirm every bad value was rejected by the role's own validation
      ansible.builtin.assert:
        that:
          # Keep duplicates: every case must contribute its own rejection. Deduping
          # lets one broken sibling hide behind another case that uses the same gate.
          - decdn_rejected | sort == _decdn_expected | sort
        fail_msg: >-
          decdn_node did not reject every bad value at its validation asserts.
          Expected {{ _decdn_expected | sort }}, got {{ decdn_rejected | sort }} —
          a missing tag means that bad value slipped past validation (it would reach
          the daemon/crash-loop it at config load, or ship credentials insecurely).
      vars:
        _decdn_expected:
          ["cross-field", "binary-format", "binary-check-mode", "arch-mismatch", "arch-unset", "network-unknown",
           "network-unknown-noaddr", "network-chain", "backup-secret-key", "backup-bare-string",
           "backup-empty", "path-cache-home", "path-backup-home", "path-decommission-cache", "range",
           "range-min1", "bounded-range", "shape", "bool",
           "enum", "dict", "float", "list", "string", "string-newline", "otlp-https",
           "otlp-noport", "otlp-path", "otlp-userinfo", "otlp-colon", "otlp-port",
           "otlp-newline", "env-control-rpc", "env-control-extra", "env-gate",
           "env-extra", "env-content", "config-gate",
           "install-method", "source-ref", "source-ref", "source-repo", "source-repo",
           "source-repo-ssh-ok", "source-jobs", "source-timeout"]
