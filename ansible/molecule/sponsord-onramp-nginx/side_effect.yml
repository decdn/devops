---
# Split from ../sponsord-onramp/side_effect.yml so the two run side by side; same
# converged host (that scenario's prepare, converge and verify, by path). What a green
# converge cannot prove about the role's proxy handling:
#   1. proxy "none": no client-IP header, the public URL as given, and a warning
#      that the role's nginx site is still enabled.
#   2. A broken upstream behind nginx fails the run.
#   3. The role never silently disables an nginx site it did not enable.
#   4. The Caddy the role ran before nginx is retired while it holds tcp/80
#      (stopped and disabled, nginx started in its place, its Caddyfile and state
#      gone); a Caddyfile someone else wrote is left alone.
#   5. ACME against a server that does not answer: lego's issuance fails the run,
#      while nginx keeps serving the HTTP-01 challenge and the https redirect, and
#      the renewal timer keeps running.
#   6. ACME with the certificate already issued for that server and domain: the
#      converge serves it over https without running lego, and leaves no force.
# The custom gate page and the Turnstile secret, which need no proxy change, run in
# ../sponsord-onramp-turnstile.
# Order matters: 1 leaves the host in proxy "none" mode and 2's first converge puts
# nginx back. Every later section converges back onto the self-signed certificate,
# so the host is left healthy on the role's own site for verify. Plays after the
# first reuse its facts (gather_facts: false).
- name: Side effect — bring your own proxy
  hosts: all
  become: true
  tasks:
    - name: Converge with proxy "none"
      ansible.builtin.include_role:
        name: sponsord_onramp
      vars:
        sponsord_onramp_proxy: none
        sponsord_onramp_public_url: https://downloads.molecule.test

    - name: Read the env file in proxy "none" mode
      ansible.builtin.slurp:
        src: /etc/sponsord/sponsord-onramp.env
      register: _or_none_env

    # With an arbitrary proxy in front, trusting X-Forwarded-For would let clients
    # pick the address the rate limits key on.
    - name: Require no client-IP header, the given public URL, and the stale-site warning
      ansible.builtin.assert:
        that:
          - "'ONRAMP_CLIENT_IP_HEADER' not in _env"
          - "'ONRAMP_PUBLIC_URL=https://downloads.molecule.test\n' in _env"
          - sponsord_onramp_stale_site.rc == 0
        fail_msg: "{{ _env }}"
      vars:
        _env: "{{ _or_none_env.content | b64decode }}"

- name: Side effect — a broken upstream behind nginx
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Converge back onto nginx
      ansible.builtin.include_role:
        name: sponsord_onramp

    # nginx pointed at a port nothing listens on: TLS works (self-signed), the
    # upstream answers 502, and that must fail the run.
    - name: Run the nginx tasks against a dead upstream
      block:
        - name: Point nginx at a port nothing listens on
          ansible.builtin.include_role:
            name: sponsord_onramp
            tasks_from: front
          vars:
            sponsord_onramp_port: 8099
            sponsord_onramp_readiness_retries: 2

        - name: Fail — the nginx probe let a dead upstream through
          ansible.builtin.fail:
            msg: The role finished although nginx could not reach the onramp.
      rescue:
        - name: Require the failure to come from the nginx probe report
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Report an onramp that is not reachable through nginx'
            fail_msg: >-
              Expected the nginx probe to fail the run, but it failed at
              "{{ ansible_failed_task.name }}".

    - name: Converge back onto the real upstream
      ansible.builtin.include_role:
        name: sponsord_onramp

- name: Side effect — an nginx site this role did not enable
  hosts: all
  become: true
  gather_facts: false
  vars:
    _or_foreign: /etc/nginx/sites-enabled/other
    _or_foreign_text: "server { listen 8081; server_name other.example; return 204; }\n"
  tasks:
    - name: Enable a site of someone else's
      ansible.builtin.copy:
        dest: "{{ _or_foreign }}"
        content: "{{ _or_foreign_text }}"
        mode: "0644"

    - name: Converge against the foreign site
      block:
        - name: Run the role beside a foreign site
          ansible.builtin.include_role:
            name: sponsord_onramp

        - name: Fail — the role deployed beside a site it did not enable
          ansible.builtin.fail:
            msg: The role finished although nginx served {{ _or_foreign }}.
      rescue:
        - name: Require the failure to come from the foreign-site refusal
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Refuse nginx sites this role did not enable'
            fail_msg: >-
              Expected the role to refuse the foreign site, but it failed at
              "{{ ansible_failed_task.name }}".

    - name: Read the foreign site after the refusal
      ansible.builtin.slurp:
        src: "{{ _or_foreign }}"
      register: _or_foreign_after

    - name: Require the foreign site untouched
      ansible.builtin.assert:
        that:
          - (_or_foreign_after.content | b64decode) == _or_foreign_text
        fail_msg: The refused run still changed {{ _or_foreign }}.

    - name: Remove the foreign site
      ansible.builtin.file:
        path: "{{ _or_foreign }}"
        state: absent

# No caddy package in the image: a stand-in unit plays the old Caddy, holding tcp/80
# as Caddy did, with nginx stopped. The purge of an absent package is a no-op.
- name: Side effect — the role's earlier Caddy is retired
  hosts: all
  become: true
  gather_facts: false
  vars:
    _or_caddyfile: /etc/caddy/Caddyfile
  tasks:
    - name: Stage the role's old Caddyfile, Caddy's state and a running caddy unit
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          mkdir -p /etc/caddy /var/lib/caddy/.local
          printf '# MANAGED BY the sponsord_onramp role — do not edit by hand.\nonramp.molecule.test {\n}\n' \
            > {{ _or_caddyfile }}
          printf '[Service]\nExecStart=/usr/bin/python3 -m http.server 80\n[Install]\nWantedBy=multi-user.target\n' \
            > /etc/systemd/system/caddy.service
          systemctl stop nginx
          systemctl daemon-reload
          systemctl enable --now caddy.service
          for _ in $(seq 50); do ss -Hltn 'sport = :80' | grep -q . && exit 0; sleep 0.2; done
          echo "the stand-in Caddy never bound tcp/80" >&2; exit 1
      changed_when: true

    - name: Converge with the role's Caddy in place
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the caddy unit and the Caddy files after the converge
      ansible.builtin.systemd_service:
        name: caddy
      register: _or_caddy_unit

    - name: Read nginx after the converge
      ansible.builtin.systemd_service:
        name: nginx
      register: _or_nginx_unit

    - name: Stat the Caddy files after the converge
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _or_caddy_files
      loop: ["{{ _or_caddyfile }}", /var/lib/caddy]

    - name: Require the role's Caddy stopped, disabled and its files gone
      ansible.builtin.assert:
        that:
          - _or_caddy_unit.status.ActiveState == 'inactive'
          - _or_caddy_unit.status.UnitFileState == 'disabled'
          - _or_caddy_files.results | selectattr('stat.exists') | list | length == 0
          - _or_nginx_unit.status.ActiveState == 'active'
        fail_msg: >-
          caddy is {{ _or_caddy_unit.status.ActiveState }}/{{ _or_caddy_unit.status.UnitFileState }};
          still present: {{ _or_caddy_files.results | selectattr('stat.exists') | map(attribute='item') | list }}

    - name: Stage a Caddyfile someone else wrote, with Caddy running
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          printf 'other.example {\n  respond "theirs"\n}\n' > {{ _or_caddyfile }}
          printf '[Service]\nExecStart=/bin/sleep infinity\n[Install]\nWantedBy=multi-user.target\n' \
            > /etc/systemd/system/caddy.service
          systemctl daemon-reload
          systemctl enable --now caddy.service
      changed_when: true

    - name: Converge beside the foreign Caddy
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the caddy unit beside the foreign Caddyfile
      ansible.builtin.systemd_service:
        name: caddy
      register: _or_caddy_foreign

    - name: Read the foreign Caddyfile after the converge
      ansible.builtin.slurp:
        src: "{{ _or_caddyfile }}"
      register: _or_caddyfile_foreign

    - name: Require a Caddy the role did not run left alone
      ansible.builtin.assert:
        that:
          - _or_caddy_foreign.status.ActiveState == 'active'
          - "'respond \"theirs\"' in (_or_caddyfile_foreign.content | b64decode)"
        fail_msg: The role touched a Caddy it did not run.

    - name: Remove the stand-in Caddy
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          systemctl disable --now caddy.service
          rm -rf /etc/systemd/system/caddy.service /etc/caddy
          systemctl daemon-reload
      changed_when: true

# No ACME server answers in a container: lego is installed for real (the pinned
# release, digest-verified), then its issuance against 127.0.0.1:14000 must fail
# the run at the issuance check, with nginx still serving tcp/80.
- name: Side effect — ACME against a server that does not answer
  hosts: all
  become: true
  gather_facts: false
  vars:
    # "staging" in the URL makes the role's https probe accept an untrusted
    # certificate, which the next play plants.
    _or_acme_server: https://127.0.0.1:14000/staging/dir
  tasks:
    - name: Converge on acme
      block:
        - name: Run the role against the dead ACME server
          ansible.builtin.include_role:
            name: sponsord_onramp
          vars:
            sponsord_onramp_tls: acme
            sponsord_onramp_acme_server: "{{ _or_acme_server }}"

        - name: Fail — the role finished without a certificate
          ansible.builtin.fail:
            msg: The role finished although lego could not obtain a certificate.
      rescue:
        - name: Require the failure to come from the issuance check
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Report a certificate lego could not obtain'
            fail_msg: >-
              Expected the issuance check to fail the run, but it failed at
              "{{ ansible_failed_task.name }}": {{ ansible_failed_result.msg | default('') }}

    - name: Read the lego unit's command line and the renewal timer
      ansible.builtin.command:
        argv: [systemctl, cat, sponsord-onramp-certs.service]
      register: _or_certs_unit
      changed_when: false

    - name: Read the renewal timer after the failed issuance
      ansible.builtin.systemd_service:
        name: sponsord-onramp-certs.timer
      register: _or_timer_failed

    # The deploy hook's arguments are what files/certs-deployed reads: the server
    # and domain it records, the record file and the force file it clears.
    - name: Require an HTTP-01 webroot issuance for the one name, and the timer running
      ansible.builtin.assert:
        that:
          - "'--http.webroot /var/www/sponsord-onramp-acme' in _or_certs_unit.stdout"
          - "'--domains onramp.molecule.test' in _or_certs_unit.stdout"
          - "'--dns' not in _or_certs_unit.stdout"
          - "'--email ops@molecule.test' in _or_certs_unit.stdout"
          - ('--server ' ~ _or_acme_server) in _or_certs_unit.stdout
          - >-
            ('--deploy-hook \"/usr/local/lib/sponsord-onramp/certs-deployed ' ~ _or_acme_server
             ~ ' onramp.molecule.test /var/lib/sponsord-onramp-acme/.issued-for'
             ~ ' /var/lib/sponsord-onramp-acme/force.env\"') in _or_certs_unit.stdout
          - _or_timer_failed.status.ActiveState == 'active'
          - _or_timer_failed.status.UnitFileState == 'enabled'
        fail_msg: "{{ _or_certs_unit.stdout }}"

    # What the ACME server would fetch: a token lego wrote, served on tcp/80 under
    # the domain, readable by nginx's unprivileged workers.
    - name: Write a challenge token the way lego would
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          umask 022
          printf 'molecule-key-auth' > /var/www/sponsord-onramp-acme/.well-known/acme-challenge/molecule-token
      changed_when: true

    - name: Fetch the challenge through nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/.well-known/acme-challenge/molecule-token
        headers:
          Host: onramp.molecule.test
        return_content: true
      register: _or_challenge

    - name: Probe the https redirect without a certificate
      ansible.builtin.uri:
        url: http://127.0.0.1/healthz
        headers:
          Host: onramp.molecule.test
        follow_redirects: none
        status_code: 301
      register: _or_redirect

    - name: Require the challenge served and the redirect intact
      ansible.builtin.assert:
        that:
          - _or_challenge.content == 'molecule-key-auth'
          - _or_redirect.location == 'https://onramp.molecule.test/healthz'
        fail_msg: >-
          challenge {{ _or_challenge.content | default('') }},
          redirect {{ _or_redirect.location | default('') }}

    - name: Remove the challenge token
      ansible.builtin.file:
        path: /var/www/sponsord-onramp-acme/.well-known/acme-challenge/molecule-token
        state: absent

    # What a successful issuance leaves (lego's files and the deploy hook's record),
    # planted: the converge must serve it without running lego (the dead server would
    # fail the run) and without forcing a reissue.
    - name: Plant a certificate issued for this server and domain
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          d=/var/lib/sponsord-onramp-acme
          install -d -m 0700 "$d/certificates"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 \
            -subj /CN=onramp.molecule.test -addext subjectAltName=DNS:onramp.molecule.test \
            -keyout "$d/certificates/sponsord-onramp.key" -out "$d/certificates/sponsord-onramp.crt" 2>/dev/null
          printf '%s onramp.molecule.test\n' '{{ _or_acme_server }}' > "$d/.issued-for"
      changed_when: true

    - name: Read when lego last ran
      ansible.builtin.command:
        argv: [systemctl, show, -P, ExecMainStartTimestampMonotonic, sponsord-onramp-certs.service]
      register: _or_lego_before
      changed_when: false

    - name: Converge on acme with the certificate in place
      ansible.builtin.include_role:
        name: sponsord_onramp
      vars:
        sponsord_onramp_tls: acme
        sponsord_onramp_acme_server: "{{ _or_acme_server }}"

    - name: Read when lego last ran, after the converge
      ansible.builtin.command:
        argv: [systemctl, show, -P, ExecMainStartTimestampMonotonic, sponsord-onramp-certs.service]
      register: _or_lego_after
      changed_when: false

    - name: Read the site and the force file with the certificate in place
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/sponsord-onramp
      register: _or_acme_site

    - name: Stat the force file
      ansible.builtin.stat:
        path: /var/lib/sponsord-onramp-acme/force.env
      register: _or_force

    - name: Require the issued certificate served, lego not run and nothing forced
      ansible.builtin.assert:
        that:
          - _or_lego_after.stdout == _or_lego_before.stdout
          - "'ssl_certificate /var/lib/sponsord-onramp-acme/certificates/sponsord-onramp.crt;' in _site"
          - "'No certificate yet' not in _site"
          - not _or_force.stat.exists
        fail_msg: >-
          lego ran at {{ _or_lego_before.stdout }} -> {{ _or_lego_after.stdout }};
          force file {{ _or_force.stat.exists }}; site: {{ _site }}
      vars:
        _site: "{{ _or_acme_site.content | b64decode }}"

    - name: Converge back onto the self-signed certificate
      ansible.builtin.include_role:
        name: sponsord_onramp

    - name: Read the renewal timer after the switch back
      ansible.builtin.systemd_service:
        name: sponsord-onramp-certs.timer
      register: _or_timer

    - name: Require the renewal timer stopped and disabled under self-signed
      ansible.builtin.assert:
        that:
          - _or_timer.status.ActiveState == 'inactive'
          - _or_timer.status.UnitFileState == 'disabled'
        fail_msg: "{{ _or_timer.status.ActiveState }}/{{ _or_timer.status.UnitFileState }}"
