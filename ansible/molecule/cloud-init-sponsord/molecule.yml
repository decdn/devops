---
# Boots the REAL cloud-init/user-data-sponsord.yaml (a sponsor host: sponsord, then
# sponsord-onramp behind Caddy) in a systemd container, following the "Sponsor host"
# walkthrough in cloud-init/README.md. Built from ../cloud-init/pack.yml and
# ../cloud-init/includes/, so the boot plumbing is the node scenario's; this one covers
# what differs:
#   prepare     cloud-init and the repo (as ../cloud-init), shared mount propagation
#               (as ../sponsord), and a signed loopback mirror holding one v* release
#               of the shared stubs (sponsord and sponsord-onramp, as upstream ships
#               them).
#   converge    seeds the template (placeholders filled; release bases, keyrings and
#               Caddy's `tls internal` pointed at local ones) and boots. Asserts the
#               host stopped at the secret gate with all four sponsor secrets listed.
#   side_effect refuses an inventory with localhost in neither base group, and one
#               with the onramp outside sponsord_hosts (stage 2's checks, each
#               recording "failed"). Then writes only sponsord's three secrets and
#               re-runs: the gate must still hold, now for the Turnstile secret alone.
#               Then writes it, moves DEVOPS_REF to a tag, and re-runs.
#   verify      both services and Caddy running from the signed releases, the API
#               token generated on the host, https through Caddy, no hint left.
#
# The release download and verify path of sponsord-onramp runs here and nowhere else
# in the suite (../validation-sponsord sets its release mode, but stops at its
# asserts); sponsord's also runs in ../sponsord-install.
#
# One platform: Ubuntu 26.04, the newest supported release, so systemd >= 255 (which
# writes credentials 0440, see roles/sponsord/README.md) and Caddy from universe. The
# controller-Python bracket and stage 1's refusals are ../cloud-init's job.
#
# Coverage boundary: `baseline` is skipped through bootstrap.sh's test-only switch, as
# in ../cloud-init, so the tcp/80 + tcp/443 holes are pinned by tests/firewall-holes
# (make test-scripts), not here.
#
# The stages need network access: apt (the user-data's packages, Caddy), PyPI and Galaxy.
driver:
  name: docker
platforms:
  - name: decdn-cloud-init-sponsord-u2604
    # Same digest as ../cloud-init's Ubuntu 26.04 platform; bump them together.
    image: geerlingguy/docker-ubuntu2604-ansible@sha256:a81f2af83a18b609eabdc926d56bc4813d3d7558d60dc891db6056f868fe6054
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    # See ../default/molecule.yml for why pipelining is on.
    ANSIBLE_PIPELINING: "true"
verifier:
  name: ansible
scenario:
  test_sequence:
    # Leading destroy: see ../default/molecule.yml. No idempotence step: converge boots
    # cloud-init once, which is what a first boot does.
    - destroy
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - destroy
