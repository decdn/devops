---
# The operator's part, as the "Sponsor host" walkthrough in cloud-init/README.md tells it:
#   1. Write sponsord's three secrets only, and re-run. The onramp's Turnstile secret is
#      still missing, so the run must stop at the gate again, listing just that file:
#      the gate covers every group the host is in, not only the first.
#   2. Write the Turnstile secret, move DEVOPS_REF to a tag on a newer commit (the
#      upgrade path), and re-run for the whole playbook. The values are placeholders:
#      the stubs never dial the RPC URL or Cloudflare.
- name: Side effect — the secrets, in two steps
  hosts: all
  become: true
  vars:
    env_file: /etc/decdn-bootstrap/bootstrap.env
  tasks:
    - name: Create /etc/sponsord
      ansible.builtin.file:
        path: /etc/sponsord
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write sponsord's secrets on the host
      ansible.builtin.copy:
        dest: "/etc/sponsord/{{ item.name }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - {name: treasury-keystore.json, content: "{{ '{}' }}\n"}
        - {name: treasury-password, content: "molecule-placeholder\n"}
        - {name: secret.env, content: "SPONSORD_RPC_URL=https://rpc.example.invalid/v2/molecule\n"}
      loop_control:
        label: "{{ item.name }}"

    - name: Re-run the bootstrap without the Turnstile secret
      ansible.builtin.command:
        cmd: /usr/local/sbin/decdn-bootstrap
      register: partial
      changed_when: true
      failed_when: false

    - name: Read the state after the partial re-run
      ansible.builtin.slurp:
        src: /var/lib/decdn-bootstrap/state
      register: partial_state

    - name: Read the list of missing secrets after the partial re-run
      ansible.builtin.slurp:
        src: /var/lib/decdn-bootstrap/awaiting
      register: partial_awaiting

    - name: Stat the daemon (not installed while any secret is missing)
      ansible.builtin.stat:
        path: /usr/local/bin/sponsord
      register: partial_bin

    - name: Assert the gate still holds, for the Turnstile secret alone
      ansible.builtin.assert:
        that:
          - partial.rc == 0
          - partial_state.content | b64decode | trim == 'awaiting-secret'
          - partial_awaiting.content | b64decode | split | list == ['/etc/sponsord/turnstile-secret']
          - partial.stdout is search('Cloudflare Turnstile secret')
          - partial.stdout is not search('treasury wallet')
          - not partial_bin.stat.exists
        fail_msg: >-
          rc={{ partial.rc }} state={{ partial_state.content | b64decode | trim }}
          awaiting={{ partial_awaiting.content | b64decode | to_json }}
          sponsord installed={{ partial_bin.stat.exists }}
          output={{ (partial.stdout_lines[-30:] + partial.stderr_lines) | to_json }}

    - name: Write the Turnstile secret on the host
      ansible.builtin.copy:
        dest: /etc/sponsord/turnstile-secret
        content: "1x0000000000000000000000000000000AA\n"
        owner: root
        group: root
        mode: "0600"

    - name: Read the working bootstrap.env
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: good_env

    - name: Pin the tag on the newer commit (the upgrade path)
      ansible.builtin.copy:
        dest: "{{ env_file }}"
        content: >-
          {{ good_env.content | b64decode
             | regex_replace('(?m)^DEVOPS_REF=.*$', 'DEVOPS_REF=v0.0.0-molecule') }}
        owner: root
        group: root
        mode: "0600"

    - name: Re-run the bootstrap
      ansible.builtin.command:
        cmd: /usr/local/sbin/decdn-bootstrap
      register: rerun
      changed_when: true
      failed_when: false

    - name: Fail with the bootstrap's output
      ansible.builtin.fail:
        msg: "{{ rerun.stdout_lines[-60:] + rerun.stderr_lines }}"
      when: rerun.rc != 0
