---
# The release install path against a local mirror. The header of molecule.yml lists
# what each step proves.
- name: Side effect — release install from a local mirror
  hosts: all
  become: true
  vars:
    _ids_project: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    _ids_mirror: /srv/iroh-dns-server-mirror
    _ids_base: http://127.0.0.1:8081
    _ids_stamp: /usr/local/lib/iroh-dns-server/installed-version
    _ids_good: 0.0.0-molecule-stub     # what the stub reports on /healthz
    _ids_other: 0.0.0-molecule-other   # a release whose server reports _ids_good
    _ids_targets:
      x86_64: x86_64-unknown-linux-gnu
      aarch64: aarch64-unknown-linux-gnu
    _ids_target: "{{ _ids_targets[ansible_facts['architecture']] }}"
  tasks:
    - name: Create the mirror's release directories
      ansible.builtin.file:
        path: "{{ _ids_mirror }}/{{ item }}/x"
        state: directory
        mode: "0755"
      loop: ["v{{ _ids_good }}", "v{{ _ids_other }}"]

    - name: Stage the stub as each release's binary
      ansible.builtin.copy:
        src: "{{ _ids_project }}/molecule/iroh-dns-server/files/iroh-dns-server-stub"
        dest: "{{ _ids_mirror }}/{{ item }}/x/iroh-dns-server"
        mode: "0755"
      loop: ["v{{ _ids_good }}", "v{{ _ids_other }}"]

    # One flat binary at the archive root, as upstream's tarballs.
    - name: Pack each release as upstream names it
      ansible.builtin.command:
        argv: [tar, -C, "{{ _ids_mirror }}/v{{ item }}/x", -czf,
               "{{ _ids_mirror }}/v{{ item }}/iroh-dns-server-v{{ item }}-{{ _ids_target }}.tar.gz", ./iroh-dns-server]
        creates: "{{ _ids_mirror }}/v{{ item }}/iroh-dns-server-v{{ item }}-{{ _ids_target }}.tar.gz"
      loop: ["{{ _ids_good }}", "{{ _ids_other }}"]

    - name: Hash the releases and the stub binary
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      register: _ids_sums
      loop:
        - "{{ _ids_mirror }}/v{{ _ids_good }}/iroh-dns-server-v{{ _ids_good }}-{{ _ids_target }}.tar.gz"
        - "{{ _ids_mirror }}/v{{ _ids_other }}/iroh-dns-server-v{{ _ids_other }}-{{ _ids_target }}.tar.gz"
        - "{{ _ids_mirror }}/v{{ _ids_good }}/x/iroh-dns-server"

    - name: Name the digests
      ansible.builtin.set_fact:
        _ids_good_sha: "{{ _ids_sums.results[0].stat.checksum }}"
        _ids_other_sha: "{{ _ids_sums.results[1].stat.checksum }}"
        _ids_bin_sha: "{{ _ids_sums.results[2].stat.checksum }}"

    - name: Serve the mirror on loopback
      ansible.builtin.command:
        argv: [systemd-run, --unit=molecule-dns-mirror, --collect, python3, -m, http.server, "8081",
               --bind, 127.0.0.1, --directory, "{{ _ids_mirror }}"]
      changed_when: true

    - name: Wait for the mirror
      ansible.builtin.wait_for:
        port: 8081
        host: 127.0.0.1
        timeout: 15

    # --- a wrong pin --------------------------------------------------------------------
    - name: Install with a wrong sha256 pin
      block:
        - name: Run the role in release mode with a wrong digest
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: release
            iroh_dns_server_release_base: "{{ _ids_base }}"
            iroh_dns_server_version: "{{ _ids_good }}"
            iroh_dns_server_sha256: "{{ {_ids_target: '0' * 64} }}"

        - name: Fail — a release with the wrong digest was installed
          ansible.builtin.fail:
            msg: The role finished although the tarball did not match its pin.
      rescue:
        - name: Require the download's checksum to be what failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Download the release tarball and verify its sha256'
            fail_msg: "Failed at '{{ ansible_failed_task.name }}', not the pinned download."

    - name: Stat the stamp after the refused download
      ansible.builtin.stat:
        path: "{{ _ids_stamp }}"
      register: _ids_stamp_bad

    - name: Require no stamp after the refused download
      ansible.builtin.assert:
        that:
          - not _ids_stamp_bad.stat.exists
        fail_msg: A tarball that failed its pin left an install stamp.

    # --- the right pin ------------------------------------------------------------------
    - name: Install the pinned release
      ansible.builtin.include_tasks: includes/install-good.yml

    # --- a pin changed without a version bump -------------------------------------------
    # The stamp records the pin, so a changed pin is downloaded and checked again
    # rather than trusted on the version alone (here it does not match: refused).
    - name: Re-run with the pin changed and the version unchanged
      block:
        - name: Run the role with the same version and another digest
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: release
            iroh_dns_server_release_base: "{{ _ids_base }}"
            iroh_dns_server_version: "{{ _ids_good }}"
            iroh_dns_server_sha256: "{{ {_ids_target: '1' * 64} }}"

        - name: Fail — a changed pin was trusted on the old stamp
          ansible.builtin.fail:
            msg: The role finished although the pin changed and the tarball no longer matches it.
      rescue:
        - name: Require the re-download's checksum to be what failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Download the release tarball and verify its sha256'
            fail_msg: "Failed at '{{ ansible_failed_task.name }}', not the pinned download."

    # --- the mirror down: nothing to download -------------------------------------------
    - name: Stop the mirror
      ansible.builtin.systemd_service:
        name: molecule-dns-mirror
        state: stopped

    - name: Re-run the release install with the mirror down
      ansible.builtin.include_role:
        name: iroh_dns_server
      vars:
        iroh_dns_server_install_method: release
        iroh_dns_server_release_base: "{{ _ids_base }}"
        iroh_dns_server_version: "{{ _ids_good }}"
        iroh_dns_server_sha256: "{{ {_ids_target: _ids_good_sha} }}"

    # --- the binary replaced in place -----------------------------------------------------
    - name: Replace the installed binary with other bytes, same version string
      ansible.builtin.lineinfile:
        path: /usr/local/bin/iroh-dns-server
        line: "# replaced in place by molecule"

    - name: Serve the mirror again
      ansible.builtin.command:
        argv: [systemd-run, --unit=molecule-dns-mirror, --collect, python3, -m, http.server, "8081",
               --bind, 127.0.0.1, --directory, "{{ _ids_mirror }}"]
      changed_when: true

    - name: Wait for the mirror again
      ansible.builtin.wait_for:
        port: 8081
        host: 127.0.0.1
        timeout: 15

    - name: Re-install over the replaced binary
      ansible.builtin.include_tasks: includes/install-good.yml

    # --- a release whose server reports another version -----------------------------------
    # The binary has no --version: the gate reads the version on /healthz, once the
    # server runs, and the stamp is written only after that.
    - name: Install a release that does not report its pinned version
      block:
        - name: Run the role pinned to a version the server does not report
          ansible.builtin.include_role:
            name: iroh_dns_server
          vars:
            iroh_dns_server_install_method: release
            iroh_dns_server_release_base: "{{ _ids_base }}"
            iroh_dns_server_version: "{{ _ids_other }}"
            iroh_dns_server_sha256: "{{ {_ids_target: _ids_other_sha} }}"
            iroh_dns_server_readiness_retries: 3

        - name: Fail — the gate let a mismatched version through
          ansible.builtin.fail:
            msg: The role finished although the server does not report the pinned version.
      rescue:
        - name: Require the readiness gate to be what failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require iroh-dns-server to be up on all its listeners'
            fail_msg: "Failed at '{{ ansible_failed_task.name }}', not the readiness gate's version check."

    - name: Stat the stamp after the mismatched version
      ansible.builtin.stat:
        path: "{{ _ids_stamp }}"
      register: _ids_stamp_other

    - name: Require no stamp vouching for the mismatched binary
      ansible.builtin.assert:
        that:
          - not _ids_stamp_other.stat.exists
        fail_msg: A release that failed the version check left an install stamp.

    # Leave the server release-installed for verify.
    - name: Install the pinned release once more
      ansible.builtin.include_tasks: includes/install-good.yml

    - name: Stop the mirror for good
      ansible.builtin.systemd_service:
        name: molecule-dns-mirror
        state: stopped
