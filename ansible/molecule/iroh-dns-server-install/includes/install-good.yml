---
# Install the good release from the mirror and check the binary and the stamp.
- name: Run the role in release mode with the right digest
  ansible.builtin.include_role:
    name: iroh_dns_server
  vars:
    iroh_dns_server_install_method: release
    iroh_dns_server_release_base: "{{ _ids_base }}"
    iroh_dns_server_version: "{{ _ids_good }}"
    iroh_dns_server_sha256: "{{ {_ids_target: _ids_good_sha} }}"

- name: Hash the installed binary
  ansible.builtin.stat:
    path: /usr/local/bin/iroh-dns-server
    checksum_algorithm: sha256
  register: _ids_installed

- name: Read the install stamp
  ansible.builtin.slurp:
    src: "{{ _ids_stamp }}"
  register: _ids_stamp_good

- name: Require the release's binary, stamped with its version, target, pin and checksum
  ansible.builtin.assert:
    that:
      - _ids_installed.stat.checksum == _ids_bin_sha
      - >-
        (_ids_stamp_good.content | b64decode | trim)
        == _ids_good ~ ' ' ~ _ids_target ~ ' ' ~ _ids_good_sha ~ ' ' ~ _ids_bin_sha
    fail_msg: >-
      Installed binary {{ _ids_installed.stat.checksum }} (want {{ _ids_bin_sha }}), stamp
      "{{ _ids_stamp_good.content | b64decode | trim }}".
