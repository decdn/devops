---
# What a green converge + idempotence cannot prove, on ../iroh-relay's converge:
#   1. A listener the unit does not hold (no QUIC socket) fails the gate.
#   2. A relay that binds and then crashes fails the gate (the settle period); a
#      re-run right after the crash (the unit restarting, or already back) passes
#      the port guard. 2b: so does a unit with no MainPID whose own process holds
#      every port (held in ExecStartPre: what #113's guard saw, held still).
#   3. A running relay whose record is gone is restarted and recorded again.
#   4. QAD off: rendered off, no udp/7842 listener, and another process on udp/7842
#      is no conflict, until QAD is on again (the port guard's UDP half).
#   5. 0.0.0.0 and a specific IPv4 address: rendered, bound, and probed there (the
#      certificate check is "fail" in this inventory).
#   6. The allowlist: every relay reads every platform's node ID; a node with no
#      identity, a failing `whoami`, an unreachable node, a host outside the
#      inventory and two nodes sharing an ID each fail tasks_from node-ids; the
#      read works in check mode; with the inventory read off only the listed IDs
#      render; the "everyone" and "denylist" modes render as such. (A role run that
#      skipped the read is refused: ../validation-iroh-relay.) Two nodes sharing an
#      ID needs two hosts, hence this scenario's two platforms.
# The include files are ../iroh-relay's. The host is left as converged, with the
# molecule CA trusted, for verify (../iroh-relay's).
- name: Side effect — gate variants, QAD off, bind addresses, access modes
  hosts: all
  become: true
  tasks:
    # As playbooks/iroh_relay.yml does before the role: facts the converge run set
    # do not carry over to this run.
    - name: Read the inventory nodes' endpoint IDs, as the playbook does
      ansible.builtin.include_role:
        name: iroh_relay
        tasks_from: node-ids

    # --- 1. a listener the unit does not hold ------------------------------------
    - name: Stop the relay, then make it skip its QUIC socket
      ansible.builtin.systemd_service:
        name: iroh-relay
        state: stopped

    - name: Stage the stub's no-QUIC marker
      ansible.builtin.copy:
        dest: /etc/iroh-relay/stub-no-quic
        content: ""
        mode: "0644"

    - name: Converge against a relay that never binds udp/7842
      block:
        - name: Run the role with a short readiness window
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_readiness_retries: 3
            iroh_relay_readiness_delay: 1

        - name: Fail — the gate passed a relay without its QUIC listener
          ansible.builtin.fail:
            msg: The role finished although iroh-relay never bound udp/7842.
      rescue:
        - name: Require the gate to be what failed (no QUIC listener)
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require iroh-relay to be up on all its listeners'
            fail_msg: "Failed at '{{ ansible_failed_task.name }}', not the readiness gate."
      always:
        - name: Remove the no-QUIC marker
          ansible.builtin.file:
            path: /etc/iroh-relay/stub-no-quic
            state: absent

    # --- 2. a relay that binds, then crashes ----------------------------------------
    - name: Stop the relay, then make it exit shortly after binding
      ansible.builtin.systemd_service:
        name: iroh-relay
        state: stopped

    - name: Stage the stub's exit-after marker
      ansible.builtin.copy:
        dest: /etc/iroh-relay/stub-exit-after
        content: ""
        mode: "0644"

    - name: Converge against a relay that exits after binding
      block:
        - name: Run the role with a settle period longer than the relay lives
          ansible.builtin.include_role:
            name: iroh_relay
          vars:
            iroh_relay_readiness_retries: 3
            iroh_relay_readiness_delay: 1
            iroh_relay_readiness_settle: 5

        - name: Fail — the gate passed a relay that crashed after binding
          ansible.builtin.fail:
            msg: The role finished although iroh-relay exited right after binding.
      rescue:
        - name: Require the gate to be what failed (a crash after binding)
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require iroh-relay to be up on all its listeners'
            fail_msg: "Failed at '{{ ansible_failed_task.name }}', not the readiness gate."
      always:
        - name: Remove the exit-after marker
          ansible.builtin.file:
            path: /etc/iroh-relay/stub-exit-after
            state: absent

    # Not stopped first: the crashed relay is being restarted (Restart=on-failure),
    # which is when an operator re-runs the role; whatever the timing, the port guard
    # must pass the relay's own listeners (#113). 2b holds the racy case still.
    - name: Converge the relay back up after the crash
      ansible.builtin.include_role:
        name: iroh_relay

    # --- 2b. the port guard on a unit with no MainPID ---------------------------------
    # What #113's guard saw across two reads (MainPID 0, then the restarted relay's
    # listeners), held still: the unit's own process holds every port while systemd
    # reports no MainPID (it is still in ExecStartPre). A guard that matched listeners
    # to the MainPID would refuse them; this one must report all four as its own.
    - name: Stop the relay, then hold it in ExecStartPre with the relay running
      ansible.builtin.systemd_service:
        name: iroh-relay
        state: stopped

    - name: Check the port guard against a unit with no MainPID
      block:
        - name: Create the relay's drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/iroh-relay.service.d
            state: directory
            mode: "0755"

        - name: Install a drop-in that runs the relay from ExecStartPre and stays there
          ansible.builtin.copy:
            dest: /etc/systemd/system/iroh-relay.service.d/molecule-hold.conf
            content: |
              [Service]
              ExecStartPre=/bin/sh -c '/usr/local/bin/iroh-relay \
                --config-path /etc/iroh-relay/iroh-relay.toml & exec sleep infinity'
              TimeoutStartSec=infinity
            mode: "0644"

        - name: Reload systemd with the hold
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Queue the held relay's start
          ansible.builtin.command:
            argv: [systemctl, start, --no-block, iroh-relay]
          changed_when: true

        - name: Wait for the held relay to bind every port
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              ss -Hltn 'sport = :80' | grep -q .
              ss -Hltn 'sport = :443' | grep -q .
              ss -Hltn 'sport = :9092' | grep -q .
              ss -Hlun 'sport = :7842' | grep -q .
          register: _ir_hold_bound
          changed_when: false
          failed_when: false
          retries: 10
          delay: 1
          until: _ir_hold_bound.rc == 0

        - name: Read the held unit
          ansible.builtin.systemd_service:
            name: iroh-relay
          register: _ir_hold_unit

        - name: Require the unit to hold every port with no MainPID
          ansible.builtin.assert:
            that:
              - _ir_hold_bound.rc == 0
              - _ir_hold_unit.status.ActiveState == 'activating'
              - _ir_hold_unit.status.MainPID | string == '0'
            fail_msg: >-
              The hold did not take: ports bound rc {{ _ir_hold_bound.rc }}, state
              {{ _ir_hold_unit.status.ActiveState }}/{{ _ir_hold_unit.status.SubState }},
              MainPID {{ _ir_hold_unit.status.MainPID }}.

        - name: Run the port guard against the held unit (must pass)
          ansible.builtin.include_role:
            name: iroh_relay
            tasks_from: ports

        # Passing on no output would prove nothing: every port must be read as own.
        - name: Require the guard to have taken every held listener for the relay's
          ansible.builtin.assert:
            that:
              - _own | select('search', ':80\s') | list | length > 0
              - _own | select('search', ':443\s') | list | length > 0
              - _own | select('search', ':9092\s') | list | length > 0
              - _own | select('search', ':7842\s') | list | length > 0
            fail_msg: "The guard's own listeners: {{ _own }}"
          vars:
            _own: "{{ iroh_relay_pre_listeners.stderr_lines | select('match', '^own: ') | list }}"
      always:
        - name: Stop the held relay
          ansible.builtin.systemd_service:
            name: iroh-relay
            state: stopped

        - name: Remove the hold drop-in
          ansible.builtin.file:
            path: /etc/systemd/system/iroh-relay.service.d/molecule-hold.conf
            state: absent

        - name: Reload systemd without the hold
          ansible.builtin.systemd_service:
            daemon_reload: true

    - name: Converge the relay back up after the hold
      ansible.builtin.include_role:
        name: iroh_relay

    # --- 3. a running relay with no record ------------------------------------------
    - name: Read the relay before its record goes missing
      ansible.builtin.systemd_service:
        name: iroh-relay
      register: _ir_norec_before

    - name: Remove the restart-input record
      ansible.builtin.file:
        path: /etc/iroh-relay/.relay-inputs.sha256
        state: absent

    - name: Converge with no record
      ansible.builtin.include_role:
        name: iroh_relay

    - name: Read the relay after the converge with no record
      ansible.builtin.systemd_service:
        name: iroh-relay
      register: _ir_norec_after

    - name: Require a relay never confirmed on its inputs to be restarted
      ansible.builtin.assert:
        that:
          - _ir_norec_after.status.MainPID != _ir_norec_before.status.MainPID
        fail_msg: >-
          With its record gone, a running relay must be restarted (it was never
          confirmed up on its current inputs); its PID stayed
          {{ _ir_norec_before.status.MainPID }}.

    - name: Check that the record is back on the current inputs
      ansible.builtin.include_tasks: ../iroh-relay/includes/record-is-current.yml

    # --- 4. QUIC address discovery off ----------------------------------------------
    - name: Converge with QUIC address discovery off
      ansible.builtin.include_role:
        name: iroh_relay
      vars:
        iroh_relay_enable_quic_addr_discovery: false

    - name: Read the config and the UDP listeners with QAD off
      ansible.builtin.command:
        argv: [ss, -Hlun, "sport = :7842"]
      register: _ir_qad_off_udp
      changed_when: false

    - name: Read the rendered config with QAD off
      ansible.builtin.slurp:
        src: /etc/iroh-relay/iroh-relay.toml
      register: _ir_qad_off_cfg

    - name: Require QAD off in the config and on the wire
      ansible.builtin.assert:
        that:
          - "'enable_quic_addr_discovery = false' in (_ir_qad_off_cfg.content | b64decode)"
          - _ir_qad_off_udp.stdout | trim | length == 0
        fail_msg: "QAD off: udp/7842 listeners {{ _ir_qad_off_udp.stdout }}"

    # Its unit's name ends like the relay's: still another process.
    - name: Squat on udp/7842 with another process
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=iroh-relay-squatter
          - --collect
          - python3
          - -c
          - >-
            import socket, time;
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM);
            s.bind(('0.0.0.0', 7842)); time.sleep(3600)
      changed_when: true

    - name: Wait for the UDP squatter to bind
      ansible.builtin.command:
        argv: [ss, -Hlun, "sport = :7842"]
      register: _ir_udp_squat
      changed_when: false
      retries: 10
      delay: 1
      until: _ir_udp_squat.stdout | trim | length > 0

    # With QAD off the relay does not want udp/7842: the squatter is no conflict.
    - name: Converge with QAD off beside the UDP squatter
      ansible.builtin.include_role:
        name: iroh_relay
      vars:
        iroh_relay_enable_quic_addr_discovery: false

    - name: Converge with QAD on while another process holds udp/7842
      block:
        - name: Run the role with QAD on beside the UDP squatter
          ansible.builtin.include_role:
            name: iroh_relay

        - name: Fail — the role took a UDP port another process holds
          ansible.builtin.fail:
            msg: The role finished although another process held udp/7842.
      rescue:
        - name: Require the port guard to be what failed (udp/7842)
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Refuse public ports held by another process'
            fail_msg: "Failed at '{{ ansible_failed_task.name }}', not the port guard."
      always:
        - name: Stop the UDP squatter
          ansible.builtin.systemd_service:
            name: iroh-relay-squatter
            state: stopped
          failed_when: false

    # --- 5. non-wildcard bind addresses ------------------------------------------------
    # The certificate check is "fail" in this inventory, so a probe aimed at the
    # wrong address fails these converges.
    - name: Converge on each IPv4 bind address
      ansible.builtin.include_tasks: ../iroh-relay/includes/bind-address.yml
      loop:
        - 0.0.0.0
        - "{{ ansible_facts['default_ipv4']['address'] }}"
      loop_control:
        loop_var: _ir_bind

    # --- 6. the access modes -----------------------------------------------------------
    - name: Read the node IDs while one stand-in node misbehaves
      ansible.builtin.include_tasks: ../iroh-relay/includes/node-ids-fail.yml
      loop:
        - {marker: molecule-no-identity, failed_at: Require an endpoint ID from every deCDN node}
        - {marker: molecule-whoami-fails, failed_at: Require an endpoint ID from every deCDN node}
        - {marker: molecule-shared-id, failed_at: Refuse deCDN nodes that share an endpoint ID}
      loop_control:
        loop_var: _ir_case

    # A node that cannot be reached is reported by name, not as the relay host.
    - name: Add a deCDN node nobody can reach
      ansible.builtin.add_host:
        name: molecule-unreachable-node
        ansible_connection: ssh
        ansible_host: 127.0.0.1
        ansible_port: 1
        ansible_ssh_common_args: -o ConnectTimeout=3

    - name: Read the node IDs of an unreachable node and of a host outside the inventory
      ansible.builtin.include_tasks: ../iroh-relay/includes/node-ids-fail.yml
      loop:
        - hosts: [molecule-unreachable-node]
          failed_at: Require an endpoint ID from every deCDN node
        - hosts: [molecule-not-an-inventory-host]
          failed_at: Validate iroh_relay_allowlist_node_hosts
      loop_control:
        loop_var: _ir_case

    - name: Read the inventory nodes' IDs in check mode
      ansible.builtin.include_role:
        name: iroh_relay
        tasks_from: node-ids
        apply:
          check_mode: true

    - name: Require the check-mode read to have read every node
      ansible.builtin.assert:
        that:
          - _iroh_relay_inventory_node_ids_read
          - _iroh_relay_inventory_node_ids | sort == groups['iroh_relay_hosts'] | map('hash', 'sha256') | sort
        fail_msg: "Check mode read {{ _iroh_relay_inventory_node_ids }}."

    - name: Converge in each other access mode
      ansible.builtin.include_tasks: ../iroh-relay/includes/access-mode.yml
      loop:
        - {access: everyone, allowlist: [], denylist: [], want: '"everyone"'}
        # The inventory read off: only the listed ID, none of the nodes'.
        - access: allowlist
          allowlist: [81d82536cb4c96ddbeab1f6bf4495d126c1942fb90b9ffb433d91d23314801e7]
          denylist: []
          from_inventory: false
          want: '{ allowlist = ["81d82536cb4c96ddbeab1f6bf4495d126c1942fb90b9ffb433d91d23314801e7"] }'
        - access: denylist
          allowlist: []
          denylist: [08ebd644cd0bd76975a53e7ff96b1eacd14dd4f61672f3f54c7c8bb19fbf2a08]
          want: '{ denylist = ["08ebd644cd0bd76975a53e7ff96b1eacd14dd4f61672f3f54c7c8bb19fbf2a08"] }'
      loop_control:
        loop_var: _ir_mode

    - name: Converge back on the inventory's settings
      ansible.builtin.include_role:
        name: iroh_relay

    - name: Check the relay is back on a current record
      ansible.builtin.include_tasks: ../iroh-relay/includes/record-is-current.yml
