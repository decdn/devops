---
# The relay's other gate refusals and its knobs, split from ../iroh-relay so the two
# run side by side: the same host shapes, inventory and converge (that scenario's
# prepare, converge and verify, by path), then side_effect.yml here: a relay that
# skips its QUIC socket or crashes after binding FAILS the gate; a missing record
# restarts a running relay; QAD off renders and binds no udp/7842, and a squatter
# there is refused only with QAD on; 0.0.0.0 and a specific IPv4 bind are rendered,
# bound and probed; the access modes, and every way the inventory read of node IDs
# fails. Two platforms: two nodes sharing an endpoint ID needs two hosts.
#
# The inventory below must stay identical to ../iroh-relay/molecule.yml's
# (`make test-scripts` checks); the stub is the one it names.
driver:
  name: docker
platforms:
  - name: relay-gate-molecule
    # Same digest-pinned images as ../sponsord (repo convention).
    image: geerlingguy/docker-debian12-ansible@sha256:a131e3b7a9a38dda40e98b49b39d6200ffab0ad853c714a513f5eea41bab9a25
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - iroh_relay_hosts
  # systemd 255: StateDirectory= and the ambient capability on a newer systemd.
  - name: relay-gate-molecule-u2404
    image: geerlingguy/docker-ubuntu2404-ansible@sha256:3394e335df58c961c00b78ae601ef30cdd7463b112f21b0c5f78674a70526302
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - iroh_relay_hosts
provisioner:
  name: ansible
  options:
    skip-tags: baseline
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    # Same pipelining note as ../default/molecule.yml.
    ANSIBLE_PIPELINING: "true"
  playbooks:
    prepare: ../iroh-relay/prepare.yml
    converge: ../iroh-relay/converge.yml
    verify: ../iroh-relay/verify.yml
  inventory:
    group_vars:
      iroh_relay_hosts:
        iroh_relay_install_method: manual
        iroh_relay_manual_bin_src: "${MOLECULE_PROJECT_DIRECTORY}/molecule/iroh-relay/files/iroh-relay-stub"
        iroh_relay_hostname: relay.molecule.test
        iroh_relay_acme_contact: ops@molecule.test
        # A real ed25519 public key in iroh's hex form.
        # The default allowlist mode: one ID listed here, plus the ID the stand-in
        # `decdn` (prepare.yml) prints on each platform, every platform read as if
        # it were one of the inventory's deCDN nodes (by every relay, across hosts).
        iroh_relay_allowlist:
          - 81d82536cb4c96ddbeab1f6bf4495d126c1942fb90b9ffb433d91d23314801e7
        iroh_relay_allowlist_node_hosts: "{{ groups['iroh_relay_hosts'] }}"
        # Every optional key rendered, so the stub checks each one's shape.
        iroh_relay_accept_conn_limit: 50
        iroh_relay_accept_conn_burst: 100
        iroh_relay_client_rx_bytes_per_second: 4194304
        iroh_relay_client_rx_max_burst_bytes: 8388608
        iroh_relay_log_level: info,iroh_relay=debug
        iroh_relay_certificate_check: fail
        iroh_relay_certificate_retries: 5
        iroh_relay_certificate_delay: 1
        iroh_relay_readiness_retries: 10
        iroh_relay_readiness_delay: 1
        # 1s, not the default 5: the side effects run the role dozens of times. The
        # crash-after-bind case (../iroh-relay-gate) sets its own 5s.
        iroh_relay_readiness_settle: 1
        decdn_grafana_cloud_enabled: true
        grafana_alloy_install_method: manual
        grafana_alloy_manual_bin_src: "${MOLECULE_PROJECT_DIRECTORY}/molecule/grafana-cloud/files/alloy-stub"
        grafana_alloy_region: US
        grafana_alloy_loki_url: https://logs-prod-xx.molecule.invalid/loki/api/v1/push
verifier:
  name: ansible
scenario:
  test_sequence:
    # Leading destroy: see ../default/molecule.yml. No idempotence step: the
    # converge is ../iroh-relay's, whose idempotence runs there.
    - destroy
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - destroy
