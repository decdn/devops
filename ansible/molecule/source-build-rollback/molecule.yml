---
# The node built from source, split from ../source-build so the two run side by
# side: the same host shape, inventory and converge (that scenario's prepare,
# converge and verify, by path), then side_effect.yml here commits a revision whose
# binaries fail the --version backstop and rolls back from it by SHA.
#
# Needs network access to static.rust-lang.org, as ../source-build does. The
# inventory below must stay identical to ../source-build/molecule.yml's
# (`make test-scripts` checks).
driver:
  name: docker
platforms:
  - name: decdn-source-build-rollback-molecule
    # Same digest as default/molecule.yml (see there).
    image: geerlingguy/docker-debian12-ansible@sha256:a131e3b7a9a38dda40e98b49b39d6200ffab0ad853c714a513f5eea41bab9a25
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/collections"
    ANSIBLE_PIPELINING: "true"
  playbooks:
    prepare: ../source-build/prepare.yml
    converge: ../source-build/converge.yml
    verify: ../source-build/verify.yml
  inventory:
    group_vars:
      # Inventory, not converge vars, so side_effect.yml re-runs the role with the
      # same inputs.
      all:
        decdn_node_install_method: source
        decdn_node_source_repo: file:///srv/decdn-fixture.git
        decdn_node_source_ref: main
        # An integer, so the CARGO_BUILD_JOBS branch and the jobs assert both see
        # the non-string form inventory usually gives.
        decdn_node_source_build_jobs: 2
        # Not the binary's version: proves non-release installs are not held to the pin
        # (only release mode compares it).
        decdn_node_version: "9.9.9-not-the-binary"
        decdn_rpc_url: "https://rpc.example.invalid/"
        decdn_chain_id: 421614
        decdn_region: "US"
        decdn_payment_pool_address: "0x1111111111111111111111111111111111111111"
        decdn_capacity_bond_address: "0x2222222222222222222222222222222222222222"
        decdn_slash_judge_address: "0x3333333333333333333333333333333333333333"
        decdn_content_blacklist_address: "0x4444444444444444444444444444444444444444"
verifier:
  name: ansible
scenario:
  test_sequence:
    # Leading destroy: see ../default/molecule.yml. No idempotence: ../source-build
    # runs it on the identical converge. verify (../source-build's) checks the
    # converged rev 1 the side effect starts from, so it runs first.
    - destroy
    - create
    - prepare
    - converge
    - verify
    - side_effect
    - destroy
