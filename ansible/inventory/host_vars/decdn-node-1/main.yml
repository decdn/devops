---
# Per-node deployment values for decdn-node-1 (COMMITTED — non-secret config only).
# Ansible merges every *.yml in this directory for host decdn-node-1. The one
# sensitive value, decdn_rpc_url, lives in the sibling secret.yml (git-ignored) —
# copy secret.yml.example to secret.yml and fill it in. The node refuses to start
# until both this file and secret.yml are set.
#
# The contract addresses below are the canonical Arbitrum Sepolia (chain 421614)
# v0.1.0 genesis deploy (deployBlock 11418331) — public on-chain facts from the deCDN
# contract deployment, not invented here. If you target a different deployment, replace
# them (and chain_id) with that deployment's values.
# MUST-EDIT lines are yours to fill; the rest match the genesis deploy.

# Pinned release to install (a v<version> GitHub Release must exist).
decdn_node_version: "0.1.0"
# Recommended: pin the tarball's sha256 (no checksums file is published upstream).
decdn_node_sha256: ""

# --- Chain (Arbitrum Sepolia, chain 421614) -----------------------------------
# The RPC endpoint (decdn_rpc_url) is the one sensitive value — set it in secret.yml.
decdn_chain_id: 421614                                   # Arbitrum Sepolia
# Required contracts (from the chain-421614 deployment).
decdn_payment_channel_address: "0x62B911B7CdEA5eedFB7dC0E2343440516fB8cb43"   # PaymentChannel
decdn_capacity_bond_address: "0x2F08aE39B0127C92d56F9E5eAd20692b217dDc58"     # CapacityBond
decdn_slash_judge_address: "0xa9feAb7c1a82e32a2A52c40aD545C0111eC3A2b4"       # SlashJudge

# --- Slash appeals (optional; ADR 028) ----------------------------------------
decdn_slash_appeal_address: "0x4CA50D80bFcBA877eAC4cFa36FF95D7f803c6590"       # SlashAppeal
decdn_slash_judge_from_block: 11418331   # SlashJudge deploy block — bounds per-restart rescan

# --- Origin directory (optional; ADR 022 — set both or neither) ---------------
decdn_origin_assignment_address: "0x632F49B3447810eF20eee884fF6e7EAB5560b19e"  # OriginAssignment
decdn_publisher_registry_address: "0xa9D014d24924E7A5BCaB9E49A68119B1e92EBCD7" # PublisherRegistry
decdn_origin_directory_from_block: 11418331   # PublisherRegistry deploy block

# --- Content blacklist compliance (optional; ADR 011/031) ---------------------
decdn_content_blacklist_address: "0x7e903dd1674EDe0596629205E55e5fe1B670dBD3"  # ContentBlacklist
decdn_content_blacklist_from_block: 11418331  # ContentBlacklist deploy block

# --- Cache pull-through origin (what the node fetches on a cache miss) ---------
# MUST-EDIT — operator-specific backing origin (NOT a chain fact). A serving node
# needs one, else cache misses fail NoOrigin. http shown; see defaults/main.yml for
# fs / s3 fields.
decdn_cache_origin_kind: "http"
decdn_cache_origin_url: "https://your-origin.example/"

# --- Node identity / locale ---------------------------------------------------
decdn_region: "US"            # MUST-EDIT — ISO 3166-1 alpha-2 of the node's physical location
# decdn_relay_url: ""         # optional iroh relay for NAT traversal

# --- Economics ----------------------------------------------------------------
decdn_rate_per_mb: 10         # USDC base units (6 decimals); 10 = $0.00001/MB
