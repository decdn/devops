---
# Per-node deployment values for origin-1, a publisher's origin node (COMMITTED —
# non-secret config only). Ansible merges every *.yml in this directory for host
# origin-1. An origin is a node like decdn-node-1 (see that host's main.yml) plus
# the origin backend below. The sensitive
# values (decdn_rpc_url, and any environment-borne secrets) live OFF this file:
# either in a 0600 /etc/decdn/decdn.env provisioned on the target host (preferred —
# nothing sensitive on the control machine), or in the sibling git-ignored
# secret.yml (copy secret.yml.example). The role refuses to start the node until
# this file is set and ONE of those two secret sources exists.
#
# CONTRACT ADDRESSES ARE NOT INVENTED HERE, and not copied here either:
# decdn_network below selects the role's mirror of upstream's deployment manifest
# (roles/decdn_node/vars/main/networks.yml, regenerated by
# scripts/sync-network-profiles.py from contracts/deployments/<chainId>.json in
# decdn/decdn).
# It is the same manifest `decdn config init --chain arbitrum-sepolia` bakes in, and
# upstream redeploys change every address at once, so one mirror beats a hand copy
# per inventory. To target a different deployment, clear decdn_network and set
# decdn_chain_id plus the decdn_*_address variables from that deployment's manifest.
# MUST-EDIT lines are yours to fill.

# --- Which binaries to install ------------------------------------------------
# "release" (the default): the v<version> GitHub Release tarballs, verified against
# the GPG-signed SHA256SUMS manifest. The version defaults to the decdn/decdn release
# the role pins; set it only to hold a node on another one.
decdn_node_install_method: release
# decdn_node_version: "0.0.1"
#
# Alternative: build on the node from a git ref (any tag, branch or SHA), as an
# unprivileged build user with a pinned toolchain (decdn_node_version is not checked
# in this mode):
#     decdn_node_install_method: source
#     decdn_node_source_ref: v0.0.1
# Alternative: copy binaries built on this control machine
# (`cargo build --release -p decdn-node -p decdn-cli` in a decdn/decdn checkout):
#     decdn_node_install_method: manual
#     decdn_node_manual_bin_src: /path/to/decdn/target/release/decdn-node
#     decdn_cli_manual_bin_src: /path/to/decdn/target/release/decdn

# --- Chain (Arbitrum Sepolia, chain 421614) -----------------------------------
# The RPC endpoint is the one sensitive value — provision it as DECDN_RPC_URL in
# /etc/decdn/decdn.env on the host, or set decdn_rpc_url in secret.yml.
# The profile supplies decdn_chain_id and all eight contract addresses (the four
# required ones, SlashAppeal, OriginAssignment, PublisherRegistry and USDC). Set any
# decdn_*_address here only to override it deliberately; the role reports overrides.
decdn_network: arbitrum-sepolia

# --- Origin backend (the canonical source of the namespace's content) ---------
# MUST-EDIT — where this origin reads the content it serves (NOT a chain fact).
# http shown; fs (a local disk or an NFS mount: decdn_cache_origin_path) and s3
# (S3/R2/B2/MinIO: decdn_cache_origin_s3_*) are in roles/decdn_node/defaults/main.yml,
# and decdn_cache_origins takes an ordered fallback list. S3 access keys never go
# here: put them in /etc/decdn/decdn.env on the host (AWS_ACCESS_KEY_ID, …) with
# decdn_cache_origin_s3_use_default_chain: true, or in secret.yml's decdn_extra_env.
# playbooks/origin.yml refuses a decdn_origin_nodes host without a backend.
decdn_cache_origin_kind: "http"
decdn_cache_origin_url: "https://your-origin.example/"
# Being configured is not being recognised: the namespace's publisher seats this
# node's operator with OriginAssignment.addOrigin (decdn/adr/011-content-takedown.md,
# Origin Assignment Authority). With a backend set, the node declines misses for
# namespaces it is not an origin of (decdn_relay_foreign_namespaces defaults to false)
# and does not pull from other nodes (decdn_node_to_node_pull_through_enabled).

# --- Node identity / locale ---------------------------------------------------
decdn_region: "US"            # MUST-EDIT — ISO 3166-1 alpha-2 of the node's physical location
# decdn_relay_urls: []        # optional iroh relays for NAT traversal ([] => n0 defaults)

# --- Economics ----------------------------------------------------------------
# Seller-side quote: this node's asking price, advertised verbatim and never clamped
# to the delivery floor by the daemon (ADR 003 §Rate-floor enforcement, ADR 019
# §Step 3.3 — the ADRs, not this file, govern that behaviour).
decdn_rate_per_mb: 10         # USDC base units (6 decimals); 10 = $0.00001/MB
