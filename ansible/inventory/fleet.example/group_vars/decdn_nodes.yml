---
# Settings shared by every node in the fleet. Copied with the overlay; edit the
# private copy. Per-host differences go in host_vars/<host>/main.yml.

# --- Binaries -----------------------------------------------------------------
# Until upstream tags a release, install locally built binaries. Build them from a
# decdn/decdn checkout (cross-compile for aarch64 hosts; the role derives each
# host's target from its architecture and checks the ELF before shipping):
#   cargo build --release -p decdn-node -p decdn-cli
decdn_node_install_method: manual
decdn_release_target_dir: ""        # MUST-EDIT - control-machine path to decdn's target/release
# Once a release exists, switch to the GPG-verified tarballs and drop the two
# lines above:
# decdn_node_install_method: release
# decdn_node_version: "X.Y.Z"

# --- Chain --------------------------------------------------------------------
# Chain id and every contract address come from the role's mirror of upstream's
# deployment manifest (roles/decdn_node/README.md § Network profiles). Nothing to
# copy by hand, and an upstream redeploy is a role update, not an inventory edit.
decdn_network: arbitrum-sepolia

# --- Cache sizing ---------------------------------------------------------------
# Size to each host's disk and to the largest object you expect to serve; see
# docs/requirements.md for the disk formula. A node rejects any blob larger than
# decdn_max_blob_size_mb with BlobTooLarge, and decdn_cache_size_mb must be at
# least that. Override per host in host_vars when disks differ.
# decdn_max_blob_size_mb: 1024      # role default
# decdn_cache_size_mb: 10240        # role default (10 GiB)

# --- Observability ----------------------------------------------------------------
# Opt-in Grafana Cloud metrics + journald per node. Provision the token first
# (roles/grafana_alloy/README.md).
# decdn_grafana_cloud_enabled: true
