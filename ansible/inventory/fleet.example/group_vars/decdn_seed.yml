---
# Seed nodes hold the model catalogue in a local filesystem origin, which is the
# directory Launch/seed-model.sh writes into:
#   sudo -u decdn OUT_DIR=/var/lib/decdn/origin ./seed-model.sh
# /var/lib/decdn is the unit's StateDirectory, so the hardened daemon can read it
# under ProtectSystem=strict. The role creates the directory on first converge.
decdn_cache_origin_kind: fs
decdn_cache_origin_path: /var/lib/decdn/origin
# Seeds need disk for the origin copy (~352 GiB for the full set) AND the cache.
