---
# TEMPLATE for a private fleet overlay. Copy this whole directory OUT of this
# public repo, into a private repo or directory, and fill it in there:
#   cp -r ansible/inventory/fleet.example ../../my-fleet      # a PRIVATE repo/dir
#   make deploy INVENTORY=../../my-fleet/hosts.yml LIMIT=<host>
# Ansible loads group_vars/ and host_vars/ from beside the hosts.yml you pass, so the
# overlay carries its own. The QUIC firewall hole is NOT in here: it lives in
# playbooks/group_vars/decdn_nodes.yml, which applies to every inventory.
#
# Host names and addresses below are placeholders. Real IPs go in the private copy
# only. Bootstrap, ansible_user and the Ubuntu sudo-rs note: see ../hosts.yml.example.
#
# Every host belongs to decdn_nodes, the group site.yml targets. Add child groups of
# your own when hosts differ in a way that is easier to express per group than per
# host (disk size, an origin, an egress cap on pay-per-TB bandwidth), and give each
# one a group_vars/<group>.yml. Ansible merges a child group's vars over decdn_nodes'.
#
# decdn_region is REQUIRED per host (ISO 3166-1 alpha-2 of the physical location).
# It is the on-chain region hint (ADR 030) and scopes ContentBlacklist compliance
# (ADR 011). The role refuses to deploy without it.
decdn_nodes:
  hosts:
    node-a:
      ansible_host: REPLACE_WITH_IP_OR_DNS
      decdn_region: DE
    node-b:
      ansible_host: REPLACE_WITH_IP_OR_DNS
      decdn_region: US
