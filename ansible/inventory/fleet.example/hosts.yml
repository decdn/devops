---
# TEMPLATE for a private fleet overlay: the launch fleet from
# decdn/internal Launch/fleet-plan.md (10–20 nodes, Hetzner + OVHcloud, >= 4–5
# countries on 3 continents). Copy this whole directory OUT of this public repo:
#   cp -r ansible/inventory/fleet.example ../../decdn-fleet     # a PRIVATE repo/dir
#   make deploy INVENTORY=../../decdn-fleet/hosts.yml LIMIT=<host>
# Ansible loads group_vars/ and host_vars/ from beside the hosts.yml you pass, so the
# overlay carries its own. The QUIC firewall hole is NOT in here: it lives in
# playbooks/group_vars/decdn_nodes.yml, which applies to every inventory.
#
# Host names and addresses below are placeholders. Real IPs go in the private copy only.
# Bootstrap, ansible_user and the sudo-rs note: see ../hosts.yml.example.
#
# Every host belongs to decdn_nodes, the group site.yml targets, and to one group
# from each of two axes:
#   role:    decdn_seed  - holds the catalogue in a local fs origin (seed-model.sh)
#            decdn_edge  - no origin; fills its cache from seeds/peers on demand
#   billing: decdn_unmetered - flat-rate bandwidth: hero/wow-factor traffic goes here
#            decdn_metered   - pay-per-TB egress: map coverage, egress-capped
# Record the billing choice here, before provisioning (fleet-plan.md). The group is
# the record.
#
# decdn_region is REQUIRED per host (ISO 3166-1 alpha-2 of the physical location).
# It drives the stats map and the ADR 030 / ADR 011 regional scope. The role
# refuses to deploy without it.
decdn_nodes:
  children:
    decdn_seed:
      hosts:
        fsn1-a:                      # Hetzner Falkenstein
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: DE
        ash-a:                       # Hetzner Ashburn
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: US
    decdn_edge:
      hosts:
        hel1-a:                      # Hetzner Helsinki
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: FI
        hil-a:                       # Hetzner Hillsboro
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: US
        gra-a:                       # OVHcloud Gravelines
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: FR
        waw-a:                       # OVHcloud Warsaw
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: PL
        bhs-a:                       # OVHcloud Beauharnois
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: CA
        sgp-a:                       # OVHcloud Singapore
          ansible_host: REPLACE_WITH_IP_OR_DNS
          decdn_region: SG
    # Billing axis: the same hosts, listed again by name only.
    decdn_unmetered:
      hosts:
        fsn1-a:
        ash-a:
        hel1-a:
        hil-a:
    decdn_metered:
      hosts:
        gra-a:
        waw-a:
        bhs-a:
        sgp-a:
