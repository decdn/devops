---
# Shared config for sponsord-onramp hosts (the second play of playbooks/sponsord.yml,
# also run by publisher.yml). Each host must be in sponsord_hosts too. Uncomment and fill
# in; per-host values can move to host_vars/<host>/main.yml.
# Full variable list: roles/sponsord_onramp/defaults/main.yml and its README.md.
#
# The Turnstile widget's secret key: sponsord_onramp_turnstile_secret in the
# git-ignored host_vars/<host>/secret.yml (the role writes it to the host), or
# /etc/sponsord/turnstile-secret (0600) written on the host by you.
# The daemon's API token (/etc/sponsord/api-token) is the sponsord role's.

# --- Binary ------------------------------------------------------------------------
# The same three methods as sponsord. "release" (default) installs the same release
# as the sponsord role; set both versions together to hold the host on another:
# sponsord_onramp_version: "0.3.0"
# Or build on the host (its own checkout, so it may pin a different ref):
# sponsord_onramp_install_method: source
# sponsord_onramp_source_ref: v0.3.0
# Or manual, which follows sponsord_release_target_dir (`cargo build --release` in
# a decdn/decdn checkout builds both binaries):
# sponsord_onramp_install_method: manual

# --- Public address ----------------------------------------------------------------
# nginx terminates TLS for this name, with a certificate lego obtains over ACME
# HTTP-01. Its A/AAAA records must point at the host and tcp/80 must reach it before
# the first deploy; the playbooks open tcp/80 + tcp/443. The ACME contact is
# REQUIRED with sponsord_onramp_tls: acme (the default). To bring your own proxy
# instead, set sponsord_onramp_proxy: none (HERE, not in a play: the firewall holes
# read it) and sponsord_onramp_public_url.
# sponsord_onramp_domain: downloads.example.org
# sponsord_onramp_acme_email: ops@example.org

# --- What users get (REQUIRED) -----------------------------------------------------
# PUBLIC: served to every user. A keyless endpoint, never sponsord_rpc_url.
# sponsord_onramp_rpc_url: https://sepolia-rollup.arbitrum.io/rpc
# sponsord_onramp_turnstile_sitekey: "0x…"
# The decdn release the installers install defaults to the newest release of the
# role's sponsord_onramp_decdn_release line (decdn/decdn, the decdn_node role's default
# line; a host's decdn_node_version does not move it), with the SHA-256 of its
# verified SHA256SUMS, on each deploy. To serve one exact release, set its tag and digest:
# sponsord_onramp_decdn_release: v0.3.0
# sponsord_onramp_decdn_sums_sha256: "…"
# CapacityBond and SlashJudge come from sponsord_network (group_vars/sponsord_hosts.yml).
