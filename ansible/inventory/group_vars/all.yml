---
# Deployment overrides for the anvil devnet.
#
# Sane defaults for every knob live in the roles (roles/*/defaults/main.yml) so
# the roles are self-contained. Set anything here to override per host/group.
# Secrets are generated ON THE HOST by the roles and never live here.

# --- REQUIRED ---------------------------------------------------------------
# Public key for the admin sudo user, installed BEFORE ssh_hardening disables
# root + password login (the baseline role asserts this to prevent lockout).
ssh_admin_user: deploy
ssh_admin_pubkey: ""              # e.g. "ssh-ed25519 AAAA... you@laptop"

# Optional inbound-SSH source allowlist (CIDRs). Empty = accept from any source.
ssh_allow_cidrs: []

# --- Common overrides (uncomment to change; see roles/*/defaults for all) ----
# rpc_hostname: rpc-dev.decdn.org   # printed in ETH_RPC_URL; change if running
#                                   # alongside the existing box
# foundry_version: latest           # latest | nightly | vX.Y.Z (pin for reproducibility)
# anvil_chain_id: 31337             # devnet default; NOT a protocol claim (ADR)
# anvil_block_time: 2
# anvil_accounts: 10
