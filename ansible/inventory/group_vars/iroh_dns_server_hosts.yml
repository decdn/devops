---
# Shared config for iroh DNS server hosts (playbooks/iroh_dns_server.yml, also run
# by site.yml). Uncomment and fill in; per-host values (the hostname, at least) go
# under the host in hosts.yml (as hosts-publisher.yml.example shows) or in
# host_vars/<host>/main.yml.
# Full variable list: roles/iroh_dns_server/defaults/main.yml and its README.md.
# Nothing to provision on the host: the server generates its ACME account key and
# TLS key itself, in its 0700 state directory.

# --- Public name + certificate (REQUIRED) ------------------------------------------
# Per host. The parent zone delegates the hostname to this host (NS <hostname>.
# plus a glue A record), and tcp/443 must reach it from the internet, before Let's
# Encrypt issues the certificate.
# iroh_dns_server_hostname: dns.example.org
# iroh_dns_server_acme_contact: ops@example.org
# A trial run on Let's Encrypt's staging CA (untrusted certificates):
# iroh_dns_server_acme_staging: true

# --- DNS zone ----------------------------------------------------------------------
# The public IPv4 the glue record names. Defaults to the DNS bind address when that
# is a public one; a host behind 1:1 NAT (most clouds) must set it.
# iroh_dns_server_rr_a: 203.0.113.10
# iroh_dns_server_rr_aaaa: "2001:db8::10"
# More zones served beside the hostname:
# iroh_dns_server_origins: [dns.example.org, discovery.example.net]

# --- Listeners ---------------------------------------------------------------------
# DNS binds ONE address, by default the host's default IPv4 address, which leaves
# systemd-resolved's 127.0.0.53 alone. "::" also serves IPv6, once nothing else holds
# port 53 (DNSStubListener=no). On a host behind NAT, the private address the
# provider forwards to is the right one.
# iroh_dns_server_dns_bind_address: "::"
# iroh_dns_server_https_bind_address: "0.0.0.0"

# --- The deploy's certificate check ------------------------------------------------
# "warn" (default) reports a server without a trusted certificate yet, and fails once
# Let's Encrypt has issued one before; "fail" always fails without one, for once the
# delegation and tcp/443 are known to be in place.
# iroh_dns_server_certificate_check: fail
