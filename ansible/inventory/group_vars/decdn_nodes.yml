---
# Shared config for public deCDN node hosts (playbooks/site.yml).
# Per-node values live in host_vars/<node>/: addresses/region/version in main.yml.
# The sensitive rpc_url is provisioned as /etc/decdn/decdn.env on the host, or (if
# you would rather the role authored that file) in a git-ignored secret.yml.

# The node's public QUIC firewall hole (udp/4433) is NOT set here. It lives in
# playbooks/group_vars/decdn_nodes.yml so it applies to every inventory, including a
# private fleet overlay passed with INVENTORY=.

# --- Grafana Cloud observability (opt-in) --------------------------------------
# One mirrored flag drives BOTH roles (grafana_alloy install/config AND the
# otlp_endpoint injection into node.toml). Uncomment after provisioning the
# credential file on each host — see roles/grafana_alloy/files/grafana-alloy.env.example:
#
# decdn_grafana_cloud_enabled: true
# grafana_alloy_region: "{{ decdn_region }}"  # override only when needed
# grafana_alloy_deployment_environment: production
