---
# Manifest for the `decdn.node` Ansible collection — what a node operator runs:
# deploy + harden a deCDN node. Publishers' services are `decdn.publisher`
# (../publisher/galaxy.yml), which depends on this one.
#
# This file is an OVERLAY, not the project root manifest. It is assembled into a
# clean collection tree (with the roles in roles.txt) by `galaxy/build.sh node`;
# it is deliberately NOT placed at ansible/ root, so the deploy project stays a
# plain Ansible project (bare role names, roles_path, production-profile
# ansible-lint) rather than being reinterpreted as a collection. See ../../README.md.
namespace: decdn
name: node
# Set only by scripts/release.sh (RELEASING.md); 0.0.0 means never released.
version: 0.0.0                      # pre-1.0: published shape not yet stable
readme: README.md
authors:
  - deCDN Contributors
description: >-
  Deploy and harden a public deCDN node: DevSec host baseline, the decdn_node
  daemon (a cache node, or a publisher's origin) with backup and decommission, and
  opt-in Grafana Cloud observability.
license:
  - MIT
# Galaxy tags must match ^[a-z0-9]+$ (no hyphens/underscores).
tags:
  - decdn
  - cdn
  - node
  - systemd
  - hardening
  - debian
  - ubuntu
  - devsec
  - iroh
  - web3
# Collection-level dependencies — only what the SHIPPED roles use:
#   baseline -> devsec.hardening (os_hardening + ssh_hardening), ansible.posix
#               (authorized_key)
#   decdn_node -> ansible.builtin only
#   grafana_alloy -> ansible.builtin only
# community.general is NOT used by any role, so it is intentionally absent here.
dependencies:
  devsec.hardening: ">=10.0.0"
  ansible.posix: ">=1.5.0"
repository: https://github.com/decdn/devops
documentation: https://github.com/decdn/devops/tree/main/ansible
homepage: https://decdn.org
issues: https://github.com/decdn/devops/issues
# No build_ignore. It used to carry "*.example" as a guard against shipping an
# inventory secret template, but build.sh stages ONLY roles/ + this overlay — the
# inventory never enters the tree, so the pattern excluded nothing real while
# silently dropping roles/decdn_node/files/decdn.env.example, which external
# operators need (it is the template for the host-provisioned 0600 env file).
# Add a NARROW, path-anchored pattern here if something must ever be excluded.
