# Ansible configuration for the deCDN deployment project (public node + internal
# anvil devnet). Run all ansible / ansible-playbook / molecule commands from here.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
nocows = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
