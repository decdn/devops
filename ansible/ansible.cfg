# Ansible configuration for the anvil-devnet project.
# Run all ansible / ansible-playbook / molecule commands from this directory.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
nocows = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
