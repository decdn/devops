# Ansible configuration for the deCDN deployment project (the public node).
# Run all ansible / ansible-playbook commands from here.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
nocows = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
