# Ansible configuration for the deCDN deployment project (the public node).
# Run all ansible / ansible-playbook commands from here.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
nocows = True
interpreter_python = auto_silent
# Run modules over the existing SSH session instead of staging a script into the
# target's tmpdir. Two roles write credentials with `copy: content=…` (the node's
# decdn.env, Alloy's grafana-alloy.env), and without pipelining the module args —
# including the plaintext secret — are written to ~/.ansible/tmp on the target
# before the atomic move. `no_log` covers task output, not that file. Requires
# `requiretty` to be off in sudoers, which is the default on the Debian/Ubuntu
# targets this project supports.
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
