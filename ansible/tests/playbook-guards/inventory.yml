---
# Fixture for tests/scripts-test.sh's playbook-guard cases. Nothing here is ever
# contacted: the cases run only guard tasks, which gather no facts.
all:
  vars:
    ansible_connection: local
  children:
    decdn_nodes:
      hosts:
        node-only: {}
        dns-node: {}
        node-with-origin:
          decdn_cache_origin_kind: http
        origin-ok: {}
        origin-list: {}
        origin-none: {}
    # A top-level group here, not decdn_nodes' child, so a host can be in it alone.
    decdn_origin_nodes:
      hosts:
        origin-ok:
          decdn_cache_origin_kind: http
        origin-list:
          decdn_cache_origins: [{kind: fs, path: /srv/content}]
        origin-none: {}
        origin-orphan:
          decdn_cache_origin_kind: http
    sponsord_hosts:
      hosts:
        both: {}
        relay-onramp: {}
        dns-onramp: {}
    sponsord_onramp_hosts:
      hosts:
        both: {}
        onramp-only: {}
        relay-onramp: {}
        dns-onramp: {}
    iroh_relay_hosts:
      hosts:
        relay-only: {}
        relay-onramp: {}
        dns-relay: {}
    iroh_dns_server_hosts:
      hosts:
        dns-only: {}
        dns-node: {}
        dns-relay: {}
        dns-onramp: {}
