---
# Fixture for check.sh: one host per group shape. Nothing here is ever contacted;
# check.sh only asks Ansible to resolve each host's variables.
all:
  vars:
    ansible_connection: local
  children:
    decdn_nodes:
      hosts:
        node: {}
        node-port:
          decdn_bind_port: 5555
        co-located: {}
        co-located-onramp: {}
        relay-node: {}
        dns-node: {}
        origin-listed: {}
      # A publisher's origins: a child group, so its hosts are decdn_nodes too.
      children:
        decdn_origin_nodes:
          hosts:
            origin: {}
            origin-listed: {}
            origin-onramp: {}
    sponsord_hosts:
      hosts:
        sponsord: {}
        origin-onramp: {}
        co-located: {}
        onramp: {}
        onramp-own-proxy: {}
        co-located-onramp: {}
        relay-sponsord: {}
        dns-sponsord: {}
    sponsord_onramp_hosts:
      hosts:
        onramp: {}
        onramp-own-proxy:
          sponsord_onramp_proxy: none
        co-located-onramp: {}
        origin-onramp: {}
    iroh_relay_hosts:
      hosts:
        relay: {}
        relay-no-qad:
          iroh_relay_enable_quic_addr_discovery: false
        relay-node: {}
        relay-sponsord: {}
    iroh_dns_server_hosts:
      hosts:
        dns: {}
        dns-node: {}
        dns-sponsord: {}
