---
# Playbook-adjacent group_vars for iroh_relay_hosts (see decdn_nodes.yml beside
# this for why playbook-adjacent, and for the precedence).
#
# The same list as decdn_nodes.yml and sponsord_hosts.yml, built in all.yml from the
# host's groups. It must be identical in every file: a host in more than one group
# runs baseline once per play, and different lists would flip its firewall on every
# run.
baseline_extra_inbound: "{{ _baseline_service_inbound }}"
