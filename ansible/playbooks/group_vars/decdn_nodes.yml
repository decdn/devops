---
# Playbook-adjacent group_vars for decdn_nodes: Ansible loads these for EVERY
# inventory passed with -i / INVENTORY=, unlike inventory/group_vars/, which only
# loads alongside inventory/hosts.yml. Only settings that every node needs no matter
# which inventory drives the run belong here. A private fleet overlay (see
# ansible/README.md "Private fleet inventory") must not be able to lose them.
# Operator knobs go in the inventory's own group_vars / host_vars.
#
# Precedence: playbook group_vars beat inventory group_vars, so to change this
# for a node, override it in that node's host_vars.

# The public holes in the baseline firewall: the node's QUIC listener, plus those of
# any other service the host also runs (all.yml builds the list from the host's
# groups). sponsord_hosts.yml sets the same value, so a host in both groups renders
# one firewall in both plays.
baseline_extra_inbound: "{{ _baseline_service_inbound }}"
