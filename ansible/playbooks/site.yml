---
# Everything in the inventory: what node operators run, then what publishers run.
#   node.yml       decdn_nodes that are not origins (node operators)
#   publisher.yml  origins, sponsord (+ onramp), iroh relays, iroh DNS servers
# A host is in as many of those groups as it runs services; each play matches nothing
# unless the inventory defines its group.
- name: Provision deCDN cache nodes
  ansible.builtin.import_playbook: node.yml

- name: Provision the publisher's services
  ansible.builtin.import_playbook: publisher.yml
