---
# Mint (and reveal exactly once) a new basic-auth dev user, then reload Caddy.
# Usage: ansible-playbook playbooks/add-dev-user.yml -e user=alice
#        (or: make add-dev USER_NAME=alice)
# Idempotent: an existing user is left untouched and never silently rotated.
- name: Add a basic-auth dev user
  hosts: anvil_devnet
  become: true
  roles:
    - role: caddy
      vars:
        caddy_extra_user: "{{ user | mandatory }}"
      tags: [caddy, add-dev]
