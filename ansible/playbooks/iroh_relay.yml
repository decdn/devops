---
# iroh relays: the fallback path for deCDN peers that cannot hole-punch, and QUIC
# address discovery for the ones that can. Self-hosted as operational
# infrastructure, not an incentivized role (decdn/adr/architecture.md).
#   iroh_relay_hosts: read the deCDN nodes' IDs (the allowlist) -> baseline ->
#                     grafana_alloy (opt-in, off by default) -> iroh_relay, one relay
#                     at a time
# Standalone entry point (`make deploy-relay`), also imported by publisher.yml. The
# relay is public by design: it terminates its own TLS (Let's Encrypt) on tcp/443
# and binds tcp/80 and udp/7842, opened by playbooks/group_vars/all.yml; its
# metrics stay on loopback. Point nodes at it with decdn_relay_urls — see
# roles/iroh_relay/README.md.
# Before the relay play: the onramp's Caddy needs tcp/80 and tcp/443 too, and only
# one of them can have them. (Under site.yml, sponsord.yml runs first, so on a host
# in both groups the onramp is already up when this refuses; either way the deploy
# fails loudly.) The role itself refuses ports another process holds, so the
# decdn.publisher collection gets the same protection without this repo's groups.
# tests/scripts-test.sh runs this play by its name.
- name: Refuse an iroh relay on a sponsord-onramp host
  hosts: iroh_relay_hosts
  gather_facts: false
  tasks:
    - name: Require the host outside sponsord_onramp_hosts
      ansible.builtin.assert:
        that:
          - "'sponsord_onramp_hosts' not in group_names"
        fail_msg: >-
          {{ inventory_hostname }} is in both iroh_relay_hosts and sponsord_onramp_hosts.
          The relay terminates its own TLS on tcp/80 and tcp/443, which the onramp's
          proxy needs as well: give the relay a host of its own.

# The relay admits only listed endpoint IDs by default (iroh_relay_access:
# allowlist). Read the ID of every deCDN node in this inventory, on the node, so the
# allowlist follows the fleet; a node whose ID cannot be read fails the run here,
# before the relay is touched. Skipped for the other modes, or with
# iroh_relay_allowlist_from_inventory: false.
- name: Read the deCDN nodes' endpoint IDs for the relay allowlist
  hosts: iroh_relay_hosts
  become: true
  gather_facts: false
  tasks:
    # Tagged like the iroh_relay role below (and its tasks, through apply), so a
    # tag-scoped run (--tags iroh_relay / relay) never renders the allowlist
    # without the inventory's nodes.
    - name: Read every deCDN node's endpoint ID
      ansible.builtin.include_role:
        name: iroh_relay
        tasks_from: node-ids
        apply:
          tags: [iroh_relay, relay]
      tags: [iroh_relay, relay]
      when:
        - iroh_relay_access | default('allowlist') == 'allowlist'
        - iroh_relay_allowlist_from_inventory | default(true) | bool

# One relay at a time: a fleet change re-renders every relay's allowlist, and
# restarting them together would drop every relayed connection at once.
- name: Provision iroh relays
  hosts: iroh_relay_hosts
  become: true
  serial: 1
  roles:
    - role: baseline
      tags: [baseline]
    - role: grafana_alloy
      tags: [observability, iroh_relay, relay]
    - role: iroh_relay
      tags: [iroh_relay, relay]
