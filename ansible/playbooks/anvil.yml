---
# INTERNAL-ONLY deployment: our shared anvil devnet behind Caddy basic-auth.
#   baseline -> anvil -> caddy
# This is team tooling, not the product. The public deploy is playbooks/site.yml
# (the deCDN node). Runs on a separate, internal host/group.
- name: Provision the internal anvil devnet
  hosts: anvil_devnet
  become: true
  roles:
    - role: baseline
      tags: [baseline]
    - role: anvil
      tags: [anvil]
    - role: caddy
      tags: [caddy]
