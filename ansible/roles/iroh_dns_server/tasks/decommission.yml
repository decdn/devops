---
# Take the DNS server out of service: `include_role: {name: iroh_dns_server,
# tasks_from: decommission}` (playbooks/decommission.yml, `make decommission
# LIMIT=<host>`). Point every node's decdn_discovery_pkarr_url /
# decdn_discovery_dns_origin elsewhere first (or clear them, back to n0's
# discovery): a node keeps publishing to the server it was told to use, and peers
# resolving under its origin find nothing once it is gone.
#
# What it does: stop iroh-dns-server, disable and remove its systemd unit and its
# restart-inputs record. What
# it KEEPS: the binary, the config under iroh_dns_server_etc, and the state
# directory (the record store, the ACME account and certificates; a re-deploy
# reuses them instead of spending Let's Encrypt's rate limits). The tcp/443 and
# udp+tcp/53 firewall holes stay until the host leaves iroh_dns_server_hosts and
# baseline runs again.

- name: Refuse to decommission in check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: Decommissioning has no dry run; run it without --check once you mean it.

- name: Refuse to decommission more hosts than allowed at once
  ansible.builtin.assert:
    that:
      - decdn_decommission_max_hosts | int > 0
      - ansible_play_hosts_all | length <= decdn_decommission_max_hosts | int
      - decdn_decommission_prompt_seconds | int > 0
    fail_msg: >-
      This run targets {{ ansible_play_hosts_all | length }} hosts
      ({{ ansible_play_hosts_all | sort | join(', ') }}), more than
      decdn_decommission_max_hosts ({{ decdn_decommission_max_hosts }}). Scope it
      with LIMIT, or raise decdn_decommission_max_hosts deliberately.
      decdn_decommission_prompt_seconds must be a positive number of seconds.

# Typed confirmation (AGENTS.md hard rule 4), as the other roles'; a host that
# already confirmed in an earlier play of this run is not asked again.
- name: Ask for typed confirmation
  ansible.builtin.pause:
    prompt: >-
      About to STOP {{ _decom_services | join(', ') }}, REMOVE their systemd units
      and tear down this repo's Grafana Alloy on:
      {{ ansible_play_hosts_all | sort | join(',') }}.
      This one confirmation covers all of them. Nothing on-chain is done.
      Type the host list above exactly to continue
      (times out after {{ decdn_decommission_prompt_seconds }} s)
    seconds: "{{ decdn_decommission_prompt_seconds | int }}"
  register: _iroh_dns_server_decommission_typed
  run_once: true
  vars:
    # Every service this repo's playbooks/decommission.yml stops on these hosts, by
    # their groups, so the one confirmation names all it covers (a later play does
    # not ask again). This role's own service is always listed.
    _decom_groups: "{{ ansible_play_hosts_all | map('extract', hostvars, 'group_names') | flatten | unique }}"
    _decom_services: >-
      {{ ((['decdn-node'] if 'decdn_nodes' in _decom_groups else [])
          + (['iroh-relay'] if 'iroh_relay_hosts' in _decom_groups else [])
          + (['iroh-dns-server'] if 'iroh_dns_server_hosts' in _decom_groups else [])
          + (['sponsord-onramp and its Caddy'] if 'sponsord_onramp_hosts' in _decom_groups else [])
          + (['sponsord'] if 'sponsord_hosts' in _decom_groups else [])
          + ['iroh-dns-server']) | unique }}
  when:
    - decdn_decommission_confirm is not defined
    - not (_decdn_decommission_confirmed | default(false) | bool)

- name: Require the typed confirmation to match the targeted hosts
  ansible.builtin.assert:
    that:
      - (decdn_decommission_confirm | default(_iroh_dns_server_decommission_typed.user_input | default('')) | trim)
        == (ansible_play_hosts_all | sort | join(','))
    fail_msg: >-
      Confirmation did not match "{{ ansible_play_hosts_all | sort | join(',') }}".
      Nothing was changed.
  when: not (_decdn_decommission_confirmed | default(false) | bool)

- name: Remember the confirmation for the rest of this run
  ansible.builtin.set_fact:
    _decdn_decommission_confirmed: true

- name: Check for the iroh-dns-server unit
  ansible.builtin.stat:
    path: "{{ _iroh_dns_server_unit }}"
  register: _iroh_dns_server_decommission_unit

- name: Stop and disable iroh-dns-server
  ansible.builtin.systemd_service:
    name: iroh-dns-server
    state: stopped
    enabled: false
  when: _iroh_dns_server_decommission_unit.stat.exists

- name: Remove the iroh-dns-server unit and its restart-inputs record
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _iroh_dns_server_unit }}"
    - "{{ iroh_dns_server_inputs_checksum_file }}"

# Unconditional: cheap, and right even after an earlier run removed the file but
# failed before reloading.
- name: Reload systemd after removing the unit
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Report what is left to do
  ansible.builtin.debug:
    msg:
      - >-
        {{ ('iroh-dns-server is stopped and its unit removed on ' ~ inventory_hostname ~ '.')
           if _iroh_dns_server_decommission_unit.stat.exists
           else ('No iroh-dns-server unit was installed on ' ~ inventory_hostname ~ '; nothing was stopped.') }}
      - >-
        Kept: {{ iroh_dns_server_bin }}, {{ iroh_dns_server_config_file }}, and the
        record store, ACME account and certificates under
        /var/lib/private/{{ _iroh_dns_server_state_dir | basename }} (a re-deploy
        reuses them; delete them to start over).
      - >-
        tcp/443 and udp+tcp/53 stay open until you take the host out of
        iroh_dns_server_hosts and re-run baseline.
      - >-
        Nodes publishing to https://{{ iroh_dns_server_hostname | default('<hostname>', true) }}/pkarr
        (decdn_discovery_pkarr_url) can no longer be found under its origin: point
        them elsewhere (make deploy) if you have not, and remove the parent zone's
        NS and glue records for it.
