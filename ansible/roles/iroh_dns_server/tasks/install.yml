---
# Install the iroh-dns-server binary. Two methods, selected by
# iroh_dns_server_install_method:
#   "release" (default): download the pinned
#     iroh-dns-server-v<version>-<target>.tar.gz from n0-computer/iroh's GitHub
#     Release, verified against the sha256 pinned in defaults (upstream publishes no
#     signature), then extract. Idempotent and upgrade-aware via a stamp that also
#     records the pinned archive digest and the installed binary's sha256, so a
#     corrected pin, or a binary replaced in place, is downloaded and verified again.
#   "manual": copy a binary from the control machine.
# Every method clears the stamp before it replaces the binary, so an interrupted
# install leaves no stamp vouching for it. The binary has no --version: the stamp
# is written by tasks/main.yml once the running server's /healthz has reported the
# pinned version (the readiness gate).

- name: Install from the pinned GitHub Release tarball
  when: iroh_dns_server_install_method == "release"
  block:
    - name: Name the release archive
      ansible.builtin.set_fact:
        iroh_dns_server_release_archive: >-
          iroh-dns-server-v{{ iroh_dns_server_version }}-{{ iroh_dns_server_target }}.tar.gz
        # The stamp names the target and the pinned archive digest too, so a host
        # whose triple changed or a pin corrected without a version bump is not
        # trusted on the version alone.
        iroh_dns_server_stamp_prefix: >-
          {{ iroh_dns_server_version }} {{ iroh_dns_server_target }}
          {{ iroh_dns_server_sha256[iroh_dns_server_target] }}

    - name: Read the installed-version stamp
      ansible.builtin.slurp:
        src: "{{ _iroh_dns_server_stamp }}"
      register: iroh_dns_server_stamp
      failed_when: false
      changed_when: false

    - name: Hash the installed binary
      ansible.builtin.stat:
        path: "{{ iroh_dns_server_bin }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: iroh_dns_server_bin_pre

    # "<version> <target> <pinned archive sha256> <sha256 of the installed binary>".
    - name: Decide whether (re)install is needed
      ansible.builtin.set_fact:
        iroh_dns_server_need_install: >-
          {{ (iroh_dns_server_stamp.content is not defined)
             or not (iroh_dns_server_bin_pre.stat.exists | default(false))
             or ((iroh_dns_server_stamp.content | b64decode | trim)
                 != iroh_dns_server_stamp_prefix ~ ' ' ~ (iroh_dns_server_bin_pre.stat.checksum | default(''))) }}

    - name: Report that the release download is not simulated in check mode
      ansible.builtin.debug:
        msg: >-
          check mode: skipping the download + verification of iroh-dns-server
          {{ iroh_dns_server_version }}. The config and unit below still diff normally.
      when:
        - iroh_dns_server_need_install
        - ansible_check_mode

    - name: Install iroh-dns-server {{ iroh_dns_server_version }}
      when:
        - iroh_dns_server_need_install
        - not ansible_check_mode
      block:
        # A private staging directory, not a fixed /tmp path: these bytes are trusted
        # on the strength of the pinned digest alone.
        - name: Create a private download staging directory
          ansible.builtin.tempfile:
            state: directory
            prefix: iroh-dns-server-install-
          register: iroh_dns_server_stage
          changed_when: false

        - name: Restrict the staging directory to root
          ansible.builtin.file:
            path: "{{ iroh_dns_server_stage.path }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Create the extraction directory
          ansible.builtin.file:
            path: "{{ iroh_dns_server_stage.path }}/x"
            state: directory
            owner: root
            group: root
            mode: "0700"

        # get_url verifies the checksum before it keeps the file.
        - name: Download the release tarball and verify its sha256
          ansible.builtin.get_url:
            url: >-
              {{ iroh_dns_server_release_base }}/v{{ iroh_dns_server_version }}/{{ iroh_dns_server_release_archive }}
            dest: "{{ iroh_dns_server_stage.path }}/{{ iroh_dns_server_release_archive }}"
            owner: root
            group: root
            mode: "0600"
            checksum: "sha256:{{ iroh_dns_server_sha256[iroh_dns_server_target] }}"

        # Dropped before installing, so a release that then fails the gate leaves no
        # stamp and the next run downloads again.
        - name: Clear the install stamp before installing
          ansible.builtin.file:
            path: "{{ _iroh_dns_server_stamp }}"
            state: absent

        - name: Extract the release tarball
          ansible.builtin.unarchive:
            src: "{{ iroh_dns_server_stage.path }}/{{ iroh_dns_server_release_archive }}"
            dest: "{{ iroh_dns_server_stage.path }}/x"
            remote_src: true
            owner: root
            group: root

        # Only the one binary leaves the staging directory.
        - name: Install the binary
          ansible.builtin.copy:
            src: "{{ iroh_dns_server_stage.path }}/x/{{ _iroh_dns_server_archive_member }}"
            dest: "{{ iroh_dns_server_bin }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          notify: Restart iroh-dns-server

      always:
        - name: Remove the download staging directory
          ansible.builtin.file:
            path: "{{ iroh_dns_server_stage.path }}"
            state: absent
          when: iroh_dns_server_stage.path is defined

- name: Install a binary from the control machine
  when: iroh_dns_server_install_method == "manual"
  block:
    - name: Clear the install stamp before copying
      ansible.builtin.file:
        path: "{{ _iroh_dns_server_stamp }}"
        state: absent

    - name: Copy the iroh-dns-server binary from the control machine
      ansible.builtin.copy:
        src: "{{ iroh_dns_server_manual_bin_src }}"
        dest: "{{ iroh_dns_server_bin }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart iroh-dns-server

# Runs every converge. iroh-dns-server has no --version (clap exits 2 on it), so
# this only proves the binary runs on this host (architecture, glibc) and is the
# CLI the unit's --config flag is written for; the version is checked on the
# running server's /healthz by the readiness gate.
- name: Run the installed iroh-dns-server --help (smoke check)
  ansible.builtin.command:
    argv: ["{{ iroh_dns_server_bin }}", --help]
  register: iroh_dns_server_help
  changed_when: false
  failed_when: false
  # The binary only exists once the copy/extract above really ran.
  when: not ansible_check_mode

- name: Require the installed iroh-dns-server to run
  ansible.builtin.assert:
    that:
      - iroh_dns_server_help.rc == 0
      - "'--config' in iroh_dns_server_help.stdout"
    fail_msg: >-
      {{ iroh_dns_server_bin }} --help exited {{ iroh_dns_server_help.rc }} with
      "{{ (iroh_dns_server_help.stdout ~ ' ' ~ iroh_dns_server_help.stderr) | trim }}",
      without the --config option the unit starts it with. The binary on the host is
      broken, built for another platform, or is not iroh-dns-server. In release mode,
      remove {{ _iroh_dns_server_stamp }} to force a fresh download.
  when: not ansible_check_mode
