---
# sponsord_onramp role defaults. sponsord-onramp is the public side of the deCDN
# onboarding sponsor: the gate page people pass (Cloudflare Turnstile), the
# decdn.sh / decdn.ps1 installers, and the API the installers poll for their
# capability. It holds no wallet. It calls the sponsord daemon on the same host with the daemon's
# API token, so a host in sponsord_onramp_hosts must also be in sponsord_hosts.
#
# The onramp listens on loopback. Caddy, installed by this role unless you turn it
# off, terminates TLS for sponsord_onramp_domain and is the only public listener
# (AGENTS.md hard rule 2). Upstream: github.com/decdn/sponsord, docs/operator.md.

# --- Install method -----------------------------------------------------------
# "release" (default): download the pinned v<version> GitHub Release tarball and
#   verify it against the GPG-signed SHA256SUMS. decdn/sponsord releases its whole
#   workspace (sponsord, sponsord-onramp) from one vX.Y.Z tag.
# "source": clone sponsord_onramp_source_repo at sponsord_onramp_source_ref on the host and
#   `cargo build -p sponsord-onramp` there as an unprivileged build user (see "Build from
#   source" below).
# "manual": copy a locally-built binary from the control machine.
sponsord_onramp_install_method: release    # "release" | "source" | "manual"
sponsord_onramp_manual_bin_src: ""        # manual: control-machine path to the binary
# Alternative to sponsord_onramp_manual_bin_src: the control-machine `target/release`
# dir of a decdn/sponsord checkout (falls back to target/<triple>/release). The role
# checks the binary is an ELF for the host's architecture before shipping it.
sponsord_onramp_release_target_dir: "{{ sponsord_release_target_dir | default('') }}"

# --- Build from source (sponsord_onramp_install_method "source") -----------------------
# The repo and the ref to build: any tag, branch or commit SHA (REQUIRED in
# "source" mode). A branch is re-resolved every run, so a moved branch rebuilds;
# an unchanged commit does not. The URL must not embed credentials.
sponsord_onramp_source_repo: "https://github.com/decdn/sponsord.git"
sponsord_onramp_source_ref: ""
# CARGO_BUILD_JOBS for the build ("" = one per CPU); lower it if the host runs
# out of memory compiling.
sponsord_onramp_source_build_jobs: ""
# Ceiling for the (async) build, in seconds.
sponsord_onramp_source_build_timeout: 7200
# Shared with the decdn_node and sponsord roles, defined identically in each (make
# test-scripts checks): the unprivileged build user (never root), its root-owned
# home (the toolchain, one git clone per role, a per-build work directory) and the
# sha256-pinned rustup-init. Override them in inventory, not per role, so a
# co-located host keeps one toolchain.
decdn_build_user: decdn-build
decdn_build_home: /var/lib/decdn-build
decdn_rustup_version: "1.29.1"
decdn_rustup_sha256:
  x86_64-unknown-linux-gnu: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
  aarch64-unknown-linux-gnu: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433

# --- Release to install ("release" mode) ----------------------------------------
# The decdn/sponsord release to install, a line ("X.Y", the newest finished vX.Y.N)
# or an exact "X.Y.Z": the same one as the sponsord role's sponsord_version.
sponsord_onramp_version: "0.2"
# Derived from the host's gathered architecture (vars/main/arch.yml).
sponsord_onramp_target: "{{ _sponsord_onramp_arch_targets.get(ansible_facts.get('architecture', ''), '') }}"
sponsord_onramp_release_base: "https://github.com/decdn/sponsord/releases/download"
# Where a release line is resolved (GitHub's GET /repos/decdn/sponsord/releases
# shape; 60 unauthenticated requests an hour per address).
sponsord_onramp_release_index: "https://api.github.com/repos/decdn/sponsord/releases?per_page=100"
sponsord_onramp_verify_release_signature: true
# Upstream signs every decdn/sponsord release with the keys in its one KEYS file,
# vendored once, in the sponsord role. Both roles ship side by side (this repo and
# the decdn.publisher collection), so the path holds in either.
sponsord_onramp_release_keyring: "{{ role_path }}/../sponsord/files/sponsord-release-KEYS.asc"

# --- Chain ----------------------------------------------------------------------
# The onramp takes the chain id and the PaymentPool from the daemon (/v1/info). It
# hands users' decdn the CapacityBond (node discovery) and, if set, the SlashJudge
# contract. With a network profile both come from upstream's deployment manifest,
# mirrored into vars/main/networks.yml by scripts/sync-network-profiles.py; an
# explicit inventory value still wins. Defaults to the daemon's sponsord_network.
sponsord_onramp_network: "{{ sponsord_network | default('') }}"
# Internal: set sponsord_onramp_network, not this.
_sponsord_onramp_profile: "{{ _sponsord_onramp_network_profiles.get(sponsord_onramp_network, {}) }}"
sponsord_onramp_capacity_bond_address: "{{ _sponsord_onramp_profile.get('capacity_bond_address', '') }}"
# "" omits it.
sponsord_onramp_slash_judge_address: "{{ _sponsord_onramp_profile.get('slash_judge_address', '') }}"

# REQUIRED. The JSON-RPC endpoint users' decdn reads the chain through. NOT a
# secret, and it must not hold one: the onramp bakes it into the installers every
# user downloads. Use a public endpoint, never
# the keyed URL the daemon uses (sponsord_rpc_url).
sponsord_onramp_rpc_url: ""

# --- Listener -------------------------------------------------------------------
# IPv4 loopback only (asserted): Caddy, or your own proxy, is the public side.
sponsord_onramp_bind_address: 127.0.0.1
sponsord_onramp_port: 8080
# The daemon, on this host. Follows the sponsord role's listener when inventory
# sets it; the fallbacks match roles/sponsord/defaults/main.yml.
sponsord_onramp_daemon_url: >-
  http://{{ sponsord_bind_address | default('127.0.0.1') }}:{{ sponsord_port | default(8090) }}

# --- Public address + TLS front -------------------------------------------------
# "caddy": install Caddy from the distro and let it terminate TLS for
# sponsord_onramp_domain (ACME by default), opening tcp/80 and tcp/443.
# "none": bring your own proxy (nginx, a Cloudflare Tunnel, ...); no package, no
# firewall hole, and sponsord_onramp_public_url is required.
# playbooks/group_vars/all.yml reads this to open the ports, so set it in
# inventory, not in a play's vars.
sponsord_onramp_proxy: caddy              # "caddy" | "none"
sponsord_onramp_domain: ""                # caddy: REQUIRED, e.g. downloads.example.org
# The base URL users reach, baked into the installers and the gate links. https
# only. Derived from the domain in caddy mode.
sponsord_onramp_public_url: >-
  {{ ('https://' ~ sponsord_onramp_domain) if sponsord_onramp_proxy == 'caddy' else '' }}
# "acme": a publicly trusted certificate (Let's Encrypt / ZeroSSL). The domain's
# A/AAAA records must point at this host and tcp/80 + tcp/443 must reach it.
# "internal": Caddy's own local CA, for staging and tests; browsers will not trust it.
sponsord_onramp_caddy_tls: acme           # "acme" | "internal"
sponsord_onramp_acme_email: ""            # optional ACME account contact
# The role owns /etc/caddy/Caddyfile. If that file exists without the role's marker
# and is not the package's untouched default, it belongs to someone else, and the
# role refuses to replace it unless this is true.
sponsord_onramp_caddy_overwrite_config: false
# The header Caddy (or your proxy) puts the client address in; the onramp rate
# limits and gates by it. Caddy (without trusted_proxies) sets X-Forwarded-For to
# the client it saw, discarding any client-sent value, and the onramp uses the
# right-most entry, so clients cannot choose their address. With your own
# proxy, set it only if that proxy is the ONLY way in (CF-Connecting-IP behind
# Cloudflare); otherwise clients pick their own address. "" = the TCP peer.
sponsord_onramp_client_ip_header: "{{ 'X-Forwarded-For' if sponsord_onramp_proxy == 'caddy' else '' }}"

# --- Gate -----------------------------------------------------------------------
# Cloudflare Turnstile: create a widget for sponsord_onramp_domain in the
# Cloudflare dashboard. The sitekey is public; the secret lives on the host (0600
# root) and reaches the onramp as a systemd credential.
sponsord_onramp_turnstile_sitekey: ""     # REQUIRED
# The widget's secret has TWO homes, like sponsord's sponsord_rpc_url: leave it ""
# and write sponsord_onramp_turnstile_secret_file on the host yourself, or set it in
# the git-ignored host_vars/<host>/secret.yml and the role writes that file.
sponsord_onramp_turnstile_secret: ""      # SENSITIVE
# Confirm that sponsord_onramp_turnstile_secret may replace a secret file the role
# did not write (its record is missing, says `host`, or no longer matches).
sponsord_onramp_turnstile_secret_overwrite_host_file: false
sponsord_onramp_brand_name: ""            # [deCDN] name on the gate page
# A control-machine HTML file served as the gate page instead of the built-in one
# (placeholders: upstream docs/operator.md). "" = the built-in page.
sponsord_onramp_gate_template_src: ""

# --- Release the installers install --------------------------------------------
# The decdn/decdn release the installers download `decdn` from. A release line,
# "vX.Y" (the default follows the decdn_node role's), serves the newest finished
# vX.Y.N, looked up in sponsord_onramp_decdn_release_index on every run, with the
# SHA-256 of its SHA256SUMS read from sponsord_onramp_decdn_release_base and
# verified against sponsord_onramp_decdn_keyring first. An exact tag, "vX.Y.Z",
# needs that digest set beside it (`sha256sum SHA256SUMS` after verifying its .asc);
# preflight refuses a tag without one and a line with one.
sponsord_onramp_decdn_release: v0.2       # decdn/decdn line or tag
sponsord_onramp_decdn_sums_sha256: ""     # with a tag only
sponsord_onramp_decdn_release_index: "https://api.github.com/repos/decdn/decdn/releases?per_page=100"
# Where the role reads a line's SHA256SUMS: the installers' own download location
# (<releases base>/decdn/releases/download), unless a test mirror serves it.
sponsord_onramp_decdn_release_base: >-
  {{ (sponsord_onramp_releases_base or 'https://github.com/decdn') ~ '/decdn/releases/download' }}
# decdn/decdn's KEYS, vendored with this role (a copy of the decdn_node role's;
# make test-scripts keeps them identical).
sponsord_onramp_decdn_keyring: decdn-release-KEYS.asc
sponsord_onramp_releases_base: ""         # [https://github.com/decdn]

# --- Limits ("" = the onramp's own default, shown in brackets) -----------------
sponsord_onramp_spending_cap_micro_usdc: ""   # [the daemon's maximum] cap per capability
sponsord_onramp_ttl_secs: ""                  # [the daemon's maximum] TTL per capability
sponsord_onramp_fund_rate_per_min: ""         # [10] POST /v1/fund per address; 0 = off
sponsord_onramp_poll_rate_per_min: ""         # [120] GET /v1/capability per address; 0 = off

# --- Logging ----------------------------------------------------------------------
# RUST_LOG for the onramp: a level (debug) or target=level pairs
# (sponsord_onramp=debug,info). "" omits it and the onramp logs at info. Its
# release is built without tracing's env-filter, so span or field filters are not
# understood: the onramp prints "Ignoring RUST_LOG" and then logs NOTHING, and a
# bare word that is not a level is read as a target. The role accepts only parts
# that are each a level or target=level.
sponsord_onramp_log_level: ""

# --- Files on the host ----------------------------------------------------------
# Beside the daemon's files: the directory and the API token follow the sponsord
# role's sponsord_etc / sponsord_api_token_file when inventory sets them (the
# fallbacks match roles/sponsord/defaults/main.yml).
sponsord_onramp_etc: "{{ sponsord_etc | default('/etc/sponsord') }}"
sponsord_onramp_api_token_file: "{{ sponsord_api_token_file | default(sponsord_onramp_etc ~ '/api-token') }}"
sponsord_onramp_turnstile_secret_file: "{{ sponsord_onramp_etc }}/turnstile-secret"   # inventory or operator (0600)
# "<source> <sha256>" record of who last wrote the Turnstile secret file (the role
# from inventory, or the operator on the host), as sponsord's secret.env record.
sponsord_onramp_turnstile_secret_checksum_file: "{{ sponsord_onramp_etc }}/.turnstile-secret.sha256"
sponsord_onramp_env_file: "{{ sponsord_onramp_etc }}/sponsord-onramp.env"             # non-secret (0644, role-owned)
sponsord_onramp_gate_template_file: "{{ sponsord_onramp_etc }}/onramp-gate.html"      # when _src is set (0644)
# sha256 record of every restart input (token, Turnstile secret, env file, gate
# page, unit, binary) as of the last converge that saw the onramp healthy.
sponsord_onramp_inputs_checksum_file: "{{ sponsord_onramp_etc }}/.onramp-inputs.sha256"

sponsord_onramp_bin: /usr/local/bin/sponsord-onramp

# --- Readiness --------------------------------------------------------------------
# The onramp binds only after reading the daemon's /v1/info, so /healthz answering
# 200 is the config gate. A timeout FAILS the deploy. Window ~60s.
sponsord_onramp_readiness_retries: 30
sponsord_onramp_readiness_delay: 2

# --- Lifecycle: decommission (tasks_from: decommission) -------------------------
# Only read by that entry point (playbooks/decommission.yml). Shared with decdn_node
# and sponsord (and identical there, `make test-scripts` checks): one typed
# confirmation covers every service on the host. A non-interactive run sets
# decdn_decommission_confirm to the comma-joined, sorted host list (deliberately NOT
# defaulted here).
decdn_decommission_max_hosts: 1
decdn_decommission_prompt_seconds: 300   # an unanswered confirmation prompt fails closed after this
