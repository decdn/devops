---
# Each handler reloads systemd itself rather than relying on a separate "Reload
# systemd" handler running first (see roles/sponsord/handlers/main.yml).
- name: Restart sponsord-onramp
  ansible.builtin.systemd:
    name: sponsord-onramp
    state: restarted
    daemon_reload: true

# A reload is graceful: nginx's old workers finish their requests. Under --check on
# a host without nginx its install is only simulated, so there is nothing to reload.
- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: not ansible_check_mode or sponsord_onramp_nginx_installed | default(false)
