---
# Take the onramp out of service: `include_role: {name: sponsord_onramp,
# tasks_from: decommission}` (playbooks/decommission.yml, `make decommission
# LIMIT=<host>`). It runs before sponsord's own decommission: the onramp needs the
# daemon.
#
# What it does: stop the onramp and the certificate renewal timer and remove their
# systemd units, disable the role's nginx site and stop
# nginx when that was the only site it served (a site someone else enabled keeps
# nginx running, minus the role's), and retire a Caddy the role ran before nginx.
# What it KEEPS: the Turnstile secret and the other files under
# sponsord_onramp_etc, the certificate and lego's account, the binaries and the
# nginx package.
# The tcp/80 + tcp/443 firewall holes stay until the host leaves
# sponsord_onramp_hosts and baseline runs again.

- name: Refuse to decommission in check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: Decommissioning has no dry run; run it without --check once you mean it.

- name: Refuse to decommission more hosts than allowed at once
  ansible.builtin.assert:
    that:
      - decdn_decommission_max_hosts | int > 0
      - ansible_play_hosts_all | length <= decdn_decommission_max_hosts | int
      - decdn_decommission_prompt_seconds | int > 0
    fail_msg: >-
      This run targets {{ ansible_play_hosts_all | length }} hosts
      ({{ ansible_play_hosts_all | sort | join(', ') }}), more than
      decdn_decommission_max_hosts ({{ decdn_decommission_max_hosts }}). Scope it
      with LIMIT, or raise decdn_decommission_max_hosts deliberately.
      decdn_decommission_prompt_seconds must be a positive number of seconds.

# Typed confirmation (AGENTS.md hard rule 4), as decdn_node's and sponsord's; a host
# that already confirmed in an earlier play of this run is not asked again.
- name: Ask for typed confirmation
  ansible.builtin.pause:
    prompt: >-
      About to STOP {{ _decom_services | join(', ') }}, REMOVE their systemd units
      and tear down this repo's Grafana Alloy on:
      {{ ansible_play_hosts_all | sort | join(',') }}.
      This one confirmation covers all of them. Nothing on-chain is done.
      Type the host list above exactly to continue
      (times out after {{ decdn_decommission_prompt_seconds }} s)
    seconds: "{{ decdn_decommission_prompt_seconds | int }}"
  register: _sponsord_onramp_decommission_typed
  run_once: true
  vars:
    # Every service this repo's playbooks/decommission.yml stops on these hosts, by
    # their groups, so the one confirmation names all it covers (a later play does
    # not ask again). This role's own service is always listed.
    _decom_groups: "{{ ansible_play_hosts_all | map('extract', hostvars, 'group_names') | flatten | unique }}"
    _decom_services: >-
      {{ ((['decdn-node'] if 'decdn_nodes' in _decom_groups else [])
          + (['iroh-relay'] if 'iroh_relay_hosts' in _decom_groups else [])
          + (['iroh-dns-server'] if 'iroh_dns_server_hosts' in _decom_groups else [])
          + (['decdn-gateway and its nginx'] if 'decdn_gateway_hosts' in _decom_groups else [])
          + (['sponsord-onramp and its nginx'] if 'sponsord_onramp_hosts' in _decom_groups else [])
          + (['sponsord'] if 'sponsord_hosts' in _decom_groups else [])
          + ['sponsord-onramp and its nginx']) | unique }}
  when:
    - decdn_decommission_confirm is not defined
    - not (_decdn_decommission_confirmed | default(false) | bool)

- name: Require the typed confirmation to match the targeted hosts
  ansible.builtin.assert:
    that:
      - (decdn_decommission_confirm | default(_sponsord_onramp_decommission_typed.user_input | default('')) | trim)
        == (ansible_play_hosts_all | sort | join(','))
    fail_msg: >-
      Confirmation did not match "{{ ansible_play_hosts_all | sort | join(',') }}".
      Nothing was changed.
  when: not (_decdn_decommission_confirmed | default(false) | bool)

- name: Remember the confirmation for the rest of this run
  ansible.builtin.set_fact:
    _decdn_decommission_confirmed: true

- name: Check for the sponsord-onramp unit and the renewal timer
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  register: _sponsord_onramp_decommission_units
  loop: [sponsord-onramp.service, sponsord-onramp-certs.timer]

- name: Stop and disable sponsord-onramp and the renewal timer
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ _sponsord_onramp_decommission_units.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove the onramp's units and its restart-inputs record
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/sponsord-onramp.service
    - /etc/systemd/system/sponsord-onramp-certs.service
    - /etc/systemd/system/sponsord-onramp-certs.timer
    - "{{ sponsord_onramp_inputs_checksum_file }}"

# Unconditional: cheap, and right even after an earlier run removed the files but
# failed before reloading.
- name: Reload systemd after removing the units
  ansible.builtin.systemd_service:
    daemon_reload: true

# With the backend gone nginx would answer every request with a 502 on the public
# ports. Only the role's site is disabled; nginx stops only when nothing else is
# enabled.
- name: Check the nginx site for this role's marker
  ansible.builtin.command:
    argv: [grep, -qF, "{{ _sponsord_onramp_nginx_marker }}", "{{ _sponsord_onramp_nginx_site }}"]
  register: _sponsord_onramp_decommission_site
  changed_when: false
  # 1 = no marker, 2 = no file (or unreadable): neither is the role's site.
  failed_when: false

- name: Disable the role's nginx site
  ansible.builtin.file:
    path: "{{ _sponsord_onramp_nginx_site_link }}"
    state: absent
  when: _sponsord_onramp_decommission_site.rc == 0

- name: List what else nginx serves
  ansible.builtin.find:
    paths: [/etc/nginx/sites-enabled, /etc/nginx/conf.d]
    file_type: any
    hidden: true
  register: _sponsord_onramp_decommission_others
  when: _sponsord_onramp_decommission_site.rc == 0

- name: Stop and disable nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: stopped
    enabled: false
  when:
    - _sponsord_onramp_decommission_site.rc == 0
    - _sponsord_onramp_decommission_others.matched == 0

- name: Reload nginx without the role's site
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when:
    - _sponsord_onramp_decommission_site.rc == 0
    - _sponsord_onramp_decommission_others.matched > 0

# A host never converged since the move to nginx still runs the role's Caddy.
- name: Retire the role's earlier Caddy
  ansible.builtin.include_tasks: caddy-remove.yml
  vars:
    _sponsord_onramp_caddy_purge: true

- name: Report what is left to do
  ansible.builtin.debug:
    msg:
      - >-
        sponsord-onramp is stopped and its units removed on {{ inventory_hostname }}
        {{- "; the role's nginx site is disabled" if _sponsord_onramp_decommission_site.rc == 0
            else "; no nginx site of this role's was found" }}
        {{- "; the role's earlier Caddy is removed" if sponsord_onramp_legacy_caddy.rc | default(1) == 0 else "" }}.
      - >-
        Kept: {{ sponsord_onramp_turnstile_secret_file }} and the other files under
        {{ sponsord_onramp_etc }}, the certificate under {{ sponsord_onramp_acme_dir }},
        {{ sponsord_onramp_bin }}, lego and the nginx package.
      - >-
        tcp/80 and tcp/443 stay open until you take the host out of
        sponsord_onramp_hosts and re-run baseline.
