---
# Caddy in front of the onramp: the host's only public HTTP listener (tcp/80 for
# the ACME challenge and the https redirect, tcp/443). playbooks/group_vars/all.yml
# opens both in the baseline firewall for hosts in sponsord_onramp_hosts while
# sponsord_onramp_proxy is "caddy". The distro package brings its own hardened unit
# (user caddy, CAP_NET_BIND_SERVICE only); main.yml has already refused a Caddy
# this role does not own.

# curl: the probe at the end of this file.
- name: Install Caddy from the distribution
  ansible.builtin.apt:
    name: [caddy, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

# `caddy validate` loads the config the way `caddy run` does (it also provisions
# the TLS automation), so a Caddyfile that would not start never lands.
- name: Template the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ sponsord_onramp_caddyfile }}"
    owner: root
    group: root
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Restart caddy

- name: Apply pending Caddy changes
  ansible.builtin.meta: flush_handlers

# Under --check on a host without Caddy the install above is only simulated, so
# there is no unit to start yet.
- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
  when: not ansible_check_mode or 'caddy' in ansible_facts.packages

# The whole chain, as a user would reach it but pinned to this host: TLS for the
# domain, the proxy, the onramp. With ACME the certificate can lag (DNS not yet
# pointed here, a rate limit), so that probe only warns; with Caddy's internal CA
# nothing outside the host is involved, so it is fatal.
- name: Probe the onramp through Caddy
  ansible.builtin.command:
    argv: >-
      {{ ['curl', '--silent', '--show-error', '--fail', '--max-time', '5',
          '--retry', sponsord_onramp_readiness_retries | string,
          '--retry-delay', sponsord_onramp_readiness_delay | string,
          '--retry-max-time', '60', '--retry-all-errors',
          '--resolve', sponsord_onramp_domain ~ ':443:127.0.0.1']
         + (['--insecure'] if sponsord_onramp_caddy_tls == 'internal' else [])
         + ['https://' ~ sponsord_onramp_domain ~ '/healthz'] }}
  register: sponsord_onramp_caddy_probe
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Report an onramp that is not reachable through Caddy
  ansible.builtin.fail:
    msg: |-
      https://{{ sponsord_onramp_domain }}/healthz did not answer through Caddy on this
      host (curl exit {{ sponsord_onramp_caddy_probe.rc }}: {{ sponsord_onramp_caddy_probe.stderr | trim }}).
      The onramp itself is healthy on loopback, so the fault is in Caddy:
        sudo journalctl -u caddy -e
  when:
    - not ansible_check_mode
    - sponsord_onramp_caddy_tls == 'internal'
    - sponsord_onramp_caddy_probe.rc != 0

- name: Warn that the public certificate is not in place yet
  ansible.builtin.debug:
    msg: |-
      WARNING: https://{{ sponsord_onramp_domain }}/healthz did not answer through Caddy
      on this host yet (curl exit {{ sponsord_onramp_caddy_probe.rc }}:
      {{ sponsord_onramp_caddy_probe.stderr | trim }}). With ACME that usually means the
      certificate is not issued yet: check that the domain's A/AAAA records point at
      this host and that tcp/80 and tcp/443 reach it, then read
        sudo journalctl -u caddy -e
      Users cannot reach the onramp until this answers.
  when:
    - not ansible_check_mode
    - sponsord_onramp_caddy_tls == 'acme'
    - sponsord_onramp_caddy_probe.rc != 0
