---
# The decdn/decdn release the installers install `decdn` from, as the tag and
# SHA256SUMS digest the onramp serves (ONRAMP_DECDN_RELEASE, _SUMS_SHA256).
#
# An exact sponsord_onramp_decdn_release comes with the operator's
# sponsord_onramp_decdn_sums_sha256 and is served as it is. A line ("v0.2") resolves
# to the newest finished release in it (tasks/resolve-release.yml), and its digest
# is taken from that release's SHA256SUMS, fetched from where the installers fetch
# it and verified against the decdn/decdn KEYS vendored with this role first: every
# installer trusts this digest, so it is never taken from an unsigned file. A new
# release in the line therefore reaches the installers on the next run (and
# restarts the onramp, which reads its env file only at start).
#
# Check mode fetches and hashes the manifest to report the env file's diff, but
# does not verify it (gnupg may not be installed yet); the real run does. The release
# served is recorded on the host, by either path, so when GitHub's release list cannot
# be read the resolver keeps serving it (its SHA256SUMS still comes from the release
# itself), and never a release an exact pin has since moved the installers off.
- name: Serve an exact decdn release as pinned
  ansible.builtin.set_fact:
    _onramp_decdn_release: "{{ sponsord_onramp_decdn_release }}"
    _onramp_decdn_sums_sha256: "{{ sponsord_onramp_decdn_sums_sha256 }}"
  when: sponsord_onramp_decdn_sums_sha256 | length > 0

- name: Resolve the decdn release line the installers use
  when: sponsord_onramp_decdn_sums_sha256 | length == 0
  block:
    - name: Resolve sponsord_onramp_decdn_release
      ansible.builtin.include_tasks: resolve-release.yml
      vars:
        _rr_spec: "{{ sponsord_onramp_decdn_release[1:] }}"
        _rr_index: "{{ sponsord_onramp_decdn_release_index }}"
        _rr_name: sponsord_onramp_decdn_release
        _rr_stamp: "{{ _sponsord_onramp_decdn_record }}"

    - name: Name the resolved decdn release
      ansible.builtin.set_fact:
        _onramp_decdn_release: "v{{ _rr_version }}"

    - name: Fetch and verify the SHA256SUMS of decdn {{ _onramp_decdn_release }}
      block:
        - name: Create a private staging directory for the decdn manifest
          ansible.builtin.tempfile:
            state: directory
            prefix: onramp-decdn-
          register: _onramp_decdn_stage
          check_mode: false
          changed_when: false

        - name: Download the decdn SHA256SUMS and its signature
          ansible.builtin.get_url:
            url: "{{ sponsord_onramp_decdn_release_base }}/{{ _onramp_decdn_release }}/{{ item }}"
            dest: "{{ _onramp_decdn_stage.path }}/{{ item }}"
            owner: root
            group: root
            mode: "0600"
          loop: [SHA256SUMS, SHA256SUMS.asc]
          check_mode: false
          changed_when: false

        - name: Ensure gnupg is available to verify the decdn manifest
          ansible.builtin.package:
            name: gnupg
            state: present
          when: not ansible_check_mode

        - name: Stage the decdn release signing keyring
          ansible.builtin.copy:
            src: "{{ sponsord_onramp_decdn_keyring }}"
            dest: "{{ _onramp_decdn_stage.path }}/KEYS.asc"
            owner: root
            group: root
            mode: "0600"
          when: not ansible_check_mode

        # As roles/decdn_node/tasks/install.yml: an isolated GNUPGHOME, and the
        # status lines parsed, since gpg exits 0 for a good signature from an
        # expired or revoked key.
        - name: Verify the decdn SHA256SUMS signature
          ansible.builtin.shell:
            chdir: "{{ _onramp_decdn_stage.path }}"
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              export GNUPGHOME="{{ _onramp_decdn_stage.path }}/gnupg"
              mkdir -p "$GNUPGHOME"
              chmod 700 "$GNUPGHOME"
              gpg --batch --quiet --no-autostart --import KEYS.asc
              gpg --batch --no-autostart --status-fd 3 --verify SHA256SUMS.asc SHA256SUMS \
                3>gpg-status.txt
              if grep -qE '^\[GNUPG:\] (EXPKEYSIG|REVKEYSIG|EXPSIG)' gpg-status.txt; then
                echo "decdn's SHA256SUMS carries a good signature from an EXPIRED or" >&2
                echo "REVOKED release key. Re-sync" >&2
                echo "roles/sponsord_onramp/files/decdn-release-KEYS.asc from upstream KEYS," >&2
                echo "or pin an exact release and its digest." >&2
                exit 1
              fi
              grep -q '^\[GNUPG:\] VALIDSIG ' gpg-status.txt
          register: _onramp_decdn_sig
          changed_when: false
          when: not ansible_check_mode

        - name: Hash the decdn SHA256SUMS
          ansible.builtin.stat:
            path: "{{ _onramp_decdn_stage.path }}/SHA256SUMS"
            get_checksum: true
            checksum_algorithm: sha256
          register: _onramp_decdn_sums_stat

        - name: Record the decdn SHA256SUMS digest
          ansible.builtin.set_fact:
            _onramp_decdn_sums_sha256: "{{ _onramp_decdn_sums_stat.stat.checksum }}"

      always:
        - name: Remove the decdn manifest staging directory
          ansible.builtin.file:
            path: "{{ _onramp_decdn_stage.path }}"
            state: absent
          check_mode: false
          changed_when: false
          when: _onramp_decdn_stage.path is defined

- name: Ensure the onramp's state directory exists
  ansible.builtin.file:
    path: "{{ _sponsord_onramp_decdn_record | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record the decdn release the installers are served
  ansible.builtin.copy:
    dest: "{{ _sponsord_onramp_decdn_record }}"
    content: "{{ _onramp_decdn_release[1:] }}\n"
    owner: root
    group: root
    mode: "0644"
