---
# The publicly trusted certificate for sponsord_onramp_domain, from lego over ACME
# HTTP-01: lego writes the challenge into sponsord_onramp_acme_webroot and nginx
# serves it on tcp/80 (the site is already up, http-only until this certificate
# exists). No DNS credentials are involved. Renewed by sponsord-onramp-certs.timer.
# Mirrors roles/decdn_gateway/tasks/tls.yml's acme half, which carries the
# rationale for the record, the force file and the pause.
#
# --- acme -------------------------------------------------------------------------
- name: Obtain the certificate with lego
  when: sponsord_onramp_tls == 'acme'
  block:
    - name: Name the lego archive and its digest
      ansible.builtin.set_fact:
        sponsord_onramp_lego_archive: >-
          lego_v{{ sponsord_onramp_lego_version }}_linux_{{ _lego_arch }}.tar.gz
        sponsord_onramp_lego_digest: "{{ sponsord_onramp_lego_sha256[_lego_arch] }}"
        sponsord_onramp_lego_url: >-
          {{ sponsord_onramp_lego_release_base }}/v{{ sponsord_onramp_lego_version
          }}/lego_v{{ sponsord_onramp_lego_version }}_linux_{{ _lego_arch }}.tar.gz
        # The stamp names the pinned archive digest too, so a corrected pin is
        # downloaded and verified again.
        sponsord_onramp_lego_stamp_want: >-
          {{ sponsord_onramp_lego_version }} {{ sponsord_onramp_lego_sha256[_lego_arch] }}
      vars:
        _lego_arch: "{{ _sponsord_onramp_lego_arches[sponsord_onramp_target] }}"

    - name: Read the lego install stamp
      ansible.builtin.slurp:
        src: "{{ _sponsord_onramp_lego_stamp }}"
      register: sponsord_onramp_lego_stamp
      failed_when: false
      changed_when: false

    - name: Check for the lego binary
      ansible.builtin.stat:
        path: "{{ sponsord_onramp_lego_bin }}"
      register: sponsord_onramp_lego_bin_stat

    # lego publishes no signature, so the archive is trusted on the digest pinned in
    # defaults alone (as the iroh roles' releases).
    - name: Install lego {{ sponsord_onramp_lego_version }}
      when:
        - not ansible_check_mode
        - >-
          not sponsord_onramp_lego_bin_stat.stat.exists
          or (sponsord_onramp_lego_stamp.content | default('') | b64decode | trim) != sponsord_onramp_lego_stamp_want
      block:
        - name: Create a private lego staging directory
          ansible.builtin.tempfile:
            state: directory
            prefix: sponsord-onramp-lego-
          register: sponsord_onramp_lego_stage
          changed_when: false

        - name: Restrict the lego staging directory to root
          ansible.builtin.file:
            path: "{{ sponsord_onramp_lego_stage.path }}/x"
            state: directory
            owner: root
            group: root
            mode: "0700"

        # get_url verifies the checksum before it keeps the file.
        - name: Download lego and verify its sha256
          ansible.builtin.get_url:
            url: "{{ sponsord_onramp_lego_url }}"
            dest: "{{ sponsord_onramp_lego_stage.path }}/{{ sponsord_onramp_lego_archive }}"
            owner: root
            group: root
            mode: "0600"
            checksum: "sha256:{{ sponsord_onramp_lego_digest }}"

        - name: Clear the lego stamp before installing
          ansible.builtin.file:
            path: "{{ _sponsord_onramp_lego_stamp }}"
            state: absent

        - name: Extract lego
          ansible.builtin.unarchive:
            src: "{{ sponsord_onramp_lego_stage.path }}/{{ sponsord_onramp_lego_archive }}"
            dest: "{{ sponsord_onramp_lego_stage.path }}/x"
            remote_src: true
            owner: root
            group: root

        - name: Install the lego binary
          ansible.builtin.copy:
            src: "{{ sponsord_onramp_lego_stage.path }}/x/lego"
            dest: "{{ sponsord_onramp_lego_bin }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"

        - name: Run the installed lego --version
          ansible.builtin.command:
            argv: ["{{ sponsord_onramp_lego_bin }}", --version]
          register: sponsord_onramp_lego_installed
          changed_when: false

        - name: Require the pinned lego version
          ansible.builtin.assert:
            that:
              - >-
                sponsord_onramp_lego_installed.stdout
                is match('^lego version ' ~ (sponsord_onramp_lego_version | regex_escape) ~ ' ')
            fail_msg: >-
              {{ sponsord_onramp_lego_bin }} --version printed
              "{{ sponsord_onramp_lego_installed.stdout | trim }}", not lego
              {{ sponsord_onramp_lego_version }}.

        - name: Record the installed lego
          ansible.builtin.copy:
            dest: "{{ _sponsord_onramp_lego_stamp }}"
            content: "{{ sponsord_onramp_lego_stamp_want }}\n"
            owner: root
            group: root
            mode: "0644"

      always:
        - name: Remove the lego staging directory
          ansible.builtin.file:
            path: "{{ sponsord_onramp_lego_stage.path }}"
            state: absent
          when: sponsord_onramp_lego_stage.path is defined

    - name: Install lego's deploy hook
      ansible.builtin.copy:
        src: certs-deployed
        dest: "{{ _sponsord_onramp_certs_deployed }}"
        owner: root
        group: root
        mode: "0755"

    - name: Ensure lego's state directory exists
      ansible.builtin.file:
        path: "{{ sponsord_onramp_acme_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # nginx serves <webroot>/.well-known/acme-challenge/ to the ACME server, so the
    # path is world-readable; lego writes only the short-lived challenge tokens there.
    - name: Ensure the HTTP-01 webroot exists
      ansible.builtin.file:
        path: "{{ sponsord_onramp_acme_webroot }}/.well-known/acme-challenge"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check for the renewal timer of an earlier run
      ansible.builtin.stat:
        path: /etc/systemd/system/sponsord-onramp-certs.timer
      register: sponsord_onramp_timer_unit

    # Serialized with the timer, before anything is read or written: a renewal under
    # way for the previous server or domain could otherwise replace the certificate
    # after the decision below (on a revert, while the record already names the
    # wanted CA), or clear a newer force between its hook's check and delete. The
    # timer is stopped and any run in flight waited for (an ACME run can take
    # a minute); it comes back whatever happens (always:).
    - name: Settle the certificate with the timer paused
      block:
        # Not a change of its own: the timer comes back below. The module's status is
        # the unit's state before the pause, which decides whether that is a change.
        - name: Pause the renewal timer
          ansible.builtin.systemd:
            name: sponsord-onramp-certs.timer
            state: stopped
          register: sponsord_onramp_timer_paused
          changed_when: false
          when:
            - sponsord_onramp_timer_unit.stat.exists
            - not ansible_check_mode

        - name: Wait for a certificate run already under way
          ansible.builtin.command:
            argv: [systemctl, show, -P, ActiveState, sponsord-onramp-certs.service]
          register: sponsord_onramp_certs_state
          changed_when: false
          until: sponsord_onramp_certs_state.stdout | trim in ['inactive', 'failed']
          retries: 180
          delay: 5
          when:
            - sponsord_onramp_timer_unit.stat.exists
            - not ansible_check_mode

        # The unit is the one place the lego command line lives: the timer renews
        # through it, and the first issuance below runs it too.
        - name: Install the certificate service and its timer
          ansible.builtin.template:
            src: "{{ item }}.j2"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: "0644"
          loop: [sponsord-onramp-certs.service, sponsord-onramp-certs.timer]
          register: sponsord_onramp_certs_units

        - name: Load the certificate units
          ansible.builtin.systemd:
            daemon_reload: true
          when: sponsord_onramp_certs_units.changed and not ansible_check_mode

        - name: Check for the certificate
          ansible.builtin.stat:
            path: "{{ sponsord_onramp_cert_file }}"
          register: sponsord_onramp_cert_stat

        # "<server> <domain>", recorded after the last run that issued it. A record that
        # differs (a new domain or ACME server, or a run that failed after either
        # changed) keeps the certificate pending until a run succeeds: the unit file
        # alone cannot tell, since it no longer changes on the run after a failure.
        - name: Read what the certificate was last issued for
          ansible.builtin.slurp:
            src: "{{ _sponsord_onramp_issued_for }}"
          register: sponsord_onramp_issued_for
          failed_when: false
          changed_when: false

        # A certificate from before the record existed: adopted when its names are the
        # wanted ones (its CA cannot be read back reliably, so it is taken as the
        # configured one), reissued otherwise.
        - name: Read the existing certificate's names
          ansible.builtin.command:
            argv: [openssl, x509, -in, "{{ sponsord_onramp_cert_file }}", -noout, -ext, subjectAltName]
          register: sponsord_onramp_cert_names
          changed_when: false
          failed_when: false
          check_mode: false
          when:
            - sponsord_onramp_cert_stat.stat.exists
            - sponsord_onramp_issued_for.content is not defined

        - name: Decide whether the certificate must be issued again
          ansible.builtin.set_fact:
            sponsord_onramp_issue_for: "{{ _want }}"
            sponsord_onramp_need_issue: >-
              {{ not sponsord_onramp_cert_stat.stat.exists
                 or (sponsord_onramp_issued_for.content is defined
                     and (sponsord_onramp_issued_for.content | b64decode | trim) != _want)
                 or (sponsord_onramp_issued_for.content is not defined
                     and (sponsord_onramp_cert_names.stdout | default('')
                          | regex_findall('DNS:([^,\\s]+)') | sort)
                         != [sponsord_onramp_domain]) }}
          vars:
            _want: "{{ sponsord_onramp_acme_server }} {{ sponsord_onramp_domain }}"

        # An existing certificate that is not due would be kept: force the reissue,
        # until a run succeeds (the file is removed below), including timer runs.
        - name: Force the next issuance
          ansible.builtin.copy:
            dest: "{{ _sponsord_onramp_force_env }}"
            # The last line names what it forces, so a run already under way for another
            # server or domain does not clear it (files/certs-deployed).
            content: |
              LEGO_RENEW_FORCE=true
              LEGO_ARI_DISABLE=true
              SPONSORD_ONRAMP_FORCE_FOR={{ sponsord_onramp_issue_for }}
            owner: root
            group: root
            mode: "0600"
          when:
            - sponsord_onramp_need_issue
            - sponsord_onramp_cert_stat.stat.exists

        # The certificate is already the wanted one (e.g. reverted to its CA after a
        # failed switch): a force left for another server or domain would make every
        # timer run reissue from this one, and its deploy hook would never clear it.
        - name: Remove a force the wanted certificate no longer needs
          ansible.builtin.file:
            path: "{{ _sponsord_onramp_force_env }}"
            state: absent
          when: not sponsord_onramp_need_issue

        # Synchronous: the https server is added only once the certificate exists
        # (front.yml includes the site again after this), and a changed domain or CA
        # must not wait for the timer. systemctl start waits for a oneshot to finish
        # (the units were loaded above); its exit status is the run's.
        - name: Obtain or update the certificate now
          ansible.builtin.command:
            argv: [systemctl, start, sponsord-onramp-certs.service]
          register: sponsord_onramp_certs_run
          changed_when: true
          failed_when: false
          when:
            - not ansible_check_mode
            - sponsord_onramp_need_issue or sponsord_onramp_certs_units.changed

        - name: Re-check for the certificate
          ansible.builtin.stat:
            path: "{{ sponsord_onramp_cert_file }}"
          register: sponsord_onramp_cert_post
          when: sponsord_onramp_certs_run is not skipped

        - name: Report a certificate lego could not obtain
          ansible.builtin.fail:
            msg: |-
              lego did not obtain a certificate for {{ sponsord_onramp_domain }}
              (systemctl start exited {{ sponsord_onramp_certs_run.rc }}). The ACME server
              fetches http://{{ sponsord_onramp_domain }}/.well-known/acme-challenge/ from
              this host's nginx: check that the domain's A/AAAA records point here and
              that tcp/80 reaches it from the internet, then read the reason:
                sudo journalctl -u sponsord-onramp-certs -e
              The onramp is running and nginx serves its http redirect; https serves the
              previous certificate if there was one, and otherwise stays closed until a
              certificate is issued. Re-run the deploy once it can be.
              Use sponsord_onramp_acme_server: letsencrypt-staging while iterating, so failed
              attempts do not spend the production rate limits.
          when:
            - sponsord_onramp_certs_run is not skipped
            - sponsord_onramp_certs_run.rc != 0 or not sponsord_onramp_cert_post.stat.exists

        # A pending reissue counts as done only when the deploy hook recorded it: lego
        # exits 0 after a run that issued nothing too.
        - name: Read the record after the run
          ansible.builtin.slurp:
            src: "{{ _sponsord_onramp_issued_for }}"
          register: sponsord_onramp_issued_after
          failed_when: false
          when:
            - sponsord_onramp_certs_run is not skipped
            - sponsord_onramp_need_issue

        - name: Report a run that issued nothing
          ansible.builtin.fail:
            msg: |-
              lego exited 0 but issued no certificate for {{ sponsord_onramp_issue_for }}
              (the deploy hook did not record one). Read why:
                sudo journalctl -u sponsord-onramp-certs -e
          when:
            - sponsord_onramp_certs_run is not skipped
            - sponsord_onramp_need_issue
            - (sponsord_onramp_issued_after.content | default('') | b64decode | trim) != sponsord_onramp_issue_for

        # A certificate from before the record existed, adopted as it is: no run issued
        # it, so the role records it itself.
        - name: Record an adopted certificate
          ansible.builtin.copy:
            dest: "{{ _sponsord_onramp_issued_for }}"
            content: "{{ sponsord_onramp_issue_for }}\n"
            owner: root
            group: root
            mode: "0600"
          when:
            - not ansible_check_mode
            - not sponsord_onramp_need_issue
            - sponsord_onramp_issued_for.content is not defined

      always:
        # A change only when the timer was not already enabled and running before the
        # pause, so a converge that settles nothing is idempotent.
        - name: Enable and start the renewal timer
          ansible.builtin.systemd:
            name: sponsord-onramp-certs.timer
            enabled: true
            state: started
            daemon_reload: true
          register: sponsord_onramp_timer_started
          changed_when: >-
            sponsord_onramp_timer_started is changed
            and not (sponsord_onramp_timer_paused.status.ActiveState | default('') == 'active'
                     and sponsord_onramp_timer_paused.status.UnitFileState | default('') == 'enabled')
          when: not ansible_check_mode or sponsord_onramp_lego_bin_stat.stat.exists
