---
# baseline role defaults. Override in inventory/group_vars for a real deployment.

# Sudo operators (admin accounts), created + keyed BEFORE ssh_hardening disables root
# login. ONE list — no separate admin knobs. "Deploy as yourself" by default: the runner
# (the control-machine $USER of whoever runs ansible-playbook, plus its ~/.ssh key) is
# auto-detected and prepended as the lockout-critical head, so the operator running
# `make deploy` is provisioned WITHOUT appearing in any committed file. Add any other
# admins to baseline_sudo_users; list yourself there (same name) to OVERRIDE the
# auto-detected head with explicit key(s)/settings. Each operator is created key-only:
# member of `sudo`, a NOPASSWD sudoers.d drop-in, and a locked password (login by key
# only). Pubkeys only — no passwords.
# Shape: [{name: <login>, keys: ["<full pubkey string>", ...], passwordless: <bool>}, ...]
# (`passwordless` is optional per entry; it defaults to baseline_sudo_passwordless below.)
# The lockout-guard assert in tasks/main.yml aborts the run (before any hardening) unless
# the resolved set has a NON-ROOT account with a key — so hardening never runs keyless.
baseline_sudo_users: []
# Auto-detect the runner ($USER + ~/.ssh id_ed25519 > ecdsa > rsa) and prepend it as the
# operator-set head. On (default) = zero-config deploy-as-yourself. Set false to provision
# ONLY the explicit baseline_sudo_users (e.g. CI/cron, where $USER may be root/unset or a
# shared automation user you don't want to grant a permanent sudo account).
# NOTE: under `sudo ansible-playbook`, cron, or CI the $USER/$HOME — and thus the
# autodetected key — may not be yours; turn this off and list admins explicitly there.
baseline_sudo_autodetect_runner: true
# Default sudo mode for operators without a per-entry `passwordless`. true (default) =
# key-only: a NOPASSWD sudoers drop-in AND a locked password, so non-interactive sudo /
# `make deploy` works with no become password and no password can authenticate. false =
# classic password sudo (you must then set a password on the account yourself, e.g.
# `passwd <user>`, to be able to sudo once ssh_hardening disables root login).
baseline_sudo_passwordless: true
# Optional inbound-SSH source allowlist (CIDRs). Empty = accept from any source.
ssh_allow_cidrs: []

# Extra public inbound ports beyond SSH. Each item: {proto, port, comment}.
# Loopback services need NOTHING here; only genuinely public listeners (e.g. the
# decdn node's QUIC udp/4433) do. Set per host/group, e.g. in group_vars.
baseline_extra_inbound: []

# --- os_hardening sysctl overrides (keep node connectivity under CIS hardening) ---
# devsec.hardening.os_hardening applies CIS-style network sysctls that can degrade a
# node. baseline feeds these knobs into its sysctl_overwrite so the hardened defaults
# still apply everywhere EXCEPT where a node needs them relaxed.
# Keep IPv6 RA/autoconf working: os_hardening disables the whole RA path (accept_ra,
# autoconf, and RA prefix/default-route learning) per CIS, which breaks SLAAC-assigned
# addresses (common on VPS) — the node loses its IPv6 address + default route on the next
# RA cycle (notably after a reboot). true = re-enable the RA sysctls SLAAC needs; set
# false on hosts with statically-configured IPv6 to keep the full CIS IPv6 hardening.
# Only takes effect where os_hardening applies sysctls — its sysctl block is skipped on
# container virtualization (lxc/openvz/docker), so on those VPS the knob is a no-op.
baseline_preserve_ipv6_autoconf: true
# os_hardening sets strict reverse-path filtering (rp_filter=1), which silently drops
# inbound QUIC arriving on the "wrong" interface of a multi-homed / policy-routed host.
# true = loose (rp_filter=2). Default keeps strict — correct for typical single-homed nodes.
baseline_rp_filter_loose: false

baseline_packages:
  - curl
  - git
  - jq
  - openssl
  - ca-certificates
  - gnupg
  - lsb-release
  - nftables
  - fail2ban
  - unattended-upgrades
  - chrony
