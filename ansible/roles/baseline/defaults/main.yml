---
# baseline role defaults. Override in inventory/group_vars for a real deployment.

# Admin sudo account, created + keyed BEFORE ssh_hardening disables root login.
# "Deploy as yourself" by default — both knobs resolve from the control machine
# when left empty, and explicit values always win:
#   ssh_admin_user   ""  -> the control-machine local $USER (of whoever runs
#                           ansible-playbook; under sudo/CI this may not be you)
#   ssh_admin_pubkey ""  -> autodetected from that same ~/.ssh (id_ed25519 > ecdsa > rsa)
# The lockout-guard assert in tasks/main.yml aborts the run (before any hardening)
# unless a NON-ROOT admin user and >=1 key resolve — so hardening never runs keyless.
ssh_admin_user: ""
ssh_admin_pubkey: ""
# When ssh_admin_pubkey is empty, read the operator's default local public key.
ssh_admin_pubkey_autodetect: true
# Additional authorized keys for the admin user (full pubkey strings, e.g. teammates).
ssh_admin_extra_pubkeys: []
# Additional named sudo users — DISTINCT accounts, not extra keys on the shared admin
# (that is ssh_admin_extra_pubkeys above). Each entry gets its OWN username, home, and
# key(s), created key-only exactly like the admin: member of `sudo`, a NOPASSWD
# sudoers.d drop-in, and a locked password (login by key only). Pubkeys only — no
# passwords. Shape: [{name: <login>, keys: ["<full pubkey string>", ...]}, ...].
baseline_sudo_users: []
# Passwordless, key-only admin account. ssh_hardening disables SSH password auth, so
# the admin user logs in by key only; with this on (default) the account gets a
# NOPASSWD sudoers drop-in AND its password is locked — non-interactive sudo / `make
# deploy` works with no become password, and no password can authenticate at all.
# Set false to keep the classic password-sudo model (you must then set a password on
# the account yourself, e.g. `passwd <user>`, to be able to sudo).
ssh_admin_passwordless_sudo: true
# Optional inbound-SSH source allowlist (CIDRs). Empty = accept from any source.
ssh_allow_cidrs: []

# Extra public inbound ports beyond SSH. Each item: {proto, port, comment}.
# Loopback services need NOTHING here; only genuinely public listeners (e.g. the
# decdn node's QUIC udp/4433) do. Set per host/group, e.g. in group_vars.
baseline_extra_inbound: []

# --- os_hardening sysctl overrides (keep node connectivity under CIS hardening) ---
# devsec.hardening.os_hardening applies CIS-style network sysctls that can degrade a
# node. baseline feeds these knobs into its sysctl_overwrite so the hardened defaults
# still apply everywhere EXCEPT where a node needs them relaxed.
# Keep IPv6 RA/autoconf working: os_hardening disables the whole RA path (accept_ra,
# autoconf, and RA prefix/default-route learning) per CIS, which breaks SLAAC-assigned
# addresses (common on VPS) — the node loses its IPv6 address + default route on the next
# RA cycle (notably after a reboot). true = re-enable the RA sysctls SLAAC needs; set
# false on hosts with statically-configured IPv6 to keep the full CIS IPv6 hardening.
# Only takes effect where os_hardening applies sysctls — its sysctl block is skipped on
# container virtualization (lxc/openvz/docker), so on those VPS the knob is a no-op.
baseline_preserve_ipv6_autoconf: true
# os_hardening sets strict reverse-path filtering (rp_filter=1), which silently drops
# inbound QUIC arriving on the "wrong" interface of a multi-homed / policy-routed host.
# true = loose (rp_filter=2). Default keeps strict — correct for typical single-homed nodes.
baseline_rp_filter_loose: false

baseline_packages:
  - curl
  - git
  - jq
  - openssl
  - ca-certificates
  - gnupg
  - lsb-release
  - nftables
  - fail2ban
  - unattended-upgrades
  - chrony
