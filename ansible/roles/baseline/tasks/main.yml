---
# Host baseline: packages, admin user, firewall, auto-patching, fail2ban, time
# sync, then DevSec OS + SSH hardening LAST (it disables root/password login).

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Under --check the install above is a no-op, so packaged units (fail2ban, chrony,
# nftables) may not exist yet on a fresh host and a systemd enable/start would
# hard-fail ("Could not find the requested service"). Probe real on-host state
# (read-only, runs in check mode) so the service tasks below can skip a missing
# unit in check mode while still previewing drift on an already-provisioned host.
- name: Probe which service units already exist on the target
  ansible.builtin.service_facts:

# --- Admin account (must exist + have a key BEFORE ssh_hardening locks root) ---
# Resolve the user and key set from the control machine when left empty; explicit
# values always win. Lookups run on the control node — that's the operator's box.
- name: Resolve the admin sudo username (local $USER if unset)
  ansible.builtin.set_fact:
    ssh_admin_user_effective: >-
      {{ ssh_admin_user if ssh_admin_user | length > 0
         else lookup('ansible.builtin.env', 'USER') }}

- name: Autodetect the operator's local SSH public key (control machine)
  ansible.builtin.set_fact:
    ssh_admin_detected_pubkey: "{{ lookup('ansible.builtin.file', found) | trim }}"
  vars:
    found: >-
      {{ query('ansible.builtin.first_found',
               {'files': candidates, 'skip': true}) | first | default('') }}
    # ~ expands via os.path.expanduser, which falls back to the passwd DB when
    # $HOME is unset (cron/CI) — more robust than an env lookup that returns ''.
    candidates:
      - "~/.ssh/id_ed25519.pub"
      - "~/.ssh/id_ecdsa.pub"
      - "~/.ssh/id_rsa.pub"
  when:
    - ssh_admin_pubkey | length == 0
    - ssh_admin_pubkey_autodetect | bool
    - found | length > 0

- name: Resolve the set of admin authorized keys
  ansible.builtin.set_fact:
    ssh_admin_keys: >-
      {{ (([ssh_admin_pubkey] if ssh_admin_pubkey | length > 0
           else [ssh_admin_detected_pubkey | default('')])
          + ssh_admin_extra_pubkeys)
         | map('trim') | reject('equalto', '') | unique | list }}

# UNCONDITIONAL lockout guard — runs BEFORE the account is created and hardening
# applied. It is the single gate that makes a keyless/root-only harden impossible;
# downstream tasks therefore need no `when`. ssh_hardening disables root login, so a
# resolved admin user of "root" (or an empty one, e.g. $USER unset under cron/CI)
# would lock the host out — both are refused here rather than skipped silently.
- name: Refuse to harden SSH without a non-root admin user and a key (lockout guard)
  ansible.builtin.assert:
    that:
      - ssh_admin_user_effective | length > 0
      - ssh_admin_user_effective != 'root'
      - ssh_admin_keys | length > 0
    fail_msg: >-
      Cannot establish a working admin login before devsec.hardening.ssh_hardening
      disables root + password auth. Resolved user='{{ ssh_admin_user_effective }}',
      keys={{ ssh_admin_keys | length }}. Causes: ssh_admin_user is empty and the
      control-machine $USER is unset (cron/CI/sudo with env_reset) -> set
      ssh_admin_user; the resolved user is 'root' (hardening forbids root login) ->
      set ssh_admin_user to a non-root account; or no key was found -> set
      ssh_admin_pubkey, add ssh_admin_extra_pubkeys, or place a default key
      (~/.ssh/id_ed25519.pub, id_ecdsa.pub, or id_rsa.pub) on the control machine.

# Surface WHAT will be trusted: autodetect installs whatever key sits in the
# control box's ~/.ssh, so echo the resolved user + key count (a silently dropped
# malformed entry, or a wrong control machine, shows up as an unexpected count).
- name: Report the resolved admin user and key count
  ansible.builtin.debug:
    msg: >-
      Admin user '{{ ssh_admin_user_effective }}' will be authorized with
      {{ ssh_admin_keys | length }} key(s); primary source =
      {{ 'explicit ssh_admin_pubkey' if ssh_admin_pubkey | length > 0
         else ('autodetected ~/.ssh key'
               if (ssh_admin_detected_pubkey | default('')) | length > 0
               else 'none (extra keys only)') }},
      plus {{ ssh_admin_extra_pubkeys | length }} extra.

- name: Create admin sudo user
  ansible.builtin.user:
    name: "{{ ssh_admin_user_effective }}"
    groups: [sudo]
    append: true
    shell: /bin/bash
    create_home: true

# --- Passwordless, key-only admin (ssh_hardening disables SSH password auth) -----
# The account logs in by key only, so it needs no password at all: grant NOPASSWD
# sudo (so non-interactive sudo / `make deploy` works with no become password) and
# lock the password (so nothing can authenticate by password). Both are gated on the
# same knob; turning it off removes the grant and falls back to classic sudo-group
# password sudo — which needs a real password, so we must NOT lock it in that case
# (and the operator must set one — see the disabled-path warning below).

# sudo's #includedir SKIPS any file in sudoers.d whose name contains a '.' or ends
# in '~'. A username like `deploy.bot` would produce a valid-but-ignored drop-in, so
# NOPASSWD would silently not apply — and with the password locked below that is a
# sudo lockout. `visudo -cf` validates content, not the filename, so it can't catch
# this. Sanitize the name to sudo's accepted charset; the rule inside still names the
# real user, so the grant is unaffected.
- name: Resolve the admin sudoers.d drop-in path (sudo ignores '.'/'~' in filenames)
  ansible.builtin.set_fact:
    ssh_admin_sudoers_file: >-
      /etc/sudoers.d/{{ ssh_admin_user_effective | regex_replace('[^A-Za-z0-9_-]', '_') }}

- name: Grant the admin user passwordless sudo
  ansible.builtin.copy:
    dest: "{{ ssh_admin_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ ssh_admin_user_effective }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"
  when: ssh_admin_passwordless_sudo | bool

- name: Lock the admin user's password (key-only login; NOPASSWD sudo)
  ansible.builtin.user:
    name: "{{ ssh_admin_user_effective }}"
    password_lock: true
  when: ssh_admin_passwordless_sudo | bool

# Reverse the NOPASSWD grant if the knob is later turned off. The password lock is
# intentionally NOT auto-reverted: unlocking a never-set password is unsafe/undefined
# — older shadow-utils blank it (passwordless account), newer ones (Debian bookworm /
# current Ubuntu) refuse. Regaining password sudo is a manual `passwd <user>` step.
# The `length > 0` guard is defence-in-depth: the lockout-guard assert above already
# aborts on an empty user, but if it were ever bypassed the path would collapse to the
# bare `/etc/sudoers.d/` directory and state:absent would recursively delete it,
# breaking sudo host-wide. Never run this destructive task on an empty username.
- name: Remove the passwordless-sudo drop-in when disabled
  ansible.builtin.file:
    path: "{{ ssh_admin_sudoers_file }}"
    state: absent
  when:
    - not (ssh_admin_passwordless_sudo | bool)
    - ssh_admin_user_effective | length > 0

# Loud fallback warning: with the knob off there is no NOPASSWD grant, and a fresh
# account (or one locked by a prior passwordless run) has no usable password — so it
# cannot sudo after ssh_hardening unless the operator sets one on the host. Flipping
# this true->false on an ALREADY-hardened host while connected as that admin user also
# breaks the current run once the drop-in is removed (later tasks can no longer
# `sudo -n`) — set a password first and re-run with `--ask-become-pass`.
- name: Warn that classic password sudo needs a password set on the host
  ansible.builtin.debug:
    msg: >-
      ssh_admin_passwordless_sudo is false: admin user '{{ ssh_admin_user_effective }}'
      uses classic sudo-group password sudo. If its password is unset or locked (fresh
      account, or a prior passwordless run), run `passwd {{ ssh_admin_user_effective }}`
      on the host or it will be unable to sudo once SSH hardening disables root login.
      Switching from passwordless to password sudo on a live hardened host needs that
      password set first, then a re-run with `--ask-become-pass`.
  when: not (ssh_admin_passwordless_sudo | bool)

# authorized_key resolves the user's ~/.ssh to write the key, so the account must
# already exist. Under --check the create task above is a no-op, so on a not-yet-
# provisioned host the user is absent and the module hard-fails ("Either user must
# exist or you must provide full path to key file in check mode"). Probe real
# on-host state (read-only, runs in check mode) and skip the key install only when
# check mode meets a missing user; real runs and check runs on a provisioned host
# (where drift is worth previewing) always proceed.
- name: Probe whether the admin user already exists on the target
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_admin_user_effective }}"
    fail_key: false

- name: Install admin authorized keys
  ansible.posix.authorized_key:
    user: "{{ ssh_admin_user_effective }}"
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_admin_keys }}"
  # fail_key:false stores a missing user as {user: None}, so test the value, not `in`.
  when: not ansible_check_mode or (getent_passwd | default({})).get(ssh_admin_user_effective)

# --- Firewall: default-deny inbound, SSH only ---------------------------------
- name: Install nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: not ansible_check_mode or 'nftables.service' in (ansible_facts.services | default({}))

# --- Automatic security patches ----------------------------------------------
- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# --- fail2ban sshd jail -------------------------------------------------------
- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      mode = aggressive
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode or 'fail2ban.service' in (ansible_facts.services | default({}))

# --- Time sync ----------------------------------------------------------------
- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  when: not ansible_check_mode or 'chrony.service' in (ansible_facts.services | default({}))

# --- DevSec hardening (LAST: ssh_hardening disables root + password auth) ------
- name: Apply DevSec OS hardening
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening

# No `when` guard here by design: the unconditional lockout assert above has already
# proven a non-root admin user with >=1 key exists (or aborted the play), so hardening
# can never run keyless. Re-adding a gate here would risk drifting out of sync with it.
- name: Apply DevSec SSH hardening
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
