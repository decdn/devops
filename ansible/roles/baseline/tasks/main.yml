---
# Host baseline: packages, admin user, firewall, auto-patching, fail2ban, time
# sync, then DevSec OS + SSH hardening LAST (it disables root/password login).

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Under --check the install above is a no-op, so packaged units (fail2ban, chrony,
# nftables) may not exist yet on a fresh host and a systemd enable/start would
# hard-fail ("Could not find the requested service"). Probe real on-host state
# (read-only, runs in check mode) so the service tasks below can skip a missing
# unit in check mode while still previewing drift on an already-provisioned host.
- name: Probe which service units already exist on the target
  ansible.builtin.service_facts:

# --- Sudo operators: ONE list, admin head auto-detected (all created + keyed BEFORE
# ssh_hardening locks root) --------------------------------------------------------
# There is no separate admin config: the operator set is the auto-detected runner head
# (this control box's $USER + its ~/.ssh key — "deploy as yourself", never committed) with
# `baseline_sudo_users` appended. Lookups run on the control node — that's the operator's box.
- name: Autodetect the runner's local SSH public key (control machine)
  ansible.builtin.set_fact:
    baseline_runner_pubkey: "{{ lookup('ansible.builtin.file', found) | trim if found | length > 0 else '' }}"
  vars:
    # Expand ~ EXPLICITLY with the expanduser filter before first_found, rather than
    # relying on the lookup to do it (behaviour that varies by ansible-core version).
    # expanduser uses os.path.expanduser, which falls back to the passwd DB when $HOME is
    # unset (cron/CI) — more robust than an env lookup that returns ''. Only probe ~/.ssh
    # when autodetection is on; otherwise this stays '' and no head is prepended below.
    found: >-
      {{ (query('ansible.builtin.first_found',
                {'files': candidates | map('expanduser') | list, 'skip': true})
          | first | default(''))
         if baseline_sudo_autodetect_runner | bool else '' }}
    candidates:
      - "~/.ssh/id_ed25519.pub"
      - "~/.ssh/id_ecdsa.pub"
      - "~/.ssh/id_rsa.pub"

# Prepend the runner as the operator-set head ONLY when it is a usable admin: autodetect
# on, a non-empty non-root $USER, a key found, AND the runner isn't already named in
# baseline_sudo_users (an explicit entry with the same name OVERRIDES the auto head, so you
# can pin your own keys/settings without a duplicate sudoers.d drop-in collision). Yields a
# 0-or-1-element list so the assembly and the lockout guard below are pure list logic.
- name: Resolve the auto-detected runner head (0 or 1 operator)
  ansible.builtin.set_fact:
    baseline_runner_head: >-
      {{ [{'name': runner_name, 'keys': [baseline_runner_pubkey]}] if prepend else [] }}
  vars:
    runner_name: "{{ lookup('ansible.builtin.env', 'USER') }}"
    prepend: >-
      {{ baseline_sudo_autodetect_runner | bool
         and runner_name | length > 0
         and runner_name != 'root'
         and baseline_runner_pubkey | length > 0
         and runner_name not in (baseline_sudo_users | map(attribute='name', default='') | list) }}

- name: Assemble the operator set (runner head + committed admins)
  ansible.builtin.set_fact:
    baseline_operators: "{{ baseline_runner_head + baseline_sudo_users }}"

# UNCONDITIONAL lockout guard — runs BEFORE any account is created and hardening applied.
# It is the single gate that makes a keyless/root-only harden impossible; downstream tasks
# therefore need no `when`. ssh_hardening disables root login, so the merged operator set
# must contain at least one NON-ROOT account that carries a key — otherwise nothing could
# log back in afterwards. An empty set (autodetect off/unresolved AND no committed admins)
# and a root-only/keyless set are both refused here rather than discovered post-hardening.
- name: Refuse to harden SSH without a non-root, keyed admin account (lockout guard)
  ansible.builtin.assert:
    that:
      - usable_admin_keys | length > 0
    fail_msg: >-
      No usable admin login exists before devsec.hardening.ssh_hardening disables root +
      password auth: the operator set has {{ baseline_operators | length }} entr{{ 'y'
      if baseline_operators | length == 1 else 'ies' }}, but none is a non-root account
      with a real key. Causes: baseline_sudo_autodetect_runner is off (or $USER is
      unset/root, or no ~/.ssh/id_ed25519|ecdsa|rsa.pub was found) AND baseline_sudo_users
      is empty or lists only root/keyless entries (a `keys: []`, `keys: [""]`, or blank
      key counts as keyless here). Fix: add an admin to baseline_sudo_users as
      {name: <non-root login>, keys: ["ssh-..."]}, or run where $USER + a ~/.ssh key
      resolve on the control machine.
  vars:
    # Non-root, truthy-named operators. (name has no dict-method collision, so attribute
    # access is safe here — unlike `keys` below.)
    nonroot_named: >-
      {{ baseline_operators | selectattr('name', 'defined') | selectattr('name', 'truthy')
         | rejectattr('name', 'equalto', 'root') | list }}
    # Their actual key MATERIAL — the guard requires a usable key, not merely a declared
    # field. Collision-safe: map('list') yields each dict's KEY NAMES, so superset(['keys'])
    # selects entries that declare a `keys` key (attribute='keys' would hit the dict .keys()
    # METHOD); map(attribute='keys') is then safe on that subset. flatten + trim + drop
    # empties so a keyless entry, `keys: []`, `keys: [""]`, or a whitespace-only key
    # contributes nothing — otherwise a password-locked account with no installable key
    # would pass the guard and brick the host once hardening disables root/password login.
    usable_admin_keys: >-
      {{ nonroot_named | zip(nonroot_named | map('list'))
         | selectattr('1', 'superset', ['keys']) | map(attribute='0')
         | rejectattr('keys', 'string') | map(attribute='keys') | flatten
         | map('trim') | reject('equalto', '') | list }}

# Surface WHAT will be provisioned: autodetect trusts whatever key sits in the control
# box's ~/.ssh, so echo the resolved operator names and whether the runner head was added
# (a wrong control machine, or an unexpectedly-overridden head, shows up here).
- name: Report the resolved operator set
  ansible.builtin.debug:
    msg: >-
      Provisioning {{ baseline_operators | length }} sudo operator(s):
      {{ baseline_operators | map(attribute='name', default='?') | list | join(', ') }}.
      {{ ('Runner head auto-detected from $USER + ~/.ssh: '
          + (baseline_runner_head | map(attribute='name') | first) + '.')
         if baseline_runner_head | length > 0
         else ('No auto-detected runner head (autodetect off, $USER/key unresolved,'
               + ' or overridden by an explicit entry); admins from baseline_sudo_users.') }}

# Runs unconditionally — the lockout guard above has proven a usable admin exists.
# sudo_users.yml validates the whole set (well-formed, keyed, unique sudoers.d filenames)
# and routes every operator through the shared sudo_account.yml primitive, provisioning
# them BEFORE ssh_hardening locks root. Kept in its own file so molecule can exercise the
# named-users subset standalone (`tasks_from: sudo_users`).
- name: Provision every sudo operator via one primitive
  ansible.builtin.include_tasks: sudo_users.yml

# --- Firewall: default-deny inbound, SSH only ---------------------------------
- name: Install nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: not ansible_check_mode or 'nftables.service' in (ansible_facts.services | default({}))

# --- Automatic security patches ----------------------------------------------
- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# --- fail2ban sshd jail -------------------------------------------------------
- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      mode = aggressive
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode or 'fail2ban.service' in (ansible_facts.services | default({}))

# --- Time sync ----------------------------------------------------------------
- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  when: not ansible_check_mode or 'chrony.service' in (ansible_facts.services | default({}))

# --- DevSec hardening (LAST: ssh_hardening disables root + password auth) ------
# The `| bool` filter is non-strict: an unparseable value (typo, quoted string, trailing
# space) coerces to false with no error — which would silently DROP the connectivity
# override and let CIS hardening sever IPv6/QUIC. Fail loud instead, matching the
# `is boolean` guards in roles/decdn_node/tasks/main.yml.
- name: Validate the sysctl-override knobs are real booleans
  ansible.builtin.assert:
    that:
      - baseline_preserve_ipv6_autoconf is boolean
      - baseline_rp_filter_loose is boolean
    fail_msg: >-
      baseline_preserve_ipv6_autoconf and baseline_rp_filter_loose must be real
      booleans (true/false), not quoted strings — each gates a `| bool` conditional
      that decides whether the node-connectivity sysctl overrides apply. A mistyped
      value silently coerces to false and lets CIS hardening sever IPv6/QUIC.

# os_hardening merges sysctl_overwrite LAST over its own hardened sysctl dict, so this
# wins over the CIS defaults for exactly the keys a node needs relaxed and nothing else.
# An off knob contributes an empty dict — the hardened default then stands.
- name: Assemble sysctl overrides that keep node connectivity under hardening
  ansible.builtin.set_fact:
    baseline_os_sysctl_overwrite: >-
      {{ (ipv6 if baseline_preserve_ipv6_autoconf | bool else {})
         | combine(rpf if baseline_rp_filter_loose | bool else {}) }}
  vars:
    # os_hardening disables the WHOLE RA path, so re-enabling accept_ra/autoconf alone is
    # not enough: without accept_ra_pinfo the kernel ignores the RA prefix (no SLAAC
    # address) and without accept_ra_defrtr it installs no default route. os_hardening
    # sets these on `default` only (the template new interfaces inherit at boot), so the
    # counter goes on `default` too — otherwise a rebooted host comes up v6-dead.
    ipv6:
      net.ipv6.conf.all.accept_ra: 1
      net.ipv6.conf.default.accept_ra: 1
      net.ipv6.conf.all.autoconf: 1
      net.ipv6.conf.default.autoconf: 1
      net.ipv6.conf.all.router_solicitations: -1
      net.ipv6.conf.default.router_solicitations: -1
      net.ipv6.conf.default.accept_ra_pinfo: 1     # learn RA prefix -> SLAAC address
      net.ipv6.conf.default.accept_ra_defrtr: 1    # learn default route from RA
      net.ipv6.conf.default.max_addresses: 16
    rpf:
      net.ipv4.conf.all.rp_filter: 2
      net.ipv4.conf.default.rp_filter: 2

- name: Apply DevSec OS hardening
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
  vars:
    sysctl_overwrite: "{{ baseline_os_sysctl_overwrite }}"
    ufw_manage_defaults: false   # nftables is the firewall; don't write /etc/default/ufw

# No `when` guard here by design: the unconditional lockout assert above has already
# proven a non-root admin user with >=1 key exists (or aborted the play), so hardening
# can never run keyless. Re-adding a gate here would risk drifting out of sync with it.
- name: Apply DevSec SSH hardening
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
