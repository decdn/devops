---
# Additional named sudo users — each its OWN account (own username, home, key),
# created key-only EXACTLY like the admin: member of `sudo`, a NOPASSWD sudoers.d
# drop-in, and a locked password (login by key only). Distinct from
# ssh_admin_extra_pubkeys, which only adds keys to the SHARED admin account. Runs
# after the admin block and before the firewall / DevSec hardening, so a listed
# operator can log in immediately once hardening applies.
#
# These accounts are NOT lockout-critical — the play always connects as the admin
# user — so, unlike the admin path, this block needs no getent-probe or lockout
# assert: a plain `when: not ansible_check_mode` guard on the key install is enough
# to keep `make check` on a fresh host (where the account doesn't exist yet, so
# authorized_key would hard-fail) from blowing up.

# Refuse two operator-input shapes that would otherwise misconfigure an account
# SILENTLY (the role's ethos: fail loud, never a silent sudo lockout) — checked here,
# before any account is touched:
#   * An entry with no `keys` (or keys: []): the tasks below would still create the
#     account, join it to `sudo`, write its NOPASSWD drop-in, and lock its password —
#     a dormant account with passwordless root and no way to log in (ssh_hardening
#     disables password auth). A `key:`/`keys:` typo hits exactly this.
#   * Two names that sanitize to the SAME sudoers.d filename (e.g. `deploy.bot` and
#     `deploy_bot`, or a name colliding with the admin's own drop-in — this block runs
#     AFTER the admin block): the copy loop would silently overwrite, leaving a user
#     with `sudo` + a locked password but NO NOPASSWD grant. `visudo -cf` validates
#     content, not a clobbered file, so it cannot catch this.
- name: Assert each named sudo user has key(s) and a unique sudoers.d filename
  ansible.builtin.assert:
    that:
      - keyless_named_users | length == 0
      - sudoers_dropin_names | length == (sudoers_dropin_names | unique | length)
    fail_msg: >-
      baseline_sudo_users is misconfigured (validated before any account is created).
      Entries lacking a non-empty `keys` list: {{ keyless_named_users }}.
      Sanitized /etc/sudoers.d/ filenames must be unique (including vs the admin
      drop-in), else one grant silently overwrites another -> silent sudo lockout;
      got {{ sudoers_dropin_names }}.
  vars:
    keyless_named_users: >-
      {{ (baseline_sudo_users | rejectattr('keys', 'defined')
          | map(attribute='name') | list)
         + (baseline_sudo_users | selectattr('keys', 'defined')
            | selectattr('keys', 'falsy') | map(attribute='name') | list) }}
    # ssh_admin_user_effective is resolved by the admin block in main.yml; on the
    # molecule `tasks_from: sudo_users` path that block never runs, so default it out.
    sudoers_dropin_names: >-
      {{ (baseline_sudo_users | map(attribute='name')
          | map('regex_replace', '[^A-Za-z0-9_-]', '_') | list)
         + ([ssh_admin_user_effective | regex_replace('[^A-Za-z0-9_-]', '_')]
            if ssh_admin_user_effective is defined else []) }}

- name: Create the additional named sudo users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: [sudo]
    append: true
    shell: /bin/bash
    create_home: true
  loop: "{{ baseline_sudo_users }}"
  loop_control:
    label: "{{ item.name }}"

# Same sudoers.d filename hazard as the admin drop-in: sudo's #includedir SKIPS any
# file whose name contains a '.' or ends in '~' — which, with the password locked
# below, is a silent sudo lockout. Sanitize the username into the filename (the rule
# inside still names the real user); `visudo -cf` validates content, not the name.
- name: Grant each named sudo user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name | regex_replace('[^A-Za-z0-9_-]', '_') }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: "visudo -cf %s"
  loop: "{{ baseline_sudo_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Lock each named sudo user's password (key-only login; NOPASSWD sudo)
  ansible.builtin.user:
    name: "{{ item.name }}"
    password_lock: true
  loop: "{{ baseline_sudo_users }}"
  loop_control:
    label: "{{ item.name }}"

# subelements flattens each (user, key) pair. The assert above already rejects a
# keyless entry, so skip_missing=true here is just defence-in-depth (it would emit
# no pairs rather than error). authorized_key writes into the account's ~/.ssh, so
# the user must exist first — under --check the create above is a no-op, so skip the
# install in check mode (see the not-lockout-critical note in the block header above).
- name: Install each named sudo user's authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ baseline_sudo_users | subelements('keys', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: not ansible_check_mode
