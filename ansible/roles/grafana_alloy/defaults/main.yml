---
# grafana_alloy role defaults. This role ships with the decdn_node role and is
# OFF by default: the single opt-in point at group/host level is
# decdn_grafana_cloud_enabled, defined IDENTICALLY in roles/decdn_node/defaults
# (the mirroring is deliberate — it gives inventory one override knob that both
# roles read; see "Grafana Cloud observability" in ansible/README.md).

decdn_grafana_cloud_enabled: false

# --- Install ------------------------------------------------------------------
# "release": download the pinned GitHub Release .deb and verify its sha256 before
# dpkg-install. "manual": copy a control-machine binary path (molecule stubs,
# pre-release testing) — no package, no version pin.
grafana_alloy_install_method: release   # "release" | "manual"
grafana_alloy_manual_bin_src: ""
# Pinned upstream version + per-arch sha256 of the .deb asset. Bump BOTH together
# from https://github.com/grafana/alloy/releases/<tag> (asset digests are shown on
# every release). A missing arch entry fails loud at preflight when enabled.
grafana_alloy_version: "1.19.2"
grafana_alloy_release_base: https://github.com/grafana/alloy/releases/download
grafana_alloy_sha256:
  amd64: 9872732d43c6d14996e1ad5a075086a93381ea6375c8c756820da68b85422eea
  arm64: 04dcc80ae4fe75832bfb9d3f376753210c635f1c0a9e851f3cded9ab20dc2b7d

# --- Paths / identities -------------------------------------------------------
grafana_alloy_user: alloy
grafana_alloy_group: alloy
grafana_alloy_bin: /usr/local/bin/alloy      # manual mode; release deb installs /usr/bin/alloy
grafana_alloy_config_dir: /etc/alloy
grafana_alloy_config_file: /etc/alloy/config.alloy
grafana_alloy_state_dir: /var/lib/alloy      # WAL/storage state, owned by the agent user
# SENSITIVE environment file holding the Grafana Cloud credentials as KEY=value
# pairs (template: files/grafana-alloy.env.example). Root-owned 0600 — systemd
# reads EnvironmentFile= as root BEFORE dropping to the agent user, so `alloy`
# never needs read access to it and no secret transits this repo. Provision it on
# the target host as a direct child of /etc so a writable parent/ancestor cannot
# swap the root-owned EnvironmentFile before systemd reads it.
grafana_alloy_secret_file: /etc/grafana-alloy.env

# SENSITIVE — the Grafana Cloud access-policy/service-account token. EMPTY (the
# default) keeps the host-provisioned posture: preflight requires a 0600 env file
# on the target host and the value never transits the control machine. SETTING it
# opts into the inventory path (#39 parity with decdn_rpc_url): this role then
# authors {{ grafana_alloy_secret_file }} as a TOKEN-ONLY EnvironmentFile that is
# rewritten wholesale on every converge, so any hand-added GC_* keys must migrate
# to their inventory variables first (all-or-nothing authoring). Whether the value
# arrives via this variable or was provisioned by hand, config.alloy reads it the
# same way at runtime: sys.env("GC_API_TOKEN").
grafana_alloy_api_token: ""

# Provenance tracking for grafana_alloy_secret_file, mirroring roles/decdn_node's
# #39 machinery. After every enabled converge the role records "<source> <sha256>"
# of the env file the service is now running on ("inventory" when
# grafana_alloy_api_token authored it, "host" otherwise) into a root-owned 0600
# record NEXT TO the secret file — deliberately NOT inside /etc/alloy or
# /var/lib/alloy, because the disable path removes those directories wholesale.
# Path validation requires this to remain exactly `<secret-file>.sha256`; it is
# not an independently aimable root-write path.
# Preflight uses the pair to fail loud on (a) adopting a role-authored file after
# the secret went missing from the control machine and (b) clobbering an operator-
# edited or untracked file without grafana_alloy_overwrite_host_file. Disable keeps
# both file and record so a later re-enable cannot forget who authored the token.
grafana_alloy_env_checksum_file: /etc/grafana-alloy.env.sha256

# Explicit opt-in letting grafana_alloy_api_token rewrite an env file whose
# provenance record is missing or mismatched — i.e. something this role did not
# last write. Identical contract to decdn_env_overwrite_host_file: because the
# rewrite is token-only, any lines added outside Ansible are DISCARDED; migrate
# them to their inventory variables BEFORE turning this on (preflight then stops
# demanding them from the file, which also makes the migration verifiable).
#
# Turn it back to false after the one converge that needs it. Left true, this host
# has NO clobber guard: the next hand-edit to the env file is silently destroyed
# instead of stopping the deploy, which is the whole point of the record. It must
# be a real boolean — preflight rejects "yes"/"on"/"1" rather than let YAML
# truthiness grant an authorisation nobody typed.
grafana_alloy_overwrite_host_file: false

# --- Network (loopback-only; AGENTS.md hard rule 2) ---------------------------
# OTLP receivers bound to loopback ONLY — the daemon accepts telemetry pushed
# over localhost, never from the network; no firewall hole exists or is needed.
grafana_alloy_otlp_grpc_bind: 127.0.0.1
grafana_alloy_otlp_grpc_port: 4317          # standard OTLP/gRPC port; decdn_node's
grafana_alloy_otlp_http_bind: 127.0.0.1     # injected otlp_endpoint depends on the
grafana_alloy_otlp_http_port: 4318          # gRPC value staying put (see node.toml.j2)
# Alloy's own admin/UI server. Upstream already defaults it to 127.0.0.1:12345,
# but the unit passes it explicitly so the binding is reviewable in the unit and
# a future upstream default change cannot quietly widen it. There is NO gRPC
# admin listener in Alloy (that was Grafana Agent) — `alloy run` has no
# --server.grpc.listen-addr flag, and passing one is an immediate crash-loop.
grafana_alloy_server_http_addr: 127.0.0.1:12345

# --- Grafana Cloud endpoints (NON-SECRET; optional inventory overrides) -------
# Only the API TOKEN is a secret. The endpoint URLs and the two numeric instance
# IDs are not, so they may be set here (group_vars/host_vars) instead of being
# hand-typed into the root-owned env file on every host — leaving GC_API_TOKEN
# as the only credential, itself dually homeable: operator-provisioned per host,
# or carried by grafana_alloy_api_token from git-ignored inventory (see below).
#
# Each of these is optional and falls back, when left EMPTY, to the matching
# sys.env("GC_…") lookup the role has always used, so an existing deployment that
# sets none of them renders byte-identical configuration. Setting one makes its
# env key unnecessary, and preflight stops requiring that key.
#
# NEVER put a credential in THIS template: config.alloy is world-readable 0644 on
# the host, and inventory is committed. The API token is the ONE value allowed to
# ride through inventory — via grafana_alloy_api_token below, which is SENSITIVE
# and belongs in a git-ignored secret.yml exactly like decdn_rpc_url (#39). Setting
# it makes this role author /etc/grafana-alloy.env itself; leaving it "" keeps the
# original operator-provisioned posture. See README.md §Credentials.
grafana_alloy_prom_url: ""            # else sys.env("GC_PROM_REMOTE_WRITE_URL")
grafana_alloy_prom_username: ""       # else sys.env("GC_PROM_USERNAME")
grafana_alloy_otlp_endpoint: ""       # else sys.env("GC_OTLP_ENDPOINT")
# The OTLP gateway authenticates with the STACK instance ID, which on many
# Grafana Cloud orgs is a different number from the Prometheus one (portal:
# "OTLP Endpoint" -> "Instance ID"). This role used to reuse the Prometheus
# value, so a stack where the two differ 401s on traces while metrics keep
# flowing — a silent half-outage. Left empty, the rendered config falls back at
# RUNTIME to sys.env("GC_OTLP_USERNAME") and then to whatever the Prometheus
# side resolves to, so an org where the IDs coincide keeps working untouched.
grafana_alloy_otlp_username: ""       # else sys.env("GC_OTLP_USERNAME"), else the Prometheus ID
# Grafana Cloud's Loki instance ID is a DIFFERENT number from the Prometheus one
# (the same access-policy token authenticates both).
grafana_alloy_loki_url: ""            # else sys.env("GC_LOKI_URL")
grafana_alloy_loki_username: ""       # else sys.env("GC_LOKI_USERNAME")

# --- Metrics scrape (node /metrics -> Grafana Cloud Prometheus) ---------------
grafana_alloy_scrape_interval: 30s
# Explicit `job` label for the daemon's own series. Without it Prometheus derives
# `job` from the scrape component's ID ("prometheus.scrape.decdn_node"), which is
# an implementation detail no dashboard should hard-code.
# UPGRADE NOTE: setting this changes the identity of already-existing series.
# Hosts deployed before this label existed report job="prometheus.scrape.decdn_node";
# set grafana_alloy_node_job: "" to keep that value instead of re-pointing
# dashboards, recording rules and alerts.
grafana_alloy_node_job: decdn-node

# --- Host (machine) metrics ---------------------------------------------------
# Alloy's built-in node_exporter. Runs IN-PROCESS: no extra listener, no extra
# port, no firewall hole (AGENTS.md hard rule 2 is unaffected). Stamped with the
# job label Grafana Cloud's prebuilt "Linux Server / node_exporter" integration
# dashboards and alert rules key off, so they work with zero dashboard wiring.
grafana_alloy_host_metrics_enabled: true
# Host metrics do not need the node's resolution; 60s halves the series cost.
grafana_alloy_host_scrape_interval: 60s
# Changing this away from integrations/node_exporter silently un-wires the
# Grafana Cloud integration dashboards. "integrations/unix" is also accepted.
grafana_alloy_host_job: integrations/node_exporter
# Hand-picked replacement for node_exporter's ~45-collector default set (Alloy's
# `set_collectors`: anything absent here is off). The remote bill scales with
# series count, so this covers the questions an operator actually asks — CPU,
# memory, disk, filesystem, network, load, saturation — and nothing else.
grafana_alloy_host_collectors:
  - cpu
  - diskstats
  - filefd
  - filesystem
  - loadavg
  - meminfo
  - netdev
  - os
  - pressure        # PSI saturation; needs kernel 4.20+/CONFIG_PSI, absent = no series
  - stat
  - time
  - uname
  - vmstat
# Added ON TOP of the list above (Alloy's `enable_collectors`). `systemd` is
# registered defaultDisabled upstream and must be named here; it answers "is
# decdn-node actually running", which the daemon's own /metrics cannot when the
# daemon is down. It talks to the D-Bus system bus, so it collects nothing in a
# container without one (molecule) — that is expected, not a failure.
grafana_alloy_host_extra_collectors:
  - systemd
# Subtracted from BOTH lists above at render time; an escape hatch for a
# collector that misbehaves on a specific fleet. (Doing it in the template is
# deliberate: upstream applies disable_collectors BEFORE enable_collectors, so a
# name in both would end up enabled — the opposite of a veto.)
grafana_alloy_host_disable_collectors: []
# Alloy's own exporter-internal metrics (scrape durations per collector). Off:
# grafana_alloy_self_metrics_enabled covers agent health more cheaply.
grafana_alloy_host_include_exporter_metrics: false
# Filter regexes. Single-quoted YAML so backslashes stay literal; each is
# JSON-encoded into the rendered config, so quotes/backslashes cannot break out
# of the string. Defaults mirror upstream's, plus tmpfs (Grafana Cloud's own
# snippet adds it) and the usual container/virtual interface noise.
# NOTE the escaped line breaks: YAML double quotes join these back into ONE regex
# with no whitespace. Single quotes cannot be used here (the line is too long for
# yamllint) and a folded scalar would inject spaces into the pattern.
grafana_alloy_host_fs_types_exclude: "^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|\
  fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|\
  selinuxfs|squashfs|sysfs|tmpfs|tracefs)$"
grafana_alloy_host_mount_points_exclude: '^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+)($|/)'
grafana_alloy_host_mount_timeout: 5s
grafana_alloy_host_netdev_device_exclude: '^(veth.*|cali.*|docker.*|br-.*|lo|[a-f0-9]{15})$'
grafana_alloy_host_disk_device_exclude: '^(ram|loop|fd|(h|s|v|xv)d[a-z]|nvme\d+n\d+p)\d+$'
# Per-unit state, deliberately scoped: one series set per unit on the box is a
# real cost, and only these units matter. Units must match include AND NOT match
# exclude.
grafana_alloy_host_systemd_unit_include: '(decdn-node|alloy|ssh|sshd)\.service'
grafana_alloy_host_systemd_unit_exclude: '.+\.(automount|device|mount|scope|slice)'

# --- Agent self-monitoring ----------------------------------------------------
# Alloy's own health (component evaluation, WAL, remote-write queue/failures).
# Cheap, and the only way to tell "the node is silent" apart from "the agent that
# reports on the node is wedged".
grafana_alloy_self_metrics_enabled: true
grafana_alloy_self_job: integrations/alloy

# --- Host + service logs (journald -> Grafana Cloud Loki) ---------------------
# Reading the journal as a non-root user needs a group journald grants read to:
# systemd-journal owns the journal files, adm gets an ACL on /var/log/journal.
# With neither, the component starts cleanly and collects NOTHING, so the role
# joins the alloy user to both where they exist, lists them under
# SupplementaryGroups, and warns when either is missing.
grafana_alloy_logs_enabled: true
# Grafana Cloud's Linux Server integration uses the SAME job value for logs as
# for host metrics; its logs dashboards key off job + instance.
grafana_alloy_logs_job: integrations/node_exporter
# Bounds the catch-up burst after an outage or a fresh install: without it a
# restart can replay days of journal into your bill in one go.
grafana_alloy_logs_max_age: 12h
# "" => Alloy reads both /var/log/journal and /run/log/journal (persistent and
# volatile). Set a single path only if you know the host keeps just one.
grafana_alloy_logs_journal_path: ""
# Cost guardrails, applied while the __journal* fields still exist. Both are
# anchored regexes matched against the whole value; "" disables that rule.
# Priority keywords are emerg/alert/crit/error/warning/notice/info/debug
# (journald's numeric priority 3 surfaces as "error", NOT "err").
grafana_alloy_logs_drop_priority_regex: 'debug'
grafana_alloy_logs_drop_unit_regex:
  '(session-\d+\.scope|user@\d+\.service|systemd-timesyncd\.service|cron\.service|systemd-logind\.service)'

# --- Resource identity labels (low-cardinality only!) --------------------------
# These become metric labels and OTLP resource attributes shipped to your Grafana
# Cloud org for EVERY series/span/log line: never add high-cardinality values
# (hashes, per-request ids, timestamps) — the remote bill scales with unique
# label sets (see README cost guardrails).
# service_name also names the daemon's journald stream in Loki (unit
# "decdn-node.service" only; host units never get it). "" drops it everywhere.
grafana_alloy_service_name: decdn-node
grafana_alloy_service_namespace: decdn
grafana_alloy_instance_id: ""            # "" => derive from inventory_hostname
grafana_alloy_deployment_environment: production
grafana_alloy_region: "{{ decdn_region | default('') }}"

# --- Pipeline tuning ------------------------------------------------------------
# Probabilistic sampler for TRACES, expressed as the 0..1 keep-ratio
# the deCDN issue settled on (0.25 == keep ~25% of spans); converted to the
# component's percentage internally. Validated at preflight.
grafana_alloy_trace_sampling_ratio: 0.25
grafana_alloy_batch_timeout: 3s           # max delay before a partial batch flushes
grafana_alloy_batch_send_size: 1024       # items per batch (soft target)
grafana_alloy_batch_max_size: 2048        # hard cap; larger batches split
grafana_alloy_queue_size: 5000            # exporter sending queue capacity
grafana_alloy_retry_initial_interval: 5s  # first backoff after a failed push
grafana_alloy_retry_max_elapsed_time: 5m  # total retry budget per request

# systemd TimeoutStopSec for the unit (seconds): cap for flushing the exporter
# queue on shutdown. Truncating it drops buffered telemetry (not money), so the
# default stays modest.
grafana_alloy_stop_timeout_sec: 90
