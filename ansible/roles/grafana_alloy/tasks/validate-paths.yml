---
# Path-shape gates for every filesystem location this role manages.
#
# Imported by BOTH preflight.yml (enable path) and the teardown block in
# main.yml (disable path). The disable path deletes these directories outright,
# so it must not trust an un-validated variable either — that is the whole point
# of factoring them out here instead of leaving them inside preflight.

- name: Constrain the managed Alloy paths (no traversal, no symlink-bait segments)
  ansible.builtin.assert:
    that:
      # Anchored prefix AND a per-segment charset. A prefix match alone is not
      # enough: "/var/lib/../../etc" satisfies "^/var/lib/[A-Za-z0-9._/-]+$"
      # because '.' and '/' are in the class, which would let a hostile/typo'd
      # inventory aim the disable-path `file: state=absent` at /etc.
      - item.value is match(item.regex)
      - "'.' not in item.value.split('/')"
      - "'..' not in item.value.split('/')"
      - "'' not in item.value.split('/')[1:]"
    quiet: true
    fail_msg: >-
      {{ item.name }} must be an absolute, traversal-free path under
      {{ item.under }} whose segments use only [A-Za-z0-9._-] and never contain
      '.' or '..' as full path segments (got "{{ item.value }}"). These paths
      are removed wholesale when decdn_grafana_cloud_enabled is turned off, so
      the exact path shape is enforced before any delete.
  loop:
    # Must stay under /var/lib: systemd's StateDirectory= is relative to it.
    - name: grafana_alloy_state_dir
      value: "{{ grafana_alloy_state_dir }}"
      under: /var/lib
      regex: '^/var/lib/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
    - name: grafana_alloy_config_dir
      value: "{{ grafana_alloy_config_dir }}"
      under: /etc
      regex: '^/etc/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
    - name: grafana_alloy_config_file
      value: "{{ grafana_alloy_config_file }}"
      under: /etc
      regex: '^/etc/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
    - name: grafana_alloy_secret_file
      value: "{{ grafana_alloy_secret_file }}"
      under: /etc
      regex: '^/etc/[A-Za-z0-9._-]+$'
    # Written by the enabled path and retained beside the secret across disable.
    # It authorizes later adoption/overwrite decisions, so keep the same anchored
    # single-segment treatment as the secret file.
    - name: grafana_alloy_env_checksum_file
      value: "{{ grafana_alloy_env_checksum_file }}"
      under: /etc
      regex: '^/etc/[A-Za-z0-9._-]+$'
  loop_control:
    label: "{{ item.name }}"

# This root-written record is read onto the controller and used to authorize a
# later rewrite. Letting inventory aim it independently at any direct child of
# /etc would turn a typo into an arbitrary-file read/overwrite. Keep it coupled to
# the already-constrained credential path as its literal `.sha256` companion.
- name: Require the provenance record to sit beside the credential file
  ansible.builtin.assert:
    that:
      - grafana_alloy_env_checksum_file == grafana_alloy_secret_file ~ '.sha256'
    quiet: true
    fail_msg: >-
      grafana_alloy_env_checksum_file must be exactly grafana_alloy_secret_file +
      ".sha256" (expected {{ grafana_alloy_secret_file }}.sha256, got
      {{ grafana_alloy_env_checksum_file }}). The record is root-read, rewritten,
      and trusted as overwrite authorization, so it cannot be aimed independently
      at another file under /etc.

# The disable path recursively removes config_dir. It must never be equal to, or
# an ancestor of, either retained secret artifact or the systemd unit used as the
# ownership marker; otherwise a valid-looking override can erase the evidence that
# prevents stale-token adoption (or an entire systemd directory).
- name: Keep destructive directories away from retained Alloy files
  ansible.builtin.assert:
    that:
      - grafana_alloy_config_dir != grafana_alloy_secret_file
      - grafana_alloy_config_dir != grafana_alloy_env_checksum_file
      - not grafana_alloy_secret_file.startswith(grafana_alloy_config_dir ~ '/')
      - not grafana_alloy_env_checksum_file.startswith(grafana_alloy_config_dir ~ '/')
      - grafana_alloy_config_dir != _ga_unit_path
      - not _ga_unit_path.startswith(grafana_alloy_config_dir ~ '/')
      - grafana_alloy_config_file not in
        [grafana_alloy_secret_file, grafana_alloy_env_checksum_file, _ga_unit_path]
    quiet: true
    fail_msg: >-
      grafana_alloy_config_dir/config_file must not equal or contain the retained
      credential ({{ grafana_alloy_secret_file }}), provenance record
      ({{ grafana_alloy_env_checksum_file }}), or managed unit ({{ _ga_unit_path }}).
      The disable path removes config_dir recursively, so overlapping paths would
      delete security evidence or unrelated system files.

# The role templates the config INTO the directory it creates and chowns; a file
# outside it would be written to an unmanaged (possibly unsafe) location and
# would survive the disable path's directory removal.
- name: Require the rendered config to live inside the managed config directory
  ansible.builtin.assert:
    that:
      - grafana_alloy_config_file.startswith(grafana_alloy_config_dir ~ '/')
      - (grafana_alloy_config_file | dirname) == grafana_alloy_config_dir
    fail_msg: >-
      grafana_alloy_config_file ({{ grafana_alloy_config_file }}) must be a file
      directly inside grafana_alloy_config_dir ({{ grafana_alloy_config_dir }}).
