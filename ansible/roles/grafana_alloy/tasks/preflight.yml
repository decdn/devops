---
# Fail-loud preflight, run BEFORE any host mutation. Mirrors decdn_node's
# secret-file posture: this role never carries the API TOKEN in inventory and
# never reads the env file's values onto the control machine — it only greps
# shapes on the host itself. The non-secret half of the connection settings
# (endpoint URLs, instance IDs) MAY come from inventory; those are validated here
# too, and each one that is set removes its key from the host-state gates below.
#
# Ordering matters for testability (molecule/validation): PURE-INVENTORY gates
# run first so a bad knob rejects deterministically regardless of what fixtures
# exist on the host; the host-state credential gates follow.

# --- Variable-shape gates -------------------------------------------------------
# Env-var placeholders resolve AFTER these checks, so anything templatable from
# inventory must be validated here, on the spot.

- name: Validate the pipeline knobs
  ansible.builtin.assert:
    that:
      # ratio is the 0..1 keep-ratio documented for operators; the template renders
      # sampling_percentage = ratio * 100, so out-of-range values are an operator
      # surprise (0 = everything dropped, >1 upstream-rejected float32 semantics).
      - grafana_alloy_trace_sampling_ratio is number
      - grafana_alloy_trace_sampling_ratio >= 0
      - grafana_alloy_trace_sampling_ratio <= 1
      # Duration strings interpolate verbatim into Go duration fields — one wrong
      # suffix is a config-load crash-loop.
      - item is match('^[0-9]+(ms|s|m|h)$')
    quiet: true
    fail_msg: >-
      grafana_alloy_trace_sampling_ratio must be a number in [0, 1] (got
      "{{ grafana_alloy_trace_sampling_ratio }}"), and every *_interval /
      *_timeout / max_elapsed_time knob must be a bare integer with an ms/s/m/h
      suffix, e.g. 5s or 500ms.
  loop:
    - "{{ grafana_alloy_batch_timeout }}"
    - "{{ grafana_alloy_retry_initial_interval }}"
    - "{{ grafana_alloy_retry_max_elapsed_time }}"
    - "{{ grafana_alloy_scrape_interval }}"
    - "{{ grafana_alloy_host_scrape_interval }}"
    - "{{ grafana_alloy_host_mount_timeout }}"
    - "{{ grafana_alloy_logs_max_age }}"
  loop_control:
    label: "{{ item }}"

- name: Validate the observability sub-switches
  ansible.builtin.assert:
    that:
      - grafana_alloy_host_metrics_enabled is boolean
      - grafana_alloy_self_metrics_enabled is boolean
      - grafana_alloy_logs_enabled is boolean
      - grafana_alloy_host_include_exporter_metrics is boolean
    fail_msg: >-
      grafana_alloy_host_metrics_enabled, _self_metrics_enabled, _logs_enabled
      and _host_include_exporter_metrics must be booleans (true/false), not
      quoted strings — each gates whole component groups in config.alloy.

# An unknown collector name is NOT a startup crash: Alloy resolves collectors by
# map lookup and silently ignores names it does not know, so a typo ships an
# exporter that quietly measures less than the operator thinks. A charset check
# cannot catch `diskstat`; only the committed inventory in vars/main.yml can.
- name: Validate the node_exporter collector names
  ansible.builtin.assert:
    that:
      - item in _ga_known_collectors
    quiet: true
    fail_msg: >-
      "{{ item }}" is not a node_exporter collector known to Alloy
      {{ grafana_alloy_version }}. Check grafana_alloy_host_collectors /
      _host_extra_collectors / _host_disable_collectors against the collector
      table in the prometheus.exporter.unix reference. An unknown name is
      silently ignored at runtime, so this gate is the only thing standing
      between a typo and metrics that never arrive. (If upstream added a
      collector, extend _ga_known_collectors in the role's vars/main.yml.)
  loop: >-
    {{ (grafana_alloy_host_collectors
        + grafana_alloy_host_extra_collectors
        + grafana_alloy_host_disable_collectors) | map('string') | list }}
  loop_control:
    label: "{{ item }}"
  when: grafana_alloy_host_metrics_enabled | bool

# NOTE the EFFECTIVE set, i.e. after the template subtracts
# _host_disable_collectors from the other two lists. An empty set_collectors is
# not "measure nothing" to Alloy — it reads as unset and re-enables the whole
# ~45-collector default set, the exact opposite of what an operator who disabled
# everything intended.
- name: Require a non-empty effective host collector set
  ansible.builtin.assert:
    that:
      - >-
        ((grafana_alloy_host_collectors + grafana_alloy_host_extra_collectors)
         | reject('in', grafana_alloy_host_disable_collectors) | list | length) > 0
    fail_msg: >-
      grafana_alloy_host_metrics_enabled is true but no collector survives
      grafana_alloy_host_disable_collectors, which would silently fall back to
      node_exporter's full default set instead of measuring nothing. Either
      populate grafana_alloy_host_collectors or turn host metrics off with
      grafana_alloy_host_metrics_enabled: false.
  when: grafana_alloy_host_metrics_enabled | bool

# job/instance are what Grafana Cloud's integration dashboards filter on, and
# like the identity labels they ride on EVERY series and log line.
- name: Validate the job labels
  ansible.builtin.assert:
    that:
      - (item.allow_empty | bool and item.value | length == 0)
        or item.value is match('^[A-Za-z0-9._/-]{1,63}$')
    quiet: true
    fail_msg: >-
      Job labels are restricted to the same low-cardinality charset as the
      identity labels (letters, digits, dot, underscore, slash, dash, ≤ 63
      chars): "{{ item.value }}" does not fit {{ item.name }}.
      {{ item.allow_empty | bool | ternary('It may also be "" (fall back to the
      component-ID job Alloy used before this label existed).', '') }}
  loop:
    # Only the node job may be blanked: that restores the pre-existing
    # job="prometheus.scrape.decdn_node" identity. The other three feed Grafana
    # Cloud integration dashboards that filter on an exact job value.
    - {name: grafana_alloy_node_job, value: "{{ grafana_alloy_node_job | string }}", allow_empty: true}
    - {name: grafana_alloy_host_job, value: "{{ grafana_alloy_host_job | string }}", allow_empty: false}
    - {name: grafana_alloy_self_job, value: "{{ grafana_alloy_self_job | string }}", allow_empty: false}
    - {name: grafana_alloy_logs_job, value: "{{ grafana_alloy_logs_job | string }}", allow_empty: false}
  loop_control:
    label: "{{ item.name }}"

- name: Validate integer pipeline knobs
  ansible.builtin.assert:
    that:
      - (item.value | string) is match('^[0-9]+$')
      - item.value | int >= 1
    quiet: true
    fail_msg: >-
      {{ item.name }} must be a positive integer (got "{{ item.value }}").
  loop:
    - {name: grafana_alloy_batch_send_size, value: "{{ grafana_alloy_batch_send_size }}"}
    - {name: grafana_alloy_batch_max_size, value: "{{ grafana_alloy_batch_max_size }}"}
    - {name: grafana_alloy_queue_size, value: "{{ grafana_alloy_queue_size }}"}
  loop_control:
    label: "{{ item.name }}"

- name: Validate identity labels
  ansible.builtin.assert:
    that:
      # "" is legal here (attribute omitted entirely) but a blank AFTER trimming
      # whitespace must not sneak through.
      - item in ["", none] or item is match('^[A-Za-z0-9._/-]{1,63}$')
    quiet: true
    fail_msg: >-
      Identity label values are shipped to Grafana Cloud as metric labels and OTLP
      resource attributes on EVERY series/span, so they are restricted to a
      low-cardinality charset (letters, digits, dot, underscore, slash, ≤ 63
      chars): {{ item }} does not fit. Offending variables:
      grafana_alloy_service_name / service_namespace / instance_id /
      deployment_environment / region.
  loop:
    - "{{ grafana_alloy_service_name }}"
    - "{{ grafana_alloy_service_namespace }}"
    # _ga_instance_id is REQUIRED (never "") — it has a derived non-empty default.
    - "{{ _ga_instance_id }}"
    # These two may be "" (= attribute omitted entirely).
    - "{{ grafana_alloy_deployment_environment | default('', true) }}"
    - "{{ grafana_alloy_region | default('', true) }}"
  loop_control:
    label: "{{ item }}"

- name: Require deployment identity attributes
  ansible.builtin.assert:
    that:
      - grafana_alloy_deployment_environment | length > 0
      - grafana_alloy_region | length > 0
    fail_msg: >-
      grafana_alloy_deployment_environment and grafana_alloy_region are required
      identity attributes when Grafana Cloud observability is enabled.

# --- Grafana Cloud connection settings (inventory half) -------------------------
# These five are NON-secret and therefore inventory-settable; each one that is set
# replaces its sys.env("GC_…") lookup in the rendered config and removes the
# corresponding requirement from the host-state gates at the bottom of this file.
# The API token has no variable by design: config.alloy is 0644 on the host.

- name: Validate any inventory-provided Grafana Cloud endpoints
  ansible.builtin.assert:
    that:
      # Empty == "fall back to the env file", which is the default and always OK.
      - item.value | length == 0 or item.value is match('^https://[^\s]+$')
    quiet: true
    fail_msg: >-
      {{ item.name }} must be an https:// URL (got "{{ item.value }}"). Plain
      http would ship your Grafana Cloud API token in cleartext. Leave it empty
      to keep reading the value from {{ item.key }} in
      {{ grafana_alloy_secret_file }} instead.
  loop:
    - {name: grafana_alloy_prom_url, key: GC_PROM_REMOTE_WRITE_URL, value: "{{ grafana_alloy_prom_url | string }}"}
    - {name: grafana_alloy_otlp_endpoint, key: GC_OTLP_ENDPOINT, value: "{{ grafana_alloy_otlp_endpoint | string }}"}
    - {name: grafana_alloy_loki_url, key: GC_LOKI_URL, value: "{{ grafana_alloy_loki_url | string }}"}
  loop_control:
    label: "{{ item.name }}"

- name: Validate any inventory-provided Grafana Cloud instance IDs
  ansible.builtin.assert:
    that:
      - item.value | length == 0 or item.value is match('^[A-Za-z0-9._-]{1,64}$')
    quiet: true
    fail_msg: >-
      {{ item.name }} must be the numeric Grafana Cloud instance ID (letters,
      digits, dot, underscore, dash), not a token and not a quoted string with
      whitespace — got "{{ item.value }}". NOTE the Loki instance ID differs from
      the Prometheus one; the access-policy token is shared and stays in
      {{ grafana_alloy_secret_file }} as GC_API_TOKEN.
  loop:
    - {name: grafana_alloy_prom_username, value: "{{ grafana_alloy_prom_username | string }}"}
    - {name: grafana_alloy_loki_username, value: "{{ grafana_alloy_loki_username | string }}"}
  loop_control:
    label: "{{ item.name }}"

- name: Refuse a Grafana Cloud token smuggled into inventory
  ansible.builtin.assert:
    that:
      # Access-policy tokens (glc_), service-account tokens (glsa_), API keys
      # (eyJ… — base64 JSON), and any URL carrying user:pass@host.
      - not (item is search('(glc_|glsa_|eyJ)'))
      - "'@' not in item"
    quiet: true
    fail_msg: >-
      A Grafana Cloud access token (or a URL with embedded credentials) appears
      in an inventory variable. config.alloy is world-readable on the host and
      inventory is committed: the token belongs ONLY in
      {{ grafana_alloy_secret_file }} as GC_API_TOKEN.
  loop:
    - "{{ grafana_alloy_prom_url | string }}"
    - "{{ grafana_alloy_prom_username | string }}"
    - "{{ grafana_alloy_otlp_endpoint | string }}"
    - "{{ grafana_alloy_loki_url | string }}"
    - "{{ grafana_alloy_loki_username | string }}"
  loop_control:
    label: "{{ item | truncate(24, true) }}"

- name: Validate the loopback listener addresses
  ansible.builtin.assert:
    that:
      - grafana_alloy_otlp_grpc_bind == '127.0.0.1'
      - grafana_alloy_otlp_http_bind == '127.0.0.1'
      - grafana_alloy_server_http_addr is match('^127[.]0[.]0[.]1:[0-9]+$')
    fail_msg: >-
      Grafana Alloy OTLP and admin listeners must bind to 127.0.0.1 only;
      wildcard or public listener addresses are not permitted.

- name: Validate listener ports
  ansible.builtin.assert:
    that:
      - (item | string) is match('^[0-9]+$')
      - item | int >= 1
      - item | int <= 65535
    quiet: true
    fail_msg: "Grafana Alloy listener ports must be decimal integers in 1..65535 (got {{ item }})."
  loop:
    - "{{ grafana_alloy_otlp_grpc_port }}"
    - "{{ grafana_alloy_otlp_http_port }}"
    - "{{ grafana_alloy_server_http_addr.split(':')[-1] }}"

- name: Validate the managed filesystem paths
  ansible.builtin.import_tasks: validate-paths.yml

# COUPLING GUARD: the node-side otlp_endpoint injected by
# roles/decdn_node/templates/node.toml.j2 hardcodes the gRPC receiver port
# constant. If this default ever moves, node.toml must move WITH it — the molecule
# suite asserts the pair stays coherent; update both plus their comments.
- name: Require the standard OTLP gRPC port the node's exporter expects
  ansible.builtin.assert:
    that:
      - grafana_alloy_otlp_grpc_port | int == 4317
      - (grafana_alloy_otlp_grpc_port | string) is match('^[0-9]+$')
    fail_msg: >-
      grafana_alloy_otlp_grpc_port was moved away from 4317, but
      roles/decdn_node emits otlp_endpoint="http://127.0.0.1:4317" as a fixed
      literal — spans would stop reaching Alloy while every deploy stays green.
      Either restore 4317 or re-sync node.toml.j2 + the schema docs in the same
      change.

# --- Host-state credential gates ------------------------------------------------

- name: Validate the parent /etc directory for the secret file
  ansible.builtin.stat:
    path: /etc
  register: _ga_etc_stat

- name: Require /etc to be a real root-owned, non-writable parent
  ansible.builtin.assert:
    that:
      - _ga_etc_stat.stat.exists
      - _ga_etc_stat.stat.isdir | default(false)
      - (_ga_etc_stat.stat.pw_name | default('')) == 'root'
      - (_ga_etc_stat.stat.gr_name | default('')) == 'root'
      - (_ga_etc_stat.stat.mode | default('')) | length == 4
      - (_ga_etc_stat.stat.mode | string)[-2] not in ['2', '3', '6', '7']
      - (_ga_etc_stat.stat.mode | string)[-1] not in ['2', '3', '6', '7']
    fail_msg: >-
      {{ grafana_alloy_secret_file }} must be a direct child of /etc, and /etc
      must be a real root:root directory with no group/other write bit. A
      writable parent or ancestor lets a service replace the root-only
      EnvironmentFile before systemd reads it.

- name: Require the Grafana Cloud secret environment file
  ansible.builtin.stat:
    path: "{{ grafana_alloy_secret_file }}"
    follow: false
  register: _ga_secret_stat

# stat.exists alone cannot see the difference between a regular file and a
# symlink planted at the credential path that later passes a root chown/chmod
# would harden whatever TARGET it points at — exactly what the secret-file gate
# refuses, so refuse here too.
- name: Assert the secret file is a real root-owned 0600 file
  ansible.builtin.assert:
    that:
      - _ga_secret_stat.stat.exists
      - _ga_secret_stat.stat.isreg | default(false)
      - (_ga_secret_stat.stat.pw_name | default('')) == 'root'
      - (_ga_secret_stat.stat.gr_name | default('')) == 'root'
      - _ga_secret_stat.stat.mode | string == '0600'
    fail_msg: >-
      {{ grafana_alloy_secret_file }} is missing, not a regular file (symlink?
      directory?), or not owned root:root 0600 (found owner
      {{ _ga_secret_stat.stat.pw_name | default('?') }}, mode
      {{ _ga_secret_stat.stat.mode | default('?') }}). Provision it on the target
      host per roles/grafana_alloy/files/grafana-alloy.env.example:
        umask 077
        sudo install -m 600 -o root -g root grafana-alloy.env {{ grafana_alloy_secret_file }}
      systemd expands its KEY=value pairs into the unit before dropping
      privileges, so root ownership is sufficient — do not relax it.

# systemd skips an EnvironmentFile line it cannot parse SILENTLY, so each required
# key is grepped for presence + value shape directly on the host: grep keeps the
# values off stdout AND off the control machine (slurping the file back would put
# the API token there, defeating the point of the host-provisioned path).
#
# "Required" is now conditional: a key is only needed when nothing in inventory
# supplies that value, and the Loki pair is only needed when logs are enabled.
# GC_API_TOKEN is ALWAYS required — it is the one value that must never live in
# inventory.
- name: Confirm every required credential key is present and shaped correctly
  ansible.builtin.command:
    cmd: grep -qE -- '{{ item.regex }}' {{ grafana_alloy_secret_file | quote }}
  changed_when: false
  check_mode: false               # read-only gate: must also run under make check
  failed_when: false
  loop:
    # The cloud URLs must be https:// (plain http would ship the API token in
    # cleartext); the credential values must be non-empty, non-comment text.
    # POSIX bracket classes only — grep -E does NOT interpret \r/\n escapes (they
    # become literal 'r'/'n', silently poisoning the class), and each grep line is
    # already newline-free by construction.
    - key: GC_API_TOKEN
      regex: ^GC_API_TOKEN=[^[:space:]#][^[:space:]]*$
      var: "(none — the token must never be set in inventory)"
      required: true
    - key: GC_PROM_REMOTE_WRITE_URL
      regex: ^GC_PROM_REMOTE_WRITE_URL=https://[^[:space:]]+$
      var: grafana_alloy_prom_url
      required: "{{ grafana_alloy_prom_url | length == 0 }}"
    - key: GC_PROM_USERNAME
      regex: ^GC_PROM_USERNAME=[^[:space:]#][^[:space:]]*$
      var: grafana_alloy_prom_username
      required: "{{ grafana_alloy_prom_username | length == 0 }}"
    - key: GC_OTLP_ENDPOINT
      regex: ^GC_OTLP_ENDPOINT=https://[^[:space:]]+$
      var: grafana_alloy_otlp_endpoint
      required: "{{ grafana_alloy_otlp_endpoint | length == 0 }}"
    - key: GC_LOKI_URL
      regex: ^GC_LOKI_URL=https://[^[:space:]]+$
      var: grafana_alloy_loki_url
      required: "{{ grafana_alloy_logs_enabled | bool and grafana_alloy_loki_url | length == 0 }}"
    - key: GC_LOKI_USERNAME
      regex: ^GC_LOKI_USERNAME=[^[:space:]#][^[:space:]]*$
      var: grafana_alloy_loki_username
      required: "{{ grafana_alloy_logs_enabled | bool and grafana_alloy_loki_username | length == 0 }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.required | bool
  register: _ga_secret_grep

- name: Report which credential key was missing or malformed
  ansible.builtin.fail:
    msg: >-
      {{ grafana_alloy_secret_file }} does not carry a usable line for
      {{ _ga_missing | map(attribute='key') | join(', ') }}. Either add the
      KEY=value pair(s) on the host (see
      roles/grafana_alloy/files/grafana-alloy.env.example) — URLs must be
      https:// and every value non-empty, since systemd silently drops
      unparseable lines so a quoting typo looks identical to a missing key — or,
      for everything except the token, set the matching inventory variable
      instead: {{ _ga_missing | map(attribute='var') | join(', ') }}.
  vars:
    # Skipped loop items (key not required) carry no rc, so filter on rc being
    # defined first: rejectattr alone would count every skipped key as missing.
    _ga_missing: >-
      {{ _ga_secret_grep.results | default([])
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
  when: _ga_missing | length > 0
