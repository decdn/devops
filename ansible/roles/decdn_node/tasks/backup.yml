---
# Encrypted backup of a node: `include_role: {name: decdn_node, tasks_from: backup}`
# (playbooks/backup.yml, `make backup`). See docs/lifecycle.md for restore and host
# migration.
#
# The archive is encrypted ON THE HOST to the operator's age recipients (public
# keys), so plaintext key material never leaves the node and nothing secret is
# needed on the control machine: only the encrypted file is fetched. Decrypting it
# needs the matching private key, which never comes near this role.
#
# Two scopes (decdn_backup_scope):
#   identity  node.secret + keystore.json + the keystore password file. Taken hot:
#             the daemon never rewrites them while running. Enough to bring the
#             SAME on-chain identity up elsewhere.
#   full      the whole data dir minus the cache, plus the keystore (wherever it
#             lives) and the password file. The daemon's redb stores (vouchers not
#             yet redeemed live in them) are only consistent at rest, so the node is
#             stopped for the copy and restarted afterwards if it was up. Use it
#             before a host migration.

- name: Refuse to take a backup in check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: >-
      A backup writes an archive on the host and (scope "full") stops the node, so
      it has no meaningful dry run. Run it without --check.

- name: Validate the backup settings
  ansible.builtin.assert:
    that:
      - decdn_backup_scope in ["identity", "full"]
      - decdn_backup_age_recipients is sequence
      - decdn_backup_age_recipients is not string
      - decdn_backup_age_recipients is not mapping
      - decdn_backup_age_recipients | length > 0
      - >-
        decdn_backup_age_recipients
        | reject('match', '^(age1[0-9a-z]{58}|ssh-ed25519 [A-Za-z0-9+/=]+|ssh-rsa [A-Za-z0-9+/=]+)( .*)?$')
        | list | length == 0
      - decdn_backup_include_env is boolean
      - decdn_backup_leave_stopped is boolean
      - decdn_backup_fetch is boolean
    fail_msg: >-
      decdn_backup_scope must be "identity" or "full". decdn_backup_age_recipients
      must be a non-empty LIST of public keys to encrypt to: age recipients
      (age1…, from `age-keygen -y`) or SSH public keys (ssh-ed25519 / ssh-rsa lines).
      Never a private key. decdn_backup_include_env, decdn_backup_leave_stopped and
      decdn_backup_fetch must be booleans.

- name: Validate the lifecycle paths
  ansible.builtin.import_tasks: validate-lifecycle-paths.yml

# The keystore is listed explicitly in both scopes: decdn_keystore_file may live
# outside decdn_home, and a migration backup without the wallet strands the bond.
# In the full scope it is only added when the data dir does not already cover it,
# so tar does not store it twice.
- name: Build the list of paths to archive
  vars:
    _keystore_in_home: "{{ decdn_keystore_file.startswith(decdn_home.rstrip('/') ~ '/') }}"
  ansible.builtin.set_fact:
    _decdn_backup_paths: >-
      {{ ([decdn_home ~ '/node.secret', decdn_keystore_file]
          if decdn_backup_scope == 'identity'
          else [decdn_home] + ([] if _keystore_in_home | bool else [decdn_keystore_file]))
         + [decdn_keystore_password_file]
         + ([decdn_env_file] if decdn_backup_include_env | bool else []) }}
    _decdn_backup_file: >-
      {{ decdn_backup_dir }}/{{ inventory_hostname }}-{{ decdn_backup_scope }}-{{
         now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.age
    _decdn_backup_written: false

- name: Check that every path to archive exists
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _decdn_backup_stat
  loop: "{{ _decdn_backup_paths + [decdn_home ~ '/node.secret', decdn_keystore_file] }}"

- name: Require every path to archive
  ansible.builtin.assert:
    that:
      - _decdn_backup_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing on the host: {{ _decdn_backup_stat.results | rejectattr('stat.exists')
      | map(attribute='item') | unique | join(', ') }}. There is no identity to back up
      yet (deploy and provision the keystore first), or a path variable does not match
      this host.

- name: Install age
  ansible.builtin.apt:
    name: age
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ decdn_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Recipients go in a file (`age -R`) rather than argv: SSH public keys carry spaces
# and comments, and a file needs no shell quoting at all.
- name: Write the recipients file
  ansible.builtin.copy:
    dest: "{{ decdn_backup_dir }}/.recipients"
    content: "{{ decdn_backup_age_recipients | join('\n') }}\n"
    owner: root
    group: root
    mode: "0600"

# The unit's ActiveState rather than service_facts: service_facts reports only the
# "running" sub-state as running, so a Restart=always unit caught between restarts
# (activating / auto-restart) would read as stopped and never be restarted.
- name: Record whether the node is up
  ansible.builtin.systemd_service:
    name: decdn-node
  register: _decdn_backup_active
  failed_when: false

- name: Decide whether to restart the node afterwards
  ansible.builtin.set_fact:
    _decdn_was_up: >-
      {{ (_decdn_backup_active.status | default({})).get('ActiveState', '')
         in ['active', 'activating', 'reloading'] }}

- name: Check for the decdn-node unit
  ansible.builtin.stat:
    path: /etc/systemd/system/decdn-node.service
  register: _decdn_backup_unit

- name: Take the backup
  block:
    # Stopped whenever the unit exists, not only when it reads as up: a crash-looping
    # node would otherwise be restarted by systemd mid-copy.
    - name: Stop the node for a consistent full backup
      ansible.builtin.systemd_service:
        name: decdn-node
        state: stopped
      when:
        - decdn_backup_scope == "full"
        - _decdn_backup_unit.stat.exists

    # tar reads the absolute paths relative to / (so a restore is `tar -C /`) and
    # stores numeric owners. The cache is excluded from a full backup: it is
    # re-fetchable content and usually most of the disk. Written to a .partial name
    # and renamed, so an interrupted run never leaves a truncated archive behind
    # that looks complete.
    - name: Write the encrypted archive
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail;
          umask 077;
          tar -C / --numeric-owner
          --exclude={{ (decdn_cache_dir | regex_replace('^/', '')) | quote }}
          -czf - -- {{ _decdn_backup_paths | map('regex_replace', '^/', '') | map('quote') | join(' ') }}
          | age -R {{ (decdn_backup_dir ~ '/.recipients') | quote }} -o {{ (_decdn_backup_file ~ '.partial') | quote }};
          mv -- {{ (_decdn_backup_file ~ '.partial') | quote }} {{ _decdn_backup_file | quote }}
        executable: /bin/bash
      changed_when: true

    - name: Mark the archive as written
      ansible.builtin.set_fact:
        _decdn_backup_written: true
  always:
    - name: Remove a partial archive left by a failed run
      ansible.builtin.file:
        path: "{{ _decdn_backup_file }}.partial"
        state: absent

    # leave_stopped is honoured only when the archive was written: a failed backup
    # must never leave the node down with nothing to show for it.
    - name: Restart the node after the full backup
      ansible.builtin.systemd_service:
        name: decdn-node
        state: started
      when:
        - decdn_backup_scope == "full"
        - _decdn_backup_unit.stat.exists
        - _decdn_was_up | bool
        - not (decdn_backup_leave_stopped | bool and _decdn_backup_written | bool)

- name: Checksum the archive
  ansible.builtin.stat:
    path: "{{ _decdn_backup_file }}"
    checksum_algorithm: sha256
  register: _decdn_backup_result

# fetch is fine for identity archives (kilobytes). Under become it reads the whole
# file into memory on both ends (base64, via slurp), so a full archive is not
# fetched by default; the report prints a streaming copy command instead.
- name: Create the local backup directory for this host
  ansible.builtin.file:
    path: "{{ decdn_backup_local_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: decdn_backup_fetch | bool

- name: Fetch the encrypted archive to the control machine
  ansible.builtin.fetch:
    src: "{{ _decdn_backup_file }}"
    dest: "{{ decdn_backup_local_dir }}/{{ inventory_hostname }}/"
    flat: true
    validate_checksum: true
  when: decdn_backup_fetch | bool

- name: Report the backup
  ansible.builtin.debug:
    msg: >-
      {{ decdn_backup_scope }} backup written to {{ _decdn_backup_file }}
      (sha256 {{ _decdn_backup_result.stat.checksum }}, {{ _decdn_backup_result.stat.size }} bytes)
      {{- (', fetched to ' ~ decdn_backup_local_dir ~ '/' ~ inventory_hostname ~ '/')
          if decdn_backup_fetch | bool
          else ('. Not fetched; copy it off the host with: ssh ' ~ inventory_hostname
                ~ ' sudo cat ' ~ _decdn_backup_file ~ ' > ' ~ (_decdn_backup_file | basename)) }}.
      Prove it restores before you rely on it:
      `age -d -i <your-identity> <file> | tar -tz`.
      {{- ' The node was left STOPPED (decdn_backup_leave_stopped).' if decdn_backup_scope == 'full'
          and decdn_backup_leave_stopped | bool and _decdn_was_up | bool else '' }}
