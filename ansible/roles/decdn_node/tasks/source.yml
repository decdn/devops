---
# decdn_node_install_method "source": build decdn-node + the decdn CLI on the node
# from decdn_node_source_repo at decdn_node_source_ref, then install them as root.
#
# The build runs as the unprivileged decdn_build_user, never root: cargo executes
# every dependency's build script, which is arbitrary code. Each new commit builds
# in a fresh environment, so nothing one build leaves behind can reach a later one:
#   - root owns the build home, the toolchain (pinned rustup-init, then the
#     toolchain the commit's rust-toolchain.toml names, installed by root) and the
#     git clone (fetched by root); the build user can read the toolchain, nothing
#     else of it.
#   - the commit is exported with `git archive` into a work directory recreated
#     for every build, with its own CARGO_HOME, TMPDIR and HOME, and deleted after
#     a successful install. The build user has no git metadata, cargo config or
#     cache that outlives the build, cannot write any directory above it (cargo
#     reads config from every ancestor), may not use cron or at, and any process
#     it left running is killed before and after the build.
#   - the outputs are installed by files/install-build-output.py, which refuses
#     symlinks and files the build user does not own without a check-then-use race.
#
# Idempotent through a stamp holding <repo>@<commit>: a run that resolves the same
# commit (and finds both binaries installed) skips the build; a moved branch or a
# new ref rebuilds. The stamp is removed before a build installs anything and
# written again by install.yml only after the --version backstop passes, so a
# failed install, or a rollback to the previous ref after one, always rebuilds.

- name: Report that the source build is not simulated in check mode
  ansible.builtin.debug:
    msg: >-
      check mode: skipping the fetch + build of decdn_node_source_ref
      {{ decdn_node_source_ref }}. The binaries on the target are NOT rebuilt or
      checked against the ref by this run; the config and unit below still diff.
  when: ansible_check_mode

- name: Build decdn-node + decdn CLI from source
  when: not ansible_check_mode
  vars:
    decdn_toolchain_env:
      RUSTUP_HOME: "{{ decdn_build_home }}/toolchain/rustup"
      CARGO_HOME: "{{ decdn_build_home }}/toolchain/cargo"
    decdn_rustup_archive: "https://static.rust-lang.org/rustup/archive/{{ decdn_rustup_version }}"
    decdn_source_clone: "{{ decdn_build_home }}/git/decdn"
    decdn_work: "{{ decdn_build_home }}/work/decdn"
  block:
    - name: Require a pinned rustup-init digest for this target
      ansible.builtin.assert:
        that:
          - decdn_node_target in decdn_rustup_sha256
        fail_msg: >-
          decdn_rustup_sha256 has no digest for {{ decdn_node_target }}. Add the
          sha256 of rustup {{ decdn_rustup_version }}'s rustup-init for it: the
          rustup-init.sha256 published beside it under
          {{ decdn_rustup_archive }}.

    # acl: becoming the unprivileged build user needs it on a non-root connection
    # (baseline installs it too; this keeps the role self-contained). cmake is
    # optional upstream but speeds up the aws-lc-sys build.
    - name: Install the build dependencies
      ansible.builtin.apt:
        name:
          - acl
          - build-essential
          - ca-certificates
          - cmake
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the build group
      ansible.builtin.group:
        name: "{{ decdn_build_user }}"
        system: true

    # No home is created for it: the home below is root's, so the build user can
    # leave nothing there (cargo would read a ~/.cargo/config.toml from it).
    - name: Create the build user
      ansible.builtin.user:
        name: "{{ decdn_build_user }}"
        group: "{{ decdn_build_user }}"
        system: true
        home: "{{ decdn_build_home }}"
        create_home: false
        shell: /usr/sbin/nologin
      register: decdn_build_account

    # Parents first; follow: false, and every parent is root-owned, so none of
    # these can have been swapped for a symlink by the build user.
    - name: Create the root-owned build layout
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
        follow: false
      loop:
        - {path: "{{ decdn_build_home }}", group: "{{ decdn_build_user }}", mode: "0750"}
        - {path: "{{ decdn_build_home }}/toolchain", group: root, mode: "0755"}
        - {path: "{{ decdn_build_home }}/git", group: root, mode: "0700"}
        - {path: "{{ decdn_build_home }}/work", group: root, mode: "0755"}
      loop_control:
        label: "{{ item.path }}"

    # A job scheduled by one build's script would otherwise run during a later
    # build and edit its sources.
    - name: Deny cron and at to the build user
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "{{ decdn_build_user }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/cron.deny
        - /etc/at.deny

    - name: Check for an installed rustup
      ansible.builtin.stat:
        path: "{{ decdn_build_home }}/toolchain/cargo/bin/rustup"
      register: decdn_rustup_stat

    # As root, into the root-owned toolchain directory. --default-toolchain none:
    # each build installs the toolchain its commit pins (below).
    - name: Install rustup
      when: not decdn_rustup_stat.stat.exists
      block:
        - name: Download the pinned rustup-init
          ansible.builtin.get_url:
            url: "{{ decdn_rustup_archive }}/{{ decdn_node_target }}/rustup-init"
            dest: "{{ decdn_build_home }}/toolchain/rustup-init"
            checksum: "sha256:{{ decdn_rustup_sha256[decdn_node_target] }}"
            owner: root
            group: root
            mode: "0700"

        - name: Run rustup-init
          ansible.builtin.command:
            argv:
              - "{{ decdn_build_home }}/toolchain/rustup-init"
              - -y
              - --no-modify-path
              - --profile
              - minimal
              - --default-toolchain
              - none
          environment: "{{ decdn_toolchain_env }}"
          changed_when: true
      always:
        - name: Remove rustup-init
          ansible.builtin.file:
            path: "{{ decdn_build_home }}/toolchain/rustup-init"
            state: absent

    # As root, into a root-only clone: the build user never touches git metadata,
    # so no hook or repo config it could plant runs on a later fetch. force:
    # discard any local edit, so what is built is exactly the ref.
    - name: Fetch the source at {{ decdn_node_source_ref }}
      ansible.builtin.git:
        repo: "{{ decdn_node_source_repo }}"
        dest: "{{ decdn_source_clone }}"
        version: "{{ decdn_node_source_ref }}"
        force: true
      register: decdn_source_git

    - name: Read the installed-source stamp
      ansible.builtin.slurp:
        src: /usr/local/lib/decdn/installed-source
      register: decdn_source_stamp
      failed_when: false
      changed_when: false

    - name: Check the installed binaries
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ decdn_bin }}"
        - "{{ decdn_cli_bin }}"
      register: decdn_source_bins

    - name: Decide whether a build is needed
      ansible.builtin.set_fact:
        decdn_source_id: "{{ decdn_node_source_repo }}@{{ decdn_source_git.after }}"
        decdn_need_build: >-
          {{ (decdn_source_stamp.content is not defined)
             or ((decdn_source_stamp.content | b64decode | trim)
                 != (decdn_node_source_repo ~ '@' ~ decdn_source_git.after))
             or (decdn_source_bins.results | rejectattr('stat.exists') | list | length > 0) }}

    - name: Build and install @ {{ decdn_source_git.after }}
      when: decdn_need_build
      block:
        # Dropped before anything is installed, so a run that fails from here on
        # leaves no stamp, and the next run (even one rolled back to the previous
        # commit) rebuilds and reinstalls instead of trusting it.
        - name: Clear the installed-source stamp before installing
          ansible.builtin.file:
            path: /usr/local/lib/decdn/installed-source
            state: absent

        - name: Stop anything still running as the build user
          ansible.builtin.command:
            argv: [pkill, -KILL, -u, "{{ decdn_build_user }}"]
          register: decdn_build_pkill
          changed_when: decdn_build_pkill.rc == 0
          failed_when: decdn_build_pkill.rc not in [0, 1]

        # Root reads the file in its own clone, without following a symlink the
        # repo might carry there.
        - name: Read the toolchain the commit pins
          ansible.builtin.command:
            argv:
              - python3
              - -I
              - -c
              - |
                import json, os, sys, tomllib
                fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW)
                with os.fdopen(fd, "rb") as f:
                    t = tomllib.load(f).get("toolchain", {})
                print(json.dumps({"channel": t.get("channel", ""),
                                  "profile": t.get("profile", "minimal"),
                                  "components": t.get("components", [])}))
              - "{{ decdn_source_clone }}/rust-toolchain.toml"
          register: decdn_toolchain_read
          changed_when: false
          failed_when: false

        - name: Require a pinned toolchain in the commit
          ansible.builtin.assert:
            that:
              - decdn_toolchain_read.rc == 0
              - (decdn_toolchain_read.stdout | from_json).channel | length > 0
            fail_msg: >-
              {{ decdn_source_id }} has no readable rust-toolchain.toml with a
              [toolchain] channel ({{ decdn_toolchain_read.stderr | default('', true) | trim }}).
              The role installs exactly the toolchain the commit pins; build a ref
              that pins one.

        - name: Install the commit's toolchain (as root)
          ansible.builtin.command:
            argv: >-
              {{ [decdn_build_home ~ '/toolchain/cargo/bin/rustup', 'toolchain', 'install',
                  decdn_toolchain.channel, '--profile', decdn_toolchain.profile, '--no-self-update']
                 + (decdn_toolchain.components | map('regex_replace', '^', '--component=') | list) }}
          environment: "{{ decdn_toolchain_env }}"
          vars:
            decdn_toolchain: "{{ decdn_toolchain_read.stdout | from_json }}"
          register: decdn_toolchain_install
          changed_when: >-
            'unchanged' not in (decdn_toolchain_install.stdout ~ decdn_toolchain_install.stderr)

        # Into root's own work directory (the build user cannot write it), then
        # handed over read-only.
        - name: Export the commit
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ decdn_source_clone }}"
              - archive
              - --format=tar
              - --output={{ decdn_build_home }}/work/decdn.tar
              - "{{ decdn_source_git.after }}"
          changed_when: true

        - name: Let the build user read the export
          ansible.builtin.file:
            path: "{{ decdn_build_home }}/work/decdn.tar"
            owner: root
            group: "{{ decdn_build_user }}"
            mode: "0640"

        # Its parent is root-owned, so removing and recreating it as root is safe.
        - name: Remove the previous work directory
          ansible.builtin.file:
            path: "{{ decdn_work }}"
            state: absent

        - name: Create a fresh work directory for the build user
          ansible.builtin.file:
            path: "{{ decdn_work }}"
            state: directory
            owner: "{{ decdn_build_user }}"
            group: "{{ decdn_build_user }}"
            mode: "0750"

        - name: Unpack the commit as the build user
          ansible.builtin.shell:
            cmd: >-
              mkdir src cargo-home tmp async &&
              tar -xf {{ (decdn_build_home ~ '/work/decdn.tar') | quote }} -C src
            chdir: "{{ decdn_work }}"
          become: true
          become_user: "{{ decdn_build_user }}"
          changed_when: true

        - name: Remove the export
          ansible.builtin.file:
            path: "{{ decdn_build_home }}/work/decdn.tar"
            state: absent

        # async: a cold build of the workspace takes many minutes, longer than an
        # SSH session should be trusted to stay up; the job keeps running on the
        # host and is polled (its status files live in the work directory, as the
        # build user's home is root's). --locked builds the committed Cargo.lock,
        # never a re-resolved one.
        - name: Build decdn-node + decdn CLI @ {{ decdn_source_git.after }}
          ansible.builtin.command:
            argv:
              - cargo
              - build
              - --release
              - --locked
              - -p
              - decdn-node
              - -p
              - decdn-cli
            chdir: "{{ decdn_work }}/src"
          become: true
          become_user: "{{ decdn_build_user }}"
          environment: >-
            {{ {'RUSTUP_HOME': decdn_build_home ~ '/toolchain/rustup',
                'RUSTUP_TOOLCHAIN': (decdn_toolchain_read.stdout | from_json).channel,
                'CARGO_HOME': decdn_work ~ '/cargo-home',
                'HOME': decdn_work,
                'TMPDIR': decdn_work ~ '/tmp',
                'PATH': decdn_build_home ~ '/toolchain/cargo/bin:/usr/local/bin:/usr/bin:/bin'}
               | combine({'CARGO_BUILD_JOBS': decdn_node_source_build_jobs | string}
                         if (decdn_node_source_build_jobs | string) | length > 0 else {}) }}
          vars:
            # The status files of the async job; the build user's home is root's.
            ansible_async_dir: "{{ decdn_work }}/async"
          async: "{{ decdn_node_source_build_timeout | int }}"
          poll: 30
          changed_when: true

        - name: Stop anything the build left running
          ansible.builtin.command:
            argv: [pkill, -KILL, -u, "{{ decdn_build_user }}"]
          register: decdn_build_pkill
          changed_when: decdn_build_pkill.rc == 0
          failed_when: decdn_build_pkill.rc not in [0, 1]

        - name: Install the built binaries
          ansible.builtin.script:
            cmd: >-
              install-build-output.py {{ decdn_work | quote }}
              {{ ('src/target/release/' ~ item.name) | quote }}
              {{ item.dest | quote }} {{ decdn_build_account.uid }}
            executable: /usr/bin/python3
          loop:
            - {name: decdn-node, dest: "{{ decdn_bin }}"}
            - {name: decdn, dest: "{{ decdn_cli_bin }}"}
          loop_control:
            label: "{{ item.dest }}"
          register: decdn_source_install
          changed_when: decdn_source_install.stdout | trim == 'changed'
          notify: Restart decdn-node

        # Several GB, and the next build starts from scratch anyway. Kept on
        # failure, for inspection; the next build replaces it.
        - name: Remove the work directory
          ansible.builtin.file:
            path: "{{ decdn_work }}"
            state: absent
      rescue:
        - name: Report the failed source build
          ansible.builtin.fail:
            msg: >-
              Building or installing {{ decdn_source_id }} failed at
              "{{ ansible_failed_task.name }}":
              {{ (ansible_failed_result.stderr | default('', true) | trim)[-2000:]
                 or ansible_failed_result.msg | default('(no output)') }}.
              A compiler killed by the kernel is usually memory: lower
              decdn_node_source_build_jobs. "async task did not complete" means
              decdn_node_source_build_timeout ({{ decdn_node_source_build_timeout }}s)
              is too short. Check free disk under {{ decdn_build_home }} too; the
              work directory {{ decdn_work }} is left for inspection.

# Outside the check-mode skip, so `make check` shows a release -> source switch
# dropping it. A leftover release stamp would make a later release deploy of the
# SAME version skip the download over these source-built binaries.
- name: Clear the release version stamp in source mode
  ansible.builtin.file:
    path: /usr/local/lib/decdn/installed-version
    state: absent
