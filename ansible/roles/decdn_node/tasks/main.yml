---
# Provision a public deCDN node: install, configure, harden, start.
# On-chain stake + registration (ADR 019 Phase 2) is an operator action — see
# roles/decdn_node/README.md. This role covers host prep + Phase-3 startup.

# --- Fail loud on missing required config -------------------------------------
- name: Require a valid install method
  ansible.builtin.assert:
    that:
      - decdn_node_install_method in ["release", "manual"]
    fail_msg: >-
      decdn_node_install_method must be "release" (pinned GitHub Release tarballs)
      or "manual" (copy locally-built binaries from the control machine).

- name: Require a pinned release version
  ansible.builtin.assert:
    that:
      - decdn_node_version | length > 0
    fail_msg: >-
      decdn_node_version must be set to a published release (e.g. "0.1.0"). A
      matching v<version> GitHub Release must exist. Set it in host_vars.
  when: decdn_node_install_method == "release"

- name: Require manual binary sources when install method is manual
  ansible.builtin.assert:
    that:
      - decdn_node_manual_bin_src | length > 0
      - decdn_cli_manual_bin_src | length > 0
    fail_msg: >-
      decdn_node_install_method "manual" requires decdn_node_manual_bin_src and
      decdn_cli_manual_bin_src — control-machine paths to the locally-built
      decdn-node daemon and decdn CLI binaries. Set them in host_vars.
  when: decdn_node_install_method == "manual"

- name: Validate decdn_node_generate_keystore is a real boolean
  ansible.builtin.assert:
    that:
      - decdn_node_generate_keystore is boolean
    fail_msg: >-
      decdn_node_generate_keystore must be a boolean (true/false), not a quoted
      string — it gates a `| bool` conditional on host-side wallet generation.

- name: Require chain + contract configuration
  ansible.builtin.assert:
    that:
      - decdn_rpc_url | length > 0
      - decdn_chain_id | int > 0
      - decdn_payment_channel_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_capacity_bond_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_slash_judge_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_payment_channel_address != decdn_zero_address
      - decdn_capacity_bond_address != decdn_zero_address
      - decdn_slash_judge_address != decdn_zero_address
      - decdn_region is match('^[A-Z]{2}$')
    fail_msg: >-
      decdn_rpc_url, a positive decdn_chain_id, the three contract addresses
      (0x + 40 hex, none the zero address), and an uppercase ISO-3166 2-letter
      decdn_region are required. Source chain-id + contract addresses from the deCDN
      contract deployment / the relevant ADR — never guess. Set them in host_vars.
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"

# slash_appeal_address is optional (only `decdn appeal slash` uses it — the daemon
# ignores the key), so it is not in the hard assert above. But if an operator sets
# it, a half-filled/zero value would silently render a bad node.toml, so validate
# it the same fail-loud way as the required addresses when present.
- name: Validate the optional SlashAppeal address when set
  ansible.builtin.assert:
    that:
      - decdn_slash_appeal_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_slash_appeal_address != decdn_zero_address
    fail_msg: >-
      decdn_slash_appeal_address is set but is not a valid contract address
      (0x + 40 hex, not the zero address). Leave it empty to omit it, or set the
      deployed SlashAppeal address (source it from the deployment / ADR 028).
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"
  when: decdn_slash_appeal_address | length > 0

# slash_judge_from_block feeds a `| int > 0` gate in node.toml.j2, and Jinja's int
# filter silently coerces any unparseable value to 0 — which drops the key and
# reverts the daemon to a full-chain rescan on every restart, discarding the
# operator's input with no trace in the rendered config. Assert integer shape so a
# typo fails loud at deploy time instead. Runs unconditionally: the default 0
# passes, so a malformed value can never slip through the coercion silently.
- name: Validate the SlashJudge scan-floor block is a non-negative integer
  ansible.builtin.assert:
    that:
      - decdn_slash_judge_from_block | string is match('^[0-9]+$')
    fail_msg: >-
      decdn_slash_judge_from_block must be a non-negative integer (the SlashJudge
      deploy block). Got "{{ decdn_slash_judge_from_block }}". Leave it 0 to scan
      from genesis, or set the deploy block to bound per-restart rescan cost.

# The ADR 022 origin directory needs BOTH OriginAssignment + PublisherRegistry (it
# gates prefetch on the pair); the template emits them together, so reject a
# one-sided config here. Runs when EITHER is set — an empty counterpart then fails
# the address regex, turning "both or neither" into a loud, specific failure.
- name: Validate the optional origin-directory contract pair (ADR 022)
  ansible.builtin.assert:
    that:
      - decdn_origin_assignment_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_publisher_registry_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_origin_assignment_address != decdn_zero_address
      - decdn_publisher_registry_address != decdn_zero_address
    fail_msg: >-
      The origin directory (ADR 022) needs BOTH decdn_origin_assignment_address and
      decdn_publisher_registry_address set to valid contract addresses (0x + 40 hex,
      not the zero address) — or BOTH empty to omit it. Source them from the deCDN
      contract deployment for your target chain / ADR 022.
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"
  when: >-
    (decdn_origin_assignment_address | length > 0)
    or (decdn_publisher_registry_address | length > 0)

# content_blacklist_address is optional (ADR 011/031); a half-filled/zero value
# would silently render a bad node.toml, so validate it fail-loud when present —
# same posture as the SlashAppeal address.
- name: Validate the optional ContentBlacklist address when set
  ansible.builtin.assert:
    that:
      - decdn_content_blacklist_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_content_blacklist_address != decdn_zero_address
    fail_msg: >-
      decdn_content_blacklist_address is set but is not a valid contract address
      (0x + 40 hex, not the zero address). Leave it empty to omit it, or set the
      deployed ContentBlacklist address (source it from the deployment / ADR 011).
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"
  when: decdn_content_blacklist_address | length > 0

# The *_from_block knobs feed `| int > 0` gates in node.toml.j2, and Jinja's int
# filter silently coerces an unparseable value to 0 — dropping the key and
# reverting to a full-chain rescan with no trace. Assert integer shape (like
# slash_judge_from_block) so a typo fails loud. Unconditional: the default 0 passes.
- name: Validate the origin-directory and blacklist scan-floor blocks are integers
  ansible.builtin.assert:
    that:
      - decdn_origin_directory_from_block | string is match('^[0-9]+$')
      - decdn_content_blacklist_from_block | string is match('^[0-9]+$')
    fail_msg: >-
      decdn_origin_directory_from_block and decdn_content_blacklist_from_block must
      be non-negative integers (the respective contract deploy blocks). Got
      "{{ decdn_origin_directory_from_block }}" / "{{ decdn_content_blacklist_from_block }}".
      Leave them 0 to scan from genesis, or set the deploy block to bound rescan cost.

# The cache pull-through origin is a tagged [cache.origin] table: node.toml.j2
# emits only the chosen kind's fields, and the daemon denies unknown fields. Reject
# an unknown kind or a kind missing its required field(s) so a serving node never
# starts with an unusable (or NoOrigin) cache backend.
- name: Validate the cache pull-through origin when set
  ansible.builtin.assert:
    that:
      - decdn_cache_origin_kind in ["http", "fs", "s3"]
      - (decdn_cache_origin_kind != "http") or (decdn_cache_origin_url | length > 0)
      - (decdn_cache_origin_kind != "fs") or (decdn_cache_origin_path | length > 0)
      - >-
        (decdn_cache_origin_kind != "s3")
        or (decdn_cache_origin_s3_bucket | length > 0
            and decdn_cache_origin_s3_region | length > 0)
      # Validate each kind's optional value-shape ONLY for the selected kind — a
      # leftover value for a non-selected kind is never rendered, so it must not
      # fail an unrelated deploy. http: DecompressMode accepts only auto|strict (a
      # typo would render TOML the daemon rejects at load — an opaque crash-loop).
      - (decdn_cache_origin_kind != "http") or (decdn_cache_origin_decompress in ["", "auto", "strict"])
      # s3: path_style feeds a `| bool` gate in node.toml.j2; require a REAL boolean
      # so a quoted "false" is rejected here, not silently coerced to path_style = true.
      - (decdn_cache_origin_kind != "s3") or (decdn_cache_origin_s3_path_style is boolean)
    fail_msg: >-
      decdn_cache_origin_kind must be one of http|fs|s3 and carry that kind's
      required fields — http: decdn_cache_origin_url; fs: decdn_cache_origin_path;
      s3: decdn_cache_origin_s3_bucket + decdn_cache_origin_s3_region.
      decdn_cache_origin_decompress, if set, must be auto|strict, and
      decdn_cache_origin_s3_path_style must be a boolean (true/false). Leave the
      kind empty to omit [cache.origin] (cache misses then fail NoOrigin).
  when: decdn_cache_origin_kind | length > 0

# --- User & directories -------------------------------------------------------
- name: Create decdn system group
  ansible.builtin.group:
    name: "{{ decdn_group }}"
    system: true

- name: Create decdn system user
  ansible.builtin.user:
    name: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    system: true
    home: "{{ decdn_home }}"
    create_home: true
    shell: /usr/sbin/nologin

- name: Ensure data, cache and config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ decdn_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ decdn_home }}", owner: "{{ decdn_user }}", mode: "0700"}
    - {path: "{{ decdn_cache_dir }}", owner: "{{ decdn_user }}", mode: "0700"}
    - {path: "{{ decdn_etc }}", owner: "{{ decdn_user }}", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"

# For a filesystem pull-through origin (kind: fs), the daemon's FilesystemOrigin::new
# fails fast if the base path is missing or is not a directory — a crash-loop on every
# (re)start. Create it here so a kind: fs deploy is self-contained. The sharded blob
# files under it ({path}/{hex[0..2]}/{hex}) are content, not config, and stay an
# operator concern — only the base dir is role-managed. 0755 (looser than the 0700
# data dirs above) because pull-through origin blobs are public CDN content, not
# secrets, and an operator may populate the tree out-of-band as a different user.
- name: Ensure the fs cache-origin base directory exists (kind == fs)
  ansible.builtin.file:
    path: "{{ decdn_cache_origin_path }}"
    state: directory
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0755"
  when:
    - decdn_cache_origin_kind == "fs"
    - decdn_cache_origin_path | length > 0

# --- Install the binaries -----------------------------------------------------
- name: Install decdn-node + decdn CLI
  ansible.builtin.import_tasks: install.yml

# --- Opt-in turnkey wallet generation (decdn_node_generate_keystore) -----------
# Off by default. When on, mint a *fresh* wallet ONLY when the keystore is absent —
# never touching an existing (possibly funded) one. `decdn key-gen` needs a password
# file first, so we generate a random one, but ONLY when the keystore is ALSO absent:
# minting a password beside a pre-existing keystore it can't decrypt would silently
# orphan that wallet, so we refuse (the gate below then fails loud for the operator
# to supply the matching password). The generated wallet is still unfunded + unstaked;
# funding + on-chain staking/registration (ADR 019 Phase 2) stay operator steps.
- name: Check for an existing eth keystore (generate mode)
  ansible.builtin.stat:
    path: "{{ decdn_keystore_file }}"
  register: decdn_keystore_pregen_stat
  when: decdn_node_generate_keystore | bool

- name: Check for an existing keystore password file (generate mode)
  ansible.builtin.stat:
    path: "{{ decdn_keystore_password_file }}"
  register: decdn_pw_pregen_stat
  when: decdn_node_generate_keystore | bool

# Wallet generation mutates host state via a binary, which `--check` cannot dry-run
# faithfully (the command modules skip, and the password copy would otherwise simulate
# an empty-content write). Skip generation under check mode so `make check` stays clean
# and deterministic; on a genuinely unprovisioned host the gate below then reports what
# is missing — the same as the default (generate=false) posture.
#
# Only for a fresh wallet: keystore absent AND password absent. A password present
# beside a missing keystore is a valid operator-first-provisioned password — keep it
# and let key-gen bind to it below.
- name: Generate a random keystore password (fresh wallet only)
  ansible.builtin.command: openssl rand -base64 32
  register: decdn_pw_gen
  no_log: true                     # the generated value protects the keystore
  changed_when: true
  when:
    - decdn_node_generate_keystore | bool
    - not ansible_check_mode
    - not decdn_keystore_pregen_stat.stat.exists
    - not decdn_pw_pregen_stat.stat.exists

- name: Write the generated keystore password file (fresh wallet only)
  ansible.builtin.copy:
    dest: "{{ decdn_keystore_password_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
    content: "{{ decdn_pw_gen.stdout }}\n"
  no_log: true                     # the password protects the keystore at rest
  when:
    - decdn_node_generate_keystore | bool
    - not ansible_check_mode
    - not decdn_keystore_pregen_stat.stat.exists
    - not decdn_pw_pregen_stat.stat.exists

- name: Generate the eth keystore + node identity (only if keystore absent)
  ansible.builtin.command:
    cmd: >-
      {{ decdn_cli_bin }} key-gen
      --output-dir {{ decdn_home }}
      --password-file {{ decdn_keystore_password_file }}
    creates: "{{ decdn_keystore_file }}"
  become: true
  become_user: "{{ decdn_user }}"
  register: decdn_keygen
  when:
    - decdn_node_generate_keystore | bool
    - not ansible_check_mode

# NOTE: key-gen uses keystore.json as its `creates:` sentinel, but the pre-start gate
# below stats node.secret too — so a partial run (keystore.json written, node.secret
# not) is NOT masked on rerun: key-gen skips on the sentinel, then the gate fails loud
# on the missing node identity. No separate post-condition check needed here.
- name: Show the generated NodeId + eth address (fund + stake this wallet)
  ansible.builtin.debug:
    # stdout is the CLI's public NodeId + eth address per its documented contract
    # (no secret material) — safe to surface so the operator can fund + stake it.
    msg: "{{ decdn_keygen.stdout_lines }}"
  when:
    - decdn_node_generate_keystore | bool
    - decdn_keygen.changed | default(false)

# --- Require the eth wallet before start (operator-provisioned, or minted above) ---
- name: Confirm the eth keystore is present
  ansible.builtin.stat:
    path: "{{ decdn_keystore_file }}"
  register: decdn_keystore_stat

- name: Confirm the node identity is present
  ansible.builtin.stat:
    path: "{{ decdn_home }}/node.secret"
  register: decdn_node_secret_stat

- name: Confirm the keystore password file is present
  ansible.builtin.stat:
    path: "{{ decdn_keystore_password_file }}"
  register: decdn_pw_stat

- name: Require keystore + node identity + password before starting
  ansible.builtin.assert:
    that:
      - decdn_keystore_stat.stat.exists
      - decdn_node_secret_stat.stat.exists
      - decdn_pw_stat.stat.exists
    fail_msg: |-
      Missing eth keystore ({{ decdn_keystore_file }}), node identity
      ({{ decdn_home }}/node.secret) and/or password file
      ({{ decdn_keystore_password_file }}). Provision the wallet on the host as the
      {{ decdn_user }} user. key-gen READS the password file (it never creates one),
      so make it FIRST, then generate the keys INTO the data dir:
        umask 077
        openssl rand -base64 32 | sudo -u {{ decdn_user }} tee {{ decdn_keystore_password_file }} >/dev/null
        sudo -u {{ decdn_user }} chmod 600 {{ decdn_keystore_password_file }}
        sudo -u {{ decdn_user }} decdn key-gen \
          --output-dir {{ decdn_home }} --password-file {{ decdn_keystore_password_file }}
      Pass --output-dir {{ decdn_home }} explicitly: a bare `decdn key-gen` writes to
      ~/.decdn and the node would not find its keys. That writes node.secret +
      keystore.json and prints the NodeId + eth address; fund + stake that address per
      ADR 019 (still manual). Or set decdn_node_generate_keystore: true to have this
      role run all of the above on the host (the wallet is still unfunded + unstaked).

- name: Lock down keystore + node identity + password file permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
  loop:
    - "{{ decdn_keystore_file }}"
    - "{{ decdn_home }}/node.secret"
    - "{{ decdn_keystore_password_file }}"

# --- Config + hardened unit ---------------------------------------------------
# The RPC URL is the one sensitive value (it may embed an API key), so it lives
# in a 0600 EnvironmentFile (DECDN_RPC_URL, read by the binary's clap env) rather
# than node.toml. That keeps node.toml non-secret and diffable under `--check`.
- name: Write the secret environment file
  ansible.builtin.copy:
    dest: "{{ decdn_env_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
    content: "DECDN_RPC_URL={{ decdn_rpc_url }}\n"
  no_log: true                     # the RPC URL may embed an API key
  notify: Restart decdn-node

- name: Template node.toml (non-secret — RPC URL is in the env file)
  ansible.builtin.template:
    src: node.toml.j2
    dest: "{{ decdn_config_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0640"
  notify: Restart decdn-node

- name: Install decdn-node systemd unit
  ansible.builtin.template:
    src: decdn-node.service.j2
    dest: /etc/systemd/system/decdn-node.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart decdn-node

- name: Apply pending decdn-node changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start decdn-node
  ansible.builtin.systemd:
    name: decdn-node
    enabled: true
    state: started

# --- Readiness ----------------------------------------------------------------
# ADVISORY probe: the daemon binds its loopback /metrics listener only after its
# startup bootstrap completes, which on a healthy node can lag process start by a
# long way (metrics/admin bind behind the PaymentChannel buyer bootstrap — an
# upstream startup-ordering issue tracked in decdn/decdn, not here). So a probe
# TIMEOUT must NOT fail the deploy — but a metrics endpoint that ANSWERS with an
# error is a real fault, not slow startup, so that still should. failed_when below
# encodes exactly that (connection-refused advisory, non-200 fails loud). The
# service-state assert further down is a necessary backstop but NOT sufficient:
# the unit is Type=simple, so a wedged-but-alive or slow-crash-looping daemon can
# still report `running` (see that task) — a persistent timeout here is therefore
# not provably benign. Tune the window with
# decdn_readiness_retries × decdn_readiness_delay (≈60s at the defaults).
- name: Wait for the node metrics endpoint (advisory)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ decdn_metrics_port }}/metrics"
    status_code: 200
  register: decdn_metrics_probe
  retries: "{{ decdn_readiness_retries }}"
  delay: "{{ decdn_readiness_delay }}"
  # default(-1): on connection-refused the uri module returns status -1 (and may
  # omit the key). Retry only while the endpoint has NOT answered (status -1) —
  # stop the moment it answers (any other status), so a real fault (e.g. a 500)
  # surfaces immediately via failed_when rather than after the whole window.
  until: decdn_metrics_probe.status | default(-1) != -1
  changed_when: false
  # Scope the suppression, don't blanket it: -1 (not bound yet) stays advisory and
  # 200 is ready, but a bound endpoint answering any other status (e.g. a 500 from
  # a broken /metrics handler) is a genuine fault — fail loud on it instead of
  # masking it as slow startup (AGENTS.md hard-rule 4).
  failed_when: decdn_metrics_probe.status | default(-1) not in [-1, 200]
  # `--check` never starts the service, so the probe would be meaningless (and
  # uri skips in check mode anyway, leaving no status for the warn below).
  when: not ansible_check_mode

- name: Warn if the metrics endpoint was not ready within the probe window
  ansible.builtin.debug:
    # Literal block so the curl/journalctl hints print on their own lines,
    # copy-pasteable, rather than folded onto one.
    msg: |-
      decdn-node /metrics did not answer 200 within
      ~{{ (decdn_readiness_retries | int) * (decdn_readiness_delay | int) }}s
      ({{ decdn_readiness_retries }}×{{ decdn_readiness_delay }}), so readiness
      could NOT be confirmed. This is OFTEN benign — a healthy node binds
      metrics/admin late (behind the startup PaymentChannel bootstrap) and logs
      "node runtime ready" once bound — but a PERSISTENT timeout can also mean a
      wedged or mis-started daemon (a Type=simple unit still reports `running`
      even when wedged). Verify before trusting the node:
        curl -s http://127.0.0.1:{{ decdn_metrics_port }}/metrics
        journalctl -u decdn-node -e   (look for "node runtime ready")
  when:
    - not ansible_check_mode
    - decdn_metrics_probe.status | default(-1) != 200

# A stale process can still answer /metrics, so also confirm THIS unit exists and
# is running. This is a backstop, not a full health check: it catches a daemon
# that exited/failed or a fast crash-loop that tripped systemd's start limit (unit
# state `failed`), but Type=simple reports `running` the instant the process
# forks, so a wedged-but-alive or slow-crash-looping daemon can still pass here.
# FULL readiness (serving paid traffic) additionally requires on-chain
# registration — `decdn node health`.
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Confirm decdn-node is running (not failed/crash-looping)
  ansible.builtin.assert:
    that:
      - "'decdn-node.service' in ansible_facts.services"
      - ansible_facts.services['decdn-node.service'].state == 'running'
    fail_msg: "decdn-node is not running (failed/crash-looping?) — check: journalctl -u decdn-node -e"
