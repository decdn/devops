---
# Provision a public deCDN node: install, configure, harden, start.
# On-chain stake + registration (ADR 019 Phase 2) is an operator action — see
# roles/decdn_node/README.md. This role covers host prep + Phase-3 startup.

# --- Fail loud on missing required config -------------------------------------
- name: Require a valid install method
  ansible.builtin.assert:
    that:
      - decdn_node_install_method in ["release", "manual"]
    fail_msg: >-
      decdn_node_install_method must be "release" (pinned GitHub Release tarballs)
      or "manual" (copy locally-built binaries from the control machine).

# NOTE (2026-09): upstream decdn/decdn has NO release tags yet — `git ls-remote
# --tags` is empty and .github/workflows/release.yml only fires on a v[0-9]* tag
# push. Until the first tag is cut, "release" mode has nothing to download and
# "manual" is the only working method; that is why the role default is "manual".
# This assert stays so the failure names the cause instead of surfacing a bare 404
# from the first get_url.
- name: Require a pinned release version
  ansible.builtin.assert:
    that:
      - decdn_node_version | length > 0
    fail_msg: >-
      decdn_node_install_method "release" requires decdn_node_version (e.g. "0.1.1")
      and a matching v<version> GitHub Release. As of decdn/decdn @ d306cc5c no
      release tag has been cut, so there is nothing to download — build the two
      binaries from a checkout and use decdn_node_install_method "manual" until an
      upstream release exists. Set the version in host_vars once one does.
  when: decdn_node_install_method == "release"

- name: Validate decdn_verify_release_signature is a real boolean
  ansible.builtin.assert:
    that:
      - decdn_verify_release_signature is boolean
    fail_msg: >-
      decdn_verify_release_signature must be a boolean (true/false). Leave it true
      unless you are installing from a mirror that strips SHA256SUMS.asc — turning
      it off means the tarballs are taken on trust.
  when: decdn_node_install_method == "release"

- name: Require manual binary sources when install method is manual
  ansible.builtin.assert:
    that:
      - decdn_node_manual_bin_src | length > 0
      - decdn_cli_manual_bin_src | length > 0
    fail_msg: >-
      decdn_node_install_method "manual" requires decdn_node_manual_bin_src and
      decdn_cli_manual_bin_src — control-machine paths to the locally-built
      decdn-node daemon and decdn CLI binaries. Set them in host_vars.
  when: decdn_node_install_method == "manual"

- name: Validate decdn_node_generate_keystore is a real boolean
  ansible.builtin.assert:
    that:
      - decdn_node_generate_keystore is boolean
    fail_msg: >-
      decdn_node_generate_keystore must be a boolean (true/false), not a quoted
      string — it gates a `| bool` conditional on host-side wallet generation.

# The RPC URL has TWO authoring paths (#39) and the choice is inferred from host
# state, so it has to be established BEFORE the asserts that depend on it. Either
# the operator supplies decdn_rpc_url from inventory (the role then authors the
# env file, overwriting whatever is on the host), or they provision a 0600
# /etc/decdn/decdn.env on the target themselves and the secret never touches the
# control machine at all.
#
# `stat.exists` alone cannot tell those apart — a file the role itself wrote on a
# previous converge exists just as much as an operator-provisioned one. That
# ambiguity is dangerous in BOTH directions, so after every converge that gets the
# daemon running the role records WHICH PATH wrote the file and what its contents
# hashed to, as "<source> <sha256>" in decdn_env_checksum_file. The source token is
# load-bearing and not derivable from the hash: the record is written on both
# paths, so a matching hash means only "unchanged since the last converge".
#   source=host      -> the operator owns this file
#   source=inventory -> this role rendered it from decdn_rpc_url
#   no record        -> provenance unknown (a host predating this mechanism)
#   hash mismatch    -> the file changed since that converge
# get_checksum is what makes the hash comparison possible; the value is a sha256 of
# a secret-bearing file, not the secret.
- name: Check for a host-provisioned secret environment file
  ansible.builtin.stat:
    path: "{{ decdn_env_file }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: decdn_env_pre_stat

# Deliberately not `slurp`-ing the env file itself anywhere in this role — only
# this 0600 record of its hash, which is not sensitive. A missing record is the
# normal state on a host that has never run a post-#39 converge, so a read failure
# is an expected outcome rather than an error.
- name: Read the env-file checksum this role last recorded
  ansible.builtin.slurp:
    src: "{{ decdn_env_checksum_file }}"
  register: decdn_env_recorded
  failed_when: false
  changed_when: false

# Both fields default to "" — treated exactly like "no record", which is also the
# right answer for a truncated or older single-field record: warn, do not fail.
- name: Resolve the env file's provenance
  ansible.builtin.set_fact:
    decdn_env_record_source: >-
      {{ ((decdn_env_recorded.content | default('') | b64decode | trim).split() | length == 2)
         | ternary((decdn_env_recorded.content | default('') | b64decode | trim).split()[0], '') }}
    decdn_env_recorded_sum: >-
      {{ ((decdn_env_recorded.content | default('') | b64decode | trim).split() | length == 2)
         | ternary((decdn_env_recorded.content | default('') | b64decode | trim).split()[1], '') }}

- name: Require chain + contract configuration
  ansible.builtin.assert:
    that:
      - decdn_chain_id | int > 0
      - decdn_payment_pool_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_capacity_bond_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_slash_judge_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_content_blacklist_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_payment_pool_address != decdn_zero_address
      - decdn_capacity_bond_address != decdn_zero_address
      - decdn_slash_judge_address != decdn_zero_address
      - decdn_content_blacklist_address != decdn_zero_address
      - decdn_region is match('^[A-Z]{2}$')
    fail_msg: >-
      A positive decdn_chain_id, the FOUR contract addresses
      (0x + 40 hex, none the zero address), and an uppercase ISO-3166 2-letter
      decdn_region are required. decdn_content_blacklist_address joined this list
      upstream (ADR 011/031): the daemon now refuses to resolve a config without a
      ContentBlacklist, because an absent or zero address is a fail-open compliance
      trap — serving a blacklisted hash past its window is slashable. Source
      chain-id + contract addresses from the deCDN contract deployment manifest
      (decdn/contracts/deployments/<chainId>.json) — never guess. Set them in host_vars.
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"

# The RPC endpoint gate. Mirrors the pre-start keystore gate below: the role does
# not insist on carrying the secret itself, it insists the secret EXISTS — either
# in inventory, or already on the host at 0600. Only "neither" is a failure.
#
# The provisioning commands below are deliberately heredoc-free and reference NO
# `decdn` user: this assert fires ~700 tasks before "Create decdn system user", so
# on a never-converged host that account does not exist yet and `install -o decdn`
# / `chown decdn:decdn` would fail. Creating the file as root is correct — "Lock
# down a host-provisioned env file" chowns it to {{ decdn_user }} on the converge
# that follows. (A heredoc cannot survive this message either: an indented `EOF`
# does not terminate `<<'EOF'`, and the block's own indentation would prefix the
# written line with spaces, which the DECDN_RPC_URL grep below then rejects.)
- name: Require an RPC endpoint — inventory value or a host-provisioned env file
  ansible.builtin.assert:
    that:
      - decdn_rpc_url | length > 0 or decdn_env_pre_stat.stat.exists
    fail_msg: |-
      No RPC endpoint: decdn_rpc_url is empty and {{ decdn_env_file }} does not
      exist on this host. The URL may embed a provider API key, so the preferred
      posture is to provision it on the host and keep it off the control machine
      entirely. Run this on the TARGET, as root (the {{ decdn_user }} account may
      not exist yet — this role creates it, and chowns the file on the next run):
        sudo mkdir -p {{ decdn_etc }}
        echo 'DECDN_RPC_URL=https://…' | sudo tee {{ decdn_env_file }} >/dev/null
        sudo chmod 600 {{ decdn_env_file }}
      Add any other environment-borne secrets (e.g. AWS_ACCESS_KEY_ID /
      AWS_SECRET_ACCESS_KEY for an S3 cache origin) as further KEY=value lines in
      that same file — see roles/decdn_node/files/decdn.env.example. This role
      then leaves the file's CONTENT alone and only enforces 0600 ownership.
      Alternatively set decdn_rpc_url (plus any decdn_extra_env) in the git-ignored
      host_vars/<node>/secret.yml and the role will author the file for you.

# stat.exists is true for a directory or a symlink. Both are hazards, not merely
# unsupported: "Lock down a host-provisioned env file" runs `file` as root, and
# with the module's default follow:true a symlink planted by a compromised
# {{ decdn_user }} account (which owns the 0750 {{ decdn_etc }}) would have root
# chown+chmod the TARGET — /etc/shadow, say. A symlink also has no stat.checksum,
# which would surface much later as an undefined-variable crash. Refuse early.
- name: Require the env file to be a regular file
  ansible.builtin.assert:
    that:
      - decdn_env_pre_stat.stat.isreg | default(false)
    fail_msg: >-
      {{ decdn_env_file }} exists but is not a regular file
      (symlink/directory/device). This role chowns and chmods that path as root,
      so following a link out of {{ decdn_etc }} would apply 0600 {{ decdn_user }}
      ownership to whatever it points at. Replace it with a real file. To keep the
      secret on other storage, bind-mount it there rather than symlinking.
  when: decdn_env_pre_stat.stat.exists

# The dangerous half of inferring the path from host state. An empty decdn_rpc_url
# is meant to say "the operator provisioned this file" — but it also happens when
# the git-ignored secret.yml is simply ABSENT: a fresh clone, a new control
# machine, a CI runner, an undecrypted vault. Without this check the role would
# then adopt its own previously-written file as though it were operator-supplied,
# and a ROTATED url in the missing secret.yml would silently never land: the grep
# finds the role's own stale DECDN_RPC_URL line, the checksum is unchanged, no
# restart is queued, and the deploy is green. Before #39 that state failed loud at
# "Require chain + contract configuration"; this restores that.
- name: Refuse to adopt a role-authored env file as host-provisioned
  ansible.builtin.assert:
    that:
      - decdn_env_record_source != 'inventory'
        or decdn_env_recorded_sum != (decdn_env_pre_stat.stat.checksum | default(''))
    fail_msg: >-
      decdn_rpc_url is empty, but {{ decdn_env_file }} is byte-for-byte the file
      THIS ROLE last wrote from inventory — so the value has gone missing from the
      control machine (an absent host_vars/<node>/secret.yml, a fresh clone, an
      undecrypted vault) rather than being deliberately handed to the host.
      Treating it as host-provisioned would deploy green while silently keeping the
      old endpoint. Restore decdn_rpc_url, or — if you really are migrating this
      node to the host-provisioned path — hand the file over explicitly by
      discarding the role's provenance record:
      sudo rm {{ decdn_env_checksum_file }}
  when: decdn_rpc_url | length == 0

# The mirror direction, and the reason it is an assert rather than the `debug` it
# started as: the role now actively tells operators to keep AWS credentials in
# this file, and an inventory decdn_rpc_url rewrites it WHOLESALE. Losing those
# lines produces exactly the outcome "Reject decdn_extra_env" exists to prevent —
# an S3 403 hours later behind a green deploy — so it gets the same treatment.
# Scoped to a file whose provenance is KNOWN to be foreign: with no record (a
# pre-#39 host's first converge) this cannot distinguish anything, so it stays
# quiet and the run seeds the record for next time.
- name: Refuse to overwrite an env file this role did not write
  ansible.builtin.assert:
    that:
      - decdn_env_overwrite_host_file | bool
    fail_msg: >-
      decdn_rpc_url is set, but {{ decdn_env_file }} on this host is not a file
      this role authored — the provenance record reads
      "{{ decdn_env_record_source | default('', true) }}" and/or its checksum no
      longer matches, so it was written or edited by someone else. Rendering it
      from inventory would DISCARD those lines (any
      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY behind an S3 origin included), and
      because this role never reads the file it cannot tell you what would be
      lost. Clear decdn_rpc_url to keep the host's copy, fold the host's extra
      lines into decdn_extra_env, or set decdn_env_overwrite_host_file: true to
      confirm the file is the role's to author.
  when:
    - decdn_rpc_url | length > 0
    - decdn_env_pre_stat.stat.exists
    - decdn_env_recorded_sum | length > 0
    - >-
      decdn_env_record_source != 'inventory'
      or decdn_env_recorded_sum != (decdn_env_pre_stat.stat.checksum | default(''))

# The env file is authored ALL-OR-NOTHING from inventory: the copy below renders
# DECDN_RPC_URL *and* decdn_extra_env in one go, and it is skipped entirely when
# decdn_rpc_url is empty. So extra_env alongside a host-provisioned file would be
# silently dropped — surfacing hours later as an S3 403 with nothing in the deploy
# output to explain it (AGENTS.md hard-rule 4). Fail loud instead.
- name: Reject decdn_extra_env when the env file is host-provisioned
  ansible.builtin.assert:
    that:
      - decdn_extra_env | default({}, true) | length == 0
    fail_msg: >-
      decdn_extra_env is set but decdn_rpc_url is empty, so this role will NOT
      write the host-provisioned {{ decdn_env_file }} and those variables would
      never reach the daemon. Append them as KEY=value lines to
      {{ decdn_env_file }} on the host instead, or move BOTH decdn_rpc_url and
      decdn_extra_env into host_vars/<node>/secret.yml so the role authors the
      whole file.
  when:
    - decdn_rpc_url | length == 0
    - decdn_env_pre_stat.stat.exists

# slash_appeal_address is optional (only `decdn appeal slash` uses it — the daemon
# validates but ignores the key), so it is not in the hard assert above. But if an
# operator sets it, a half-filled/zero value would silently render a bad node.toml,
# so validate it the same fail-loud way as the required addresses when present.
- name: Validate the optional SlashAppeal address when set
  ansible.builtin.assert:
    that:
      - decdn_slash_appeal_address is match('^0x[0-9a-fA-F]{40}$')
      - decdn_slash_appeal_address != decdn_zero_address
    fail_msg: >-
      decdn_slash_appeal_address is set but is not a valid contract address
      (0x + 40 hex, not the zero address). Leave it empty to omit it, or set the
      deployed SlashAppeal address (source it from the deployment / ADR 028).
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"
  when: decdn_slash_appeal_address | length > 0

# The ADR 022 origin-directory contracts are INDEPENDENTLY optional upstream — the
# old "both or neither" rule went away when the daemon stopped mirroring the whole
# directory (#1737). origin_assignment_address feeds the daemon's cache-miss
# pull-through fallback; publisher_registry_address is validate-only on the daemon
# and consumed by `decdn publish`. Validate each on its own when set, so a typo
# still fails loud without forcing an operator to set a contract they don't use.
- name: Validate the optional origin-directory contract addresses (ADR 022)
  ansible.builtin.assert:
    that:
      - item.value is match('^0x[0-9a-fA-F]{40}$')
      - item.value != decdn_zero_address
    fail_msg: >-
      {{ item.name }} is set but is not a valid contract address (0x + 40 hex, not
      the zero address). Leave it empty to omit it, or source the deployed address
      from the deCDN contract deployment manifest for your chain / ADR 022.
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"
  loop:
    - {name: decdn_origin_assignment_address, value: "{{ decdn_origin_assignment_address }}"}
    - {name: decdn_publisher_registry_address, value: "{{ decdn_publisher_registry_address }}"}
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0

# The CLI-only [blockchain] address keys (usdc + swap venue). The daemon validates
# them under deny_unknown_fields even though only `decdn setup` / `decdn pool` read
# them, so a malformed value fails the daemon's own startup — catch it here first.
- name: Validate the optional CLI-only contract addresses when set
  ansible.builtin.assert:
    that:
      - item.value is match('^0x[0-9a-fA-F]{40}$')
      - item.value != decdn_zero_address
    fail_msg: >-
      {{ item.name }} is set but is not a valid contract address (0x + 40 hex, not
      the zero address). Leave it empty to omit it.
  vars:
    decdn_zero_address: "0x0000000000000000000000000000000000000000"
  loop:
    - {name: decdn_usdc_address, value: "{{ decdn_usdc_address }}"}
    - {name: decdn_swap_router_address, value: "{{ decdn_swap_router_address }}"}
    - {name: decdn_swap_quoter_address, value: "{{ decdn_swap_quoter_address }}"}
    - {name: decdn_swap_balancer_pool, value: "{{ decdn_swap_balancer_pool }}"}
    - {name: decdn_swap_pool_address, value: "{{ decdn_swap_pool_address }}"}
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0

# The cache pull-through origin is a tagged [cache.origin] table: node.toml.j2
# emits only the chosen kind's fields, and the daemon denies unknown fields. Reject
# an unknown kind or a kind missing its required field(s) so a serving node never
# starts with an unusable (or NoOrigin) cache backend.
- name: Validate the cache pull-through origin when set
  ansible.builtin.assert:
    that:
      - decdn_cache_origin_kind in ["http", "fs", "s3"]
      - (decdn_cache_origin_kind != "http") or (decdn_cache_origin_url | length > 0)
      - (decdn_cache_origin_kind != "fs") or (decdn_cache_origin_path | length > 0)
      - >-
        (decdn_cache_origin_kind != "s3")
        or (decdn_cache_origin_s3_bucket | length > 0
            and decdn_cache_origin_s3_region | length > 0)
      # Validate each kind's optional value-shape ONLY for the selected kind — a
      # leftover value for a non-selected kind is never rendered, so it must not
      # fail an unrelated deploy. http: DecompressMode accepts only auto|strict (a
      # typo would render TOML the daemon rejects at load — an opaque crash-loop).
      # DecompressMode is a field on BOTH the http variant and S3OriginConfig, and
      # the template emits it for both — so guard both, not just http.
      - decdn_cache_origin_kind not in ["http", "s3"] or decdn_cache_origin_decompress in ["", "auto", "strict"]
      # s3: path_style feeds a `| bool` gate in node.toml.j2; require a REAL boolean
      # so a quoted "false" is rejected here, not silently coerced to path_style = true.
      - (decdn_cache_origin_kind != "s3") or (decdn_cache_origin_s3_path_style is boolean)
    fail_msg: >-
      decdn_cache_origin_kind must be one of http|fs|s3 and carry that kind's
      required fields — http: decdn_cache_origin_url; fs: decdn_cache_origin_path;
      s3: decdn_cache_origin_s3_bucket + decdn_cache_origin_s3_region.
      decdn_cache_origin_decompress, if set, must be auto|strict, and
      decdn_cache_origin_s3_path_style must be a boolean (true/false). Leave the
      kind empty to omit [cache.origin] (cache misses then fail NoOrigin).
  when: decdn_cache_origin_kind | length > 0

# The inverse gate. Every decdn_cache_origin_* default is "", and the validator
# above is skipped when the kind is empty — so setting a payload and forgetting the
# kind renders NO [cache.origin] table, produces no assert, no diff line and a
# green deploy, and every cache miss then fails NoOrigin at runtime on a node that
# looks healthy to systemd and to the readiness probe. Fail loud instead.
- name: Require a cache origin kind when any origin field is set
  ansible.builtin.assert:
    that:
      - decdn_cache_origin_kind | length > 0
    fail_msg: >-
      One or more decdn_cache_origin_* values are set but decdn_cache_origin_kind is
      empty, so NO [cache.origin] table is rendered and every cache miss would fail
      NoOrigin. Set decdn_cache_origin_kind to http|fs|s3, or clear the leftover
      fields (or use decdn_cache_origins for the multi-origin form).
  when: >-
    (decdn_cache_origins | length == 0)
    and ((decdn_cache_origin_url | length > 0) or (decdn_cache_origin_path | length > 0)
         or (decdn_cache_origin_s3_bucket | length > 0) or (decdn_cache_origin_s3_region | length > 0)
         or (decdn_cache_origin_s3_endpoint_url | length > 0)
         or (decdn_cache_origin_s3_prefix | length > 0)
         or (decdn_cache_origin_decompress | length > 0)
         or (decdn_cache_origin_s3_profile | length > 0)
         or decdn_cache_origin_s3_use_default_chain | bool)

# Same per-kind contract for the [[cache.origins]] list form. Entries are dicts, so
# the checks read from item.* rather than the scalar vars, and a missing key must be
# caught here: the template renders `o.url` unguarded for kind http, which would
# raise an undefined-variable error mid-template rather than a useful message.
- name: Validate each cache origin in the multi-origin list
  ansible.builtin.assert:
    that:
      - item.kind | default('') in ["http", "fs", "s3"]
      - (item.kind != "http") or (item.url | default('') | length > 0)
      - (item.kind != "fs") or (item.path | default('') | length > 0)
      - >-
        (item.kind != "s3")
        or (item.bucket | default('') | length > 0 and item.region | default('') | length > 0)
      - item.decompress | default('') in ["", "auto", "strict"]
      - item.path_style is not defined or item.path_style is boolean
      # The template renders a FIXED field list per kind, so any other key is
      # silently dropped — `path_stile: true` would leave the node talking to
      # MinIO in virtual-host mode with nothing in the diff to show for it.
      # Mirror the rate-limit tables' subset check.
      - item.keys() | list | difference(decdn_origin_keys[item.kind]) | length == 0
    fail_msg: >-
      decdn_cache_origins[{{ ansible_loop.index0 }}] is not a valid origin: each entry
      needs kind http|fs|s3 plus that kind's required fields — http: url;
      fs: path; s3: bucket + region. Optional decompress must be auto|strict and
      path_style must be a real boolean, and no key outside
      {{ decdn_origin_keys[item.kind | default('http')] | join(', ') }} (unknown keys
      are silently dropped by the template). Got {{ item }}.
  vars:
    # Per-kind field lists, matching what node.toml.j2 actually emits. `credentials`
    # is absent on purpose: the template only renders the credentials sub-table for
    # the single-origin form, so accepting it here would silently drop it.
    decdn_origin_keys:
      http: [kind, url, decompress]
      fs: [kind, path]
      s3: [kind, bucket, region, endpoint_url, path_style, prefix, decompress]
  loop: "{{ decdn_cache_origins }}"
  loop_control:
    label: "{{ item.kind | default('?') }}"
    extended: true
  when: decdn_cache_origins | length > 0

# The S3 default-chain credential toggle. Static access keys are deliberately NOT
# templated (node.toml is 0640 and diffable) — they belong in the 0600 env file via
# decdn_extra_env, which is where the AWS default chain reads them from.
- name: Validate the S3 credential-source knobs
  ansible.builtin.assert:
    that:
      - decdn_cache_origin_s3_use_default_chain is boolean
      - >-
        decdn_cache_origin_s3_profile in ["", none]
        or decdn_cache_origin_s3_profile is match('^[^\"\\s\\\\]+$')
    fail_msg: >-
      decdn_cache_origin_s3_use_default_chain must be a real boolean, and
      decdn_cache_origin_s3_profile (when set) must contain no quote, whitespace or
      backslash. Static AWS keys are never written to node.toml — put
      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN in the 0600
      {{ decdn_env_file }} on the host (or in decdn_extra_env, if the role authors
      that file) and leave the default chain to read them.

- name: Reject S3 credential knobs alongside the multi-origin form
  ansible.builtin.assert:
    that:
      - not (decdn_cache_origin_s3_use_default_chain | bool
             or decdn_cache_origin_s3_profile | length > 0)
    fail_msg: >-
      decdn_cache_origin_s3_use_default_chain / decdn_cache_origin_s3_profile apply
      only to the single [cache.origin] table — the template does not render a
      credentials sub-table for [[cache.origins]] entries, so setting them with
      decdn_cache_origins would SILENTLY drop them. Omit the credentials block (the
      AWS default chain is used anyway when it is absent) and supply keys via the
      0600 {{ decdn_env_file }}, or switch to the single-origin form.
  when: decdn_cache_origins | length > 0

# --- Optional tuning knobs ("" => omit + use the daemon default) --------------
# These template with a `!= ""` gate (NOT `| int > 0`) because 0/false are
# meaningful values here. A bad value would render TOML the daemon rejects at
# load — an opaque crash-loop — so validate shape + upstream range/constraints at
# deploy time instead (AGENTS.md hard-rule 4). Every check is guarded `== "" or
# (...)` so the unset default always passes.

- name: Validate optional boolean tuning knobs
  ansible.builtin.assert:
    that:
      - item.value in ["", none] or item.value is boolean
    quiet: true
    fail_msg: >-
      {{ item.name }} must be a real boolean (true/false), not a quoted string — it
      templates through `| bool | lower` into a bare TOML bool. Leave it "" (or
      null) to omit the key and take the daemon default.
  loop:
    - {name: decdn_buyer_max_approve, value: "{{ decdn_buyer_max_approve }}"}
    - {name: decdn_node_to_node_pull_through_enabled, value: "{{ decdn_node_to_node_pull_through_enabled }}"}
    - {name: decdn_relay_foreign_namespaces, value: "{{ decdn_relay_foreign_namespaces }}"}
    - {name: decdn_circuit_breaker_enabled, value: "{{ decdn_circuit_breaker_enabled }}"}
  loop_control:
    label: "{{ item.name }}"

# Integer shape first (a separate task): if a value is non-numeric this fails loud
# BEFORE the range task below runs its `| int` comparisons, so `| int` there never
# silently coerces a typo to 0.
- name: Validate optional integer tuning knobs are non-negative integers
  ansible.builtin.assert:
    that:
      # Shape AND magnitude: TOML integers are i64-domain, so a value above
      # i64::MAX (9223372036854775807) renders but fails the daemon's TOML parse
      # (a crash-loop) even though it is a "valid u64". Cap it here. "" and null
      # (None) both mean "unset" and pass.
      - item in ["", none] or (item | string is match('^[0-9]+$') and item | int <= 9223372036854775807)
    quiet: true
    fail_msg: >-
      "{{ item }}" is not a non-negative integer <= i64::MAX (9223372036854775807).
      Every optional numeric knob (payment/settlement/watcher/cache-tuning/
      pull-through/limits) must be a bare u64 in that range, or "" / null to omit
      it. See roles/decdn_node/defaults/main.yml for the full list.
  # A list EXPRESSION (not a list of "{{ }}" strings) so each item keeps its type —
  # a null stays None (caught by the `in [..., none]` guard) instead of becoming the
  # string "None", which would fail the shape regex.
  loop: >-
    {{ [decdn_delivery_floor, decdn_credit_max, decdn_credit_ramp_divisor,
        decdn_frame_target_bytes, decdn_voucher_commit_interval_ms,
        decdn_redeem_threshold_micro_usdc, decdn_redeem_max_vouchers_per_tx,
        decdn_redeem_interval_secs, decdn_buyer_working_deposit_micro_usdc,
        decdn_pool_min_remaining_deposit_micro_usdc, decdn_pool_floor_signer_share_bps,
        decdn_pool_floor_signer_max_windows, decdn_rpc_watchdog_interval_sec,
        decdn_event_poll_interval_ms, decdn_content_blacklist_poll_interval_sec,
        decdn_rate_bounds_poll_interval_sec, decdn_fee_shares_poll_interval_sec,
        decdn_origin_directory_positive_ttl_sec, decdn_origin_directory_negative_ttl_sec,
        decdn_origin_directory_cache_capacity, decdn_swap_fee_tier,
        decdn_max_blob_size_mb, decdn_max_rate_per_mb, decdn_max_probe_holds,
        decdn_stake_lane_reserved_holds, decdn_gc_interval_sec,
        decdn_fs_rescan_interval_sec, decdn_origin_probe_ttl_sec,
        decdn_origin_probe_negative_ttl_sec, decdn_origin_probe_fault_ttl_sec,
        decdn_origin_probe_timeout_ms, decdn_origin_probe_memo_capacity,
        decdn_eviction_high_water_pct, decdn_eviction_target_pct,
        decdn_eviction_per_sweep_budget, decdn_eviction_tick_secs,
        decdn_node_pull_probe_fanout, decdn_node_pull_timeout_sec,
        decdn_node_pull_stall_window_sec, decdn_node_pull_min_throughput_bps,
        decdn_tinylfu_sketch_bytes, decdn_tinylfu_promotion_threshold,
        decdn_tinylfu_probation_target_pct, decdn_tinylfu_aging_halflife_sec,
        decdn_serve_economics_n_max, decdn_serve_economics_warming_budget,
        decdn_serve_economics_warming_refill, decdn_origin_retry_max_retries,
        decdn_origin_retry_initial_backoff_ms, decdn_origin_retry_max_backoff_ms,
        decdn_origin_retry_buffered_max_bytes, decdn_circuit_breaker_failure_threshold,
        decdn_circuit_breaker_cooldown_ms, decdn_circuit_breaker_half_open_max_calls,
        decdn_security_max_concurrent_handlers, decdn_security_per_source_burst,
        decdn_security_max_tracked_sources, decdn_load_shed_egress_budget_mbps,
        decdn_load_shed_max_concurrent_serves_high, decdn_load_shed_max_concurrent_serves_low,
        decdn_load_shed_per_client_serve_cap, decdn_receipts_max_file_bytes,
        decdn_receipts_retained_files] }}

# Float-shaped knobs render through `| float` into a bare TOML float. A non-numeric
# value would make `| float` coerce to 0.0 and silently disable a rate limit, so
# assert the shape (accepting ints, which Jinja widens) before that happens.
- name: Validate optional float tuning knobs are non-negative numbers
  ansible.builtin.assert:
    that:
      - item.value in ["", none] or (item.value is number and item.value | float >= 0.0)
    quiet: true
    fail_msg: >-
      {{ item.name }} must be a non-negative number (it templates through `| float`
      into a bare TOML float). Got "{{ item.value }}". Leave it "" to omit the key.
  loop:
    - {name: decdn_serve_economics_discount, value: "{{ decdn_serve_economics_discount }}"}
    - {name: decdn_origin_retry_jitter_ratio, value: "{{ decdn_origin_retry_jitter_ratio }}"}
    - {name: decdn_security_per_source_rate_per_sec, value: "{{ decdn_security_per_source_rate_per_sec }}"}
  loop_control:
    label: "{{ item.name }}"

# The two rate-limit tables share one shape. Reject unknown keys here rather than
# letting them render: [dht.rate_limit] / [probe.rate_limit] are deny_unknown_fields
# upstream, and the template's key loop would silently DROP anything not on its
# list — so a typo'd knob would leave the limit at its default with no trace.
- name: Validate optional DHT + probe rate-limit tables
  ansible.builtin.assert:
    that:
      - item.value | type_debug in ["dict", "AnsibleMapping"]
      - item.value.keys() | difference(decdn_rate_limit_keys) | length == 0
      - item.value.values() | select('string') | list | length == 0
      - item.value.values() | reject('number') | list | length == 0
      # Jinja's `number` test is isinstance(v, numbers.Number) and Python's bool
      # subclasses int, so `true` passes it and renders as `1` — a burst of one
      # rather than a config error. Reject booleans explicitly.
      - item.value.values() | select('boolean') | list | length == 0
      - item.value.values() | select('lt', 0) | list | length == 0
    fail_msg: >-
      {{ item.name }} must be a mapping whose keys are a subset of
      {{ decdn_rate_limit_keys | join(', ') }}, with non-negative, non-boolean,
      unquoted numeric values.
      Got {{ item.value }}. Unknown keys are silently dropped by the template and
      rejected by the daemon, so they fail here instead.
  vars:
    decdn_rate_limit_keys:
      - per_peer_rate_per_sec
      - per_peer_burst
      - per_ip_rate_per_sec
      - per_ip_burst
      - global_rate_per_sec
      - global_burst
      - max_tracked_per_ip
      - max_tracked_per_peer
  loop:
    - {name: decdn_dht_rate_limit, value: "{{ decdn_dht_rate_limit }}"}
    - {name: decdn_probe_rate_limit, value: "{{ decdn_probe_rate_limit }}"}
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0

# Enum-valued knobs. The daemon matches these against a closed set and refuses to
# start on anything else, so a typo is a crash-loop rather than a fallback.
- name: Validate optional enum knobs
  ansible.builtin.assert:
    that:
      - item.value in ["", none] or item.value in item.allowed
    quiet: true
    fail_msg: >-
      {{ item.name }} must be one of {{ item.allowed | join(' | ') }}
      (got "{{ item.value }}"), or "" to take the daemon default.
  # Every allowed value is QUOTED. YAML 1.1 parses a bare `off` (and `on`, `no`,
  # `yes`) as a boolean, so `allowed: [off, margin]` would become [False, "margin"]
  # and the string "off" could never match — silently rejecting a valid policy.
  loop:
    - {name: decdn_eviction_policy, value: "{{ decdn_eviction_policy }}", allowed: ["lru", "tinylfu"]}
    - {name: decdn_admission_policy, value: "{{ decdn_admission_policy }}", allowed: ["always", "tinylfu"]}
    - {name: decdn_serve_economics_policy, value: "{{ decdn_serve_economics_policy }}",
       allowed: ["off", "margin"]}
    - {name: decdn_load_shed_policy, value: "{{ decdn_load_shed_policy }}",
       allowed: ["resource-pressure", "always-admit"]}
    - {name: decdn_swap_venue, value: "{{ decdn_swap_venue }}", allowed: ["uniswap-v3", "balancer-v3"]}
    - {name: decdn_log_format, value: "{{ decdn_log_format }}", allowed: ["pretty", "json"]}
    - {name: decdn_log_level, value: "{{ decdn_log_level }}",
       allowed: ["trace", "debug", "info", "warn", "error"]}
  loop_control:
    label: "{{ item.name }}"

# Range / nonzero constraints the daemon enforces at load (out-of-range => the node
# refuses to start). Values are integer-shaped by the task above, so `| int` is safe.
# ("" and null both mean "unset" and skip the check.)
- name: Validate optional knob ranges the daemon rejects out-of-range
  ansible.builtin.assert:
    that:
      # rpc_watchdog: 0 disables, otherwise must be >= 10 (1..9 rejected upstream).
      - >-
        decdn_rpc_watchdog_interval_sec in ["", none]
        or (decdn_rpc_watchdog_interval_sec | int == 0 or decdn_rpc_watchdog_interval_sec | int >= 10)
      - decdn_event_poll_interval_ms in ["", none] or (decdn_event_poll_interval_ms | int >= 250)
      - >-
        decdn_content_blacklist_poll_interval_sec in ["", none]
        or (decdn_content_blacklist_poll_interval_sec | int >= 1)
      # Knobs the daemon requires strictly positive (a configured 0 is rejected —
      # omit the knob instead to take the default).
      - item in ["", none] or (item | int >= 1)
    quiet: true
    fail_msg: >-
      An optional knob is out of the range the daemon accepts:
      decdn_rpc_watchdog_interval_sec (0 or >= 10),
      decdn_event_poll_interval_ms (>= 250),
      decdn_content_blacklist_poll_interval_sec (>= 1); and each of
      decdn_redeem_threshold_micro_usdc, decdn_redeem_max_vouchers_per_tx,
      decdn_redeem_interval_secs, decdn_buyer_working_deposit_micro_usdc,
      decdn_rate_bounds_poll_interval_sec, decdn_fee_shares_poll_interval_sec,
      decdn_voucher_commit_interval_ms must be >= 1 when set ("{{ item }}" is not).
  loop: >-
    {{ [decdn_redeem_threshold_micro_usdc, decdn_redeem_max_vouchers_per_tx,
        decdn_redeem_interval_secs, decdn_buyer_working_deposit_micro_usdc,
        decdn_rate_bounds_poll_interval_sec, decdn_fee_shares_poll_interval_sec,
        decdn_voucher_commit_interval_ms] }}

# Bounded ranges. Each is a closed interval the daemon range-checks at load, so an
# out-of-range value is a startup refusal rather than a clamp.
- name: Validate optional bounded-range knobs
  ansible.builtin.assert:
    that:
      - item.value in ["", none] or (item.value | int >= item.min and item.value | int <= item.max)
    quiet: true
    fail_msg: >-
      {{ item.name }} must be in {{ item.min }}..={{ item.max }} when set
      (got "{{ item.value }}"). Leave it "" to take the daemon default.
  loop:
    - {name: decdn_eviction_high_water_pct, value: "{{ decdn_eviction_high_water_pct }}", min: 60, max: 95}
    - {name: decdn_eviction_target_pct, value: "{{ decdn_eviction_target_pct }}", min: 40, max: 90}
    - {name: decdn_eviction_per_sweep_budget, value: "{{ decdn_eviction_per_sweep_budget }}", min: 1, max: 256}
    - {name: decdn_eviction_tick_secs, value: "{{ decdn_eviction_tick_secs }}", min: 1, max: 60}
    - {name: decdn_frame_target_bytes, value: "{{ decdn_frame_target_bytes }}", min: 1, max: 1048576}
    - {name: decdn_pool_floor_signer_share_bps, value: "{{ decdn_pool_floor_signer_share_bps }}",
       min: 1, max: 10000}
    - {name: decdn_tinylfu_probation_target_pct, value: "{{ decdn_tinylfu_probation_target_pct }}",
       min: 1, max: 50}
    # sketch_bytes has a HARD FLOOR: below it the daemon errors out at config load.
    # The floor bites on the stock lru/always policies too, because the default
    # serve_economics policy ("margin") builds the same sketch (#1803 review).
    - {name: decdn_tinylfu_sketch_bytes, value: "{{ decdn_tinylfu_sketch_bytes }}",
       min: 16384, max: 9223372036854775807}
    - {name: decdn_origin_retry_buffered_max_bytes, value: "{{ decdn_origin_retry_buffered_max_bytes }}",
       min: 1, max: 67108864}
    - {name: decdn_receipts_max_file_bytes, value: "{{ decdn_receipts_max_file_bytes }}",
       min: 1048576, max: 1073741824}
    - {name: decdn_receipts_retained_files, value: "{{ decdn_receipts_retained_files }}", min: 1, max: 100}
    - {name: decdn_redeem_interval_secs, value: "{{ decdn_redeem_interval_secs }}", min: 1, max: 21600}
  loop_control:
    label: "{{ item.name }}"

- name: Validate optional cross-field knob constraints
  ansible.builtin.assert:
    that:
      # The daemon fills each UNSET side with its own default and THEN enforces the
      # constraint, so compare effective (default-substituted) values — NOT "skip if
      # either side is unset". Skipping would let a lowered high-water mark with an
      # unset target (which resolves to 80) slip through here and crash-loop the
      # daemon at config load.
      #
      # The eviction hysteresis gap is STRUCTURAL: target must sit at least 5 points
      # below high-water, not merely below it.
      - _eff_evict_target | int <= (_eff_evict_high | int - 5)
      # Origin-probe memo TTLs must be ordered negative <= fault <= positive.
      - _eff_probe_neg | int <= _eff_probe_fault | int
      - _eff_probe_fault | int <= _eff_probe_pos | int
      # A single blob may not exceed the whole cache (0 = unlimited, so exempt).
      - _eff_max_blob | int == 0 or (_eff_max_blob | int <= decdn_cache_size_mb | int)
      # Load-shed low-water mark may not exceed the high-water mark.
      - _eff_shed_low | int <= _eff_shed_high | int
    fail_msg: >-
      Cross-field constraint violated (unset sides compared against the daemon
      default): decdn_eviction_target_pct (dflt 80) must be <=
      decdn_eviction_high_water_pct (dflt 90) MINUS 5 — the gap is structural;
      decdn_origin_probe_negative_ttl_sec (dflt 2) <= decdn_origin_probe_fault_ttl_sec
      (dflt 5) <= decdn_origin_probe_ttl_sec (dflt 15);
      decdn_max_blob_size_mb must be <= decdn_cache_size_mb (0 = unlimited);
      decdn_load_shed_max_concurrent_serves_low (dflt 192) must be <=
      decdn_load_shed_max_concurrent_serves_high (dflt 256).
  vars:
    # "" and null both mean "unset" => substitute the daemon default.
    _eff_evict_high: >-
      {{ decdn_eviction_high_water_pct if decdn_eviction_high_water_pct not in ['', none] else 90 }}
    _eff_evict_target: >-
      {{ decdn_eviction_target_pct if decdn_eviction_target_pct not in ['', none] else 80 }}
    _eff_probe_pos: >-
      {{ decdn_origin_probe_ttl_sec if decdn_origin_probe_ttl_sec not in ['', none] else 15 }}
    _eff_probe_neg: >-
      {{ decdn_origin_probe_negative_ttl_sec
         if decdn_origin_probe_negative_ttl_sec not in ['', none] else 2 }}
    _eff_probe_fault: >-
      {{ decdn_origin_probe_fault_ttl_sec
         if decdn_origin_probe_fault_ttl_sec not in ['', none] else 5 }}
    # max_blob_size_mb defaults to cache_size_mb upstream (#1685), so an unset side
    # trivially satisfies the constraint.
    _eff_max_blob: >-
      {{ decdn_max_blob_size_mb if decdn_max_blob_size_mb not in ['', none] else decdn_cache_size_mb }}
    _eff_shed_high: >-
      {{ decdn_load_shed_max_concurrent_serves_high
         if decdn_load_shed_max_concurrent_serves_high not in ['', none] else 256 }}
    _eff_shed_low: >-
      {{ decdn_load_shed_max_concurrent_serves_low
         if decdn_load_shed_max_concurrent_serves_low not in ['', none] else 192 }}

- name: Validate optional list knobs
  ansible.builtin.assert:
    that:
      # Fully anchored (^...$) with [^"\s\\]: a start-anchored '^https?://' prefix
      # match would accept a value like 'https://x" injected = 1' whose unescaped
      # quote breaks the rendered TOML array (a crash-loop). Also reject backslash —
      # in a TOML basic string it starts an escape, and a trailing '\' escapes the
      # closing quote. A null list is treated as unset (is none => pass).
      - decdn_relay_urls is none or decdn_relay_urls | reject('match', '^https?://[^\"\\s\\\\]+$') | list | length == 0
      - decdn_pinned_hashes is none or decdn_pinned_hashes | reject('match', '^[0-9a-f]{64}$') | list | length == 0
      # The node-local [content] denylist (hot-reloadable). Hashes are bare 64-char
      # lowercase hex; denied origins are 0x publisher addresses, checksum-agnostic
      # upstream but never the zero address.
      - >-
        decdn_content_denied_hashes is none
        or decdn_content_denied_hashes | reject('match', '^[0-9a-f]{64}$') | list | length == 0
      - >-
        decdn_content_denied_origins is none
        or decdn_content_denied_origins | reject('match', '^0x[0-9a-fA-F]{40}$') | list | length == 0
      - >-
        decdn_content_denied_origins is none
        or '0x0000000000000000000000000000000000000000' not in decdn_content_denied_origins
    fail_msg: >-
      decdn_relay_urls entries must each be an http(s):// URL with no quote,
      whitespace or backslash; decdn_pinned_hashes and decdn_content_denied_hashes
      entries must each be a 64-char lowercase-hex BLAKE3 hash (uppercase is
      rejected upstream); decdn_content_denied_origins entries must each be a
      0x + 40 hex address and none may be the zero address. Leave a list empty ([]).

# Address discovery (#818): pkarr_url and dns_origin are a PAIR upstream — a custom
# pkarr relay with no DNS origin cannot resolve peers. Static peers are independent
# and combinable, so they are validated separately.
- name: Validate the optional address-discovery configuration
  ansible.builtin.assert:
    that:
      # pkarr_url PUBLISHES this node's record; dns_origin RESOLVES peers. A
      # publish-only config cannot find anyone, so pkarr requires dns. The reverse
      # is legal upstream — dns_origin alone is a resolve-only node that does not
      # publish — so it is deliberately NOT required to carry a pkarr_url.
      - decdn_discovery_pkarr_url | length == 0 or decdn_discovery_dns_origin | length > 0
      - >-
        decdn_discovery_pkarr_url | length == 0
        or decdn_discovery_pkarr_url is match('^https?://[^\"\\s\\\\]+$')
      - >-
        decdn_discovery_dns_origin | length == 0
        or decdn_discovery_dns_origin is match('^[A-Za-z0-9.-]+$')
    fail_msg: >-
      decdn_discovery_pkarr_url requires decdn_discovery_dns_origin (a custom pkarr
      relay with no DNS origin publishes this node's address but cannot resolve
      anyone else's). dns_origin alone is fine — that is a resolve-only node. The
      pkarr URL must be http(s):// with no quote/whitespace/backslash and the DNS
      origin a bare domain. Setting either drops the n0 discovery leg entirely.

- name: Validate the optional static discovery peers
  ansible.builtin.assert:
    that:
      - item.key is match('^[0-9a-f]{64}$')
      - item.value.addrs is defined and item.value.addrs | length > 0
      - item.value.addrs | reject('match', '^[^\"\\s\\\\]+:[0-9]+$') | list | length == 0
      - >-
        item.value.relay_url is not defined or item.value.relay_url in ["", none]
        or item.value.relay_url is match('^https?://[^\"\\s\\\\]+$')
    fail_msg: >-
      Each decdn_discovery_peers key must be a 64-char lowercase-hex NodeId, and its
      value a mapping with a non-empty `addrs` list of host:port entries plus an
      optional http(s) `relay_url`. Offending entry: {{ item.key }}.
  loop: "{{ decdn_discovery_peers | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# cache.origin and cache.origins are mutually exclusive upstream, and an empty
# `origins` array is rejected outright. The template already prefers the list form
# and never emits both, but that would silently IGNORE a scalar origin an operator
# thought was in effect — so make the ambiguity fail loud instead.
- name: Validate the cache origin forms are not both configured
  ansible.builtin.assert:
    that:
      - not (decdn_cache_origins | length > 0 and decdn_cache_origin_kind | length > 0)
    fail_msg: >-
      decdn_cache_origins (the ordered [[cache.origins]] fallback list) and
      decdn_cache_origin_kind (the single [cache.origin] table) are mutually
      exclusive — upstream rejects a config carrying both. Clear
      decdn_cache_origin_kind to use the list, or empty the list to use the scalars.

# user_agent + otlp_endpoint interpolate into TOML basic strings ("..."). An
# unescaped '"', backslash or newline breaks the rendered node.toml (a daemon
# crash-loop — a trailing '\' escapes the closing quote), and the daemon additionally
# requires otlp_endpoint to be an http(s):// URL. Neither is emitted through | int, so
# validate their shape here (guarded so "" / null pass).
- name: Validate optional string knobs (user_agent, otlp_endpoint)
  ansible.builtin.assert:
    that:
      # No '"', CR, LF or backslash (would break the TOML string / are rejected upstream).
      - decdn_cache_user_agent in ["", none] or (decdn_cache_user_agent is match('^[^\"\\r\\n\\\\]+$'))
      # http(s):// URL, and no quote/whitespace/backslash (same TOML-injection guard).
      - decdn_otlp_endpoint in ["", none] or (decdn_otlp_endpoint is match('^https?://[^\"\\s\\\\]+$'))
    fail_msg: >-
      decdn_cache_user_agent must contain no double-quote, backslash or newline, and
      decdn_otlp_endpoint must be an http(s):// URL with no quote, whitespace or
      backslash (both are interpolated verbatim into node.toml). Leave either "" to omit.

# The REQUIRED scalars render raw (no `not in ["", none]` guard), so unlike every
# optional knob they reach node.toml unchecked. `decdn_cache_size_mb: "20 GB"`
# renders `cache_size_mb = 20 GB` — invalid TOML — and also slips the cross-field
# check above, because Jinja's `| int` coerces it to 0 and the `== 0` exemption
# then short-circuits. Same shape guard the optional knobs already get.
- name: Validate the required numeric knobs are integers in range
  ansible.builtin.assert:
    that:
      - item.value | string is match('^[0-9]+$')
      - item.value | int >= item.min
      - item.value | int <= item.max
    quiet: true
    fail_msg: >-
      {{ item.name }} must be an integer in {{ item.min }}..={{ item.max }}
      (got "{{ item.value }}"). It is rendered into node.toml unquoted, so a
      non-numeric value produces invalid TOML and a daemon crash-loop.
  loop:
    - {name: decdn_bind_port, value: "{{ decdn_bind_port }}", min: 1, max: 65535}
    - {name: decdn_metrics_port, value: "{{ decdn_metrics_port }}", min: 1, max: 65535}
    # 0 is meaningful: it disables the admin server entirely.
    - {name: decdn_admin_port, value: "{{ decdn_admin_port }}", min: 0, max: 65535}
    - {name: decdn_cache_size_mb, value: "{{ decdn_cache_size_mb }}", min: 1, max: 9223372036854775807}
    - {name: decdn_rate_per_mb, value: "{{ decdn_rate_per_mb }}", min: 0, max: 9223372036854775807}
  loop_control:
    label: "{{ item.name }}"

# AGENTS.md hard rule 2 is specifically about this knob: service daemons bind
# loopback, and only the QUIC port gets a firewall hole. Nothing else enforced it —
# `decdn_metrics_bind: "0.0.0.0"` was a clean deploy and a publicly-bound metrics
# endpoint with only the baseline firewall behind it.
- name: Require the metrics listener to stay on loopback
  ansible.builtin.assert:
    that:
      - decdn_metrics_bind is match('^(127\.[0-9.]+|::1|localhost)$')
    fail_msg: >-
      decdn_metrics_bind must be a loopback address (got "{{ decdn_metrics_bind }}").
      Metrics carry operational detail and the endpoint has no auth; exposing it is
      a deliberate architecture change, not a config tweak. Front it with a reverse
      proxy that terminates auth + TLS instead (AGENTS.md hard rule 2). The admin
      RPC is hardcoded to 127.0.0.1 upstream and cannot be moved at all.

# The one knob with no shape validation, and the one documented as the home for
# secrets. systemd's EnvironmentFile parser is shell-like: it applies POSIX-ish
# unquoting and SILENTLY SKIPS a line it cannot parse, so a secret containing a
# quote or backslash would simply be absent at runtime — surfacing hours later as
# an S3 403, with no_log guaranteeing nothing in the deploy output shows why.
- name: Validate decdn_extra_env keys and values
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - item.value | string is match('^[^\r\n]*$')
      - item.key != 'DECDN_RPC_URL'
    fail_msg: >-
      decdn_extra_env keys must be POSIX environment-variable names and values must
      contain no newline (systemd silently DROPS an unparseable EnvironmentFile
      line, so the variable would be absent at runtime rather than wrong).
      DECDN_RPC_URL is set from decdn_rpc_url and must not be overridden here.
      Offending entry: {{ item.key }}.
  loop: "{{ decdn_extra_env | default({}, true) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true                     # values are secrets by design

# --- User & directories -------------------------------------------------------
- name: Create decdn system group
  ansible.builtin.group:
    name: "{{ decdn_group }}"
    system: true

- name: Create decdn system user
  ansible.builtin.user:
    name: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    system: true
    home: "{{ decdn_home }}"
    create_home: true
    shell: /usr/sbin/nologin

- name: Ensure data, cache and config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ decdn_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ decdn_home }}", owner: "{{ decdn_user }}", mode: "0700"}
    - {path: "{{ decdn_cache_dir }}", owner: "{{ decdn_user }}", mode: "0700"}
    - {path: "{{ decdn_etc }}", owner: "{{ decdn_user }}", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"

# For a filesystem pull-through origin (kind: fs), the daemon's FilesystemOrigin::new
# fails fast if the base path is missing or is not a directory — a crash-loop on every
# (re)start. Create it here so a kind: fs deploy is self-contained. The sharded blob
# files under it ({path}/{hex[0..2]}/{hex}) are content, not config, and stay an
# operator concern — only the base dir is role-managed. mode 0755 (looser than the
# 0700 data dirs above) per issue #28: the pull-through origin blobs are public CDN
# content, not secrets, so world-readable is harmless. It grants no write — the
# daemon reads as decdn (owner) and out-of-band population runs as decdn or root
# regardless — and in the default layout the 0700 parent (/var/lib/decdn) still
# blocks traversal; 0755 only widens read access if an operator relocates the path.
- name: Ensure the fs cache-origin base directory exists (kind == fs)
  ansible.builtin.file:
    path: "{{ decdn_cache_origin_path }}"
    state: directory
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0755"
  when:
    - decdn_cache_origin_kind == "fs"
    - decdn_cache_origin_path | length > 0

# --- Install the binaries -----------------------------------------------------
- name: Install decdn-node + decdn CLI
  ansible.builtin.import_tasks: install.yml

# --- Opt-in turnkey wallet generation (decdn_node_generate_keystore) -----------
# Off by default. When on, mint a *fresh* wallet ONLY when the keystore is absent —
# never touching an existing (possibly funded) one. `decdn key-gen` needs a password
# file first, so we generate a random one, but ONLY when the keystore is ALSO absent:
# minting a password beside a pre-existing keystore it can't decrypt would silently
# orphan that wallet, so we refuse (the gate below then fails loud for the operator
# to supply the matching password). The generated wallet is still unfunded + unstaked;
# funding + on-chain staking/registration (ADR 019 Phase 2) stay operator steps.
- name: Check for an existing eth keystore (generate mode)
  ansible.builtin.stat:
    path: "{{ decdn_keystore_file }}"
  register: decdn_keystore_pregen_stat
  when: decdn_node_generate_keystore | bool

- name: Check for an existing keystore password file (generate mode)
  ansible.builtin.stat:
    path: "{{ decdn_keystore_password_file }}"
  register: decdn_pw_pregen_stat
  when: decdn_node_generate_keystore | bool

# Wallet generation mutates host state via a binary, which `--check` cannot dry-run
# faithfully (the command modules skip, and the password copy would otherwise simulate
# an empty-content write). Skip generation under check mode so `make check` stays clean
# and deterministic; on a genuinely unprovisioned host the gate below then reports what
# is missing — the same as the default (generate=false) posture.
#
# Only for a fresh wallet: keystore absent AND password absent. A password present
# beside a missing keystore is a valid operator-first-provisioned password — keep it
# and let key-gen bind to it below.
- name: Generate a random keystore password (fresh wallet only)
  ansible.builtin.command: openssl rand -base64 32
  register: decdn_pw_gen
  no_log: true                     # the generated value protects the keystore
  changed_when: true
  when:
    - decdn_node_generate_keystore | bool
    - not ansible_check_mode
    - not decdn_keystore_pregen_stat.stat.exists
    - not decdn_pw_pregen_stat.stat.exists

- name: Write the generated keystore password file (fresh wallet only)
  ansible.builtin.copy:
    dest: "{{ decdn_keystore_password_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
    content: "{{ decdn_pw_gen.stdout }}\n"
  no_log: true                     # the password protects the keystore at rest
  when:
    - decdn_node_generate_keystore | bool
    - not ansible_check_mode
    - not decdn_keystore_pregen_stat.stat.exists
    - not decdn_pw_pregen_stat.stat.exists

- name: Generate the eth keystore + node identity (only if keystore absent)
  ansible.builtin.command:
    cmd: >-
      {{ decdn_cli_bin }} key-gen
      --output-dir {{ decdn_home }}
      --password-file {{ decdn_keystore_password_file }}
    creates: "{{ decdn_keystore_file }}"
  become: true
  become_user: "{{ decdn_user }}"
  register: decdn_keygen
  when:
    - decdn_node_generate_keystore | bool
    - not ansible_check_mode

# NOTE: key-gen uses keystore.json as its `creates:` sentinel, but the pre-start gate
# below stats node.secret too — so a partial run (keystore.json written, node.secret
# not) is NOT masked on rerun: key-gen skips on the sentinel, then the gate fails loud
# on the missing node identity. No separate post-condition check needed here.
- name: Show the generated NodeId + eth address (fund + stake this wallet)
  ansible.builtin.debug:
    # stdout is the CLI's public NodeId + eth address per its documented contract
    # (no secret material) — safe to surface so the operator can fund + stake it.
    msg: "{{ decdn_keygen.stdout_lines }}"
  when:
    - decdn_node_generate_keystore | bool
    - decdn_keygen.changed | default(false)

# --- Require the eth wallet before start (operator-provisioned, or minted above) ---
- name: Confirm the eth keystore is present
  ansible.builtin.stat:
    path: "{{ decdn_keystore_file }}"
  register: decdn_keystore_stat

- name: Confirm the node identity is present
  ansible.builtin.stat:
    path: "{{ decdn_home }}/node.secret"
  register: decdn_node_secret_stat

- name: Confirm the keystore password file is present
  ansible.builtin.stat:
    path: "{{ decdn_keystore_password_file }}"
  register: decdn_pw_stat

- name: Require keystore + node identity + password before starting
  ansible.builtin.assert:
    that:
      - decdn_keystore_stat.stat.exists
      - decdn_node_secret_stat.stat.exists
      - decdn_pw_stat.stat.exists
    fail_msg: |-
      Missing eth keystore ({{ decdn_keystore_file }}), node identity
      ({{ decdn_home }}/node.secret) and/or password file
      ({{ decdn_keystore_password_file }}). Provision the wallet on the host as the
      {{ decdn_user }} user. key-gen READS the password file (it never creates one),
      so make it FIRST, then generate the keys INTO the data dir:
        umask 077
        openssl rand -base64 32 | sudo -u {{ decdn_user }} tee {{ decdn_keystore_password_file }} >/dev/null
        sudo -u {{ decdn_user }} chmod 600 {{ decdn_keystore_password_file }}
        sudo -u {{ decdn_user }} decdn key-gen \
          --output-dir {{ decdn_home }} --password-file {{ decdn_keystore_password_file }}
      Pass --output-dir {{ decdn_home }} explicitly: a bare `decdn key-gen` writes to
      ~/.decdn and the node would not find its keys. That writes node.secret +
      keystore.json and prints the NodeId + eth address; fund + stake that address per
      ADR 019 (still manual). Or set decdn_node_generate_keystore: true to have this
      role run all of the above on the host (the wallet is still unfunded + unstaked).

- name: Lock down keystore + node identity + password file permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
  loop:
    - "{{ decdn_keystore_file }}"
    - "{{ decdn_home }}/node.secret"
    - "{{ decdn_keystore_password_file }}"

# --- Config + hardened unit ---------------------------------------------------
# The RPC URL is the one sensitive value (it may embed an API key), so it lives
# in a 0600 EnvironmentFile (DECDN_RPC_URL, read by the binary's clap env) rather
# than node.toml. That keeps node.toml non-secret and diffable under `--check`.
#
# Two authoring paths, decided by the gate near the top of this file (#39):
#   * decdn_rpc_url set  -> the role authors the file from inventory (below). The
#     value transits the control machine on every converge and OVERWRITES any
#     host-provisioned file.
#   * decdn_rpc_url empty -> the operator wrote the file on the host. The role
#     never reads its content back (that would put the secret on the control
#     machine, which is the whole point of the host path); it only enforces
#     ownership + 0600 and greps for a non-empty DECDN_RPC_URL line.
- name: Write the secret environment file (inventory-supplied)
  ansible.builtin.copy:
    dest: "{{ decdn_env_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
    # to_json, NOT hand-rolled replace() chains. Inside a YAML literal block Jinja
    # takes '\\' as TWO literal backslashes, so the obvious
    # `replace('\\', '\\\\') | replace('"', '\\"')` silently escapes the wrong
    # thing: it never matches a lone backslash, and it renders a quote as \\" —
    # an escaped backslash followed by a CLOSING quote, truncating the value.
    # to_json emits exactly the double-quoted, C-escaped form systemd's
    # EnvironmentFile parser expects, and ensure_ascii=false keeps UTF-8 literal
    # (systemd understands \xNN, not \uNNNN). It supplies the quotes itself, so a
    # value with a space, '#', quote or backslash survives intact — the RPC URL
    # included, which used to be interpolated raw.
    content: |
      DECDN_RPC_URL={{ decdn_rpc_url | string | to_json(ensure_ascii=false) }}
      {% for k, v in (decdn_extra_env | default({}, true)) | dictsort %}
      {{ k }}={{ v | string | to_json(ensure_ascii=false) }}
      {% endfor %}
  no_log: true                     # the RPC URL may embed an API key
  register: decdn_env_copy
  notify: Restart decdn-node
  when: decdn_rpc_url | length > 0

# The copy above is no_log, so a run that replaced an existing file with
# control-machine values shows a bare "changed" and nothing else. Say what was
# lost. A file with a KNOWN-foreign provenance already failed the assert at the
# top of this file, so what is left here is the unknowable case: no record yet
# (a pre-#39 host's first converge). Gated on `is changed` as well, so it speaks
# up only when the contents actually moved rather than nagging every converge.
- name: Warn that an inventory decdn_rpc_url overwrote an untracked env file
  ansible.builtin.debug:
    msg: >-
      decdn_rpc_url is set in inventory, so {{ decdn_env_file }} was REWRITTEN
      from control-machine values, and this host carried no provenance record for
      it — any KEY=value lines added on the host that are not in decdn_extra_env
      are gone. From this converge on, that file is tracked: an edit made outside
      Ansible will fail the deploy instead of being silently discarded. Clear
      decdn_rpc_url (and decdn_extra_env) to hand the file back to the host.
  when:
    - decdn_rpc_url | length > 0
    - decdn_env_pre_stat.stat.exists
    - decdn_env_recorded_sum | length == 0
    - decdn_env_copy is changed

# Content untouched (no `content:`/`src:`) — this only asserts the file is owned
# by the daemon user and unreadable by anyone else, the same lock-down the
# operator-provisioned keystore gets above.
- name: Lock down a host-provisioned env file (ownership + mode only)
  ansible.builtin.file:
    path: "{{ decdn_env_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0600"
  when: decdn_rpc_url | length == 0

# `decdn config validate` further down sources this file, so a missing
# DECDN_RPC_URL would eventually surface — but as an opaque daemon error about an
# unresolvable config. Name the actual cause here instead. grep -q keeps the
# secret out of stdout AND out of argv; deliberately NOT slurp, which would copy
# the secret to the control machine and defeat the point of the host path.
- name: Confirm a host-provisioned env file carries a non-empty DECDN_RPC_URL
  ansible.builtin.command:
    cmd: grep -qE '^[[:space:]]*DECDN_RPC_URL=[^[:space:]]' {{ decdn_env_file | quote }}
  register: decdn_env_grep
  changed_when: false
  # Read-only, so it must still run under `make check` — otherwise the one gate
  # that can catch a malformed host file is exactly the gate a dry run skips.
  check_mode: false
  # Non-fatal here so the next task can turn rc into an actionable message
  # (mirrors the config-validation pair below).
  failed_when: false
  when: decdn_rpc_url | length == 0

- name: Report a host-provisioned env file with no usable DECDN_RPC_URL
  ansible.builtin.fail:
    msg: >-
      {% if decdn_env_grep.rc is not defined %}
      The {{ decdn_env_file }} content check could not be RUN
      ({{ decdn_env_grep.msg | default('no rc and no msg — re-run with -vvv', true) }}),
      so the host-provisioned env file is UNVERIFIED and the daemon must not be
      started on it.
      {% elif decdn_env_grep.rc | int > 1 %}
      {{ decdn_env_file }} could not be read (grep exited
      {{ decdn_env_grep.rc }}: {{ decdn_env_grep.stderr | default('no stderr', true) }}).
      {% else %}
      {{ decdn_env_file }} exists but carries no `DECDN_RPC_URL=` line with a
      non-whitespace value,
      so the daemon would start with no chain endpoint. Add one — note systemd
      SKIPS a line its shell-like parser cannot read, logging a warning to
      `journalctl -u decdn-node` that is easy to miss, so single-quote a value
      containing a space, quote, backslash or `$`:
      echo 'DECDN_RPC_URL=https://your-endpoint.example/rpc' | sudo tee -a
      {{ decdn_env_file }} >/dev/null
      {% endif %}
  when:
    - decdn_rpc_url | length == 0
    - decdn_env_grep.rc | default(1) != 0

# Re-stat after the file is final (the inventory path may just have rewritten it)
# so the comparison below, and the record written at the very end of this role,
# both describe what the daemon is about to be started on.
#
# Not no_log: the value is a sha256, not the secret, and hiding it would censor a
# module failure here into an unactionable "output has been hidden" — while the
# `changed` it drives is the only explanation an operator gets for a restart.
- name: Re-stat the env file now that it is final
  ansible.builtin.stat:
    path: "{{ decdn_env_file }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: decdn_env_post_stat

# Restart on an OUT-OF-BAND edit. The copy above already notifies when the role
# itself authors a changed file, so this covers only the host-provisioned path,
# where nothing else would notice that the operator edited decdn.env between
# converges — the daemon would keep running on the previous values behind a fully
# green deploy. Handlers dedupe and flush before the daemon is started, so this
# costs at most one restart.
#
# An ABSENT record is deliberately not a change: it means this host has never run
# a post-#39 converge, and treating "not tracked yet" as "edited" would bounce
# every node in the fleet on the upgrade run for no functional reason.
- name: Note an out-of-band change to the host-provisioned env file
  ansible.builtin.debug:
    msg: >-
      {{ decdn_env_file }} has changed since the last converge recorded it —
      restarting decdn-node so the daemon picks the new values up.
  changed_when: true
  notify: Restart decdn-node
  when:
    - decdn_rpc_url | length == 0
    - decdn_env_recorded_sum | length > 0
    - (decdn_env_post_stat.stat.checksum | default('')) != decdn_env_recorded_sum

- name: Template node.toml (non-secret — RPC URL is in the env file)
  ansible.builtin.template:
    src: node.toml.j2
    dest: "{{ decdn_config_file }}"
    owner: "{{ decdn_user }}"
    group: "{{ decdn_group }}"
    mode: "0640"
  notify: Restart decdn-node

# The role's own asserts mirror upstream constraints by hand and will drift again;
# this is the authoritative check. `decdn config validate` resolves the config the
# same way `decdn-node run` does — every section is deny_unknown_fields with no
# serde aliases, so a key this role renders but the installed binary does not know
# is a startup crash-loop. Validating here turns that into a failed deploy with the
# daemon's own error message, and it neither binds ports nor dials the RPC endpoint.
#
# Runs as decdn_user because it reads the 0600 keystore password; DECDN_RPC_URL is
# supplied from the same value systemd will hand the daemon. Skipped in check mode
# (node.toml has not been written yet) — the asserts above are the check-mode gate.
# The RPC URL is sourced from the 0600 env file rather than passed via Ansible's
# `environment:`. `environment:` is implemented as a shell prefix on the module
# command (`ENV=val /usr/bin/python3 ...`), so it lands in the target host's
# process table and any local user can read the embedded API key out of `ps` for
# the duration of the task — `no_log` hides it from Ansible's output, not from
# /proc. Sourcing the file systemd already reads keeps the secret on disk at 0600.
- name: Validate the rendered node.toml with the installed binary
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      # Exit 3 is reserved for "the env file could not be sourced" so the report
      # task below does not blame node.toml for a quoting typo in decdn.env. NOTE
      # this is bash, not systemd's parser: it expands $VAR and executes $(...)
      # and backticks, which systemd would pass through literally. Operators are
      # told to single-quote values (files/decdn.env.example).
      set -a
      . {{ decdn_env_file | quote }} || { echo "env-file could not be sourced" >&2; exit 3; }
      set +a
      {{ decdn_cli_bin | quote }} config validate \
        --config {{ decdn_config_file | quote }} \
        --keystore-password-file {{ decdn_keystore_password_file | quote }}
  become_user: "{{ decdn_user }}"
  become: true
  register: decdn_config_validate
  changed_when: false
  # Deliberately non-fatal: the next task turns a failure into an actionable
  # message. `failed_when: rc != 0` here would abort the play first and leave the
  # operator with a bare "non-zero return code".
  failed_when: false
  when: not ansible_check_mode

# `failed_when: false` above suppresses EVERY failure verdict, including ones that
# never produce an `rc` at all — a become_user failure (Debian without `acl`), a
# privilege-escalation timeout, a missing interpreter. Defaulting a missing rc to 0
# would treat "the gate could not run" as "the gate passed" and start the daemon on
# an unvalidated config, so an absent rc defaults to 1 and is reported distinctly.
- name: Report the config-validation failure
  ansible.builtin.fail:
    msg: >-
      {% if decdn_config_validate.rc | default(0) == 3 %}
      {{ decdn_env_file }} could not be sourced, so the config was never
      validated: {{ decdn_config_validate.stderr | default('(no output)', true) }}.
      This is a shell-syntax fault in the ENV FILE, not a problem with
      {{ decdn_config_file }} — most often an unbalanced quote, or an unquoted
      value containing a space. Single-quote the value and re-run.
      {% elif decdn_config_validate.rc is not defined %}
      `decdn config validate` could not be RUN
      ({{ decdn_config_validate.msg | default('no rc and no msg — re-run with -vvv', true) }}).
      {{ decdn_config_file }} is therefore UNVALIDATED and the daemon must not be
      started on it. A common cause is that becoming the unprivileged
      {{ decdn_user }} user needs the `acl` package on this host.
      {% else %}
      `decdn config validate` rejected the rendered {{ decdn_config_file }}:
      {{ decdn_config_validate.stderr | default('', true)
         or decdn_config_validate.stdout | default('', true)
         or decdn_config_validate.msg | default('(no output)', true) }}
      — this role renders a key the installed decdn
      {{ decdn_node_version | default('(manual)', true) }} does not accept, or a
      value outside its range. Config sections are deny_unknown_fields with no
      aliases upstream, so re-sync roles/decdn_node/templates/node.toml.j2 against
      the binary's schema.
      {% endif %}
  when:
    - not ansible_check_mode
    - decdn_config_validate is defined
    - decdn_config_validate.rc | default(1) != 0

- name: Install decdn-node systemd unit
  ansible.builtin.template:
    src: decdn-node.service.j2
    dest: /etc/systemd/system/decdn-node.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart decdn-node

- name: Apply pending decdn-node changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start decdn-node
  ansible.builtin.systemd:
    name: decdn-node
    enabled: true
    state: started

# Record the env file's hash LAST, and only here — deliberately after the handler
# flush and the start above, so the record means "the daemon is running on this
# content", not "Ansible saw this content".
#
# Writing it earlier (next to the comparison) looks equivalent and is not: the
# handler that acts on a detected change does not flush until well after the
# node.toml template and the `decdn config validate` gate, both of which can abort
# the play. A record written before that abort would say "already handled" on the
# NEXT converge — the comparison would find no change, no restart would be queued,
# and `state: started` is a no-op on a running unit — so a single failed run would
# permanently burn the one signal that the secret had been rotated. Writing it
# here means an aborted run simply leaves the old record in place and the next
# converge re-detects the change.
#
# No notify: by the time this runs, any restart this converge owed has happened.
- name: Record the env-file checksum (the daemon is now running on it)
  ansible.builtin.copy:
    dest: "{{ decdn_env_checksum_file }}"
    owner: root
    group: root
    mode: "0600"
    # "<source> <sha256>" — the source token is what a later converge uses to tell
    # "the operator owns this file" from "I rendered this from inventory".
    # Parenthesised: filters bind tighter than comparisons, so an unbracketed
    # `decdn_rpc_url | length > 0 | ternary(...)` parses as
    # (decdn_rpc_url | length) > (0 | ternary(...)).
    content: >
      {{ (decdn_rpc_url | length > 0) | ternary('inventory', 'host') }}
      {{ decdn_env_post_stat.stat.checksum }}
  # Under `--check` on an unprovisioned host the env-file copy only SIMULATES the
  # write, so there is nothing to hash and stat.checksum is undefined. Requiring
  # the checksum itself (not merely stat.exists) also keeps a non-regular file —
  # which stat reports as existing but never checksums — from templating undefined.
  when: (decdn_env_post_stat.stat.checksum | default('')) | length > 0

# --- Readiness ----------------------------------------------------------------
# ADVISORY probe: the daemon binds its loopback /metrics listener only after its
# startup bootstrap completes, which on a healthy node can lag process start by a
# long way (metrics/admin bind behind the PaymentChannel buyer bootstrap — an
# upstream startup-ordering issue tracked in decdn/decdn, not here). So a probe
# TIMEOUT must NOT fail the deploy — but a metrics endpoint that ANSWERS with an
# error is a real fault, not slow startup, so that still should. failed_when below
# encodes exactly that (connection-refused advisory, non-200 fails loud). The
# service-state assert further down is a necessary backstop but NOT sufficient:
# the unit is Type=simple, so a wedged-but-alive or slow-crash-looping daemon can
# still report `running` (see that task) — a persistent timeout here is therefore
# not provably benign. Tune the window with
# decdn_readiness_retries × decdn_readiness_delay (≈60s at the defaults).
# KICS reports this task under "Communication Over HTTP" (MEDIUM). It is a false
# positive and is left unsuppressed deliberately — KICS's inline ignore directives
# have no effect on this query in the pinned engine version, and a no-op directive
# that reads like a suppression is worse than none. The target is the loopback
# interface: the daemon serves metrics over plain HTTP and upstream binds that
# listener to 127.0.0.1 (the admin listener is hardcoded there), so there is no TLS
# to require. "Require the metrics listener to stay on loopback" above enforces that
# the address cannot be moved off loopback. `make security` gates on --fail-on high,
# so this does not fail the build.
- name: Wait for the node metrics endpoint (advisory)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ decdn_metrics_port }}/metrics"
    status_code: 200
  register: decdn_metrics_probe
  retries: "{{ decdn_readiness_retries }}"
  delay: "{{ decdn_readiness_delay }}"
  # default(-1): on connection-refused the uri module returns status -1 (and may
  # omit the key). Retry only while the endpoint has NOT answered (status -1) —
  # stop the moment it answers (any other status), so a real fault (e.g. a 500)
  # surfaces immediately via failed_when rather than after the whole window.
  until: decdn_metrics_probe.status | default(-1) != -1
  changed_when: false
  # Scope the suppression, don't blanket it: -1 (not bound yet) stays advisory and
  # 200 is ready, but a bound endpoint answering any other status (e.g. a 500 from
  # a broken /metrics handler) is a genuine fault — fail loud on it instead of
  # masking it as slow startup (AGENTS.md hard-rule 4).
  failed_when: decdn_metrics_probe.status | default(-1) not in [-1, 200]
  # `--check` never starts the service, so the probe would be meaningless (and
  # uri skips in check mode anyway, leaving no status for the warn below).
  when: not ansible_check_mode

- name: Warn if the metrics endpoint was not ready within the probe window
  ansible.builtin.debug:
    # Literal block so the curl/journalctl hints print on their own lines,
    # copy-pasteable, rather than folded onto one.
    msg: |-
      decdn-node /metrics did not answer 200 within
      ~{{ (decdn_readiness_retries | int) * (decdn_readiness_delay | int) }}s
      ({{ decdn_readiness_retries }}×{{ decdn_readiness_delay }}), so readiness
      could NOT be confirmed. This is OFTEN benign — a healthy node binds
      metrics/admin late (behind the startup PaymentChannel bootstrap) and logs
      "node runtime ready" once bound — but a PERSISTENT timeout can also mean a
      wedged or mis-started daemon (a Type=simple unit still reports `running`
      even when wedged). Verify before trusting the node:
        curl -s http://127.0.0.1:{{ decdn_metrics_port }}/metrics
        journalctl -u decdn-node -e   (look for "node runtime ready")
  when:
    - not ansible_check_mode
    - decdn_metrics_probe.status | default(-1) != 200

# A stale process can still answer /metrics, so also confirm THIS unit exists and
# is running. This is a backstop, not a full health check: it catches a daemon
# that exited/failed or a fast crash-loop that tripped systemd's start limit (unit
# state `failed`), but Type=simple reports `running` the instant the process
# forks, so a wedged-but-alive or slow-crash-looping daemon can still pass here.
# FULL readiness (serving paid traffic) additionally requires on-chain
# registration — `decdn node health`.
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Confirm decdn-node is running (not failed/crash-looping)
  ansible.builtin.assert:
    that:
      - "'decdn-node.service' in ansible_facts.services"
      - ansible_facts.services['decdn-node.service'].state == 'running'
    fail_msg: "decdn-node is not running (failed/crash-looping?) — check: journalctl -u decdn-node -e"
