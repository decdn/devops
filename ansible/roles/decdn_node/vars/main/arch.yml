---
# Host architecture (ansible_facts['architecture']) -> the upstream release target
# triple. These are the two Linux targets decdn/decdn's release.yml builds for; the
# defaults derive decdn_node_target from this map, and tasks/main.yml asserts the
# result is one of its values. Role vars, not defaults: the supported set is a fact
# about upstream's release matrix, not an operator knob.
_decdn_arch_targets:
  x86_64: x86_64-unknown-linux-gnu
  aarch64: aarch64-unknown-linux-gnu

# decdn_node_target -> the architecture token `file -b` prints for a matching ELF,
# used by the manual dir-mode binary check.
_decdn_arch_file_tokens:
  x86_64-unknown-linux-gnu: x86-64
  aarch64-unknown-linux-gnu: aarch64
