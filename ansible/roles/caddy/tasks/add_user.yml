---
# Mint a single basic-auth user `{{ caddy_target_user }}`. Idempotent: an existing
# user is left untouched and NEVER silently rotated. A freshly generated password
# is revealed exactly once. All credential-handling tasks use no_log.
- name: Validate the basic-auth username
  ansible.builtin.assert:
    that:
      - caddy_target_user is match('^[A-Za-z0-9_-]+$')
    fail_msg: >-
      Invalid basic-auth username '{{ caddy_target_user }}': use only
      [A-Za-z0-9_-]. (Keeps the value safe to interpolate into the grep /
      lineinfile regexes below.)
    quiet: true

- name: Check whether the basic-auth user already exists
  ansible.builtin.command:
    cmd: "grep -qP '^{{ caddy_target_user }}\\t' {{ caddy_users_tsv }}"
  register: caddy_user_check
  changed_when: false
  failed_when: false

- name: Mint '{{ caddy_target_user }}'
  # Never mint in check mode: minting needs the caddy binary (hash-password, which
  # auto-skips under --check), writes the TSV, and reveals a password — all mutating
  # side effects a dry run must not perform. Gating on ansible_check_mode first also
  # means caddy_user_check.rc — undefined when the existence-check command auto-skips
  # under --check — is never the deciding factor; default it so it can't error.
  when:
    - not ansible_check_mode
    - caddy_user_check.rc | default(1) != 0
  block:
    - name: Generate a random password
      ansible.builtin.set_fact:
        caddy_generated_pw: >-
          {{ lookup('ansible.builtin.password', '/dev/null',
                    chars=['ascii_letters', 'digits'], length=28) }}
      no_log: true

    - name: Hash the password (bcrypt) with caddy
      ansible.builtin.command:
        cmd: "caddy hash-password --plaintext {{ caddy_generated_pw | quote }}"
      register: caddy_hash
      changed_when: true
      no_log: true

    - name: Upsert the user into the TSV registry
      ansible.builtin.lineinfile:
        path: "{{ caddy_users_tsv }}"
        create: true
        owner: root
        group: caddy
        mode: "0640"
        regexp: "^{{ caddy_target_user }}\\t"
        line: "{{ caddy_target_user }}\t{{ caddy_hash.stdout }}"
      no_log: true

    - name: Reveal the new credential ONCE
      ansible.builtin.debug:
        msg: >-
          NEW basic-auth user '{{ caddy_target_user }}' — shown once, share securely:
          password={{ caddy_generated_pw }} ·
          ETH_RPC_URL=https://{{ caddy_target_user }}:{{ caddy_generated_pw }}@{{ rpc_hostname }}
