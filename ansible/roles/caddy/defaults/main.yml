---
# caddy role defaults. Override in inventory/group_vars for a real deployment.

# Exposure mode:
#   true  -> public HTTPS listener on rpc_hostname:443 with auto-TLS (Let's Encrypt)
#            + per-dev basic auth, reverse-proxying to the loopback anvil. Requires
#            inbound tcp/80+443 (open them via baseline_extra_inbound; see
#            inventory/group_vars/anvil_devnet.yml).
#   false -> loopback plain-HTTP listener on caddy_bind_port, for dev/CI (molecule)
#            or when TLS is terminated upstream by a tunnel/edge.
caddy_public: true
caddy_acme_email: ""                 # "" -> anonymous ACME; set for an LE account contact

caddy_bind_port: 8080                # loopback listener; only used when caddy_public is false
rpc_hostname: rpc-dev.decdn.org      # public HTTPS host (caddy_public) + printed in ETH_RPC_URL

# Upstream anvil RPC to proxy to (kept in sync with the anvil role defaults).
anvil_host: "127.0.0.1"
anvil_port: 8545

# On-host credential registry.
caddy_users_tsv: /etc/caddy/rpc-dev.users.tsv       # username<TAB>bcrypt registry
caddy_basicauth_file: /etc/caddy/rpc-dev.basicauth  # generated Caddyfile import
caddy_initial_user: dev                              # always ensured to exist
# caddy_extra_user: alice        # set by add-dev-user.yml to mint one more user

# JSON access log (self-rolling) recording who hit the RPC; also the log the
# fail2ban caddy-rpc jail watches for repeated basic-auth failures.
caddy_access_log: /var/log/caddy/rpc-access.log

# fail2ban jail banning IPs that repeatedly fail RPC basic auth. Only wired up on
# the public listener (caddy_public) — loopback/CI has no attack surface and runs
# without baseline, so fail2ban isn't installed there. Lenient by default:
# caddy_fail2ban_maxretry failures within findtime -> bantime ban (via nftables).
caddy_fail2ban: true
caddy_fail2ban_maxretry: 5
caddy_fail2ban_findtime: 10m
caddy_fail2ban_bantime: 1h
