---
# Encrypted backup of sponsord's credentials: `include_role: {name: sponsord,
# tasks_from: backup}` (playbooks/backup.yml, `make backup`). See docs/lifecycle.md
# for restore.
#
# The daemon keeps no state, so the backup is the credentials under sponsord_etc:
# the treasury keystore and its password (the wallet that owns the pool and pays
# its top-ups), the API token the onramp shares, and the onramp's Turnstile secret
# when one is on the host. Taken hot: the daemon never writes them. secret.env (the
# RPC URL) only with sponsord_backup_include_env.
#
# As decdn_node's backup: the archive is encrypted ON THE HOST to the operator's
# age recipients (public keys), so plaintext key material never leaves the host and
# only the encrypted file is fetched.

- name: Refuse to take a backup in check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: A backup writes an archive on the host, so it has no dry run. Run it without --check.

- name: Validate the backup settings
  ansible.builtin.assert:
    that:
      - sponsord_backup_age_recipients is sequence
      - sponsord_backup_age_recipients is not string
      - sponsord_backup_age_recipients is not mapping
      - sponsord_backup_age_recipients | length > 0
      - >-
        sponsord_backup_age_recipients
        | reject('match', '^(age1[0-9a-z]{58}|ssh-ed25519 [A-Za-z0-9+/=]+|ssh-rsa [A-Za-z0-9+/=]+)( .*)?$')
        | list | length == 0
      - sponsord_backup_include_env is boolean
      - sponsord_backup_fetch is boolean
    fail_msg: >-
      sponsord_backup_age_recipients must be a non-empty LIST of public keys to
      encrypt to: age recipients (age1…, from `age-keygen -y`) or SSH public keys
      (ssh-ed25519 / ssh-rsa lines), never a private key. It defaults to
      decdn_backup_age_recipients. sponsord_backup_include_env and
      sponsord_backup_fetch must be booleans.

# The archive is written into sponsord_backup_dir, which the role makes root 0700,
# so its shape is enforced before anything is touched (as decdn_node's
# validate-lifecycle-paths.yml).
- name: Constrain the backup paths (absolute, no traversal, no empty segments)
  ansible.builtin.assert:
    that:
      - item.value is match('^/[A-Za-z0-9._/-]+$')
      - "'.' not in item.value.split('/')"
      - "'..' not in item.value.split('/')"
      - "'' not in item.value.rstrip('/').split('/')[1:]"
    quiet: true
    fail_msg: >-
      {{ item.name }} must be an absolute path whose segments use only
      [A-Za-z0-9._-], with no '.', '..' or empty segments (got "{{ item.value }}").
  loop:
    - {name: sponsord_etc, value: "{{ sponsord_etc }}"}
    - {name: sponsord_backup_dir, value: "{{ sponsord_backup_dir }}"}
  loop_control:
    label: "{{ item.name }}"

- name: Require the backup dir to stay clear of sponsord and system directories
  vars:
    _dir: "{{ sponsord_backup_dir.rstrip('/') ~ '/' }}"
  ansible.builtin.assert:
    that:
      - _dir not in ['/etc/', '/var/', '/var/lib/', '/usr/', '/root/', '/home/', '/opt/', '/srv/', '/boot/', '/tmp/']
      - not (sponsord_etc.rstrip('/') ~ '/').startswith(_dir)
      - not _dir.startswith(sponsord_etc.rstrip('/') ~ '/')
    quiet: true
    fail_msg: >-
      sponsord_backup_dir ({{ sponsord_backup_dir }}) must be a dedicated directory
      outside {{ sponsord_etc }}, and not a system directory: the role makes it
      root-only (0700) and writes archives into it. The default is /var/backups/sponsord.

# The onramp keeps its Turnstile secret beside the daemon's files; archived when present.
- name: Check for the onramp's Turnstile secret
  ansible.builtin.stat:
    path: "{{ sponsord_etc }}/turnstile-secret"
  register: _sponsord_backup_turnstile

- name: Build the list of paths to archive
  ansible.builtin.set_fact:
    _sponsord_backup_paths: >-
      {{ [sponsord_treasury_keystore_file, sponsord_treasury_password_file, sponsord_api_token_file]
         + ([sponsord_etc ~ '/turnstile-secret'] if _sponsord_backup_turnstile.stat.exists else [])
         + ([sponsord_secret_env_file] if sponsord_backup_include_env | bool else []) }}
    _sponsord_backup_file: >-
      {{ sponsord_backup_dir }}/{{ inventory_hostname }}-sponsord-{{
         now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.tar.age

- name: Check that every path to archive exists
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _sponsord_backup_stat
  loop: "{{ _sponsord_backup_paths }}"

- name: Require every path to archive
  ansible.builtin.assert:
    that:
      - _sponsord_backup_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing on the host: {{ _sponsord_backup_stat.results | rejectattr('stat.exists')
      | map(attribute='item') | join(', ') }}. There is no treasury to back up yet
      (deploy sponsord first), or a path variable does not match this host.

- name: Install age
  ansible.builtin.apt:
    name: age
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ sponsord_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Recipients go in a file (`age -R`) rather than argv: SSH public keys carry spaces
# and comments, and a file needs no shell quoting at all.
- name: Write the recipients file
  ansible.builtin.copy:
    dest: "{{ sponsord_backup_dir }}/.recipients"
    content: "{{ sponsord_backup_age_recipients | join('\n') }}\n"
    owner: root
    group: root
    mode: "0600"

# tar reads the absolute paths relative to / (so a restore is `tar -C /`) and
# stores numeric owners. Written to a .partial name and renamed, so an interrupted
# run never leaves a truncated archive behind that looks complete.
- name: Take the backup
  block:
    - name: Write the encrypted archive
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail;
          umask 077;
          tar -C / --numeric-owner
          -czf - -- {{ _sponsord_backup_paths | map('regex_replace', '^/', '') | map('quote') | join(' ') }}
          | age -R {{ (sponsord_backup_dir ~ '/.recipients') | quote }}
          -o {{ (_sponsord_backup_file ~ '.partial') | quote }};
          mv -- {{ (_sponsord_backup_file ~ '.partial') | quote }} {{ _sponsord_backup_file | quote }}
        executable: /bin/bash
      changed_when: true
  always:
    - name: Remove a partial archive left by a failed run
      ansible.builtin.file:
        path: "{{ _sponsord_backup_file }}.partial"
        state: absent

- name: Checksum the archive
  ansible.builtin.stat:
    path: "{{ _sponsord_backup_file }}"
    checksum_algorithm: sha256
  register: _sponsord_backup_result

- name: Create the local backup directory for this host
  ansible.builtin.file:
    path: "{{ sponsord_backup_local_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: sponsord_backup_fetch | bool

- name: Fetch the encrypted archive to the control machine
  ansible.builtin.fetch:
    src: "{{ _sponsord_backup_file }}"
    dest: "{{ sponsord_backup_local_dir }}/{{ inventory_hostname }}/"
    flat: true
    validate_checksum: true
  when: sponsord_backup_fetch | bool

- name: Report the backup
  ansible.builtin.debug:
    msg: >-
      sponsord backup written to {{ _sponsord_backup_file }}
      (sha256 {{ _sponsord_backup_result.stat.checksum }}, {{ _sponsord_backup_result.stat.size }} bytes)
      {{- (', fetched to ' ~ sponsord_backup_local_dir ~ '/' ~ inventory_hostname ~ '/')
          if sponsord_backup_fetch | bool
          else ('. Not fetched; copy it off the host with: ssh ' ~ inventory_hostname
                ~ ' sudo cat ' ~ _sponsord_backup_file ~ ' > ' ~ (_sponsord_backup_file | basename)) }}.
      It holds the treasury keystore: whoever decrypts it controls the pool's funds.
      Prove it restores before you rely on it: `age -d -i <your-identity> <file> | tar -tz`.
