# deCDN services under Docker Compose: the same daemons, paths and hardening as the
# Ansible roles' systemd units, for a single host without Ansible. See README.md.
#
#   cp .env.example .env && $EDITOR .env      # COMPOSE_PROFILES, image digests, uids/gids
#   sudo docker compose up -d
#
# Each service sits behind a profile, chosen with COMPOSE_PROFILES in .env:
#   node      the deCDN node, a cache node (node operators)
#   origin    the same deCDN node, run as a publisher's origin: node.toml carries its
#             origin backend ([cache.origin]); one decdn-node either way
#   sponsord  the onboarding sponsor daemon (treasury signer + PaymentPool keeper)
#   onramp    sponsord-onramp, its public side; also starts sponsord, which it needs
#   caddy     TLS in front of the onramp (leave it out to bring your own proxy)
#
# Compose interpolates every service, enabled or not, so no variable here may be
# required with `:?`: a host without the node would then need the node's digest.
# An unset value instead renders a value that names the missing variable and that
# the service refuses: an invalid image reference, an unknown user, a host name
# with a non-numeric port. `make lint-compose` renders an empty .env to check it.
#
# Host networking, deliberately. Every backend binds 127.0.0.1, so on the host
# network it stays loopback-only, exactly as on a systemd host, and host tools (the
# `decdn` CLI, curl to /healthz) reach it directly. There are no `ports:` for Docker
# to publish, which also means Docker's own iptables rules never punch a hole past
# the host firewall. The public ports are the node's QUIC udp/4433 and, with the
# caddy profile, tcp/80 + tcp/443: open them in the host firewall.
name: decdn

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"
  # Or send the daemons' logs to the host journal, like the systemd units:
  #   driver: journald
  #   options: {tag: "{{.Name}}"}

services:
  decdn-node:
    # One service for both: a cache node and an origin are the same daemon, and they
    # would share the host's ports and /var/lib/decdn. node.toml makes the difference.
    profiles: [node, origin]
    # Always by digest, structurally: the reference is built here as repo@digest, so
    # no .env can swap in a mutable tag. The release's signed
    # decdn-node-image-digest.txt names the digest; upstream only tags an image after
    # a maintainer signs the release.
    image: ${DECDN_IMAGE_REPO:-ghcr.io/decdn/decdn-node}@${DECDN_IMAGE_DIGEST:-sha256:unset-set-DECDN_IMAGE_DIGEST-in-.env}
    network_mode: host
    # A dedicated host account (see README.md), not the image's uid 1000, which on
    # most hosts is the first human login.
    user: "${DECDN_UID:-unset-DECDN_UID}:${DECDN_GID:-unset-DECDN_GID}"
    # Mirrors the systemd unit's ExecStart.
    command:
      - run
      - --config
      - /etc/decdn/node.toml
      - --keystore-password-file
      - /etc/decdn/keystore.password
    # The RPC URL (it may embed an API key) stays in a root-owned 0600 file on the
    # host. DECDN_* variables override node.toml, so only put DECDN_RPC_URL (and
    # e.g. AWS_* for an S3 origin) here.
    env_file:
      - path: ${DECDN_ENV_FILE:-/etc/decdn/decdn.env}
        required: true
    volumes:
      - /etc/decdn:/etc/decdn:ro
      - /var/lib/decdn:/var/lib/decdn
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # SIGTERM is the daemon's graceful drain. Docker's default 10 s grace would
    # SIGKILL it mid-drain; this matches the unit's TimeoutStopSec.
    stop_signal: SIGTERM
    stop_grace_period: 300s
    restart: unless-stopped
    logging: *logging
    # No healthcheck: the image has no HTTP client, and the metrics listener only
    # serves /metrics. Probe http://127.0.0.1:9090/metrics from the host instead.

  sponsord:
    profiles: [sponsord, onramp]
    image: ${SPONSORD_IMAGE_REPO:-ghcr.io/decdn/sponsord}@${SPONSORD_IMAGE_DIGEST:-sha256:unset-set-SPONSORD_IMAGE_DIGEST-in-.env}
    network_mode: host
    # The host's `sponsord` account, which owns the credential files below: a bind
    # mount keeps the host file's owner and mode, and the daemon refuses a treasury
    # keystore that anyone but its owner can read.
    user: "${SPONSORD_UID:-unset-SPONSORD_UID}:${SPONSORD_GID:-unset-SPONSORD_GID}"
    # Read by the `docker compose` client when it creates the container, so run it
    # as root (sudo): secret.env (0600) holds SPONSORD_RPC_URL, which may embed an
    # API key; sponsord.env (0644) is the pool and limit settings. The later file
    # wins on a repeated key, so a stray SPONSORD_RPC_URL in the world-readable
    # file cannot replace the secret one.
    env_file:
      - path: ${SPONSORD_ENV_FILE:-/etc/sponsord/sponsord.env}
        required: true
      - path: ${SPONSORD_SECRET_ENV_FILE:-/etc/sponsord/secret.env}
        required: true
    # In `environment:`, which wins over env_file, so no env file can move this
    # API, which signs spending capabilities, off loopback (the release image
    # defaults to 0.0.0.0) or swap a secret file for an inline value.
    environment:
      SPONSORD_BIND: 127.0.0.1:8090
      SPONSORD_API_TOKEN_FILE: /run/secrets/api-token
      SPONSORD_TREASURY_PASSWORD_FILE: /run/secrets/treasury-password
      SPONSORD_TREASURY_KEYSTORE: /run/secrets/treasury-keystore.json
      NO_COLOR: "1"
    # One file each, read-only, and only the ones this daemon needs. A missing host
    # file fails the start instead of Docker creating a directory in its place.
    volumes:
      - type: bind
        source: /etc/sponsord/api-token
        target: /run/secrets/api-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/sponsord/treasury-password
        target: /run/secrets/treasury-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/sponsord/treasury-keystore.json
        target: /run/secrets/treasury-keystore.json
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # On SIGTERM the daemon waits for a pool top-up it already sent; this matches
    # the unit's TimeoutStopSec.
    stop_signal: SIGTERM
    stop_grace_period: 120s
    restart: unless-stopped
    logging: *logging
    # No healthcheck: the image has no HTTP client. Probe
    # http://127.0.0.1:8090/healthz from the host.

  sponsord-onramp:
    profiles: [onramp]
    image: ${SPONSORD_ONRAMP_IMAGE_REPO:-ghcr.io/decdn/sponsord-onramp}@${SPONSORD_ONRAMP_IMAGE_DIGEST:-sha256:unset-set-SPONSORD_ONRAMP_IMAGE_DIGEST-in-.env}
    network_mode: host
    # The same account as sponsord: it reads the daemon's own API token.
    user: "${SPONSORD_UID:-unset-SPONSORD_UID}:${SPONSORD_GID:-unset-SPONSORD_GID}"
    # Public settings only: everything in it (the RPC URL, contract addresses) is
    # served to every user.
    env_file:
      - path: ${SPONSORD_ONRAMP_ENV_FILE:-/etc/sponsord/sponsord-onramp.env}
        required: true
    environment:
      ONRAMP_BIND: 127.0.0.1:8080
      ONRAMP_DAEMON_URL: http://127.0.0.1:8090
      ONRAMP_PUBLIC_URL: https://${SPONSORD_ONRAMP_DOMAIN:-unset-SPONSORD_ONRAMP_DOMAIN:set-in-.env}
      ONRAMP_DAEMON_TOKEN_FILE: /run/secrets/api-token
      ONRAMP_TURNSTILE_SECRET_FILE: /run/secrets/turnstile-secret
      NO_COLOR: "1"
    volumes:
      - type: bind
        source: /etc/sponsord/api-token
        target: /run/secrets/api-token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/sponsord/turnstile-secret
        target: /run/secrets/turnstile-secret
        read_only: true
        bind: {create_host_path: false}
      # A custom gate page (upstream docs/operator.md, "Your own gate page"): put
      # the HTML in this directory and set ONRAMP_GATE_TEMPLATE to its path in
      # sponsord-onramp.env. A fixed directory rather than a configurable file, so
      # no setting can mount a credential into a server that publishes the page;
      # the entrypoint above refuses a template path outside it.
      # Created empty when absent: unused, the built-in page is served.
      - type: bind
        source: /etc/sponsord/onramp-gate
        target: /etc/sponsord/onramp-gate
        read_only: true
        bind: {create_host_path: true}
    # Upstream reads ONRAMP_GATE_TEMPLATE with no path check and serves that file to
    # anyone, while /run/secrets in this same container holds the daemon's token and
    # the Turnstile secret. So the onramp starts only if the template is unset or
    # resolves (symlinks followed) to a file in /etc/sponsord/onramp-gate/. No flags:
    # the binary gets none (a flag would beat the loopback environment), and
    # tests/invariants.jq pins this script exactly.
    entrypoint:
      - /bin/sh
      - -c
      - |
        t="$${ONRAMP_GATE_TEMPLATE-}"
        if [ -n "$$t" ]; then
          r="$$(realpath -e -- "$$t")" || { echo "ONRAMP_GATE_TEMPLATE $$t is not readable" >&2; exit 1; }
          case "$$r" in
            /etc/sponsord/onramp-gate/*) ;;
            *) echo "ONRAMP_GATE_TEMPLATE must be a file in /etc/sponsord/onramp-gate/ (it resolves to $$r)" >&2; exit 1 ;;
          esac
        fi
        exec sponsord-onramp
    # It reads the daemon's limits only at start, so `docker compose restart
    # sponsord` restarts it too, like the unit's PartOf= (a stop does not
    # propagate). It exits while the daemon is unreachable; the restart policy
    # retries until the daemon is up.
    depends_on:
      sponsord:
        condition: service_started
        restart: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging
    # No healthcheck, as above. Probe http://127.0.0.1:8080/healthz from the host.

  caddy:
    profiles: [caddy]
    # The official image, pinned by its multi-arch index digest (2.11.6).
    image: ${CADDY_IMAGE_REPO:-docker.io/library/caddy}@${CADDY_IMAGE_DIGEST:-sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73}
    network_mode: host
    # A dedicated host account that owns /var/lib/caddy. NET_BIND_SERVICE is the
    # one capability it keeps, for tcp/80 and tcp/443.
    user: "${CADDY_UID:-unset-CADDY_UID}:${CADDY_GID:-unset-CADDY_GID}"
    environment:
      SPONSORD_ONRAMP_DOMAIN: ${SPONSORD_ONRAMP_DOMAIN:-unset-SPONSORD_ONRAMP_DOMAIN:set-in-.env}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      # Certificates and the ACME account, kept across restarts so a restart does
      # not spend Let's Encrypt's rate limit.
      - type: bind
        source: /var/lib/caddy
        target: /data
        bind: {create_host_path: false}
    # Caddy autosaves the config it loaded here; nothing reads it back.
    tmpfs:
      - /config:uid=${CADDY_UID:-unset-CADDY_UID},gid=${CADDY_GID:-unset-CADDY_GID},mode=0700
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    restart: unless-stopped
    logging: *logging
