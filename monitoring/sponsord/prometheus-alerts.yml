# sponsord reference Prometheus alerting rules
#
# For the deCDN onboarding sponsor (decdn/sponsord), whose /metrics the
# grafana_alloy role ships as job="sponsord". The series and what upstream asks
# operators to alert on are in upstream docs/operator.md, "Monitor"; the names
# are crates/sponsord/src/metrics.rs. Thresholds are operator-onboarding
# defaults, not normative.
#
# NOT covered: the treasury wallet's own USDC and gas balance, which pays every
# top-up. sponsord exports no such series; watch the address with a balance
# exporter of your own. SponsordKeeperFailing is the symptom when it runs dry.
#
# sponsord runs on the Ansible and Compose paths only. The decdn-node chart does
# NOT render this file (its PrometheusRule reads ../decdn-node/prometheus-alerts.yml).
#
# Validate locally with `make lint-helm`: it runs promtool check rules on this
# file, and promtool test rules on prometheus-alerts_test.yml against a copy
# with the annotations stripped (see that file).
#
# Load into Grafana Cloud with mimirtool (see ../README.md), or into Prometheus via
# rule_files (example in ../decdn-node/prometheus-alerts.yml).

groups:
  - name: sponsord
    interval: 30s
    rules:
      - alert: SponsordDown
        expr: up{job="sponsord"} == 0
        for: 2m
        labels:
          component: sponsor
          severity: critical
        annotations:
          summary: "sponsord on {{ $labels.instance }} unreachable for 2m"
          description: |
            Prometheus has been unable to scrape sponsord for two minutes.
            No capability is issued and the pool is not topped up while it
            is down, and the onramp in front of it answers every download
            with an error. Read why on the host:
            journalctl -u sponsord -e. Adjust the job="sponsord" selector
            if your scrape job is named differently.

      # increase() over two keeper periods at the default
      # SPONSORD_POOL_WATCH_INTERVAL_SECS (3600): a keeper that fails every
      # tick keeps this firing, one that recovers lets it resolve.
      - alert: SponsordKeeperFailing
        expr: increase(sponsord_pool_keeper_failures_total[2h]) > 0
        for: 0m
        labels:
          component: sponsor
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/sponsord/blob/main/docs/operator.md#5-monitor"
          summary: "sponsord pool keeper failing on {{ $labels.instance }}"
          description: |
            The keeper failed a chain read or a top-up in the last two
            hours (sponsord_pool_keeper_failures_total rose). The usual
            cause is a treasury wallet out of USDC or gas, or an RPC
            endpoint that refuses it. The pool drains while top-ups fail.
            journalctl -u sponsord names the failing call.

      # The keeper reads the pool at start, then every
      # SPONSORD_POOL_WATCH_INTERVAL_SECS (3600 by default). Three missed
      # periods; raise it if you lengthened the interval. A gauge of 0 (no read
      # has succeeded since start) is SponsordPoolNeverChecked below: time() - 0
      # would fire this one after just its `for`.
      - alert: SponsordPoolCheckStale
        expr: >-
          sponsord_pool_last_check_unix > 0
          and time() - sponsord_pool_last_check_unix > 3 * 3600
        for: 15m
        labels:
          component: sponsor
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/sponsord/blob/main/docs/operator.md#5-monitor"
          summary: "sponsord has not read its pool balance for 3h on {{ $labels.instance }}"
          description: |
            sponsord_pool_last_check_unix has not advanced for three
            keeper periods, so the pool balance on the dashboard is stale
            and no top-up is being decided. Check the RPC endpoint and the
            keeper's errors: journalctl -u sponsord -e.

      - alert: SponsordPoolNeverChecked
        expr: sponsord_pool_last_check_unix == 0
        for: 3h
        labels:
          component: sponsor
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/sponsord/blob/main/docs/operator.md#5-monitor"
          summary: "sponsord has not read its pool balance since it started on {{ $labels.instance }}"
          description: |
            sponsord_pool_last_check_unix is still 0 three hours after
            the series appeared: the keeper has not once read the pool
            since sponsord started, so no top-up is being decided. Check
            the RPC endpoint and the keeper's errors:
            journalctl -u sponsord -e.

      - alert: SponsordTopupHeld
        expr: sponsord_pool_topup_unconfirmed_since_unix > 0
        for: 15m
        labels:
          component: sponsor
          severity: warning
        annotations:
          runbook_url: "https://github.com/decdn/sponsord/blob/main/docs/operator.md#5-monitor"
          summary: "sponsord is holding pool top-ups on {{ $labels.instance }}"
          description: |
            The keeper broadcast a top-up and could not read its receipt,
            so it sends no further top-up until that transaction mines or
            provably never can. DO NOT restart sponsord: a restart forgets
            the hold, and the pool can be refilled twice. The Ansible role
            refuses restarts while this holds; on Compose, and against a
            crash or package-upgrade restart, nothing does. It clears by itself
            once the transaction mines. If it was dropped, send 0-value
            transactions from the treasury to itself until it clears; the
            error log line names the transaction and how many it takes.

      - alert: SponsordTopupHeldLong
        expr: >-
          sponsord_pool_topup_unconfirmed_since_unix > 0
          and time() - sponsord_pool_topup_unconfirmed_since_unix > 2 * 3600
        for: 0m
        labels:
          component: sponsor
          severity: critical
        annotations:
          runbook_url: "https://github.com/decdn/sponsord/blob/main/docs/operator.md#5-monitor"
          summary: "sponsord top-ups held for over 2h on {{ $labels.instance }}"
          description: |
            A top-up has sat unconfirmed for more than two hours, so the
            pool is not being refilled. The transaction was most likely
            dropped: send 0-value transactions from the treasury to itself
            until the hold clears (the error log line says how many). Do
            not restart sponsord to clear it.

      # The keeper has read the pool (last check > 0) and found it empty: every
      # capability issued now is unusable until a top-up lands.
      - alert: SponsordPoolEmpty
        expr: >-
          sponsord_pool_remaining_micro_usdc == 0
          and sponsord_pool_last_check_unix > 0
        for: 10m
        labels:
          component: sponsor
          severity: critical
        annotations:
          runbook_url: "https://github.com/decdn/sponsord/blob/main/docs/operator.md#5-monitor"
          summary: "sponsord pool empty on {{ $labels.instance }}"
          description: |
            The pool's remaining balance was 0 at the keeper's last read.
            Sponsored downloads cannot pay nodes until it is refilled.
            Check SponsordKeeperFailing and SponsordTopupHeld, and the
            treasury wallet's USDC and gas.

      # chain_unavailable (503): a signer's on-chain registration could not be
      # read; internal (500): a server-side failure. Both are sponsord's own
      # faults, not a caller's. sponsord exports a code's series only from its
      # first error, already at 1 or more, which increase() cannot see: the
      # second operand catches a series that appeared within the window.
      - alert: SponsordRequestFailures
        expr: >-
          increase(sponsord_request_errors_total{code=~"chain_unavailable|internal"}[15m]) > 0
          or (
            sponsord_request_errors_total{code=~"chain_unavailable|internal"}
            unless sponsord_request_errors_total{code=~"chain_unavailable|internal"} offset 15m
          )
        for: 0m
        labels:
          component: sponsor
          severity: warning
        annotations:
          summary: "sponsord answering {{ $labels.code }} errors on {{ $labels.instance }}"
          description: |
            sponsord answered capability requests with {{ $labels.code }}
            in the last 15 minutes. chain_unavailable means its RPC
            endpoint could not read a signer's registration; internal is
            a server-side failure. Users see failed downloads.
            journalctl -u sponsord -e.
