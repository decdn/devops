# promtool unit tests for prometheus-alerts.yml beside it, run by the chart's
# tests/render-test.sh (`make lint-helm`). The rules do time arithmetic on unix-time
# gauges, which promtool check cannot catch. The test clock starts at 0.
#
# It does not run in place: render-test.sh copies it into a scratch directory as
# sponsord-alerts_test.yml, beside a copy of prometheus-alerts.yml with the
# annotations stripped (promtool compares annotations exactly, and they are prose)
# named sponsord-alerts.yml, the name rule_files below expects.
rule_files:
  - sponsord-alerts.yml

evaluation_interval: 30s

tests:
  # Down. a fails its scrape (up=0) and fires at exactly the for; its samples end
  # at 5m too, and the absence arm carries the alert on without resetting the for
  # (at 10m30s a for restarted at the handoff would not have run out yet). b is
  # healthy throughout. c stops at 5m with no staleness marker (the host died with
  # its agent): up goes absent once the 5m lookback passes, the absence arm fires
  # after the for, is still firing at 23h and resolves once the 1d window holds no
  # sample (25h). d gets a staleness marker and is back 1m later, inside the for,
  # so it never fires (checked at 6m, inside the gap). d2's marker is followed by
  # a gap longer than the for: it fires at 7m30s and resolves when it is back
  # (10m30s). e changes its region label on a live target and never fires.
  - interval: 30s
    input_series:
      - series: 'up{job="sponsord", instance="a"}'
        values: '0x10'
      - series: 'up{job="sponsord", instance="b"}'
        values: '1x3000'
      - series: 'up{job="sponsord", instance="c"}'
        values: '1x10'
      - series: 'up{job="sponsord", instance="d"}'
        values: '1x10 stale _x1 1x2987'
      - series: 'up{job="sponsord", instance="d2"}'
        values: '1x10 stale _x9 1x2979'
      - series: 'up{job="sponsord", instance="e", region="eu"}'
        values: '1x10'
      - series: 'up{job="sponsord", instance="e", region="us"}'
        values: '_x11 1x2989'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: SponsordDown
        exp_alerts: []
      - eval_time: 2m
        alertname: SponsordDown
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}
      - eval_time: 6m
        alertname: SponsordDown
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}
      - eval_time: 8m
        alertname: SponsordDown
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}
          - exp_labels: {job: sponsord, instance: d2, component: sponsor, severity: critical}
      - eval_time: 10m30s
        alertname: SponsordDown
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}
      - eval_time: 13m
        alertname: SponsordDown
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}
          - exp_labels: {job: sponsord, instance: c, component: sponsor, severity: critical}
      - eval_time: 23h
        alertname: SponsordDown
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}
          - exp_labels: {job: sponsord, instance: c, component: sponsor, severity: critical}
      - eval_time: 25h
        alertname: SponsordDown
        exp_alerts: []

  # A hold warns after 15m and escalates once it is 2h old; 0 is no hold.
  # The gauge holds the unix time the hold began (here t=60s).
  - interval: 1m
    input_series:
      - series: 'sponsord_pool_topup_unconfirmed_since_unix{job="sponsord", instance="a"}'
        values: '0 60x200'
      - series: 'sponsord_pool_topup_unconfirmed_since_unix{job="sponsord", instance="b"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 10m
        alertname: SponsordTopupHeld
        exp_alerts: []
      - eval_time: 20m
        alertname: SponsordTopupHeld
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: warning}
      - eval_time: 2h
        alertname: SponsordTopupHeldLong
        exp_alerts: []
      - eval_time: 2h5m
        alertname: SponsordTopupHeldLong
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}

  # a: last check at t=60s and never again, stale once 3h have passed, plus
  # for: 15m. b: a last check that keeps up with the clock, never stale.
  # c: no check has ever succeeded (0): not "stale" (time() - 0 would fire after
  # just the for), but SponsordPoolNeverChecked after its 3h.
  - interval: 5m
    input_series:
      - series: 'sponsord_pool_last_check_unix{job="sponsord", instance="a"}'
        values: '60x60'
      - series: 'sponsord_pool_last_check_unix{job="sponsord", instance="b"}'
        values: '0+300x60'
      - series: 'sponsord_pool_last_check_unix{job="sponsord", instance="c"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 3h
        alertname: SponsordPoolCheckStale
        exp_alerts: []
      - eval_time: 3h30m
        alertname: SponsordPoolCheckStale
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: warning}
      - eval_time: 2h
        alertname: SponsordPoolNeverChecked
        exp_alerts: []
      - eval_time: 3h30m
        alertname: SponsordPoolNeverChecked
        exp_alerts:
          - exp_labels: {job: sponsord, instance: c, component: sponsor, severity: warning}

  # An empty pool fires only once the keeper has read it.
  - interval: 1m
    input_series:
      - series: 'sponsord_pool_remaining_micro_usdc{job="sponsord", instance="a"}'
        values: '0x20'
      - series: 'sponsord_pool_last_check_unix{job="sponsord", instance="a"}'
        values: '60x20'
      - series: 'sponsord_pool_remaining_micro_usdc{job="sponsord", instance="b"}'
        values: '0x20'
      - series: 'sponsord_pool_last_check_unix{job="sponsord", instance="b"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: SponsordPoolEmpty
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: critical}

  # A keeper failure fires at once (that counter is exported from start, at 0).
  # The request-error series are written as sponsord exports them: absent until a
  # code's first error, then already non-zero. Both of sponsord's own codes fire
  # on that first appearance, a caller fault (bad_request) never does, and the
  # alert resolves once a code stops rising for 15m.
  - interval: 1m
    input_series:
      - series: 'sponsord_pool_keeper_failures_total{job="sponsord", instance="a"}'
        values: '0 0 1 1 1'
      - series: 'sponsord_request_errors_total{job="sponsord", instance="a", code="chain_unavailable"}'
        values: '_ _ 2x40'
      - series: 'sponsord_request_errors_total{job="sponsord", instance="a", code="internal"}'
        values: '_ _ _ 1x40'
      - series: 'sponsord_request_errors_total{job="sponsord", instance="a", code="bad_request"}'
        values: '_ _ 9x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: SponsordKeeperFailing
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, component: sponsor, severity: warning}
      - eval_time: 3m
        alertname: SponsordRequestFailures
        exp_alerts:
          - exp_labels: {job: sponsord, instance: a, code: chain_unavailable, component: sponsor, severity: warning}
          - exp_labels: {job: sponsord, instance: a, code: internal, component: sponsor, severity: warning}
      - eval_time: 30m
        alertname: SponsordRequestFailures
        exp_alerts: []
