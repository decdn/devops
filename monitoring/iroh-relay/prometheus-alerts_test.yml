# promtool unit tests for prometheus-alerts.yml beside it, run by the chart's
# tests/render-test.sh (`make lint-helm`). The rules divide one counter's rate by
# another's, which promtool check cannot catch. The test clock starts at 0.
#
# It does not run in place: render-test.sh copies it into a scratch directory as
# iroh-relay-alerts_test.yml, beside a copy of prometheus-alerts.yml with the
# annotations stripped (promtool compares annotations exactly, and they are prose)
# named iroh-relay-alerts.yml, the name rule_files below expects.
rule_files:
  - iroh-relay-alerts.yml

evaluation_interval: 30s

tests:
  # Down. a fails its scrape (up=0) and fires at exactly the for, under job and
  # instance alone (its region label is dropped). Its samples end at 5m too, and
  # the absence arm carries the alert on without resetting the for (at 10m30s a
  # for restarted at the handoff would not have run out yet). b is
  # healthy throughout. c stops at 5m with no staleness marker (the host died with
  # its agent): up goes absent once the 5m lookback passes, the absence arm fires
  # after the for, is still firing at 23h and resolves once the 1d window holds no
  # sample (25h). d gets a staleness marker and is back 1m later, inside the for,
  # so it never fires (checked at 6m, inside the gap). d2's marker is followed by
  # a gap longer than the for: it fires at 7m30s and resolves when it is back
  # (10m30s). e changes its region label on a live target and does not fire;
  # when it stops later (15m30s) it fires once, under job and instance alone,
  # although both of its label sets are still in the 1d window.
  - interval: 30s
    input_series:
      - series: 'up{job="iroh-relay", instance="a", region="eu"}'
        values: '0x10'
      - series: 'up{job="iroh-relay", instance="b"}'
        values: '1x3000'
      - series: 'up{job="iroh-relay", instance="c"}'
        values: '1x10'
      - series: 'up{job="iroh-relay", instance="d"}'
        values: '1x10 stale _x1 1x2987'
      - series: 'up{job="iroh-relay", instance="d2"}'
        values: '1x10 stale _x9 1x2979'
      - series: 'up{job="iroh-relay", instance="e", region="eu"}'
        values: '1x10'
      - series: 'up{job="iroh-relay", instance="e", region="us"}'
        values: '_x11 1x20'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: IrohRelayDown
        exp_alerts: []
      - eval_time: 2m
        alertname: IrohRelayDown
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: critical}
      - eval_time: 6m
        alertname: IrohRelayDown
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: critical}
      - eval_time: 8m
        alertname: IrohRelayDown
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: critical}
          - exp_labels: {job: iroh-relay, instance: d2, component: relay, severity: critical}
      - eval_time: 10m30s
        alertname: IrohRelayDown
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: critical}
      - eval_time: 13m
        alertname: IrohRelayDown
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: critical}
          - exp_labels: {job: iroh-relay, instance: c, component: relay, severity: critical}
      - eval_time: 23h
        alertname: IrohRelayDown
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: critical}
          - exp_labels: {job: iroh-relay, instance: c, component: relay, severity: critical}
          - exp_labels: {job: iroh-relay, instance: e, component: relay, severity: critical}
      - eval_time: 25h
        alertname: IrohRelayDown
        exp_alerts: []

  # a: 9 of every 10 https connections error out; b: 1 in 10; c: no traffic at
  # all (0/0 is NaN, which never fires). The same shapes for QAD.
  - interval: 1m
    input_series:
      - series: 'relayserver_http_connections_total{job="iroh-relay", instance="a"}'
        values: '0+10x60'
      - series: 'relayserver_http_connections_errored_total{job="iroh-relay", instance="a"}'
        values: '0+9x60'
      - series: 'relayserver_http_connections_total{job="iroh-relay", instance="b"}'
        values: '0+10x60'
      - series: 'relayserver_http_connections_errored_total{job="iroh-relay", instance="b"}'
        values: '0+1x60'
      - series: 'relayserver_http_connections_total{job="iroh-relay", instance="c"}'
        values: '0x60'
      - series: 'relayserver_http_connections_errored_total{job="iroh-relay", instance="c"}'
        values: '0x60'
      - series: 'relayserver_qad_incoming_total{job="iroh-relay", instance="a"}'
        values: '0+10x60'
      - series: 'relayserver_qad_incoming_error_total{job="iroh-relay", instance="a"}'
        values: '0+8x60'
      - series: 'relayserver_qad_incoming_total{job="iroh-relay", instance="b"}'
        values: '0+10x60'
      - series: 'relayserver_qad_incoming_error_total{job="iroh-relay", instance="b"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: IrohRelayHTTPSErrors
        exp_alerts: []
      - eval_time: 40m
        alertname: IrohRelayHTTPSErrors
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: warning}
      - eval_time: 40m
        alertname: IrohRelayQADHandshakeErrors
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: warning}

  # a drops 10% of relayed packets, b 1%.
  - interval: 1m
    input_series:
      - series: 'relayserver_send_packets_recv_total{job="iroh-relay", instance="a"}'
        values: '0+100x60'
      - series: 'relayserver_send_packets_dropped_total{job="iroh-relay", instance="a"}'
        values: '0+10x60'
      - series: 'relayserver_send_packets_recv_total{job="iroh-relay", instance="b"}'
        values: '0+100x60'
      - series: 'relayserver_send_packets_dropped_total{job="iroh-relay", instance="b"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: IrohRelayDroppingPackets
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: warning}

  # Rate limiting fires while the counter rises and resolves 15m after it stops.
  - interval: 1m
    input_series:
      - series: 'relayserver_conns_rx_ratelimited_total{job="iroh-relay", instance="a"}'
        values: '0 0 0 1 2 2x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: IrohRelayRateLimiting
        exp_alerts: []
      - eval_time: 5m
        alertname: IrohRelayRateLimiting
        exp_alerts:
          - exp_labels: {job: iroh-relay, instance: a, component: relay, severity: info}
      - eval_time: 30m
        alertname: IrohRelayRateLimiting
        exp_alerts: []
