# promtool unit tests for prometheus-alerts.yml beside it, run by the chart's
# tests/render-test.sh (`make lint-helm`). DecdnNodeDown's absence arm only shows
# itself on a series that stops, and the thresholds of
# DecdnCapacityBondRegistryResyncFailing and DecdnRedemptionMaybeBroadcast only on
# `increase` extrapolation, none of which promtool check can catch;
# DecdnBuyerTopupUnresolved and DecdnSettlementReanchorBacklog pin their for,
# DecdnSettlementLedgerWriteFailing its 1h resolve and a failure already counted
# at a node's first scrape, DecdnNodeClockSkew its window against its for (a
# one-off event stays quiet), and DecdnSettlementReanchorLowerDeposit a sparse
# retry, a healed reorg and retries that stop, and DecdnNodeBootStuck its window
# (a lone 1 holds it off; a restart fires 25m after the last 1) and a crash loop's
# gaps. The test clock starts at 0. The chart's .helmignore keeps
# this file out of the package.
#
# It does not run in place: render-test.sh copies it into a scratch directory as
# decdn-node-alerts_test.yml, beside a copy of prometheus-alerts.yml with the
# annotations stripped (promtool compares annotations exactly, and they are prose)
# named decdn-node-alerts.yml, the name rule_files below expects.
rule_files:
  - decdn-node-alerts.yml

evaluation_interval: 30s

tests:
  # Down. a fails its scrape (up=0) and fires at exactly the for, under job and
  # instance alone (its region label is dropped). Its samples end at 5m too, and
  # the absence arm carries the alert on without resetting the for (at 10m30s a
  # for restarted at the handoff would not have run out yet). b is
  # healthy throughout. c stops at 5m with no staleness marker (the host died with
  # its agent): up goes absent once the 5m lookback passes, the absence arm fires
  # after the for, is still firing at 23h and resolves once the 1d window holds no
  # sample (25h). d gets a staleness marker and is back 1m later, inside the for,
  # so it never fires (checked at 6m, inside the gap). d2's marker is followed by
  # a gap longer than the for: it fires at 6m30s and resolves when it is back
  # (10m30s). e changes its region label on a live target and does not fire;
  # when it stops later (15m30s) it fires once, under job and instance alone,
  # although both of its label sets are still in the 1d window.
  # f: two chart releases in different namespaces share the pod name; y's stops
  # while x's lives on, and y still fires. g: the job was renamed on a live
  # instance (Alloy's old component-ID job); the old job fires, as documented.
  - interval: 30s
    input_series:
      - series: 'up{job="decdn-node", instance="a", region="eu"}'
        values: '0x10'
      - series: 'up{job="decdn-node", instance="b"}'
        values: '1x3000'
      - series: 'up{job="decdn-node", instance="c"}'
        values: '1x10'
      - series: 'up{job="decdn-node", instance="d"}'
        values: '1x10 stale _x1 1x2987'
      - series: 'up{job="decdn-node", instance="d2"}'
        values: '1x10 stale _x9 1x2979'
      - series: 'up{job="decdn-node", instance="e", region="eu"}'
        values: '1x10'
      - series: 'up{job="decdn-node", instance="e", region="us"}'
        values: '_x11 1x20'
      - series: 'up{job="decdn-node", instance="decdn-node-0", namespace="x"}'
        values: '1x3000'
      - series: 'up{job="decdn-node", instance="decdn-node-0", namespace="y"}'
        values: '1x10'
      - series: 'up{job="prometheus.scrape.decdn_node", instance="g"}'
        values: '1x10'
      - series: 'up{job="decdn-node", instance="g"}'
        values: '_x11 1x2989'
    alert_rule_test:
      - eval_time: 30s
        alertname: DecdnNodeDown
        exp_alerts: []
      - eval_time: 1m
        alertname: DecdnNodeDown
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: critical}
      - eval_time: 6m
        alertname: DecdnNodeDown
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: critical}
      - eval_time: 8m
        alertname: DecdnNodeDown
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: critical}
          - exp_labels: {job: decdn-node, instance: d2, component: node, severity: critical}
      - eval_time: 10m30s
        alertname: DecdnNodeDown
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: critical}
      - eval_time: 12m
        alertname: DecdnNodeDown
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: critical}
          - exp_labels: {job: decdn-node, instance: c, component: node, severity: critical}
          - exp_labels: {job: decdn-node, instance: decdn-node-0, namespace: y, component: node, severity: critical}
          - exp_labels: {job: prometheus.scrape.decdn_node, instance: g, component: node, severity: critical}
      - eval_time: 23h
        alertname: DecdnNodeDown
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: critical}
          - exp_labels: {job: decdn-node, instance: c, component: node, severity: critical}
          - exp_labels: {job: decdn-node, instance: decdn-node-0, namespace: y, component: node, severity: critical}
          - exp_labels: {job: prometheus.scrape.decdn_node, instance: g, component: node, severity: critical}
          - exp_labels: {job: decdn-node, instance: e, component: node, severity: critical}
      - eval_time: 25h
        alertname: DecdnNodeDown
        exp_alerts: []

  # Boot stuck. Range windows are left-open (Prometheus 3), so a sample leaves a
  # 15m window at exactly 15m. a reads 0 from its first scrape (a first boot) and
  # fires at exactly the 10m for. b reads its one 1 at 6m, so it is silent while
  # that sample is in the window (checked at 10m and 20m); the 1 leaves at 21m
  # and b fires at 31m. c was ready until 10m, restarted and is stuck at 0: its
  # last 1 leaves at 25m and it fires at 35m, 25m after the last 1. d is a crash
  # loop, 4m of samples then a 2m gap: it fires at 10m, inside a gap, and keeps
  # firing through the later gaps (11m, 34m).
  - interval: 1m
    input_series:
      - series: 'decdn_node_boot_ready{job="decdn-node", instance="a"}'
        values: '0x40'
      - series: 'decdn_node_boot_ready{job="decdn-node", instance="b"}'
        values: '0x5 1 0x34'
      - series: 'decdn_node_boot_ready{job="decdn-node", instance="c"}'
        values: '1x10 0x30'
      - series: 'decdn_node_boot_ready{job="decdn-node", instance="d"}'
        values: '0x3 _x2 0x3 _x2 0x3 _x2 0x3 _x2 0x3 _x2 0x3 _x2 0x3'
    alert_rule_test:
      - eval_time: 9m30s
        alertname: DecdnNodeBootStuck
        exp_alerts: []
      - eval_time: 10m
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}
      - eval_time: 11m
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}
      - eval_time: 20m
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}
      - eval_time: 30m30s
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}
      - eval_time: 31m
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: b, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}
      - eval_time: 34m
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: b, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}
      - eval_time: 35m
        alertname: DecdnNodeBootStuck
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: b, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: d, component: node, severity: warning}

  # Capacity-bond registry resync: attempts are 15m apart. a fails once (15m) and
  # never fires: one failure reads about 1.0. b fails twice (15m, 30m), so the
  # expression turns true at 30m and fires after the 15m for. It resolves once the
  # first failure leaves the 1h window (checked at 1h20m).
  - interval: 1m
    input_series:
      - series: 'decdn_capacity_bond_registry_resync_failures_total{job="decdn-node", instance="a"}'
        values: '0x14 1x100'
      - series: 'decdn_capacity_bond_registry_resync_failures_total{job="decdn-node", instance="b"}'
        values: '0x14 1x14 2x100'
    alert_rule_test:
      - eval_time: 44m
        alertname: DecdnCapacityBondRegistryResyncFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: DecdnCapacityBondRegistryResyncFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: registry, severity: warning}
      - eval_time: 1h
        alertname: DecdnCapacityBondRegistryResyncFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: registry, severity: warning}
      - eval_time: 1h20m
        alertname: DecdnCapacityBondRegistryResyncFailing
        exp_alerts: []

  # Buyer top-up hold: a reads 1 from the start and fires at exactly the 15m for.
  # b holds for 9 minutes (6m to 14m) and clears, inside the for, so it never
  # fires. c's hold starts at 20m and fires at 35m; a is still firing then.
  - interval: 1m
    input_series:
      - series: 'decdn_buyer_topup_unresolved{job="decdn-node", instance="a"}'
        values: '1x60'
      - series: 'decdn_buyer_topup_unresolved{job="decdn-node", instance="b"}'
        values: '0x5 1x9 0x45'
      - series: 'decdn_buyer_topup_unresolved{job="decdn-node", instance="c"}'
        values: '0x19 1x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: DecdnBuyerTopupUnresolved
        exp_alerts: []
      - eval_time: 15m
        alertname: DecdnBuyerTopupUnresolved
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: payments, severity: warning}
      - eval_time: 34m
        alertname: DecdnBuyerTopupUnresolved
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: payments, severity: warning}
      - eval_time: 35m
        alertname: DecdnBuyerTopupUnresolved
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: payments, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: payments, severity: warning}

  # Maybe-broadcast. a adds one at 20m and one at 60m, never more than one in a
  # 30m window, and never fires. b adds one a minute from 0: its increase reads 2.5
  # at 2m30s (no extrapolation below a zero first sample), so it goes pending then
  # and fires at exactly the 30m for. c adds one every 14m on a running counter:
  # two in a window read about 2.07 with extrapolation, so it goes pending at 28m
  # and fires at 58m. d adds 10 at once at 20m and stays quiet: pending until the
  # jump leaves the window (48m30s), short of the for, so a one-off burst of any
  # size never fires.
  - interval: 1m
    input_series:
      - series: 'decdn_onchain_tx_maybe_broadcast_total{job="decdn-node", instance="a"}'
        values: '0x19 1x39 2x20'
      - series: 'decdn_onchain_tx_maybe_broadcast_total{job="decdn-node", instance="b"}'
        values: '0+1x70'
      - series: 'decdn_onchain_tx_maybe_broadcast_total{job="decdn-node", instance="c"}'
        values: '5x13 6x13 7x13 8x13 9x13 10x13'
      - series: 'decdn_onchain_tx_maybe_broadcast_total{job="decdn-node", instance="d"}'
        values: '5x19 15x60'
    alert_rule_test:
      - eval_time: 32m
        alertname: DecdnRedemptionMaybeBroadcast
        exp_alerts: []
      - eval_time: 32m30s
        alertname: DecdnRedemptionMaybeBroadcast
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: payments, severity: warning}
      - eval_time: 48m30s
        alertname: DecdnRedemptionMaybeBroadcast
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: payments, severity: warning}
      - eval_time: 57m30s
        alertname: DecdnRedemptionMaybeBroadcast
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: payments, severity: warning}
      - eval_time: 58m
        alertname: DecdnRedemptionMaybeBroadcast
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: payments, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: payments, severity: warning}
      - eval_time: 70m
        alertname: DecdnRedemptionMaybeBroadcast
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: b, component: payments, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: payments, severity: warning}

  # Clock skew. a's upstreams refuse it once a minute from 0: pending at 1m, it
  # fires at exactly the 30m for. b's upstream counter is flat and it refuses an
  # inbound probe a minute from 20m: the second arm alone fires it at 50m. c is
  # refused once every 14m: every 15m window holds one, so it goes pending at the
  # first (14m) and fires at 44m. d is refused once (10m): pending for under 15m,
  # it never fires. e reads flat non-zero counters on both arms and stays quiet.
  - interval: 1m
    input_series:
      - series: 'decdn_node_upstream_timestamp_rejected_total{job="decdn-node", instance="a"}'
        values: '0+1x70'
      - series: 'decdn_probe_timestamp_skew_refusals_total{job="decdn-node", instance="a"}'
        values: '0x70'
      - series: 'decdn_node_upstream_timestamp_rejected_total{job="decdn-node", instance="b"}'
        values: '0x70'
      - series: 'decdn_probe_timestamp_skew_refusals_total{job="decdn-node", instance="b"}'
        values: '0x19 1+1x50'
      - series: 'decdn_node_upstream_timestamp_rejected_total{job="decdn-node", instance="c"}'
        values: '0x13 1x13 2x13 3x13 4x13 5x5'
      - series: 'decdn_node_upstream_timestamp_rejected_total{job="decdn-node", instance="d"}'
        values: '0x9 1x60'
      - series: 'decdn_node_upstream_timestamp_rejected_total{job="decdn-node", instance="e"}'
        values: '7x70'
      - series: 'decdn_probe_timestamp_skew_refusals_total{job="decdn-node", instance="e"}'
        values: '3x70'
    alert_rule_test:
      - eval_time: 30m30s
        alertname: DecdnNodeClockSkew
        exp_alerts: []
      - eval_time: 31m
        alertname: DecdnNodeClockSkew
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
      - eval_time: 43m30s
        alertname: DecdnNodeClockSkew
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
      - eval_time: 44m
        alertname: DecdnNodeClockSkew
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: node, severity: warning}
      - eval_time: 49m30s
        alertname: DecdnNodeClockSkew
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: node, severity: warning}
      - eval_time: 50m
        alertname: DecdnNodeClockSkew
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: b, component: node, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: node, severity: warning}

  # Settlement ledger writes. a fails one write at 10m and fires then (for 0m);
  # it is still firing at 1h and resolves once the failure leaves the 1h window
  # (checked at 1h10m). b reads a flat non-zero counter on a node up for two
  # hours (failures before this window) and stays quiet. c's first sample
  # already counts 2 failures, two minutes after a start: it fires from the
  # first evaluation through its first hour of uptime and resolves after it.
  - interval: 1m
    input_series:
      - series: 'decdn_settlement_ledger_write_failures_total{job="decdn-node", instance="a"}'
        values: '0x9 1x80'
      - series: 'decdn_settlement_ledger_write_failures_total{job="decdn-node", instance="b"}'
        values: '4x90'
      - series: 'decdn_node_uptime_seconds{job="decdn-node", instance="b"}'
        values: '7200+60x90'
      - series: 'decdn_settlement_ledger_write_failures_total{job="decdn-node", instance="c"}'
        values: '2x90'
      - series: 'decdn_node_uptime_seconds{job="decdn-node", instance="c"}'
        values: '120+60x90'
    alert_rule_test:
      - eval_time: 0m
        alertname: DecdnSettlementLedgerWriteFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}
      - eval_time: 9m30s
        alertname: DecdnSettlementLedgerWriteFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}
      - eval_time: 10m
        alertname: DecdnSettlementLedgerWriteFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}
      - eval_time: 57m
        alertname: DecdnSettlementLedgerWriteFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}
      - eval_time: 1h
        alertname: DecdnSettlementLedgerWriteFailing
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
      - eval_time: 1h10m
        alertname: DecdnSettlementLedgerWriteFailing
        exp_alerts: []

  # Re-anchor backlog. a holds 3 pending pools from the start and fires at
  # exactly the 30m for. b holds 2 for 21 minutes (6m to 26m) and drains,
  # inside the for, so it never fires. c's backlog stays from 10m and fires at
  # 40m.
  - interval: 1m
    input_series:
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="a"}'
        values: '3x60'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="b"}'
        values: '0x5 2x20 0x34'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="c"}'
        values: '0x9 1x50'
    alert_rule_test:
      - eval_time: 29m30s
        alertname: DecdnSettlementReanchorBacklog
        exp_alerts: []
      - eval_time: 30m
        alertname: DecdnSettlementReanchorBacklog
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
      - eval_time: 39m30s
        alertname: DecdnSettlementReanchorBacklog
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
      - eval_time: 40m
        alertname: DecdnSettlementReanchorBacklog
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}

  # Re-anchor lower deposit. a's pool is skipped sparsely (at 1m and 41m, 40
  # minutes apart, as when a long rotation or failed ticks delay its turn) and
  # stays pending: it fires at 31m and holds through the gap. b is skipped
  # once at 10m and anchors at 20m (a reorg that healed): the gauge empties and
  # it never fires. c is skipped once at 10m and its retries stop while it
  # stays pending: it fires at 40m and resolves when the skip leaves the 1h
  # window (70m). d has a pending backlog but no lower-deposit skip (that is
  # DecdnSettlementReanchorBacklog's) and e a flat non-zero counter with
  # pending pools; both stay quiet.
  - interval: 1m
    input_series:
      - series: 'decdn_settlement_reanchor_skipped_lower_deposit_total{job="decdn-node", instance="a"}'
        values: '0 1x39 2x50'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="a"}'
        values: '0 1x90'
      - series: 'decdn_settlement_reanchor_skipped_lower_deposit_total{job="decdn-node", instance="b"}'
        values: '0x9 1x80'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="b"}'
        values: '0x9 1x10 0x70'
      - series: 'decdn_settlement_reanchor_skipped_lower_deposit_total{job="decdn-node", instance="c"}'
        values: '0x9 1x80'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="c"}'
        values: '0x9 1x80'
      - series: 'decdn_settlement_reanchor_skipped_lower_deposit_total{job="decdn-node", instance="d"}'
        values: '0x90'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="d"}'
        values: '2x90'
      - series: 'decdn_settlement_reanchor_skipped_lower_deposit_total{job="decdn-node", instance="e"}'
        values: '7x90'
      - series: 'decdn_settlement_reanchor_pending_pools{job="decdn-node", instance="e"}'
        values: '2x90'
    alert_rule_test:
      - eval_time: 30m30s
        alertname: DecdnSettlementReanchorLowerDeposit
        exp_alerts: []
      - eval_time: 31m
        alertname: DecdnSettlementReanchorLowerDeposit
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
      - eval_time: 39m30s
        alertname: DecdnSettlementReanchorLowerDeposit
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
      - eval_time: 40m
        alertname: DecdnSettlementReanchorLowerDeposit
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}
      - eval_time: 60m
        alertname: DecdnSettlementReanchorLowerDeposit
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
          - exp_labels: {job: decdn-node, instance: c, component: settlement, severity: warning}
      - eval_time: 75m
        alertname: DecdnSettlementReanchorLowerDeposit
        exp_alerts:
          - exp_labels: {job: decdn-node, instance: a, component: settlement, severity: warning}
