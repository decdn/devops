---
apiVersion: v2
name: decdn-node
description: >-
  A deCDN node (decdn-node daemon) on Kubernetes: public QUIC over UDP, a
  persistent data dir holding the operator-provisioned node identity, and a
  ClusterIP-only metrics endpoint behind a NetworkPolicy.
type: application
# Chart version (SemVer), set only by scripts/release.sh (RELEASING.md); 0.0.0 means
# never released.
version: 0.0.0
# The decdn/decdn release the chart's config rendering is synced against, and the
# image tag used when neither image.tag nor image.digest is set. Keep it equal to
# the decdn_node role's decdn_node_version, and the tag of the one image in the
# artifacthub.io/images annotation below (make test-scripts checks both).
appVersion: "0.0.1"
kubeVersion: ">=1.25.0-0"
home: https://decdn.org
icon: https://decdn.org/icon.svg
sources:
  - https://github.com/decdn/devops
  - https://github.com/decdn/decdn
keywords:
  - decdn
  - cdn
  - iroh
  - quic
maintainers:
  - name: deCDN
    email: info@decdn.org
    url: https://decdn.org
# Artifact Hub metadata (https://artifacthub.io/docs/topics/annotations/helm/).
# release-chart.yml adds artifacthub.io/changes to the packaged copy, generated from this
# release's CHANGELOG.md section (scripts/chart-artifacthub-changes.py): never add it here.
annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: decdn-node
      image: ghcr.io/decdn/decdn-node:0.0.1
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/decdn/devops/tree/main/charts/decdn-node
    - name: deCDN
      url: https://github.com/decdn/decdn
    - name: Verifying a release
      url: https://github.com/decdn/devops/blob/main/RELEASING.md#verifying-a-release
