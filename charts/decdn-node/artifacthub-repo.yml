---
# Artifact Hub repository metadata for oci://ghcr.io/decdn/charts/decdn-node
# (https://artifacthub.io/docs/topics/repositories/helm-charts/#oci-support).
# release-chart.yml's publish job pushes it as ghcr.io/decdn/charts/decdn-node:artifacthub.io;
# .helmignore keeps it out of the chart package.
#
# repositoryID: set it to the ID Artifact Hub shows once the repository is added there
# (RELEASING.md, "First release only"). The next publish pushes it, which earns the
# Verified Publisher badge.
# repositoryID: 00000000-0000-0000-0000-000000000000
#
# owners: a signed-in Artifact Hub user with one of these emails can claim the
# repository if another account added it.
owners:
  - name: deCDN
    email: info@decdn.org
