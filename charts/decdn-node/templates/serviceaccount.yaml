{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "decdn-node.serviceAccountName" . }}
  labels:
    {{- include "decdn-node.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The node never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
