{{- /*
Upstream's reference alert rules (files/monitoring/prometheus-alerts.yml, vendored
by scripts/sync-monitoring.sh) as a PrometheusRule. The file is read raw and parsed
as YAML: never pass it through `tpl`, its annotations carry Prometheus templates
({{ $labels.instance }}) that are Prometheus's to expand, not Helm's.
The rules match on metric names across every scraped node, so enable this on ONE
release per Prometheus, or each alert fires once per release.
*/}}
{{- if .Values.metrics.prometheusRule.enabled }}
{{- $rules := .Files.Get "files/monitoring/prometheus-alerts.yml" | fromYaml }}
{{- if hasKey $rules "Error" }}
{{- fail (printf "files/monitoring/prometheus-alerts.yml does not parse: %s" $rules.Error) }}
{{- end }}
{{- if not $rules.groups }}
{{- fail "files/monitoring/prometheus-alerts.yml has no rule groups; re-run scripts/sync-monitoring.sh" }}
{{- end }}
{{- $extra := .Values.metrics.prometheusRule.ruleLabels }}
{{- if $extra }}
{{- range $group := $rules.groups }}
{{- range $rule := $group.rules }}
{{- /* A rule's own labels (severity, component, ...) win over the extras. */}}
{{- $_ := set $rule "labels" (merge (deepCopy ($rule.labels | default dict)) $extra) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "decdn-node.fullname" . }}
  labels:
    {{- include "decdn-node.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerts
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
