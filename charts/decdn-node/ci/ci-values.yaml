---
# Every operator-facing knob set to a non-default value, so the schema-key check
# (make lint-helm) sees the maximal key set the chart can emit. Also the render
# `make security-helm` scans. Mirrors the first
# play of ansible/molecule/schema/converge.yml; keep the two in step.
# Placeholder data only — no real addresses, endpoints or secrets.
image:
  tag: 0.0.0-ci
service:
  loadBalancerIP: 203.0.113.10
  loadBalancerSourceRanges: ["0.0.0.0/0"]
persistence:
  storageClass: fast-ssd
  annotations:
    example.invalid/backup: "exclude"
secrets:
  keystore:
    existingSecret: decdn-node-keys
  env:
    existingSecret: decdn-node-env
metrics:
  networkPolicy:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  serviceMonitor:
    enabled: true
config:
  identity:
    region: DE
  network:
    relay_urls: ["https://relay1.example.invalid:443", "https://relay2.example.invalid:443"]
    discovery:
      pkarr_url: "https://pkarr.example.invalid/"
      dns_origin: "discovery.example.invalid"
      # A real ed25519 public key: upstream parses it as an iroh NodeId.
      peers:
        "253bad481e6371866c9f6276b2a7b3a10ca16255668e740e6fc01da1cacc4350":
          relay_url: "https://relay.example.invalid/"
          addrs: ["203.0.113.4:4433", "203.0.113.5:4433"]
  blockchain:
    chain_id: 421614
    payment_pool_address: "0x1111111111111111111111111111111111111111"
    capacity_bond_address: "0x2222222222222222222222222222222222222222"
    slash_judge_address: "0x3333333333333333333333333333333333333333"
    content_blacklist_address: "0x4444444444444444444444444444444444444444"
    slash_appeal_address: "0x5555555555555555555555555555555555555555"
    origin_assignment_address: "0x6666666666666666666666666666666666666666"
    publisher_registry_address: "0x7777777777777777777777777777777777777777"
    usdc_address: "0x8888888888888888888888888888888888888888"
    origin_directory_positive_ttl_sec: 600
    origin_directory_negative_ttl_sec: 60
    origin_directory_cache_capacity: 8192
    content_blacklist_poll_interval_sec: 300
    chain_staleness_grace_sec: 900
    rpc_watchdog_interval_sec: 15
    event_poll_interval_ms: 5000
    rate_bounds_poll_interval_sec: 1800
    fee_shares_poll_interval_sec: 1800
    redeem_threshold_micro_usdc: 2000000
    redeem_max_vouchers_per_tx: 250
    redeem_interval_secs: 120
    buyer_working_deposit_micro_usdc: 20000000
    buyer_max_approve: false
    pool_min_remaining_deposit_micro_usdc: 500000
    pool_floor_signer_live_windows: 4
  payment:
    rate_per_mb: 12
    delivery_floor: 0
    credit_max: 33554432
    credit_ramp_divisor: 4
    frame_target_bytes: 262144
    voucher_commit_interval_ms: 2500
  cache:
    cache_size_mb: 20480
    disk_headroom_mb: 4096
    max_blob_size_mb: 2048
    max_rate_per_mb: 50
    pinned_hashes: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
    user_agent: "decdn-node/ci"
    gc_interval_sec: 0
    fs_rescan_interval_sec: 30
    origin_probe_ttl_sec: 30
    origin_probe_negative_ttl_sec: 4
    origin_probe_fault_ttl_sec: 8
    origin_probe_timeout_ms: 1500
    origin_probe_memo_capacity: 2048
    eviction_high_water_pct: 85
    eviction_target_pct: 70
    eviction_per_sweep_budget: 32
    eviction_tick_secs: 2
    max_probe_holds: 512
    stake_lane_reserved_holds: 16
    node_to_node_pull_through_enabled: true
    relay_foreign_namespaces: false
    node_pull_probe_fanout: 8
    node_pull_timeout_sec: 30
    node_pull_stall_window_sec: 15
    node_pull_min_throughput_bps: 8192
    eviction_policy: tinylfu
    admission_policy: tinylfu
    tinylfu:
      sketch_bytes: 524288
      promotion_threshold: 3
      probation_target_pct: 20
      aging_halflife_sec: 900
    serve_economics:
      policy: margin
      discount: 0.25
      n_max: 32
      warming_budget: 1000000
      warming_refill: 100
    origin_retry:
      max_retries: 5
      initial_backoff_ms: 200
      max_backoff_ms: 20000
      jitter_ratio: 0.2
      buffered_max_bytes: 8388608
    circuit_breaker:
      enabled: false
      failure_threshold: 10
      cooldown_ms: 60000
      half_open_max_calls: 2
    origin:
      kind: s3
      bucket: decdn-blobs
      region: us-east-1
      endpoint_url: "https://acct.r2.cloudflarestorage.invalid"
      path_style: true
      prefix: "blobs/"
      decompress: strict
      credentials:
        source: default-chain
        profile: decdn
  observability:
    otlp_endpoint: "http://localhost:4317"
  security:
    max_concurrent_handlers: 128
    per_source_rate_per_sec: 50.5
    per_source_burst: 100
    max_tracked_sources: 2048
  load_shed:
    policy: always-admit
    egress_budget_mbps: 500
    max_concurrent_serves_high: 128
    max_concurrent_serves_low: 96
    per_client_serve_cap: 16
  dht:
    rate_limit:
      per_peer_rate_per_sec: 10.0
      per_peer_burst: 20
      per_ip_rate_per_sec: 50.0
      per_ip_burst: 100
      global_rate_per_sec: 500.0
      global_burst: 1000
      max_tracked_per_ip: 2048
      max_tracked_per_peer: 2048
  probe:
    rate_limit:
      per_peer_rate_per_sec: 2.5
      per_peer_burst: 5
      per_ip_rate_per_sec: 25.0
      per_ip_burst: 100
      global_rate_per_sec: 500.0
      global_burst: 1000
      max_tracked_per_ip: 1024
      max_tracked_per_peer: 1024
  receipts:
    max_file_bytes: 67108864
    retained_files: 8
  content:
    denied_hashes: ["bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]
    denied_origins: ["0x000000000000000000000000000000000000dEaD"]
  client:
    region_allowlist: ["US", "DE"]
